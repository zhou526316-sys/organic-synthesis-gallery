<!doctype html>
<html lang="zh-CN" data-private-pdf-viewer="loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.gczhouwld.com; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; frame-src https://api.gczhouwld.com; base-uri 'none'; form-action 'none'" />
  <title>PDF · Organic Synthesis Gallery</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#eef2f8}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{display:flex;flex-direction:column;overflow:hidden}
    header{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 14px;background:#fff;border-bottom:1px solid #d9e2ef;z-index:2}
    a{color:#2456c6;text-decoration:none;font-weight:700}#doi{font-size:13px;color:#56657a;overflow-wrap:anywhere;min-width:0}
    .toolbar{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    button,.download{min-height:34px;padding:6px 10px;border:1px solid #d6deeb;border-radius:9px;background:#fff;color:#344054;font:inherit;font-weight:650;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}.download[hidden]{display:none}
    #page-count,#zoom{min-width:58px;text-align:center;font-size:12px;color:#56657a}
    main{position:relative;flex:1;min-height:0;overflow:auto;background:#dfe5ee;padding:18px}
    #stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
    #pdf-canvas{display:block;max-width:100%;background:#fff;box-shadow:0 5px 24px rgba(15,23,42,.18)}
    #native-pdf-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    #native-pdf-frame[hidden]{display:none}
    html[data-private-pdf-mode='native'] main{padding:0;background:#fff}
    html[data-private-pdf-mode='native'] #previous,
    html[data-private-pdf-mode='native'] #next,
    html[data-private-pdf-mode='native'] #page-count,
    html[data-private-pdf-mode='native'] #zoom-out,
    html[data-private-pdf-mode='native'] #zoom-in,
    html[data-private-pdf-mode='native'] #zoom{display:none}
    #status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#56657a;background:#f5f7fb;z-index:1}
    #status[hidden]{display:none}.bad{color:#9f2d20}
    @media(max-width:680px){header{align-items:flex-start;flex-wrap:wrap}.toolbar{width:100%;margin-left:0}.toolbar button,.toolbar .download{flex:0 0 auto}main{padding:8px}}
  </style>
</head>
<body>
  <header>
    <a href="/">← 返回 Gallery</a>
    <span id="doi"></span>
    <div class="toolbar" aria-label="PDF 阅读工具">
      <button id="previous" type="button" disabled>上一页</button>
      <span id="page-count">—</span>
      <button id="next" type="button" disabled>下一页</button>
      <button id="zoom-out" type="button" disabled>−</button>
      <span id="zoom">100%</span>
      <button id="zoom-in" type="button" disabled>＋</button>
      <a id="compatibility" class="download" hidden>兼容模式</a>
      <a id="download" class="download" hidden>下载 PDF</a>
    </div>
  </header>
  <main id="main">
    <iframe id="native-pdf-frame" title="论文 PDF" hidden></iframe>
    <div id="stage"><canvas id="pdf-canvas" width="0" height="0" aria-label="论文 PDF 页面"></canvas></div>
    <div id="status">正在打开私有 PDF…</div>
  </main>
  <script type="module" src="/src/private-pdf-reader.mjs"></script>
</body>
</html>
