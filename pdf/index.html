<!doctype html>
<html lang="zh-CN" data-private-pdf-viewer="loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.gczhouwld.com https://organic-synthesis-gallery.zhou526316.workers.dev; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>PDF · Organic Synthesis Gallery</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#eef2f8}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{display:flex;flex-direction:column;overflow:hidden}
    header{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 14px;background:#fff;border-bottom:1px solid #d9e2ef;z-index:2}
    a{color:#2456c6;text-decoration:none;font-weight:700}#doi{font-size:13px;color:#56657a;overflow-wrap:anywhere;min-width:0}
    .toolbar{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    button,.download{min-height:34px;padding:6px 10px;border:1px solid #d6deeb;border-radius:9px;background:#fff;color:#344054;font:inherit;font-weight:650;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}.download[hidden]{display:none} .download[disabled]{opacity:.5}
    #page-count,#zoom{min-width:58px;text-align:center;font-size:12px;color:#56657a}
    main{position:relative;flex:1;min-height:0;overflow:hidden;background:#dfe5ee;padding:0}
    #pdf-scroll-container{position:absolute;inset:0;overflow:auto;padding:18px;overscroll-behavior:contain}
    #stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start}
    #stage{position:relative;display:block;min-height:100%;width:100%;text-align:left}
    #stage .page{margin:0 auto 16px!important;box-shadow:0 5px 24px rgba(15,23,42,.18)}
    #stage .page canvas{display:block;max-width:none}
    .pdf-scroll-hint{font-size:12px;color:#758298;white-space:nowrap}
    #stage .canvasWrapper.pdf-crop-target{position:relative;touch-action:auto}
    #pdf-crop-box{position:absolute;pointer-events:none;border:2px dashed #0b60ce;background:rgba(20,117,232,.13)}
    #pdf-crop-box[hidden],#pdf-rescue-panel[hidden],.rescue-control[hidden]{display:none!important}
    #pdf-rescue-panel{position:fixed;top:65px;right:14px;bottom:12px;width:min(360px,calc(100vw - 28px));overflow:auto;
      z-index:5;padding:16px;background:#fff;border:1px solid #bbcadb;border-radius:12px;box-shadow:0 14px 42px #1c2c4436}
    #pdf-rescue-panel button{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal}
    #pdf-rescue-panel h2{font-size:17px;margin:0 0 10px}
    #pdf-rescue-panel small{display:block;color:#667085;line-height:1.55}
    #pdf-crop-notice{font-size:12px;color:#185abc;min-width:0}
    #pdf-rescue-progress{font-size:13px;line-height:1.6;color:#344054}
    #pdf-rescue-close{width:auto!important;float:right;margin:0!important}
    .pdf-rescue-candidate{border:1px solid #cedbea;background:#f8faff!important}
    .pdf-rescue-warning{color:#b33927!important}

    #status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#56657a;background:#f5f7fb;z-index:1}
    #status[hidden]{display:none}.bad{color:#9f2d20}
    @media(max-width:680px){header{align-items:flex-start;flex-wrap:wrap}.toolbar{width:100%;margin-left:0}.toolbar button,.toolbar .download{flex:0 0 auto}main{padding:8px}}
  </style>
</head>
<body>
  <header>
    <a href="/">← 返回 Gallery</a>
    <span id="doi"></span>
    <div class="toolbar" aria-label="PDF 阅读工具">
      <span id="page-count" aria-live="polite">—</span>
      <span class="pdf-scroll-hint">连续滚动</span>
      <button id="zoom-out" type="button" disabled>−</button>
      <span id="zoom">100%</span>
      <button id="zoom-in" type="button" disabled>＋</button>
      <a id="compatibility" class="download" hidden>按需阅读</a>
      <a id="full-open" class="download" hidden>整份下载后阅读</a>
      <a id="browser-open" class="download" hidden>浏览器阅读</a>
      <button id="download" type="button" class="download" hidden>下载 PDF</button>
      <button id="pdf-figure-rescue" class="rescue-control" type="button" disabled>从 PDF 找图</button>
      <button id="pdf-crop-select" class="rescue-control" type="button" hidden>框选原图</button>
      <button id="pdf-crop-export" class="rescue-control" type="button" hidden disabled>导出原图候选</button>
      <span id="pdf-crop-notice" role="status" aria-live="polite"></span>
    </div>
  </header>
  <aside id="pdf-rescue-panel" hidden aria-label="PDF 原图恢复候选">
    <button id="pdf-rescue-close" type="button">关闭</button>
    <h2>从原始 PDF 找图</h2>
    <p id="pdf-rescue-progress" role="status" aria-live="polite">仅在当前浏览器解析，不上传 PDF 或页面。</p>
    <div id="pdf-rescue-results"></div>
    <small>找到的图号只是定位候选。必须手工核对原始图像范围、DOI 和出版许可；导出的 PNG 与溯源记录不会自动发布到公共图库。</small>
  </aside>
  <main id="main">
    <div id="pdf-scroll-container" aria-label="连续滚动 PDF 文献" tabindex="0">
      <div id="stage" class="pdfViewer"></div>
    </div>
    <div id="pdf-crop-box" hidden></div>
    <div id="status">正在打开私有 PDF…</div>
  </main>
  <script type="module" src="/src/private-pdf-reader.mjs"></script>
</body>
</html>
