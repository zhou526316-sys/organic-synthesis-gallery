<!doctype html>
<html lang="zh-CN" data-native-pdf-state="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self' blob:; font-src 'self' blob: data:; connect-src 'self' https://api.gczhouwld.com; img-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>本地 PDF · Organic Synthesis Gallery</title>
    <link rel="stylesheet" href="/src/pdf-vault/open.css" />
  </head>
  <body>
    <main id="native-shell" class="shell">
      <header class="heading">
        <a href="/" class="brand">Organic Synthesis Gallery</a>
        <span class="split" aria-hidden="true"></span>
        <h1>本地 PDF</h1>
      </header>
      <div class="content">
        <p id="native-doi" class="doi"></p>
        <p data-testid="native-pdf-status" id="native-status" role="status" aria-live="polite">正在验证账号并查找这篇 PDF…</p>
        <div class="actions">
          <button type="button" data-testid="native-pdf-download-folder" id="download-folder" hidden>首次授权 PDF 下载目录</button>
          <button type="button" data-testid="native-pdf-folder-restore" id="download-folder-restore" hidden>恢复下载目录读取权限</button>
          <button type="button" data-testid="native-pdf-folder-scan" id="download-folder-scan" hidden>重新搜索已下载 PDF</button>
          <button type="button" data-testid="native-pdf-link" id="link-file" hidden>手动选择或更换 PDF</button>
          <button type="button" data-testid="native-pdf-restore" id="restore-file" hidden>恢复原文件权限</button>
          <button type="button" data-testid="native-pdf-retry" id="retry-open" hidden>重试打开</button>
          <a id="publisher-link" target="_blank" rel="noopener noreferrer" hidden>前往期刊文章页面下载</a>
          <a id="manager-link" hidden>管理我的 PDF</a>
          <a href="/" id="sign-in-link" hidden>返回 Gallery 登录</a>
        </div>
        <p id="native-help" class="hint">浏览器只会读取你明确选择过的文件。原始 PDF 不会被移动、改名、复制到服务器或上传。</p>
        <p id="native-scan-report" class="hint" data-testid="native-pdf-scan-report" role="status" aria-live="polite"></p>
      </div>
    </main>
    <section id="native-folder-modal" class="folder-modal" role="dialog" aria-modal="true" aria-labelledby="native-folder-title" hidden>
      <div class="folder-modal-panel">
        <header class="folder-modal-head">
          <div>
            <h2 id="native-folder-title">选择 PDF 保存位置</h2>
            <p>本机文件夹或云盘的本地同步目录</p>
          </div>
          <button id="native-folder-close" type="button" aria-label="关闭保存位置选择">关闭</button>
        </header>
        <div class="folder-provider-grid" role="group" aria-label="保存位置类型">
          <button type="button" data-folder-provider="local" data-testid="native-folder-provider-local" aria-pressed="true">
            <span class="folder-provider-name">本机文件夹</span>
            <span class="folder-provider-sub">直接选电脑目录</span>
          </button>
          <button type="button" data-folder-provider="baidu" data-testid="native-folder-provider-baidu" aria-pressed="false">
            <span class="folder-provider-name">百度网盘</span>
            <span class="folder-provider-sub">登录官方客户端，再选同步目录</span>
          </button>
          <button type="button" data-folder-provider="quark" data-testid="native-folder-provider-quark" aria-pressed="false">
            <span class="folder-provider-name">夸克网盘</span>
            <span class="folder-provider-sub">登录并选择电脑本地文件夹</span>
          </button>
          <button type="button" data-folder-provider="aliyun" data-testid="native-folder-provider-aliyun" aria-pressed="false">
            <span class="folder-provider-name">阿里云盘</span>
            <span class="folder-provider-sub">选择已下载或同步的目录</span>
          </button>
          <button type="button" data-folder-provider="onedrive" data-testid="native-folder-provider-onedrive" aria-pressed="false">
            <span class="folder-provider-name">OneDrive</span>
            <span class="folder-provider-sub">选择已在本机可用的同步目录</span>
          </button>
        </div>
        <div id="native-folder-instructions" class="folder-instructions">
          <h3 id="native-folder-provider-name">本机文件夹</h3>
          <p id="native-folder-provider-summary"></p>
          <p id="native-folder-provider-steps"></p>
          <a id="native-folder-official" target="_blank" rel="noopener noreferrer" hidden>前往官方页面登录或安装</a>
          <p id="native-folder-privacy">Gallery 不收集云盘账号密码，也不连接云盘 API。选择同步文件夹可能使 PDF 经云盘客户端上传到第三方云端；请自行核对文件许可。仅能读取已下载到电脑的完整 PDF。</p>
        </div>
        <div class="folder-modal-actions">
          <button type="button" id="native-folder-confirm" data-testid="native-pdf-folder-choose">选择电脑上的文件夹</button>
          <button type="button" id="native-folder-cancel">取消</button>
        </div>
        <p id="native-folder-feedback" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section id="native-viewer" hidden aria-label="浏览器内置 PDF 阅读器">
      <iframe data-testid="native-pdf-frame" id="native-frame" title="浏览器内置 PDF 阅读器" referrerpolicy="no-referrer"></iframe>
    </section>
    <nav id="native-tools" class="native-tools" hidden aria-label="本地 PDF 关联管理">
      <button type="button" id="native-tools-toggle" aria-expanded="false">管理此 PDF</button>
      <div id="native-tools-panel" hidden>
        <button type="button" id="native-replace" data-testid="native-pdf-replace">更换本地 PDF</button>
        <button type="button" id="native-unlink" data-testid="native-pdf-unlink">取消该 DOI 的关联</button>
        <button type="button" id="native-rescan">重新搜索下载目录</button>
        <p id="native-tools-message" role="status"></p>
      </div>
    </nav>
    <script type="module" src="/src/pdf-vault/open.mjs"></script>
  </body>
</html>
