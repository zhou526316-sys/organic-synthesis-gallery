<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Synthesis Literature Gallery</title>
    <script>
      (() => {
        const CANONICAL_GALLERY = 'https://gallery.gczhouwld.com/';
        const host = window.location.hostname.toLowerCase();
        const path = window.location.pathname;
        const legacyGitHubProject =
          host === 'zhou526316-sys.github.io' &&
          (path === '/organic-synthesis-gallery' || path.startsWith('/organic-synthesis-gallery/'));
        if (host === 'organic-synthesis-gallery-public.pages.dev' || legacyGitHubProject) {
          const current = new URL(window.location.href);
          const destination = new URL(CANONICAL_GALLERY);
          destination.search = current.search;
          destination.hash = current.hash;
          document.documentElement.style.visibility = 'hidden';
          window.location.replace(destination.toString());
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./toc-rescue.js" defer></script>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
