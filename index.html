<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Synthesis Literature Gallery</title>
    <script>
      (() => {
        const LEGACY_UI_HOSTS = new Set([
          'zhou526316-sys.github.io',
          'organic-synthesis-gallery-public.pages.dev',
        ]);
        const host = window.location.hostname.toLowerCase();
        const legacyGithubPages =
          host === 'zhou526316-sys.github.io' &&
          window.location.pathname.startsWith('/organic-synthesis-gallery');
        const legacyFallback = host === 'organic-synthesis-gallery-public.pages.dev';
        if (LEGACY_UI_HOSTS.has(host) && (legacyGithubPages || legacyFallback)) {
          const current = new URL(window.location.href);
          const destination = new URL('https://api.gczhouwld.com/');
          destination.search = current.search;
          destination.hash = current.hash;
          document.documentElement.style.visibility = 'hidden';
          window.location.replace(destination.toString());
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./toc-rescue.js" defer></script>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
