name: Build Windows TOC Collector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'toc-collector/**'
      - '.github/workflows/toc-collector-windows.yml'

permissions:
  contents: read

concurrency:
  group: toc-collector-windows
  cancel-in-progress: true

env:
  COLLECTOR_BUILD_REV: '1'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: toc-collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: toc-collector-windows
          path: |
            toc-collector/dist/*.exe
            toc-collector/dist/*.yml
          if-no-files-found: error
          retention-days: 14
