name: Deploy Worker additions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-user-ui-release.yml'
      - 'cloudflare/schema.sql'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/src/user-ui.js'
      - 'cloudflare/worker/src/integrations.js'
      - 'cloudflare/worker/src/media.js'
      - 'cloudflare/worker/src/media-write.js'
      - 'cloudflare/worker/src/repair.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-user-ui-release
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
      R2_BUCKET: organic-synthesis-gallery-media
      WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      WECHAT_OPEN_APP_ID: ${{ secrets.WECHAT_OPEN_APP_ID }}
      WECHAT_OPEN_APP_SECRET: ${{ secrets.WECHAT_OPEN_APP_SECRET }}
      QQ_CONNECT_APP_ID: ${{ secrets.QQ_CONNECT_APP_ID }}
      QQ_CONNECT_APP_KEY: ${{ secrets.QQ_CONNECT_APP_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
      WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
      WECHAT_PAY_SERIAL_NO: ${{ secrets.WECHAT_PAY_SERIAL_NO }}
      WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
      WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${{ secrets.WECHAT_PAY_PLATFORM_PUBLIC_KEY }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build current frontend assets
        run: npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Resolve existing D1 database
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID" || { echo 'D1 database is missing'; exit 1; }
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Verify R2 bucket exists
        working-directory: cloudflare/worker
        run: npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null

      - name: Generate non-destructive Worker configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.user-ui.toml <<EOF
          name = "organic-synthesis-gallery"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          workers_dev = true

          [vars]
          MIGRATION_STAGE = "staging"

          [triggers]
          crons = ["0 */6 * * *"]

          [assets]
          directory = "../../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/media/*"]

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "$R2_BUCKET"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF

      - name: Apply idempotent user schema
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --file ../schema.sql --config wrangler.user-ui.toml

      - name: Sync configured login and payment secrets
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const names = [
            'GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','WECHAT_OPEN_APP_ID','WECHAT_OPEN_APP_SECRET',
            'QQ_CONNECT_APP_ID','QQ_CONNECT_APP_KEY','RESEND_API_KEY','EMAIL_FROM',
            'WECHAT_PAY_MCH_ID','WECHAT_PAY_APP_ID','WECHAT_PAY_SERIAL_NO','WECHAT_PAY_PRIVATE_KEY',
            'WECHAT_PAY_API_V3_KEY','WECHAT_PAY_PLATFORM_PUBLIC_KEY','ALIPAY_APP_ID','ALIPAY_PRIVATE_KEY','ALIPAY_PUBLIC_KEY'
          ];
          const values = Object.fromEntries(names.flatMap(name => process.env[name] ? [[name, process.env[name]]] : []));
          fs.writeFileSync('/tmp/user-integrations-secrets.json', JSON.stringify(values));
          console.log(`Prepared ${Object.keys(values).length} configured integration secrets.`);
          NODE
          if [ "$(node -p "Object.keys(require('/tmp/user-integrations-secrets.json')).length")" -gt 0 ]; then
            npx wrangler secret bulk /tmp/user-integrations-secrets.json --config wrangler.user-ui.toml >/dev/null
          fi
          rm -f /tmp/user-integrations-secrets.json

      - name: Dry-run Worker bundle
        working-directory: cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.user-ui.toml --outdir .wrangler-user-ui-dry-run

      - name: Deploy Worker without media migration
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.user-ui.toml

      - name: Native registration end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const base = process.env.WORKER_URL;
          const email = `native-smoke-${process.env.GITHUB_RUN_ID}@example.invalid`;
          const password = 'Smoke-Password-123!';
          const origin = 'https://zhou526316-sys.github.io';

          async function call(path, body, expected) {
            const response = await fetch(`${base}${path}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', origin },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}
            assert(response.status === expected, `${path}: expected ${expected}, got ${response.status}: ${text.slice(0, 500)}`);
            assert(response.headers.get('access-control-allow-origin') === origin, `${path}: CORS header missing`);
            return data;
          }

          const registered = await call('/api/user-ui/auth/register', {
            email,
            password,
            displayName: 'Native Smoke',
          }, 201);
          assert(registered.token && registered.user?.email === email, `registration response invalid: ${JSON.stringify(registered)}`);

          const loggedIn = await call('/api/user-ui/auth/password/login', { email, password }, 200);
          assert(loggedIn.token && loggedIn.user?.email === email, `password login response invalid: ${JSON.stringify(loggedIn)}`);
          console.log(JSON.stringify({ nativeRegistration: true, passwordLogin: true, email }));
          NODE

      - name: Clean native registration smoke account
        if: always()
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="native-smoke-${GITHUB_RUN_ID}@example.invalid"
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.user-ui.toml \
            --command "DELETE FROM users WHERE email = '$EMAIL';" >/dev/null

      - name: Verify health and user UI routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/api/_healthcheck" > /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -H 'content-type: application/json' \
            -H 'origin: https://zhou526316-sys.github.io' \
            --data '{"dois":[]}' \
            "$WORKER_URL/api/user-ui/reader-counts" > /tmp/counts.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -H 'origin: https://zhou526316-sys.github.io' \
            "$WORKER_URL/api/user-ui/integrations" > /tmp/integrations.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const counts = JSON.parse(fs.readFileSync('/tmp/counts.json', 'utf8'));
          const integrations = JSON.parse(fs.readFileSync('/tmp/integrations.json', 'utf8'));
          if (!health.ok || !health.d1 || !health.r2 || !health.writeAuth) throw new Error(`Healthcheck failed: ${JSON.stringify(health)}`);
          if (!counts || typeof counts.counts !== 'object') throw new Error(`Reader count route failed: ${JSON.stringify(counts)}`);
          if (!integrations?.auth || !integrations?.payments) throw new Error(`Integration route failed: ${JSON.stringify(integrations)}`);
          console.log(JSON.stringify({ health: true, userUiRoutes: true, integrations, mediaMigration: false }));
          NODE