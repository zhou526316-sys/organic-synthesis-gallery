name: Probe private PDF upload route
on:
  push:
    branches: [fix/tm-pdf-upload-20261007]
    paths:
      - scripts/probe-tm-pdf-upload-route.mjs
      - .github/workflows/tm-pdf-upload-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe health, publisher preflight, and invalid lease rejection
        run: node scripts/probe-tm-pdf-upload-route.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-pdf-upload-route
          path: tm-pdf-upload-route.json
          retention-days: 7
