name: Publisher TOC adapter CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'toc-collector/src/publisher-adapters.mjs'
      - 'toc-collector/src/background.mjs'
      - 'toc-collector/test/**'
      - 'toc-collector/package.json'
      - 'cloudflare/scripts/import-recent-media-direct.mjs'
      - 'cloudflare/scripts/build-cloudflare-bridge.mjs'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'cloudflare/worker/src/local-captures.js'
      - 'cloudflare/worker/src/index.js'
      - 'public/toc-mainline.user.js'
      - '.github/workflows/toc-publisher-adapters-ci.yml'
  push:
    branches: [main]
    paths:
      - 'toc-collector/src/publisher-adapters.mjs'
      - 'toc-collector/src/background.mjs'
      - 'toc-collector/test/**'
      - 'toc-collector/package.json'
      - 'cloudflare/scripts/import-recent-media-direct.mjs'
      - '.github/workflows/toc-publisher-adapters-ci.yml'
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check toc-collector/src/publisher-adapters.mjs
          node --check toc-collector/src/background.mjs
          node --check cloudflare/scripts/import-recent-media-direct.mjs
          node --check cloudflare/scripts/build-bridge-loader.mjs
          node --check cloudflare/scripts/build-live-toc-demand-queue.mjs
          node --check public/toc-rescue.js
          node --check public/toc-mainline.user.js
          node --check cloudflare/worker/src/index.js
          node --check cloudflare/worker/src/local-captures.js
      - name: Run publisher adapter fixtures
        run: node toc-collector/test/publisher-adapters.test.mjs
      - name: Test Tampermonkey diagnostic history
        run: node cloudflare/worker/scripts/test-tampermonkey-report-history.mjs
      - name: Verify direct importer uses shared adapter
        shell: bash
        run: |
          set -euo pipefail
          grep -F "publisher-adapters.mjs" cloudflare/scripts/import-recent-media-direct.mjs
          grep -F "extractPublisherMediaCandidates" cloudflare/scripts/import-recent-media-direct.mjs
          grep -F "pickBestPublisherMediaCandidate" toc-collector/src/background.mjs
      - name: Verify paired Tampermonkey contract and identity regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-tm220-artifacts.mjs source
          node scripts/test-media-identity-v220.mjs
          node scripts/test-tm-stage-first.mjs
          node scripts/test-tm220-release.mjs
          grep -F "/api/media/tampermonkey-reports" cloudflare/worker/src/index.js
          grep -F "captureBelongsToDoi" cloudflare/worker/src/local-captures.js
          grep -F "sanitizeTraceMessage" cloudflare/worker/src/local-captures.js
          grep -F "readOnly: true" cloudflare/scripts/build-live-toc-demand-queue.mjs
          grep -F "payload?.readOnly !== true" cloudflare/worker/src/media.js
          grep -F "isExcludedDoi(doi)" cloudflare/scripts/build-live-toc-demand-queue.mjs
          grep -F "gallery-literature-doi-registry" src/main.ts
          grep -F "TAMPERMONKEY_CORS_WRITE_PATHS" cloudflare/worker/src/index.js
          if grep -Eq "BRIDGE_WRITE_TOKEN\s*=|Bearer [A-Za-z0-9_-]{20,}" public/toc-mainline.user.js; then
            echo "Userscript must not embed a write token"
            exit 1
          fi
  windows-collector-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: toc-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Collector dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Collector checks and adapter fixtures
        run: npm run check
      - name: Build unpacked Collector
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:unpacked
      - name: Verify unpacked executable and shared adapter
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path 'dist/win-unpacked') 'Organic Synthesis Gallery TOC Collector.exe'
          if (-not (Test-Path $exe)) { throw "Unpacked EXE missing: $exe" }
          if (-not (Test-Path 'src/publisher-adapters.mjs')) { throw 'Shared publisher adapter missing from source tree' }
          Write-Host "WINDOWS_COLLECTOR_ADAPTER_SMOKE_OK $exe"
