name: Export site feedback for GPT review

on:
  push:
    branches: [main]
    paths:
      - 'feedback/REVIEW_TRIGGER'
      - '.github/workflows/site-feedback-review-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-feedback-review-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Resolve D1 database
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID" || { echo 'D1 database is missing'; exit 1; }
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Generate read-only export configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > wrangler.feedback-export.toml <<EOF
          name = "organic-synthesis-gallery-feedback-export"
          main = "src/index.js"
          compatibility_date = "2026-09-16"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF

      - name: Export open feedback
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.feedback-export.toml --json \
            --command "SELECT id, category, message, page_path, language, context_json, created_at FROM site_feedback WHERE status = 'open' ORDER BY created_at DESC LIMIT 300;" \
            > /tmp/site-feedback-raw.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/site-feedback-raw.json', 'utf8'));
          const first = Array.isArray(raw) ? raw[0] : raw;
          const rows = Array.isArray(first?.results) ? first.results : [];
          const out = {
            generatedAt: new Date().toISOString(),
            scope: 'open-site-feedback',
            count: rows.length,
            feedback: rows.map(row => ({
              id: Number(row.id),
              category: row.category,
              message: row.message,
              pagePath: row.page_path || '',
              language: row.language || '',
              context: (() => {
                try { return row.context_json ? JSON.parse(row.context_json) : {}; }
                catch { return {}; }
              })(),
              createdAt: Number(row.created_at || 0),
            })),
          };
          fs.writeFileSync('/tmp/site-feedback-review.json', JSON.stringify(out, null, 2));
          console.log(`Exported ${out.count} open feedback items for review.`);
          NODE

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-feedback-review
          path: /tmp/site-feedback-review.json
          retention-days: 7
          if-no-files-found: error
