name: Export site feedback for GPT review

on:
  push:
    branches: [main]
    paths:
      - 'feedback/REVIEW_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-feedback-review-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      FEEDBACK_EXPORT_URL: https://api.gczhouwld.com/api/admin/site-feedback/open?limit=300
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}

    steps:
      - name: Export open feedback from D1 and R2 fallback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BRIDGE_WRITE_TOKEN" || { echo 'Missing BRIDGE_WRITE_TOKEN'; exit 1; }
          curl --fail-with-body --silent --show-error             --retry 4 --retry-delay 2             -H "authorization: Bearer $BRIDGE_WRITE_TOKEN"             -H "cache-control: no-cache"             "$FEEDBACK_EXPORT_URL"             -o /tmp/site-feedback-review.json
          node - <<'NODE'
          const fs = require('fs');
          const out = JSON.parse(fs.readFileSync('/tmp/site-feedback-review.json', 'utf8'));
          if (!Array.isArray(out.feedback)) throw new Error('feedback export payload is invalid');
          if (!out.sources || !out.sources.r2Fallback) throw new Error('feedback export is missing R2 fallback source metadata');
          console.log(JSON.stringify({
            count: out.count,
            d1: out.sources.d1,
            r2Fallback: out.sources.r2Fallback,
          }));
          NODE

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-feedback-review
          path: /tmp/site-feedback-review.json
          retention-days: 7
          if-no-files-found: error
