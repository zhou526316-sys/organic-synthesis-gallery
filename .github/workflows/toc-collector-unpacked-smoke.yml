name: Build and smoke-test unpacked TOC Collector

on:
  workflow_dispatch:
  push:
    branches: [main, feat/mobile-newness-exclusions-resolver-lease]
    paths:
      - 'toc-collector/**'
      - '.github/workflows/toc-collector-unpacked-smoke.yml'

permissions:
  contents: read

jobs:
  unpacked-smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: toc-collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: npm run check

      - name: Build unpacked Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run dist:unpacked
          $dir = Resolve-Path 'dist/win-unpacked'
          $exe = Join-Path $dir 'Organic Synthesis Gallery TOC Collector.exe'
          $launcher = Join-Path $dir 'START-TOC-COLLECTOR.cmd'
          $diagnostic = Join-Path $dir 'Start-TOC-Collector-Diagnostic.cmd'
          if (-not (Test-Path $exe)) { throw "Unpacked EXE missing: $exe" }
          if (-not (Test-Path $launcher)) { throw "Unblock launcher missing: $launcher" }
          if (-not (Test-Path $diagnostic)) { throw "Diagnostic launcher missing: $diagnostic" }
          Write-Host "UNPACKED_EXE=$exe"

      - name: Direct launch smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'toc-collector-bootstrap.log'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $env:ELECTRON_ENABLE_STACK_DUMPING = '1'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $exe = Join-Path (Resolve-Path 'dist/win-unpacked') 'Organic Synthesis Gallery TOC Collector.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--startup-stage=tray', '--enable-logging=stderr' -PassThru -RedirectStandardOutput 'dist/smoke-stdout.log' -RedirectStandardError 'dist/smoke-stderr.log'
          try {
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw "TOC Collector exited during smoke test with code $($p.ExitCode)" }
            $text = Get-Content -LiteralPath $log -Raw
            foreach ($marker in @('JS_ENTRY', 'ELECTRON_IMPORTED', 'APP_READY', 'WINDOW_CREATED', 'WINDOW_VISIBLE', 'BACKGROUND_IMPORT_BEGIN', 'BACKGROUND_IMPORT_OK', 'BACKGROUND_INIT_BEGIN', 'BACKGROUND_INIT_OK')) {
              if ($text -notmatch "\[$($p.Id)\] $marker(?:\s|$)") { throw "Missing $marker for process $($p.Id)" }
            }
            foreach ($stage in @('logging', 'config', 'tray')) {
              if ($text -notmatch "\[$($p.Id)\] background\.$stage\.ok(?:\s|$)") { throw "Background stage failed or never completed: $stage" }
              if ($text -match "\[$($p.Id)\] background\.$stage\.error(?:\s|$)") { throw "Background stage logged an error: $stage" }
            }
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) { throw 'No native main window handle was observed' }
            Write-Host "TOC Collector is running; native window handle=$($p.MainWindowHandle)"
          } finally {
            if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination 'dist/smoke-bootstrap.log' -Force }
            if (-not $p.HasExited) { $p.Kill($true); $p.WaitForExit() }
            $p.Dispose()
          }

      - name: ZoneId unblock launcher smoke test
        shell: pwsh
        run: |
          $dir = Resolve-Path 'dist/win-unpacked'
          $exe = Join-Path $dir 'Organic Synthesis Gallery TOC Collector.exe'
          $launcher = Join-Path $dir 'START-TOC-COLLECTOR.cmd'
          $zone = "$exe`:Zone.Identifier"
          Set-Content -LiteralPath $zone -Value "[ZoneTransfer]`r`nZoneId=3`r`n" -Encoding ASCII
          if (-not (Test-Path -LiteralPath $zone)) { throw 'Could not create Zone.Identifier test marker' }
          $before = Get-Content -LiteralPath $zone -Raw
          Write-Host "Zone before launcher: $before"
          $log = Join-Path $env:TEMP 'toc-collector-bootstrap.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          # Start-Process -Wait includes descendants and therefore waits forever
          # for the GUI we are about to verify. Wait only for the launcher process.
          $launcherProcess = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', ('"{0}"' -f $launcher) -WorkingDirectory $dir -PassThru -WindowStyle Hidden
          if (-not $launcherProcess.WaitForExit(30000)) { throw 'Launcher did not exit within 30 seconds' }
          if ($launcherProcess.ExitCode -ne 0) { throw "Launcher failed: $($launcherProcess.ExitCode)" }
          Start-Sleep -Seconds 8
          if (Test-Path -LiteralPath $zone) { throw 'Launcher did not remove EXE Zone.Identifier' }
          $proc = Get-Process | Where-Object { $_.Path -eq $exe } | Select-Object -First 1
          if (-not $proc) {
            if (Test-Path $log) { Get-Content $log }
            throw 'Launcher removed ZoneId but Collector process is not running'
          }
          if (-not (Test-Path $log)) { Stop-Process -Id $proc.Id -Force; throw 'Bootstrap log was not created after launcher start' }
          $text = Get-Content $log -Raw
          Write-Host $text
          if (-not $text.Contains('startup-window.visible')) { Stop-Process -Id $proc.Id -Force; throw 'Launcher-started app did not report visible startup window' }
          Stop-Process -Id $proc.Id -Force
          Copy-Item $log 'dist/win-unpacked/SMOKE-TEST-bootstrap.log' -Force

      - name: Add start-here note
        shell: pwsh
        run: |
          @'
          START HERE
          ==========
          This bundle is for Windows systems where downloaded EXE files do nothing because the Windows reputation / SmartScreen UI crashes before Electron starts.

          1. Extract the entire ZIP to a normal folder.
          2. Double-click START-TOC-COLLECTOR.cmd (not the EXE on the first launch).
          3. The launcher removes Zone.Identifier only from files in this Collector folder, then starts Organic Synthesis Gallery TOC Collector.exe.
          4. Your existing config.json/writeToken in %APPDATA% is preserved.

          After the first successful launch, the EXE itself should also be unblocked.
          '@ | Set-Content 'dist/win-unpacked/START-HERE.txt' -Encoding UTF8

      - name: Upload Zone-safe smoke-tested unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: toc-collector-windows-0.1.6-unpacked-smoketested
          path: |
            toc-collector/dist/win-unpacked/**
            toc-collector/dist/*-win-unpacked.zip
            toc-collector/dist/smoke-*.log
          if-no-files-found: error
          retention-days: 14
