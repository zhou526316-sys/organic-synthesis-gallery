name: Configure Resend DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-resend-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: gczhouwld.com
    steps:
      - name: Upsert Resend DNS records
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const zoneName = process.env.ZONE_NAME;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is missing');

          const headers = {
            authorization: `Bearer ${token}`,
            'content-type': 'application/json',
          };

          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: { ...headers, ...(init.headers || {}) },
            });
            const text = await response.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || body.success === false) {
              throw new Error(`${init.method || 'GET'} ${path}: ${response.status} ${JSON.stringify(body.errors || body)}`);
            }
            return body.result;
          }

          const zones = await cf(`/zones?name=${encodeURIComponent(zoneName)}&status=active`);
          const zone = Array.isArray(zones) ? zones[0] : null;
          if (!zone?.id) throw new Error(`Active Cloudflare zone not found: ${zoneName}`);

          const records = [
            {
              type: 'TXT',
              name: 'resend._domainkey.mail.gczhouwld.com',
              content: 'p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC8AeQ5A3lPTqIjiBsw8w1+JnpzkUdeTX9WqqcM0Eec9jF8jMHCnhUCJq+3EYotEfuA+88OcNbOHaqDqeNvG1AaSxSgwZt5VR4Vrvh994GRqQiAkHefUhBCN8BQyMMsH2UujH4y+bWUSQl+v2zECr6BqOorGVOlph4a5T7HxqTcTwIDAQAB',
              ttl: 1,
            },
            {
              type: 'CNAME',
              name: 'rsend.mail.gczhouwld.com',
              content: 'rsend-apne1.forge.rmta.net',
              ttl: 1,
              proxied: false,
            },
            {
              type: 'CNAME',
              name: 'send.mail.gczhouwld.com',
              content: 'send.forge.rmta.net',
              ttl: 1,
              proxied: false,
            },
          ];

          for (const record of records) {
            const existing = await cf(
              `/zones/${zone.id}/dns_records?type=${record.type}&name=${encodeURIComponent(record.name)}`
            );
            const current = Array.isArray(existing) ? existing[0] : null;
            const body = JSON.stringify(record);
            if (current?.id) {
              await cf(`/zones/${zone.id}/dns_records/${current.id}`, { method: 'PUT', body });
              console.log(`updated ${record.type} ${record.name}`);
            } else {
              await cf(`/zones/${zone.id}/dns_records`, { method: 'POST', body });
              console.log(`created ${record.type} ${record.name}`);
            }
          }
          NODE
