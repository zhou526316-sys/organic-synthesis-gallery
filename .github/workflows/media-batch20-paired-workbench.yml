name: Paired TOC and body batch20 workbench
on:
  push:
    branches: [feat/media-batch20-paired-toc-body]
    paths:
      - '.github/workflows/media-batch20-paired-workbench.yml'
      - 'scripts/apply-media-batch20-paired.py'
      - 'scripts/test-media-batch20-paired.mjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: media-batch20-paired-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-batch20-paired-toc-body
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply batch20 paired publication patch
        run: |
          set -euo pipefail
          python3 scripts/apply-media-batch20-paired.py
          node --check cloudflare/scripts/merge-new-body-auto.mjs
          node --check cloudflare/scripts/merge-local-captures.mjs
          node --check scripts/test-media-batch20-paired.mjs
          git diff --check
      - name: Verify target batch, stable tail and same-build TOC gate
        run: |
          set -euo pipefail
          node scripts/test-media-batch20-paired.mjs | tee "$RUNNER_TEMP/batch20-tests.log"
          grep -F 'BATCH20_PAIRED_TEST_SUMMARY ' "$RUNNER_TEMP/batch20-tests.log"
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const y=fs.readFileSync('.github/workflows/github-pages.yml','utf8');
          const toc=y.indexOf('Merge D1-free local VPN captures');
          const body=y.indexOf('Independently validate and publish newly marked body captures');
          assert.ok(toc>0&&body>toc,'TOC/local capture merge must run before body publication');
          const c=fs.readFileSync('.github/workflows/new-body-continuous.yml','utf8');
          assert.match(c,/cron:\s*'\*\/5 \* \* \* \*'/);
          const p=JSON.parse(fs.readFileSync('audit/media-auto-policy.json','utf8'));
          assert.equal(p.targetNewArticles,20);assert.equal(p.tailFlushAfterMinutes,15);assert.equal(p.requireOfficialToc,true);
          console.log('BATCH20_WORKFLOW_ORDER_OK');
          JS
      - name: Extract frozen actual marked-image fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,urllib.parse,urllib.request,zipfile
          class BoundRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if result is not None and urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(newurl).netloc:
                      result.remove_header('Authorization')
                  return result
          req=urllib.request.Request('https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery/actions/artifacts/10737978319/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(BoundRedirect()).open(req,timeout=40) as r: raw=r.read(32000001)
          assert len(raw)<=32000000
          assert hashlib.sha256(raw).hexdigest()=='d2ca8159ecdabb4ee21aa389f92f621de0c962eec657ba9514e31f584ded782c'
          z=zipfile.ZipFile(io.BytesIO(raw));ev=json.loads(z.read('evidence.json'));assert not ev['errors']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'auto-fixture';(out/'images').mkdir(parents=True)
          (out/'evidence.json').write_text(json.dumps(ev))
          for row in ev['images']:
              if row.get('reviewMarker',{}).get('revision')!='1': continue
              assert re.fullmatch(r'images/next-\d{3}\.(svg|png|webp)',row['file'])
              b=z.read(row['file']);assert hashlib.sha256(b).hexdigest()==row['sha256'];(out/row['file']).write_bytes(b)
          PY
      - name: Retain exact-byte automatic publication regressions
        env:
          BODY_AUTO_FIXTURE: ${{ runner.temp }}/auto-fixture
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-new-body-auto.mjs
          node scripts/test-reviewed-body.mjs
          node scripts/test-body-review-markers.mjs
          git diff --check
          git diff --exit-code -- public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/rolling-supplement.json public/toc-mainline.user.js src cloudflare/worker
      - name: Commit exact tested source changes on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/media-batch20-paired-toc-body
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/media-auto-policy.json cloudflare/scripts/merge-new-body-auto.mjs cloudflare/scripts/merge-local-captures.mjs .github/workflows/new-body-continuous.yml docs/body-media-publication.md scripts/test-new-body-auto.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'media: target twenty paired TOC/body articles and flush stable tails'
            git push origin HEAD:feat/media-batch20-paired-toc-body
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/batch20-tested-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-batch20-paired-tested
          path: |
            ${{ runner.temp }}/batch20-tests.log
            ${{ runner.temp }}/batch20-tested-head.txt
          retention-days: 14
          if-no-files-found: warn
