name: Capture real Gallery user UI for WeChat editorial
on:
  push:
    branches: [main]
    paths:
      - audit/automation-triggers/wechat-live-ui-capture-20261012.json
permissions:
  contents: write
concurrency:
  group: wechat-oct12-live-ui-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps chromium >/tmp/wechat-capture-install.log 2>&1 || { tail -60 /tmp/wechat-capture-install.log; exit 1; }
      - name: Capture real public UI without account mutations
        run: node scripts/wechat-capture-live-ui-20261012.mjs
      - name: Preserve unmodified high-resolution screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wechat-20261012-real-ui-${{ github.run_id }}
          path: audit/wechat-working/2026-10-12-live-ui/
          retention-days: 21
      - name: Commit screenshot evidence into audit only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wechat-live-ui
          cp -a audit/wechat-working/2026-10-12-live-ui/. /tmp/wechat-live-ui/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit/wechat-working/2026-10-12-live-ui
            cp -a /tmp/wechat-live-ui/. audit/wechat-working/2026-10-12-live-ui/
            git add audit/wechat-working/2026-10-12-live-ui
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit: archive Oct12 real public Gallery UI screenshots"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
