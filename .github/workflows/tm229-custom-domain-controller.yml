name: Bridge 2.2.32 custom-domain controller regression

on:
  push:
    branches: [fix/tm229-custom-domain-controller]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tm229-custom-domain-controller.yml'
      - '.github/workflows/tm222-live-acceptance.yml'
      - '.github/workflows/tm224-live-acceptance.yml'
      - '.github/workflows/tm227-result-precedence.yml'
      - '.github/workflows/tm228-skip-controller-failures.yml'
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'scripts/test-tm229-custom-domain-controller.mjs'
      - 'scripts/test-tm228-skip-controller-failures.mjs'
      - 'scripts/test-tm227-result-precedence.mjs'
      - 'scripts/test-tm224-acquisition.mjs'
      - 'scripts/test-tm-paired-capture.mjs'
      - 'scripts/validate-tm220-artifacts.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate custom-domain controller and retained skip contracts
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node scripts/test-tm229-custom-domain-controller.mjs
          node scripts/test-tm228-skip-controller-failures.mjs
          node scripts/test-tm227-result-precedence.mjs
          python3 scripts/apply-tm222-live-progress.py
          python3 scripts/apply-tm223-upload.py
          python3 scripts/apply-tm224-acquisition.py
          python3 scripts/patch-tm221-window-guard.py
          node scripts/test-tm223-upload.mjs
          node scripts/test-tm221-window-guard.mjs
          node scripts/test-tm222-auto-report.mjs
      - name: Retain Chromium acquisition and paired-capture behavior
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-tm224-acquisition.mjs | tee "$RUNNER_TEMP/tm229-acquisition.log"
          grep -F 'TM224_ACQUISITION_TEST_SUMMARY ' "$RUNNER_TEMP/tm229-acquisition.log"
          node scripts/test-tm-paired-capture.mjs
          node scripts/test-tm222-live-progress.mjs
      - name: Build exact Bridge 2.2.32 custom-domain installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.32' public/gallery-vpn-bridge.user.js
          grep -F '// @match        https://gallery.gczhouwld.com/*' public/gallery-vpn-bridge.user.js
          grep -F '// @updateURL    https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js' public/gallery-vpn-bridge.user.js
          grep -F '// @downloadURL  https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js' public/gallery-vpn-bridge.user.js
          grep -F "var CONTROLLER_REVISION = '2.2.32';" public/gallery-vpn-bridge.user.js
          grep -F "var GALLERY_HOST = 'gallery.gczhouwld.com';" public/gallery-vpn-bridge.user.js
          grep -F "badge('已跳过 '" public/gallery-vpn-bridge.user.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm229-custom-domain-tested
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
            ${{ runner.temp }}/tm229-acquisition.log
          retention-days: 7
          if-no-files-found: warn
