name: Tampermonkey DOI-scoped publisher provenance regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'cloudflare/worker/src/local-captures.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'tests/tm-20261012-scoped-provenance.test.mjs'
      - 'tests/tm-queue-coverage.test.mjs'
      - 'tests/tm-missing-only.test.mjs'
      - '.github/workflows/tm-20261012-scoped-publisher-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'cloudflare/worker/src/local-captures.js'
      - 'tests/tm-20261012-scoped-provenance.test.mjs'
      - '.github/workflows/tm-20261012-scoped-publisher-provenance.yml'
permissions:
  contents: read
concurrency:
  group: tm-scoped-provenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and DOI-scoped source provenance
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --check cloudflare/worker/src/local-captures.js
          node --check tests/tm-20261012-scoped-provenance.test.mjs
          node --test tests/tm-20261012-scoped-provenance.test.mjs
          node tests/tm-queue-coverage.test.mjs
          node tests/tm-missing-only.test.mjs
          node tests/tm-oct10-rsc-inventory-recovery.test.mjs
          node scripts/test-tm-oct1-scope-contract.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
