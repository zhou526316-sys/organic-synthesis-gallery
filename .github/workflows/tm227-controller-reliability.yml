name: Bridge 2.2.27 foreground controller reliability

on:
  push:
    branches: [fix/tm227-foreground-timeout]
    paths:
      - '.github/workflows/tm227-controller-reliability.yml'
      - '.github/workflows/tm224-live-acceptance.yml'
      - '.github/workflows/tm222-live-acceptance.yml'
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'scripts/test-tm227-controller-reliability.mjs'
      - 'scripts/test-tm224-acquisition.mjs'
      - 'scripts/test-tm-paired-capture.mjs'
      - 'scripts/validate-tm220-artifacts.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tm227-controller-reliability.yml'
      - '.github/workflows/tm224-live-acceptance.yml'
      - '.github/workflows/tm222-live-acceptance.yml'
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'scripts/test-tm227-controller-reliability.mjs'
      - 'scripts/test-tm224-acquisition.mjs'
      - 'scripts/validate-tm220-artifacts.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate controller reliability contract
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node scripts/test-tm227-controller-reliability.mjs
          node scripts/test-tm220-release.mjs
          node scripts/test-tm222-auto-report.mjs
          node scripts/test-tm223-upload.mjs
      - name: Run retained Chromium acquisition regressions
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-tm224-acquisition.mjs | tee "$RUNNER_TEMP/tm227-acquisition.log"
          grep -F 'TM224_ACQUISITION_TEST_SUMMARY ' "$RUNNER_TEMP/tm227-acquisition.log"
          node scripts/test-tm-paired-capture.mjs
          node scripts/test-tm222-live-progress.mjs
      - name: Build exact Bridge 2.2.27 installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.27' public/gallery-vpn-bridge.user.js
          grep -F "var VERSION = '6.2.20';" public/gallery-vpn-bridge.user.js
          grep -F "var CONTROLLER_REVISION = '2.2.27';" public/gallery-vpn-bridge.user.js
          grep -F "{active:true,insert:true,setParent:true}" public/gallery-vpn-bridge.user.js
          grep -F "publisher_job_finished" public/gallery-vpn-bridge.user.js
          grep -F "event:'last_progress'" public/gallery-vpn-bridge.user.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm227-controller-tested
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
            ${{ runner.temp }}/tm227-acquisition.log
          retention-days: 7
          if-no-files-found: warn
