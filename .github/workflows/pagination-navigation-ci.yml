name: Pagination navigation acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.ts'
      - 'src/bootstrap.ts'
      - 'src/styles.css'
      - 'src/pagination-layout.css'
      - 'shared/result-window*'
      - 'tests/pagination-navigation.spec.ts'
      - 'scripts/test-pagination-layout.mjs'
      - '.github/workflows/pagination-navigation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagination-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock @playwright/test@1.55.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Typecheck, model invariants and build
        run: |
          npx tsc --noEmit
          node --test scripts/test-result-window.mjs scripts/test-pagination-layout.mjs
          npm run build
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/pagination-preview.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pagination-preview.log
          exit 1
      - name: Verify layout, direct jump, boundaries and touch targets
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: pagination-report.json
        run: npx playwright test tests/pagination-navigation.spec.ts --browser=${{ matrix.browser }} --workers=1 --reporter=line,json
      - name: Build verified archive test fixture
        run: |
          node cloudflare/scripts/merge-curated-pages.mjs
          node scripts/build-gallery-architecture-public.mjs
          npm run build
          node scripts/pages-release-delivery.mjs build dist
      - name: Verify existing static and indexed pagination contracts
        env:
          ARCHITECTURE_PREVIEW_BASE: http://127.0.0.1:4173
        run: npx playwright test tests/architecture-frontend.spec.ts --grep 'pagination|active D1 catalog view|mobile D1 catalog search|680px breakpoint' --browser=${{ matrix.browser }} --workers=1 --reporter=line --output=archive-pagination-results
      - name: Record tested revision
        if: always()
        run: |
          git rev-parse HEAD > pagination-tested-commit.txt
          sha256sum src/main.ts src/bootstrap.ts src/pagination-layout.css shared/result-window.js > pagination-source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagination-${{ matrix.browser }}
          path: |
            test-results/
            archive-pagination-results/
            pagination-report.json
            pagination-tested-commit.txt
            pagination-source-sha256.txt
          retention-days: 7
