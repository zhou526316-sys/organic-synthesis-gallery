name: Backfill literature authors

on:
  push:
    branches:
      - feat/site-authors-sep17
    paths:
      - 'scripts/backfill-authors.mjs'
      - '.github/workflows/backfill-authors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Backfill all authors from Crossref
        run: node scripts/backfill-authors.mjs
        env:
          AUTHOR_BACKFILL_CONCURRENCY: '5'

      - name: Verify zero missing authors
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit/author-coverage.json', 'utf8'));
          if (audit.missingAuthors !== 0) throw new Error(`missing authors: ${audit.missingAuthors}`);
          console.log(JSON.stringify(audit));
          NODE

      - name: Commit generated author metadata
        run: |
          if git diff --quiet; then
            echo "No author changes"
            exit 0
          fi
          git config user.name "organic-gallery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/literature-supplement.json audit/author-coverage.json audit/missing-authors.json
          git commit -m "data: backfill authors across literature corpus"
          git push origin HEAD:${{ github.ref_name }}
