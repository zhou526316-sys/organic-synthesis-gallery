name: Deploy Worker frontend assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WORKER_FRONTEND_REFRESH'
      - '.github/workflows/deploy-worker-frontend.yml'
      - 'cloudflare/worker/src/**'
      - 'cloudflare/worker/package.json'
      - 'cloudflare/migrations/**'
      - 'cloudflare/schema.sql'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
      R2_BUCKET: organic-synthesis-gallery-media
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: 'Organic Synthesis Gallery <login@mail.gczhouwld.com>'
      WECHAT_MP_APP_ID: wx28b0fa5a3e28387c
      WECHAT_MP_APP_SECRET: ${{ secrets.WECHAT_MP_APP_SECRET }}
      WECHAT_TICKET_RELAY_URL: ${{ secrets.WECHAT_TICKET_RELAY_URL }}
      WECHAT_TICKET_RELAY_KEY: ${{ secrets.WECHAT_TICKET_RELAY_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUMMARY_REVIEW_ENABLED: ${{ vars.SUMMARY_REVIEW_ENABLED }}
      SUMMARY_ALLOW_UNKNOWN_POLICY: ${{ vars.SUMMARY_ALLOW_UNKNOWN_POLICY }}
      SUMMARY_DRAFT_MODEL: ${{ vars.SUMMARY_DRAFT_MODEL }}
      SUMMARY_AUDIT_MODEL: ${{ vars.SUMMARY_AUDIT_MODEL }}
      SUMMARY_REVIEW_DAILY_LIMIT: ${{ vars.SUMMARY_REVIEW_DAILY_LIMIT }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build current frontend assets
        run: npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Resolve existing Cloudflare bindings
        id: bindings
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID" || { echo 'D1 database binding is missing'; exit 1; }
          npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Generate frontend deployment configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.bindings.outputs.d1_id }}
        run: |
          set -euo pipefail
          cat > wrangler.frontend.toml <<EOF
          name = "organic-synthesis-gallery"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          workers_dev = true

          [vars]
          MIGRATION_STAGE = "staging"
          WECHAT_MP_APP_ID = "$WECHAT_MP_APP_ID"
          WECHAT_TICKET_RELAY_URL = "$WECHAT_TICKET_RELAY_URL"
          SUMMARY_REVIEW_ENABLED = "${SUMMARY_REVIEW_ENABLED:-1}"
          SUMMARY_ALLOW_UNKNOWN_POLICY = "${SUMMARY_ALLOW_UNKNOWN_POLICY:-1}"
          SUMMARY_DRAFT_MODEL = "${SUMMARY_DRAFT_MODEL:-gpt-5.6-terra}"
          SUMMARY_AUDIT_MODEL = "${SUMMARY_AUDIT_MODEL:-gpt-5.6-sol}"
          SUMMARY_REVIEW_DAILY_LIMIT = "${SUMMARY_REVIEW_DAILY_LIMIT:-96}"

          [ai]
          binding = "AI"

          [triggers]
          crons = ["*/5 * * * *"]

          [assets]
          directory = "../../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/media/*"]

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "$R2_BUCKET"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF

      - name: Dry-run frontend Worker bundle
        working-directory: cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.frontend.toml --outdir .wrangler-frontend-dry-run

      - name: Apply atomic summary-review lease migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file ../migrations/2026-09-25-summary-review-lease.sql

      - name: Deploy frontend assets
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.frontend.toml

      - name: Sync configured runtime secrets
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const values = {};
          if (process.env.RESEND_API_KEY) values.RESEND_API_KEY = process.env.RESEND_API_KEY;
          if (process.env.EMAIL_FROM) values.EMAIL_FROM = process.env.EMAIL_FROM;
          if (process.env.WECHAT_MP_APP_SECRET) values.WECHAT_MP_APP_SECRET = process.env.WECHAT_MP_APP_SECRET;
          if (process.env.WECHAT_TICKET_RELAY_KEY) values.WECHAT_TICKET_RELAY_KEY = process.env.WECHAT_TICKET_RELAY_KEY;
          if (process.env.OPENAI_API_KEY) values.OPENAI_API_KEY = process.env.OPENAI_API_KEY;
          if (!process.env.WECHAT_MP_APP_SECRET) console.warn('WECHAT_MP_APP_SECRET is not configured; WeChat JS-SDK signing will remain disabled until the repository secret is added.');
          if (!process.env.OPENAI_API_KEY) console.warn('OPENAI_API_KEY is not configured; GPT summary review remains disabled.');
          if (!Object.keys(values).length) throw new Error('Runtime secrets are missing');
          fs.writeFileSync('/tmp/runtime-secrets.json', JSON.stringify(values));
          console.log(`Prepared ${Object.keys(values).length} runtime secrets.`);
          NODE
          npx wrangler secret bulk /tmp/runtime-secrets.json --config wrangler.frontend.toml >/dev/null
          rm -f /tmp/runtime-secrets.json
      - name: Verify WeChat MP domain file
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.gczhouwld.com/MP_verify_UBgOE7Geixav7CCb.txt"
          for i in {1..12}; do
            if BODY="$(curl --fail --silent --show-error --max-time 15 "$URL" 2>/dev/null)" && [ "$BODY" = "UBgOE7Geixav7CCb" ]; then
              echo "WeChat MP verification file is live at $URL"
              exit 0
            fi
            sleep 5
          done
          echo "WeChat MP verification file did not become live in time" >&2
          exit 1

      - name: Verify fixed-egress WeChat relay directly
        env:
          WECHAT_TICKET_RELAY_URL: ${{ secrets.WECHAT_TICKET_RELAY_URL }}
          WECHAT_TICKET_RELAY_KEY: ${{ secrets.WECHAT_TICKET_RELAY_KEY }}
        run: |
          node - <<'NODE'
          const response = await fetch(process.env.WECHAT_TICKET_RELAY_URL, {
            headers: { authorization: `Bearer ${process.env.WECHAT_TICKET_RELAY_KEY}`, accept: 'application/json' },
          });
          const text = await response.text();
          let body = {};
          try { body = text ? JSON.parse(text) : {}; } catch {}
          const safe = {
            status: response.status,
            ok: body?.ok === true,
            error: body?.error,
            reason: body?.reason,
            errcode: body?.errcode,
            errmsg: body?.errmsg,
            expiresIn: body?.expiresIn ?? body?.expires_in,
            ticketPresent: typeof body?.ticket === 'string' && body.ticket.length > 0,
          };
          console.log(JSON.stringify(safe));
          if (!response.ok || body?.ok !== true || !safe.ticketPresent) {
            throw new Error('Fixed-egress WeChat relay probe failed: ' + JSON.stringify(safe));
          }
          NODE

      - name: Verify WeChat JS-SDK signature endpoint
        env:
          SITE_URL: https://api.gczhouwld.com
        run: |
          node - <<'NODE'
          const target = 'https://gallery.gczhouwld.com/?doi=10.1021/jacs.6c15393';
          const url = new URL('/api/wechat/js-sdk-signature', process.env.SITE_URL);
          url.searchParams.set('url', target);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
          const text = await response.text();
          let body = {};
          try { body = text ? JSON.parse(text) : {}; } catch {}
          console.log(JSON.stringify({ status: response.status, body }));
          if (!response.ok || body?.ok !== true || !body?.signature) {
            throw new Error('WeChat JS-SDK signature probe failed: ' + JSON.stringify({ status: response.status, body }));
          }
          if (body.appId !== 'wx28b0fa5a3e28387c') {
            throw new Error('WeChat JS-SDK returned an unexpected AppID');
          }
          NODE

      - name: Probe configured email delivery
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: |
          node - <<'NODE'
          const response = await fetch(process.env.WORKER_URL + '/api/admin/email/probe', {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.BRIDGE_WRITE_TOKEN}` },
          });
          const text = await response.text();
          let body = {};
          try { body = text ? JSON.parse(text) : {}; } catch {}
          console.log(JSON.stringify({ status: response.status, body }));
          if (!response.ok || body?.ok !== true) console.warn('Email delivery probe failed; frontend deployment continues with diagnostics above.');
          NODE

      - name: Verify feedback runtime routes without D1 reads
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
        run: |
          node - <<'NODE'
          const base = process.env.WORKER_URL;
          const origin = 'https://gallery.gczhouwld.com';

          async function call(path, init = {}) {
            const headers = new Headers(init.headers || {});
            headers.set('origin', origin);
            const response = await fetch(`${base}${path}`, { ...init, headers });
            const text = await response.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch {}
            return { status: response.status, body };
          }

          const invalid = await call('/api/user-ui/site-feedback', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ profileId: '', message: '' }),
          });
          if (invalid.status !== 400 || !invalid.body?.error) {
            throw new Error(`site-feedback validation route invalid: ${JSON.stringify(invalid)}`);
          }

          const protectedExport = await call('/api/admin/site-feedback/open?limit=1');
          if (protectedExport.status !== 401) {
            throw new Error(`feedback export route is not protected: ${JSON.stringify(protectedExport)}`);
          }

          console.log(JSON.stringify({
            feedbackSubmissionRoute: true,
            protectedFeedbackExport: true,
          }));
          NODE

      - name: Verify deployed search filtering CSS
        env:
          SITE_URL: https://organic-synthesis-gallery.zhou526316.workers.dev/
        run: |
          node - <<'NODE'
          const site = process.env.SITE_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const marker = /\.card\[hidden\]\{display:none!important\}/;

          for (let attempt = 0; attempt < 10; attempt += 1) {
            try {
              const htmlResponse = await fetch(`${site}?search-css-smoke=${Date.now()}`, {
                headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
              });
              const html = await htmlResponse.text();
              const hrefs = [...html.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["']/g)]
                .map(match => new URL(match[1], site).href);
              const css = (await Promise.all(hrefs.map(async href => {
                const response = await fetch(`${href}${href.includes('?') ? '&' : '?'}smoke=${Date.now()}`, {
                  headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                });
                return response.ok ? response.text() : '';
              }))).join('\n');
              if (marker.test(css)) {
                console.log(JSON.stringify({ searchFilteringCss: true, stylesheets: hrefs.length, site }));
                process.exit(0);
              }
            } catch (error) {
              console.warn(String(error));
            }
            await sleep(3000);
          }
          throw new Error(`${site}: deployed CSS is missing .card[hidden]{display:none!important}`);
          NODE
