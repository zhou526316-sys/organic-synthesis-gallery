          }

          const passes=[];
          for(let attempt=1;attempt<=4&&passes.length<2;attempt+=1){
            status=await call('/api/admin/user-library-shadow/status');
            if(status.legacyUsers!==status.shadowHeads||status.revisionMismatches!==0){
              await new Promise(resolve=>setTimeout(resolve,750));
              continue;
            }
            let offset=0,checked=0,mismatched=0;
            const reasons={};
            for(let pageNo=0;pageNo<200;pageNo+=1){
              const page=await call('/api/admin/user-library-shadow/compare?offset='+offset+'&limit=20');
