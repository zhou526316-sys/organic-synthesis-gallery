              if(page.complete===true) break;
              if(page.nextOffset===null||Number(page.nextOffset)<=offset) throw new Error('user library compare cursor stalled');
              offset=Number(page.nextOffset);
            }
            const after=await call('/api/admin/user-library-shadow/status');
            const stable=status.legacyUsers===after.legacyUsers
