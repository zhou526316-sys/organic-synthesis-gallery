name: Deploy Worker frontend assets

# Canonical production Worker deployment authority. Maintenance workflows may
# mutate D1 or named secrets but must not deploy a partial Worker configuration.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WORKER_FRONTEND_REFRESH'
      - '.github/workflows/deploy-worker-frontend.yml'
      - 'cloudflare/worker/src/**'
      - 'cloudflare/worker/package.json'
      - 'cloudflare/site-analytics-v2.sql'
      - 'cloudflare/user-library-state-v2.sql'
      - 'cloudflare/user-library-state-v3.sql'
      - 'cloudflare/evidence-index-v1.sql'
      - 'cloudflare/summary-candidate-index-v1.sql'
      - 'cloudflare/literature-catalog-index-v1.sql'
      - 'scripts/test-summary-candidate-shadow-deployment-contract.mjs'
      - 'scripts/test-literature-catalog-index-shadow-deployment-contract.mjs'
      - 'scripts/test-scheduled-handoff-shadow-deployment-contract.mjs'
      - 'scripts/test-user-library-shadow-deployment-contract.mjs'
      - 'scripts/test-user-library-v3-deployment-contract.mjs'
      - 'scripts/test-site-analytics-materialized-deployment-contract.mjs'
      - 'cloudflare/scripts/build-cloudflare-bridge.mjs'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'public/toc-mainline.user.js'
      - 'public/scheduled-article-summaries.json'
      - 'public/wechat-editions/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
      LITERATURE_INDEX_D1_NAME: organic-synthesis-lit-index
      R2_BUCKET: organic-synthesis-gallery-media
      PDF_R2_BUCKET: organic-synthesis-gallery-private-pdf
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: 'Organic Synthesis Gallery <login@mail.gczhouwld.com>'
      WECHAT_MP_APP_ID: wx28b0fa5a3e28387c
      WECHAT_MP_APP_SECRET: ${{ secrets.WECHAT_MP_APP_SECRET }}
      WECHAT_TICKET_RELAY_URL: ${{ secrets.WECHAT_TICKET_RELAY_URL }}
      WECHAT_TICKET_RELAY_KEY: ${{ secrets.WECHAT_TICKET_RELAY_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate primary custom-domain Bridge installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          BRIDGE_VERSION="$(sed -n 's#^// @version[[:space:]]*##p' public/gallery-vpn-bridge.user.js | head -1 | tr -d '\r')"
          test -n "$BRIDGE_VERSION"
          grep -F '// @updateURL    https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js' public/gallery-vpn-bridge.user.js
          # Internal capture/controller compatibility is validated above by validate-tm220-artifacts.mjs.
          # Do not require the public Bridge package version to equal the controller revision:
          # they are intentionally versioned independently.

      - name: Build current frontend assets
        run: npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Validate literature index shadow deployment contract
        run: |
          node --check scripts/sync-literature-catalog-index-shadow.mjs
          node --test scripts/test-literature-catalog-index-shadow-deployment-contract.mjs scripts/test-literature-catalog-index-shadow-sync-contract.mjs

      - name: Resolve existing Cloudflare bindings
        id: bindings
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const row=rows.find(item=>item.name===process.env.D1_NAME);if(row?.uuid)process.stdout.write(row.uuid)")
          test -n "$D1_ID" || { echo 'D1 database binding is missing'; exit 1; }
          LITERATURE_INDEX_D1_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const row=rows.find(item=>item.name===process.env.LITERATURE_INDEX_D1_NAME);if(row?.uuid)process.stdout.write(row.uuid)")
          if [ -z "$LITERATURE_INDEX_D1_ID" ]; then
            echo "Creating dedicated literature search D1: $LITERATURE_INDEX_D1_NAME"
            if ! CI=true npx wrangler d1 create "$LITERATURE_INDEX_D1_NAME" >/tmp/literature-index-d1-create.txt 2>&1; then
              cat /tmp/literature-index-d1-create.txt
              echo "Create command failed; refreshing D1 list in case another run created it."
            fi
            npx wrangler d1 list --json > /tmp/d1-list-after-literature-index.json
            LITERATURE_INDEX_D1_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1-list-after-literature-index.json','utf8'));const row=rows.find(item=>item.name===process.env.LITERATURE_INDEX_D1_NAME);if(row?.uuid)process.stdout.write(row.uuid)")
          fi
          test -n "$LITERATURE_INDEX_D1_ID" || { echo 'Dedicated literature index D1 is missing'; exit 1; }
          npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null
          if ! npx wrangler r2 bucket info "$PDF_R2_BUCKET" --json >/dev/null 2>&1; then
            npx wrangler r2 bucket create "$PDF_R2_BUCKET" >/dev/null
          fi
          npx wrangler r2 bucket info "$PDF_R2_BUCKET" --json >/dev/null
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"
          echo "literature_index_d1_id=$LITERATURE_INDEX_D1_ID" >> "$GITHUB_OUTPUT"

      - name: Apply isolated private PDF D1 migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../private-pdf-v1.sql >/tmp/private-pdf-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --file=../private-pdf-v2.sql >/tmp/private-pdf-v2-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('user_capabilities','private_pdf_documents','private_pdf_access_tokens','private_pdf_capture_leases') ORDER BY name;" --json >/tmp/private-pdf-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/private-pdf-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['private_pdf_access_tokens','private_pdf_capture_leases','private_pdf_documents','user_capabilities'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('private PDF schema migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({privatePdfSchemaReady:true,tables:names}));
          NODE

      - name: Apply materialized site analytics D1 migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../site-analytics-v2.sql >/tmp/site-analytics-v2-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('site_global_stats_v2','site_daily_stats_v2','site_dimension_daily_stats_v2','site_analytics_visitors_v2','site_analytics_materialized_events_v2','site_analytics_v2_backfill') ORDER BY name;" --json >/tmp/site-analytics-v2-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/site-analytics-v2-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['site_analytics_materialized_events_v2','site_analytics_v2_backfill','site_analytics_visitors_v2','site_daily_stats_v2','site_dimension_daily_stats_v2','site_global_stats_v2'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('site analytics v2 migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({siteAnalyticsV2SchemaReady:true,tables:names}));
          NODE

      - name: Apply user library row-shadow D1 migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../user-library-state-v2.sql >/tmp/user-library-shadow-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('user_library_head','user_paper_state','user_library_shadow_backfill') ORDER BY name;" --json >/tmp/user-library-shadow-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/user-library-shadow-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['user_library_head','user_library_shadow_backfill','user_paper_state'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('user library shadow migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({userLibraryShadowSchemaReady:true,tables:names}));
          NODE

      - name: Apply user library V3 foundation migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../user-library-state-v3.sql >/tmp/user-library-v3-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('user_library_v3_head','user_library_v3_rows','user_library_v3_commits','user_library_v3_changes','user_library_v3_shape','user_library_v3_authority','user_library_v3_shadow_sync','user_library_v3_backfill') ORDER BY name;" --json >/tmp/user-library-v3-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/user-library-v3-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['user_library_v3_authority','user_library_v3_backfill','user_library_v3_changes','user_library_v3_commits','user_library_v3_head','user_library_v3_rows','user_library_v3_shadow_sync','user_library_v3_shape'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('user library v3 migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({userLibraryV3SchemaReady:true,tables:names,shadow:'enabled',boundedRead:'enabled-after-deploy',accountPull:'D3b',write:'disabled'}));
          NODE

      - name: Apply Evidence Index D1 migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../evidence-index-v1.sql >/tmp/evidence-index-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('article_evidence_index','article_evidence_index_backfill','article_evidence_handoff_backfill') ORDER BY name;" --json >/tmp/evidence-index-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/evidence-index-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['article_evidence_handoff_backfill','article_evidence_index','article_evidence_index_backfill'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('Evidence Index migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({evidenceIndexSchemaReady:true,tables:names}));
          NODE

      - name: Apply summary candidate index D1 migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=../summary-candidate-index-v1.sql >/tmp/summary-candidate-index-migration.txt
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('summary_review_job_index','summary_review_job_index_backfill') ORDER BY name;" --json >/tmp/summary-candidate-index-schema-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/summary-candidate-index-schema-check.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          const names=rows.map(x=>x.name).sort();
          const expected=['summary_review_job_index','summary_review_job_index_backfill'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('summary candidate index migration incomplete: '+JSON.stringify(names));
          console.log(JSON.stringify({summaryCandidateIndexSchemaReady:true,tables:names}));
          NODE

      - name: Apply dedicated literature search index migration
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$LITERATURE_INDEX_D1_NAME" --remote --file=../literature-catalog-index-v1.sql >/tmp/literature-index-migration.txt
          npx wrangler d1 execute "$LITERATURE_INDEX_D1_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('literature_catalog_generations','literature_catalog_index','literature_catalog_fts') ORDER BY name;" --json >/tmp/literature-index-schema-check.json
          npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT COUNT(*) AS c FROM sqlite_master WHERE name='literature_catalog_fts';" --json >/tmp/primary-d1-no-fts-check.json
          node - <<'NODE'
          const fs=require('fs');
          const unpack=file=>{
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            return Array.isArray(data)?data.flatMap(x=>x.results||[]):(data.results||[]);
          };
          const names=unpack('/tmp/literature-index-schema-check.json').map(x=>x.name).sort();
          const expected=['literature_catalog_fts','literature_catalog_generations','literature_catalog_index'];
          if(JSON.stringify(names)!==JSON.stringify(expected)) throw new Error('literature search index migration incomplete: '+JSON.stringify(names));
          const primary=unpack('/tmp/primary-d1-no-fts-check.json');
          if(Number(primary[0]?.c||0)!==0) throw new Error('primary D1 must remain free of literature FTS tables');
          console.log(JSON.stringify({literatureIndexSchemaReady:true,tables:names,primaryD1FtsFree:true}));
          NODE

      - name: Generate frontend deployment configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.bindings.outputs.d1_id }}
          LITERATURE_INDEX_D1_ID: ${{ steps.bindings.outputs.literature_index_d1_id }}
        run: |
          set -euo pipefail
          cat > wrangler.frontend.toml <<EOF
          name = "organic-synthesis-gallery"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          workers_dev = true

          [vars]
          MIGRATION_STAGE = "staging"
          WECHAT_MP_APP_ID = "$WECHAT_MP_APP_ID"
          WECHAT_TICKET_RELAY_URL = "$WECHAT_TICKET_RELAY_URL"
          SUMMARY_REVIEW_ENABLED = "0"
          SUMMARY_MODE = "scheduled_chatgpt_daily_no_api"
          SUMMARY_PUBLICATION_TIME = "12:00 Asia/Shanghai"
          EVIDENCE_INDEX_SHADOW_ENABLED = "1"
          SUMMARY_CANDIDATE_INDEX_SHADOW_ENABLED = "1"
          SCHEDULED_HANDOFF_INDEX_READ_ENABLED = "1"
          USER_LIBRARY_ROW_SHADOW_ENABLED = "1"
          USER_LIBRARY_ROW_READ_ENABLED = "1"
          USER_LIBRARY_V3_SHADOW_ENABLED = "1"
          USER_LIBRARY_V3_READ_ENABLED = "1"
          USER_LIBRARY_V3_WRITE_ENABLED = "0"
          USER_LIBRARY_V3_WRITE_CANARY_USER_ID = "__gallery_v3_write_canary__"
          USER_LIBRARY_V3_WRITE_ROLLOUT_BPS = "0"
          USER_LIBRARY_V3_WRITE_ROLLOUT_SEED = "d3c4c-2026-10-07"
          SITE_ANALYTICS_MATERIALIZED_SHADOW_ENABLED = "1"
          SITE_ANALYTICS_MATERIALIZED_READ_ENABLED = "1"
          LITERATURE_CATALOG_INDEX_SHADOW_ENABLED = "1"
          LITERATURE_CATALOG_INDEX_READ_ENABLED = "1"
          PRIVATE_PDF_READ_ENABLED = "1"
          PRIVATE_PDF_CAPTURE_ENABLED = "1"
          PRIVATE_PDF_PROCESSING_ENABLED = "0"

          [ai]
          binding = "AI"

          [triggers]
          crons = ["0 */6 * * *"]

          [assets]
          directory = "../../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/media/*"]

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "$R2_BUCKET"

          [[r2_buckets]]
          binding = "PDF_PRIVATE"
          bucket_name = "$PDF_R2_BUCKET"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"

          [[d1_databases]]
          binding = "LITERATURE_INDEX_DB"
          database_name = "$LITERATURE_INDEX_D1_NAME"
          database_id = "$LITERATURE_INDEX_D1_ID"
          EOF

      - name: Dry-run frontend Worker bundle
        working-directory: cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.frontend.toml --outdir .wrangler-frontend-dry-run

      - name: Deploy frontend assets
        id: deploy_worker
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.frontend.toml

      - name: Sync configured runtime secrets
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const values = {};
          if (process.env.RESEND_API_KEY) values.RESEND_API_KEY = process.env.RESEND_API_KEY;
          if (process.env.EMAIL_FROM) values.EMAIL_FROM = process.env.EMAIL_FROM;
          if (process.env.WECHAT_MP_APP_SECRET) values.WECHAT_MP_APP_SECRET = process.env.WECHAT_MP_APP_SECRET;
          if (process.env.WECHAT_TICKET_RELAY_KEY) values.WECHAT_TICKET_RELAY_KEY = process.env.WECHAT_TICKET_RELAY_KEY;
          if (!process.env.WECHAT_MP_APP_SECRET) console.warn('WECHAT_MP_APP_SECRET is not configured; WeChat JS-SDK signing will remain disabled until the repository secret is added.');
          if (!Object.keys(values).length) throw new Error('Runtime secrets are missing');
          fs.writeFileSync('/tmp/runtime-secrets.json', JSON.stringify(values));
          console.log(`Prepared ${Object.keys(values).length} runtime secrets.`);
          NODE
          npx wrangler secret bulk /tmp/runtime-secrets.json --config wrangler.frontend.toml >/dev/null
          rm -f /tmp/runtime-secrets.json


      - name: Verify literature indexed read activation
        id: literature_index_read_canary
        continue-on-error: true
        env:
          SITE_URL: https://gallery.gczhouwld.com/
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const reportPath='/tmp/literature-index-read-canary.json';
          const site=new URL(process.env.SITE_URL);
          const worker=String(process.env.WORKER_URL||'').replace(/\/$/,'');
          const token=process.env.BRIDGE_WRITE_TOKEN||'';
          const report={
            schemaVersion:1,phase:'P1-literature-index-read-activation',
            ok:false,rolledBack:false,startedAt:new Date().toISOString(),
          };
          const save=()=>fs.writeFileSync(reportPath,JSON.stringify(report,null,2)+'\n');
          save();

          async function jsonFetch(url,init={},attempts=6){
            let last;
            for(let attempt=1;attempt<=attempts;attempt+=1){
              try{
                const response=await fetch(url,{
                  ...init,
                  headers:{'cache-control':'no-cache',pragma:'no-cache',...(init.headers||{})},
                  signal:AbortSignal.timeout(30000),
                });
                const text=await response.text();
                let body={};try{body=text?JSON.parse(text):{};}catch{}
                last={status:response.status,ok:response.ok,body,text:text.slice(0,900)};
                if(response.status<500) return last;
              }catch(error){
                last={status:0,ok:false,body:{},text:String(error?.message||error)};
              }
              await new Promise(resolve=>setTimeout(resolve,1000*attempt));
            }
            return last;
          }

          try{
            if(!token) throw new Error('BRIDGE_WRITE_TOKEN is required for indexed-read activation canary');
            const release=await jsonFetch(new URL('architecture-v1/release.json?indexed-canary='+Date.now(),site));
            if(!release?.ok) throw new Error('architecture release unavailable: '+JSON.stringify(release));
            const catalogId=String(release.body?.catalogId||'');
            const productionCards=Number(release.body?.recordCount||0);
            if(release.body?.schema!=='gallery-architecture-public-v1'
              ||release.body?.productionActivation!==false
              ||!/^[a-f0-9]{64}$/.test(catalogId)
              ||!Number.isSafeInteger(productionCards)||productionCards<1){
              throw new Error('architecture release identity invalid: '+JSON.stringify(release.body));
            }

            const status=await jsonFetch(worker+'/api/admin/literature-catalog-index/status',{
              headers:{authorization:`Bearer ${token}`},
            });
            if(!status?.ok||status.body?.enabled!==true||status.body?.readConfigured!==true||status.body?.readPathActive!==true){
              throw new Error('indexed read status inactive: '+JSON.stringify(status));
            }
            const generation=(status.body.generations||[]).find(row=>row?.catalogId===catalogId);
            const request={
              catalogId,query:'',selectedJournals:[],excludedJournals:[],
              dateFrom:'',dateTo:'',addedDate:'',sort:'newest',limit:2,cursor:'',
            };
            const first=await jsonFetch(worker+'/api/literature/catalog-view',{
              method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(request),
            });

            if(generation?.ready===true){
              if(!first?.ok||first.body?.readPathActive!==true||first.body?.catalogId!==catalogId
                ||Number(first.body?.matched)!==productionCards||Number(first.body?.count)<1
                ||Number(first.body?.count)>2||first.body?.sort!=='newest'){
                throw new Error('indexed public page invalid: '+JSON.stringify(first));
              }
              if(first.body?.hasMore===true){
                if(typeof first.body?.nextCursor!=='string'||!first.body.nextCursor) {
                  throw new Error('indexed public cursor missing');
                }
                const second=await jsonFetch(worker+'/api/literature/catalog-view',{
                  method:'POST',
                  headers:{'content-type':'application/json'},
                  body:JSON.stringify({...request,cursor:first.body.nextCursor}),
                });
                if(!second?.ok||second.body?.readPathActive!==true||second.body?.catalogId!==catalogId
                  ||Number(second.body?.matched)!==productionCards||Number(second.body?.count)<1){
                  throw new Error('indexed public second page invalid: '+JSON.stringify(second));
                }
                const firstDois=new Set((first.body.items||[]).map(row=>row?.doi));
                if((second.body.items||[]).some(row=>firstDois.has(row?.doi))) {
                  throw new Error('indexed cursor repeated first-page DOI');
                }
              }
              report.mode='ready-generation';
            }else{
              if(first?.status!==409||first.body?.error!=='literature_catalog_generation_not_ready'
                ||first.body?.readPathActive!==false){
                throw new Error('generation handoff did not fail closed: '+JSON.stringify(first));
              }
              report.mode='pending-generation-safe-fallback';
            }

            const impossible='0'.repeat(64);
            const absent=await jsonFetch(worker+'/api/literature/catalog-view',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({...request,catalogId:impossible}),
            });
            if(absent?.status!==409||absent.body?.error!=='literature_catalog_generation_not_ready'
              ||absent.body?.readPathActive!==false){
              throw new Error('unknown generation produced an unsafe response: '+JSON.stringify(absent));
            }

            report.ok=true;
            report.catalogId=catalogId;
            report.productionCards=productionCards;
            report.currentGenerationReady=generation?.ready===true;
            report.readConfigured=true;
            report.readPathActive=true;
            report.completedAt=new Date().toISOString();
            save();
            console.log('LITERATURE_INDEX_READ_CANARY '+JSON.stringify(report));
          }catch(error){
            report.error=String(error?.message||error).slice(0,1200);
            report.failedAt=new Date().toISOString();
            save();
            throw error;
          }
          NODE

      - name: Roll back literature indexed read on canary failure
        if: steps.literature_index_read_canary.outcome == 'failure'
        working-directory: cloudflare/worker
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
        run: |
          set -euo pipefail
          sed -i 's/LITERATURE_CATALOG_INDEX_READ_ENABLED = "1"/LITERATURE_CATALOG_INDEX_READ_ENABLED = "0"/' wrangler.frontend.toml
          grep -F 'LITERATURE_CATALOG_INDEX_READ_ENABLED = "0"' wrangler.frontend.toml
          npx wrangler deploy --config wrangler.frontend.toml
          node - <<'NODE'
          import fs from 'node:fs';
          const base=String(process.env.WORKER_URL||'').replace(/\/$/,'');
          let last=null;
          for(let attempt=1;attempt<=10;attempt+=1){
            const response=await fetch(base+'/api/_healthcheck?indexed-rollback='+Date.now(),{
              headers:{'cache-control':'no-cache',pragma:'no-cache'},
              signal:AbortSignal.timeout(30000),
            });
            const body=await response.json().catch(()=>({}));
            last={status:response.status,body};
            if(response.ok&&body?.literatureCatalogIndexReadEnabled===false
              &&body?.literatureCatalogIndexReadPathActive===false) break;
            await new Promise(resolve=>setTimeout(resolve,1500));
          }
          if(last?.body?.literatureCatalogIndexReadEnabled!==false
            ||last?.body?.literatureCatalogIndexReadPathActive!==false){
            throw new Error('indexed-read rollback verification failed: '+JSON.stringify(last));
          }
          const reportPath='/tmp/literature-index-read-canary.json';
          let report={};try{report=JSON.parse(fs.readFileSync(reportPath,'utf8'));}catch{}
          report.rolledBack=true;
          report.rollbackVerifiedAt=new Date().toISOString();
          fs.writeFileSync(reportPath,JSON.stringify(report,null,2)+'\n');
          console.log('LITERATURE_INDEX_READ_ROLLBACK '+JSON.stringify({ok:true}));
          NODE

