            console.log(JSON.stringify({userLibraryShadowComparisonAttempt:attempt,...pass}));
            if(stable&&mismatched===0&&checked===after.legacyUsers) passes.push(pass);
            if(passes.length<2) await new Promise(resolve=>setTimeout(resolve,750));
          }
          if(passes.length<2) throw new Error('user library row shadow could not obtain two stable full parity passes');

