      - name: Backfill and verify materialized site analytics read path
        id: site_analytics_shadow
        continue-on-error: true
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const base=process.env.WORKER_URL;
          const token=process.env.BRIDGE_WRITE_TOKEN;
          const reportPath='/tmp/site-analytics-materialized-shadow-report.json';
          fs.writeFileSync(reportPath,JSON.stringify({
            schemaVersion:1,phase:'D4b-site-analytics-materialized-read-live',
            ok:false,status:'started',readPathActive:true,startedAt:new Date().toISOString(),
          },null,2)+'\n');
          if(!token) throw new Error('BRIDGE_WRITE_TOKEN is required for analytics shadow');

          async function call(path,{method='GET'}={}){
            const response=await fetch(base+path,{
              method,
              headers:{authorization:`Bearer ${token}`,'cache-control':'no-cache'},
              signal:AbortSignal.timeout(30000),
            });
            const text=await response.text();
            let body={};try{body=text?JSON.parse(text):{};}catch{}
            if(!response.ok) throw new Error(path+' failed: '+response.status+' '+text.slice(0,700));
            return body;
          }

          let status=await call('/api/admin/site-analytics-materialized/status');
          if(status.enabled!==true||status.readConfigured!==true){
            throw new Error('site analytics materialized read configuration invalid: '+JSON.stringify(status));
          }

          let pages=0;
          while(status.backfill?.complete!==true
            ||status.materializedEvents!==status.rawEvents
            ||Number(status.backfill?.lastEventId||0)!==Number(status.rawMaxEventId||0)){
            pages+=1;
            if(pages>400) throw new Error('site analytics materialized backfill exceeded 400 pages');
            const page=await call('/api/admin/site-analytics-materialized/backfill?limit=50',{method:'POST'});
            if(page.ok!==true) throw new Error('site analytics backfill page invalid: '+JSON.stringify(page));
            status=await call('/api/admin/site-analytics-materialized/status');
          }

          const passes=[];
          for(let attempt=1;attempt<=6&&passes.length<2;attempt+=1){
            const before=await call('/api/admin/site-analytics-materialized/status');
            const comparison=await call('/api/admin/site-analytics-materialized/compare');
            const after=await call('/api/admin/site-analytics-materialized/status');
            const stable=before.rawEvents===after.rawEvents
              &&before.materializedEvents===after.materializedEvents
              &&after.rawEvents===after.materializedEvents
              &&after.backfill?.complete===true
              &&Number(after.backfill?.lastEventId||0)===Number(after.rawMaxEventId||0);
            console.log(JSON.stringify({
              siteAnalyticsComparisonAttempt:attempt,stable,same:comparison.same,
              rawEvents:after.rawEvents,materializedEvents:after.materializedEvents,
              globalPv:after.globalPv,globalUv:after.globalUv,
            }));
            if(stable&&comparison.same===true&&comparison.readPathActive===true&&after.readPathActive===true) passes.push({
              rawEvents:after.rawEvents,materializedEvents:after.materializedEvents,
              globalPv:after.globalPv,globalUv:after.globalUv,
            });
            if(passes.length<2) await new Promise(resolve=>setTimeout(resolve,750));
          }
          if(passes.length<2) throw new Error('site analytics materialized read path could not obtain two stable full parity passes');

          status=await call('/api/admin/site-analytics-materialized/status');
          if(status.readPathActive!==true) throw new Error('site analytics materialized read path is not active: '+JSON.stringify(status));
          const live=await call('/api/user-ui/site-stats');
          if(live.readPath!=='materialized'||live.generation!=='site-pageview-v2'){
            throw new Error('live site-stats is not using materialized read path: '+JSON.stringify(live));
          }
          const report={
            schemaVersion:1,phase:'D4b-site-analytics-materialized-read-live',ok:true,readPathActive:true,
            rawEvents:Number(status.rawEvents||0),materializedEvents:Number(status.materializedEvents||0),
            globalPv:Number(status.globalPv||0),globalUv:Number(status.globalUv||0),
            backfillComplete:status.backfill?.complete===true,backfillPagesThisRun:pages,
            stableParityPasses:passes.length,liveReadPath:live.readPath,
            liveGeneration:live.generation,verifiedAt:new Date().toISOString(),
          };
          fs.writeFileSync(reportPath,JSON.stringify(report,null,2)+'\n');
          console.log('SITE_ANALYTICS_MATERIALIZED_SHADOW '+JSON.stringify(report));
          NODE

