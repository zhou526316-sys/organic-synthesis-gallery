      - name: Promote verified official TOCs into production
        id: promote_official_tocs
        continue-on-error: true
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: |
          node - <<'NODE'
          const base = process.env.WORKER_URL;
          const token = process.env.BRIDGE_WRITE_TOKEN;
          if (!token) throw new Error('BRIDGE_WRITE_TOKEN is required for TOC promotion');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let offset = 0;
          let totalPromoted = 0;
          let totalFailed = 0;
          let totalAlreadyCurrent = 0;
          let incomplete = false;

          for (let batch = 0; batch < 40; batch += 1) {
            const url = new URL('/api/admin/media/promote-local-tocs', base);
            url.searchParams.set('limit', '16');
            url.searchParams.set('scan', '24');
            url.searchParams.set('offset', String(offset));

            let response = null;
            let body = {};
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                response = await fetch(url, {
                  method: 'POST',
                  headers: { authorization: `Bearer ${token}`, 'cache-control': 'no-cache' },
                  signal: AbortSignal.timeout(25000),
                });
                body = await response.json().catch(() => ({}));
                if (response.ok && body?.ok === true) break;
                if (response.status === 401 || response.status === 403) {
                  throw new Error('TOC promotion authorization failed: ' + JSON.stringify({ status: response.status, body }));
                }
              } catch (error) {
                if (attempt >= 3) {
                  console.warn('TOC promotion page unavailable after retries:', String(error?.message || error));
                  response = null;
                  break;
                }
              }
              await sleep(1500 * attempt);
            }

            if (!response || !response.ok || body?.ok !== true) {
              incomplete = true;
              console.warn(JSON.stringify({ officialTocPromotionPaused: true, offset, batch: batch + 1 }));
              break;
            }

            totalPromoted += Number(body.promoted || 0);
            totalFailed += Number(body.failed || 0);
            totalAlreadyCurrent += Number(body.alreadyCurrent || 0);
            console.log(JSON.stringify({
              batch: batch + 1,
              ...body,
              totalPromoted,
              totalFailed,
              totalAlreadyCurrent,
            }));

            const nextOffset = Math.max(offset, Number(body.nextOffset || 0));
            if (body.hasMore !== true || nextOffset <= offset) break;
            offset = nextOffset;
          }

          console.log(JSON.stringify({
            officialTocPromotionComplete: !incomplete,
            offset,
            totalPromoted,
            totalFailed,
            totalAlreadyCurrent,
          }));
          NODE

