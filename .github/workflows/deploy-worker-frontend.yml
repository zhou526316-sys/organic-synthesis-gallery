          let status=await call('/api/admin/user-library-shadow/status');
          if(status.enabled!==true||status.readConfigured!==true){
            throw new Error('user library row read configuration invalid: '+JSON.stringify(status));
          }

          let pages=0;
          while(status.backfill?.complete!==true){
            pages+=1;
            if(pages>200) throw new Error('user library row shadow backfill exceeded 200 persisted pages');
            const page=await call('/api/admin/user-library-shadow/backfill?limit=20',{method:'POST'});
