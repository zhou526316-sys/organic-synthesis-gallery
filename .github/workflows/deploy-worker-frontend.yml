            sampleCount:Number(sample.count||0),
            reconciled:false,
          };

          if(status.backfill?.complete===true){
            if(report.indexCount!==report.legacyCount){
              throw new Error('Evidence Index count mismatch: '+JSON.stringify(report));
            }
            if(report.legacyCount<=1000){
              const indexed=new Map((sample.items||[]).map(row=>[String(row.doi||'').toLowerCase(),row]));
              for(const row of legacy.items||[]){
                const doi=String(row.doi||'').toLowerCase(),hit=indexed.get(doi);
                if(!hit) throw new Error('Evidence Index DOI missing after complete backfill: '+doi);
                if(String(hit.evidence_packet_hash||'')!==String(row.evidencePacketHash||'')){
                  throw new Error('Evidence packet hash mismatch: '+doi);
                }
                if(String(hit.source_hash||'')!==String(row.sourceHash||'')){
                  throw new Error('Evidence source hash mismatch: '+doi);
                }
              }
              report.reconciled=true;
            }
          }
          console.log('EVIDENCE_INDEX_SHADOW '+JSON.stringify(report));
