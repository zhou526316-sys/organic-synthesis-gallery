      - name: Backfill and verify scheduled handoff D1 read path
        id: scheduled_handoff_shadow
        continue-on-error: true
        env:
          WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const base=process.env.WORKER_URL;
          const token=process.env.BRIDGE_WRITE_TOKEN;
          fs.writeFileSync('/tmp/scheduled-handoff-shadow-report.json',JSON.stringify({
            schemaVersion:1,phase:'D2c2-scheduled-handoff-index-read-live',
            ok:false,status:'started',readPathActive:true,startedAt:new Date().toISOString(),
          },null,2)+'\n');
          if(!token) throw new Error('BRIDGE_WRITE_TOKEN is required for scheduled handoff shadow');

          async function call(path,{method='GET'}={}){
            const response=await fetch(base+path,{
              method,
              headers:{authorization:`Bearer ${token}`,'cache-control':'no-cache'},
              signal:AbortSignal.timeout(30000),
            });
            const text=await response.text();
            let body={};try{body=text?JSON.parse(text):{};}catch{}
            if(!response.ok) throw new Error(path+' failed: '+response.status+' '+text.slice(0,700));
            return body;
          }

          let status=await call('/api/admin/article-summary/evidence-index/status');
          if(status.enabled!==true||status.readPathActive!==false||status.backfill?.complete!==true){
            throw new Error('Evidence Index is not ready for handoff backfill: '+JSON.stringify(status));
          }

          let pages=0;
          while(status.handoffBackfill?.complete!==true){
            pages+=1;
            if(pages>100) throw new Error('scheduled handoff readiness backfill exceeded 100 persisted pages');
            const page=await call('/api/admin/article-summary/evidence-index/handoff-backfill?limit=500',{method:'POST'});
            if(page.ok!==true||page.enabled!==true){
              throw new Error('scheduled handoff readiness backfill page invalid: '+JSON.stringify(page));
            }
            console.log(JSON.stringify({scheduledHandoffBackfillPage:pages,...page}));
            status=await call('/api/admin/article-summary/evidence-index/status');
            if(status.enabled!==true||status.readPathActive!==false){
              throw new Error('Evidence Index read path changed unexpectedly during handoff backfill');
            }
          }
          if(status.handoffReadPathReady!==true){
            throw new Error('scheduled handoff D1 discovery is not ready: '+JSON.stringify(status));
          }
          if(status.handoffReadPathActive!==true){
            throw new Error('scheduled handoff D1 read path is not active: '+JSON.stringify(status));
          }

          const comparisons=[];
          for(let attempt=1;attempt<=10&&comparisons.length<3;attempt+=1){
            const comparison=await call('/api/admin/article-summary/evidence-index/handoff-compare?limit=40',{method:'POST'});
            console.log(JSON.stringify({scheduledHandoffComparisonAttempt:attempt,...comparison}));
            if(comparison.comparable===true){
              if(comparison.readPathActive!==true){
                throw new Error('scheduled handoff comparator does not see active D1 read path: '+JSON.stringify(comparison));
              }
              if(comparison.same!==true||comparison.pending?.same!==true||comparison.backfill?.same!==true){
                throw new Error('scheduled handoff D1/R2 divergence: '+JSON.stringify(comparison));
              }
              for(const kind of ['pending','backfill']){
                const legacyHash=comparison[kind]?.legacy?.candidateSetHash||'';
                const indexedHash=comparison[kind]?.indexed?.candidateSetHash||'';
                if(!legacyHash||legacyHash!==indexedHash){
                  throw new Error('scheduled handoff '+kind+' candidateSetHash mismatch: '+JSON.stringify(comparison));
                }
              }
              comparisons.push(comparison);
            }
            if(comparisons.length<3) await new Promise(resolve=>setTimeout(resolve,750));
          }
          if(comparisons.length<3){
            throw new Error('scheduled handoff parity could not obtain three stable snapshots');
          }

          const liveManifest=await call('/api/article-summary/scheduled-handoff?manifest=1&limit=40');
          if(liveManifest.discoveryMode!=='d1_index'){
            throw new Error('scheduled handoff manifest is not using D1 discovery: '+JSON.stringify(liveManifest));
          }

          const report={
            schemaVersion:1,
            phase:'D2c2-scheduled-handoff-index-read-live',
            ok:true,
            readPathActive:true,
            evidenceBackfillComplete:status.backfill?.complete===true,
            handoffBackfillComplete:status.handoffBackfill?.complete===true,
            handoffReadPathReady:status.handoffReadPathReady===true,
            backfillPagesThisRun:pages,
            evidenceCount:Number(status.evidenceCount||0),
            handoffReadyCount:Number(status.handoffReadyCount||0),
            handoffObjectsScanned:Number(status.handoffBackfill?.scannedObjects||0),
            matchedRows:Number(status.handoffBackfill?.matchedRows||0),
            staleOrMissingRows:Number(status.handoffBackfill?.staleOrMissingRows||0),
            skippedInvalid:Number(status.handoffBackfill?.skippedInvalid||0),
            stableComparisons:comparisons.length,
            allSame:comparisons.every(row=>row.same===true&&row.pending?.same===true&&row.backfill?.same===true),
            pendingCandidateSetHash:comparisons[0].pending?.legacy?.candidateSetHash||'',
            backfillCandidateSetHash:comparisons[0].backfill?.legacy?.candidateSetHash||'',
            pendingCount:Number(comparisons[0].pending?.legacy?.count||0),
            creationBacklogCount:Number(comparisons[0].backfill?.legacy?.count||0),
            manifestDiscoveryMode:liveManifest.discoveryMode,
            verifiedAt:new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/scheduled-handoff-shadow-report.json',JSON.stringify(report,null,2)+'\n');
          console.log('SCHEDULED_HANDOFF_SHADOW '+JSON.stringify(report));
          NODE

