name: Integrate atomic reader ledger once
on:
  push:
    branches: [fix/reader-count-atomic-20260923]
    paths: [.github/workflows/reader-atomic-integrate-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Replace only reader persistence and test actual SQL before committing
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('cloudflare/worker/src/user-ui.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='c358d8efe71690b2dfbea387d194ef6e7d9c75a3', 'Re-review concurrent backend changes'
          text=p.read_text()
          text="import { recordReaderOpen } from './reader-count-ledger.js';\n"+text
          a=text.index('export async function markReader(')
          b=text.index('export async function submitPaperFeedback(',a)
          block=text[a:b]
          start=block.index('  const inserted = await env.DB.prepare(')
          end=block.index('\n  return {',start)
          block=block[:start]+'  const { unique, count } = await recordReaderOpen(env.DB, doi, ipHash, now);\n'+block[end:]
          old='count: Math.max(0, Number(row?.count || 0))'
          assert block.count(old)==1
          block=block.replace(old,'count')
          p.write_text(text[:a]+block+text[b:])
          PY
          git diff --check
          mkdir -p reader-atomic-results
          node --test cloudflare/worker/scripts/test-reader-counts.mjs > reader-atomic-results/test.tap
          cat reader-atomic-results/test.tap
          git diff -- cloudflare/worker/src/user-ui.js > reader-atomic-results/integration.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/worker/src/user-ui.js
          git rm .github/workflows/reader-atomic-integrate-once.yml
          git commit -m 'fix(readers): prevent permanent undercounts after partial database failures'
          git rev-parse HEAD > reader-atomic-results/tested-commit.txt
          git push origin HEAD:fix/reader-count-atomic-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-atomic-integration
          path: reader-atomic-results/
          retention-days: 7
          if-no-files-found: warn
