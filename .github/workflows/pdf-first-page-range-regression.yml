name: PDF first-page early Range regression
on:
  push:
    branches: [fix/pdf-first-page-range-default-20261009]
    paths:
      - 'src/private-pdf-reader.mjs'
      - 'tests/private-pdf-access-browser.mjs'
      - '.github/workflows/pdf-first-page-range-regression.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  owner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Build normal production frontend without deploy
        run: |
          npm install --no-audit --no-fund
          node --check src/private-pdf-reader.mjs
          npm run build
      - name: Chromium end-to-end owner PDF and slow middle-range fixture
        env:
          PRIVATE_PDF_BROWSER_SCOPE: owner
          PRIVATE_PDF_BROWSER_OUTPUT: ${{ runner.temp }}/pdf-first-page-qa
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
          node tests/private-pdf-access-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-first-page-browser-evidence
          path: ${{ runner.temp }}/pdf-first-page-qa
          if-no-files-found: ignore
          retention-days: 5
