name: Read uploaded Tampermonkey acceptance evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tm-local-acceptance-read.yml'
      - 'audit/automation-triggers/tm-acceptance-read.json'

permissions:
  contents: read

concurrency:
  group: tm-local-acceptance-read
  cancel-in-progress: false

jobs:
  read-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read existing R2 diagnostic objects only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.136.2 r2 object get organic-synthesis-gallery-media/local-captures/diagnostics/latest.json --remote --file "$RUNNER_TEMP/tm-local.json" >/dev/null
          npx --yes wrangler@4.136.2 r2 object get organic-synthesis-gallery-media/local-captures/tampermonkey/report-index.json --remote --file "$RUNNER_TEMP/tm-reports.json" >/dev/null || echo 'TM_ACCEPTANCE_REPORT_INDEX_UNAVAILABLE'
          npx --yes wrangler@4.136.2 r2 object get organic-synthesis-gallery-media/local-captures/article-figures/stage-index.json --remote --file "$RUNNER_TEMP/tm-staged.json" >/dev/null || echo 'TM_ACCEPTANCE_STAGE_INDEX_UNAVAILABLE'
          npx --yes wrangler@4.136.2 r2 object get organic-synthesis-gallery-media/local-captures/index.json --remote --file "$RUNNER_TEMP/tm-captures.json" >/dev/null || echo 'TM_ACCEPTANCE_CAPTURE_INDEX_UNAVAILABLE'

      - name: Print compact sanitized evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, urllib.parse
          cutoff = 1790082000000
          def url(value):
              try:
                  u = urllib.parse.urlsplit(str(value or ''))
                  return urllib.parse.urlunsplit((u.scheme, u.hostname or '', u.path, '', ''))[:1200] if u.scheme in ('https','http') else ''
              except Exception:
                  return ''
          def clean(value):
              s = re.sub(r'https?://[^\s<>\"\']+', lambda m: url(m.group()), str(value or ''))
              s = re.sub(r'(?i)Bearer\s+\S+|(?:token|secret|password|cookie|authorization)\s*[:=]\s*\S+', '[redacted]', s)
              return s[:600]
          def pick(row, keys):
              out = {}
              if not isinstance(row, dict): return out
              for k in keys:
                  if k not in row or isinstance(row[k], (dict,list)): continue
                  v = row[k]
                  out[k] = url(v) if k.lower().endswith('url') or k == 'href' else clean(v) if isinstance(v,str) else v
              return out
          def emit(kind, value):
              print('TM_ACCEPTANCE_' + kind + ' ' + json.dumps(value, ensure_ascii=False, separators=(',',':')), flush=True)
          def load(name):
              p = pathlib.Path(os.environ['RUNNER_TEMP']) / ('tm-' + name + '.json')
              if not p.exists(): return None
              return json.loads(p.read_text(encoding='utf-8-sig'))
          def rows(body):
              x = (body or {}).get('items') or []
              return list(x.values()) if isinstance(x,dict) else x if isinstance(x,list) else []
          emit('READ_AT', {'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'readOnly':True})
          local = load('local')
          if not isinstance(local,dict): raise SystemExit('Uploaded diagnostic unavailable')
          emit('UPLOAD', pick(local,['uploadedAt','version','source','kind','uploadedReason','total']))
          summary = local.get('summary') or {}
          emit('SUMMARY', pick(summary,['version','controllerRevision','architectureMembershipRevision','queueGeneratedAt','startedAt','finishedAt','queueTotal','batchSize','total','visible','upgrades','figureGaps','success','failed','skipped','aborted','cooldownSkipped']))
          emit('ARCHITECTURE_SUMMARY', pick(summary.get('architectureMembership'),['ok','revision','serial','publicationSlot','catalogId','membershipSha256','asOfDate','cutoff','memberCount','hotCount','archiveCount','verifiedAt','error']))
          # Read-only run-scoped diagnostic aggregation; no PDF bytes, credentials,
          # HTML body, signed URL or private inventory rows are printed.
          def safe_num(obj,key): return int((obj or {}).get(key) or 0)
          run_start = str(summary.get('startedAt') or '')
          run_start_ms = int(datetime.datetime.fromisoformat(run_start.replace('Z','+00:00')).timestamp()*1000) if run_start else 0
          scope_fields=['queueCoverageRevision','scopeRevision','phase','startedAt','finishedAt','controllerRevision','queueGeneratedAt','scopeCount',
            'scopeHistoricalCount','scopeRecentCount','scopeExcludedCount','candidateCount','total','visitedCount','attemptCount',
            'fullyResolved','inventoryAlreadySatisfiedCount','unresolvedCount','blockedCount','pendingMissing','deferredCount',
            'tocStored','figuresStaged','evidenceStored','success','partial','failed','aborted','stopReason','ownerPdfInventoryState','inventoryUnknown']
          scope=pick(summary,scope_fields)
          for label in ['remainingNeeds','ownerPdfInventory']:
              scope[label]={k:safe_num(summary.get(label),k) for k in ['toc','figures','evidence','pdf'] if label=='remainingNeeds' or k in ['ready','pending','failed','missing','unknown']}
              if label=='ownerPdfInventory':
                  scope[label]={k:safe_num(summary.get(label),k) for k in ['ready','pending','failed','missing','unknown']}
          scope['inventoryErrors']=[clean(v) for v in (summary.get('inventoryErrors') or [])[:6]]
          emit('RUN_COVERAGE',scope)
          results=summary.get('results') or []
          grouped={}
          for result in results:
              status=str(result.get('status') or 'unknown')
              grouped[status]=grouped.get(status,0)+1
          emit('RUN_RESULT_COUNTS',{'resultRows':len(results),'counts':grouped,'readOnly':True})
          for r in sorted(results,key=lambda x:str(x.get('finishedAt') or ''))[-100:]:
              toc=r.get('toc') or {};pdf=r.get('privatePdf') or {};fig=r.get('figures') or {};fulltext=r.get('fulltext') or {}
              emit('RUN_DOI',{'doi':clean(r.get('doi')),'status':clean(r.get('status')),'reason':clean(r.get('reason')),
                'finishedAt':clean(r.get('finishedAt')),'requestedNeeds':clean(r.get('requestedNeeds')),
                'tocStatus':clean(toc.get('status')),'tocKind':clean(toc.get('kind')),
                'officialProductionStored':toc.get('productionTocStored') is True,'fallbackProductionStored':toc.get('productionFallbackStored') is True,
                'figuresDiscovered':safe_num(fig,'discovered'),'figuresStored':safe_num(fig,'stored'),'figuresFailed':safe_num(fig,'failed'),
                'fulltextStatus':clean(fulltext.get('status')),'pdfStatus':clean(pdf.get('status')),'pdfError':clean(pdf.get('reason') or pdf.get('error'))})
          for row in (summary.get('blockedPreview') or [])[:12]:
              emit('BLOCKED_DOI',pick(row,['doi','need','reason','category']))
          traceStats={}
          for tr in (local.get('traces') or []):
              for ev in (tr.get('trace') or []):
                  st=str(ev.get('stage') or 'unknown')
                  traceStats[st]=traceStats.get(st,0)+1
          emit('TRACE_STAGE_COUNTS',{'eventsByStage':traceStats,'retained':len(local.get('traces') or [])})
          usefulStages={'dom_snapshot','toc_filter_summary','figure_filter_summary','candidate_discovery',
            'toc_fallback','rsc_toc_candidate','rsc_search_toc','rsc_issue_toc','rsc_ajax','rsc_article_ajax',
            'page_doi_guard','page_identity','publisher_access','figure_quality','figure_upload','r2_upload',
            'capture_timing','paired_result','private_pdf_upload','pdf_fetch','evidence_result'}
          for tr in sorted(local.get('traces') or [],key=lambda z:str(z.get('finishedAt') or ''),reverse=True)[:24]:
              events=[e for e in (tr.get('trace') or []) if e.get('stage') in usefulStages or e.get('event') in ['failed','scan_complete','none']]
              for ev in events[-8:]:
                  emit('TRACE_DIAGNOSTIC',{'doi':clean(tr.get('doi')),
                    **pick(ev,['at','stage','event','status','httpStatus','message','imageWidth','imageHeight','byteLength'])})
          # Correlate writes since the run started without treating updated rows
          # as definitive promotion or PDF readability evidence.
          for kind,name in [('toc_index','captures'),('figure_stage','staged')]:
              body=load(name)
              relevant=[r for r in rows(body) if isinstance(r,dict) and float(r.get('updatedAt') or 0)>=run_start_ms] if body and run_start_ms else []
              dois=sorted({str(r.get('doi') or '').lower() for r in relevant if r.get('doi')})
              emit('RUN_ASSET_ACTIVITY',{'kind':kind,'indexRowsUpdatedSinceStart':len(relevant),
                'distinctDois':len(dois),'sampleDois':dois[:25],
                'notProofOfPublication':True})
          result_keys = ['doi','version','status','reason','finishedAt','kind','assetType','figuresImported','figuresStaged','diagnosticUploaded','articleUrl','sourceUrl','imageUrl']
          for r in (summary.get('results') or [])[:12]: emit('BATCH_RESULT',pick(r,result_keys))
          for name in ['activeJob','progress','publisherHeartbeat']:
              emit(name.upper(),pick(local.get(name),['doi','publisher','version','startedAt','queueGeneratedAt','status','state','at','atIso','host','url','href']))
          traces = local.get('traces') or []
          traces = sorted(traces if isinstance(traces,list) else [],key=lambda x:str(x.get('finishedAt','')),reverse=True)
          emit('TRACE_COUNT',{'retained':len(traces)})
          event_keys = ['seq','at','stage','event','status','httpStatus','url','message','candidateKind','candidateSource','imageWidth','imageHeight','byteLength']
          for r in traces[:8]:
              emit('TRACE_HEADER',pick(r,['doi','status','reason','finishedAt']))
              events = r.get('trace') or []
              selected = [e for e in events if e.get('stage') in ['diagnostic_context','architecture_membership','job','figure_quality','figure_upload','figure_stage','r2_upload','page_doi_guard','page_identity','report_upload']]
              for e in (selected[:12] if selected else events[-3:]): emit('TRACE_EVENT',{'doi':r.get('doi'),**pick(e,event_keys)})
          reports = load('reports')
          if reports is not None:
              emit('REPORT_INDEX',pick(reports,['version','updatedAt']))
              latest = sorted(rows(reports),key=lambda x:float(x.get('updatedAt') or 0),reverse=True)
              for r in latest[:12]: emit('REPORT',pick(r,result_keys+['updatedAt','uploadedAt','startedAt','queueGeneratedAt','attemptCount','successCount','failureCount']))
          for name in ['captures','staged']:
              body = load(name)
              if body is None: continue
              all_rows = rows(body)
              current = [r for r in all_rows if float(r.get('updatedAt') or 0)>=cutoff]
              emit(name.upper()+'_SUMMARY',{'rawRows':len(all_rows),'postCutoverRows':len(current),'updatedAt':body.get('updatedAt')})
              for r in sorted(current,key=lambda x:float(x.get('updatedAt') or 0),reverse=True)[:16]:
                  emit(name.upper()+'_ASSET',pick(r,['doi','id','label','caption','kind','source','articleUrl','sourceUrl','width','height','byteLength','capturedAt','updatedAt','contentHash']))
          PY

      - name: Remove temporary raw diagnostics
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tm-local.json" "$RUNNER_TEMP/tm-reports.json" "$RUNNER_TEMP/tm-staged.json" "$RUNNER_TEMP/tm-captures.json"
