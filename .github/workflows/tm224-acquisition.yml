name: Bridge 2.2.24 acquisition and ordering regression
on:
  push:
    branches: [fix/tm224-acquisition-ordering-v2]
    paths:
      - '.github/workflows/tm224-acquisition.yml'
      - 'scripts/apply-tm224-acquisition.py'
      - 'scripts/test-tm224-acquisition.mjs'
permissions:
  contents: write
concurrency:
  group: tm224-acquisition
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tm224-acquisition-ordering-v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply only client acquisition and ordering changes
        run: |
          set -euo pipefail
          python3 scripts/apply-tm224-acquisition.py
          node --check public/toc-mainline.user.js
          git diff --check
      - name: Run existing identity, window, upload and report regressions
        run: |
          set -euo pipefail
          node scripts/test-tm223-upload.mjs
          node scripts/test-tm221-window-guard.mjs
          node scripts/test-media-identity-v220.mjs
          node scripts/test-tm-stage-first.mjs
          node scripts/test-tm220-release.mjs
          node scripts/test-tm222-auto-report.mjs
      - name: Run real-browser ACS TIFF and same-figure fallback regression
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-tm224-acquisition.mjs | tee "$RUNNER_TEMP/tm224-acquisition.log"
          grep -F 'TM224_ACQUISITION_TEST_SUMMARY ' "$RUNNER_TEMP/tm224-acquisition.log"
          node scripts/test-tm-paired-capture.mjs
          node scripts/test-tm222-live-progress.mjs
      - name: Build actual self-contained installer and validate exact versions
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.24' public/gallery-vpn-bridge.user.js
          grep -F "var VERSION = '6.2.20';" public/gallery-vpn-bridge.user.js
          grep -F "var CONTROLLER_REVISION = '2.2.24';" public/gallery-vpn-bridge.user.js
          grep -F 'sameFigureCurrentSrcFallback' public/gallery-vpn-bridge.user.js
      - name: Commit exact tested source changes to feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/tm224-acquisition-ordering-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/toc-mainline.user.js cloudflare/scripts/build-bridge-loader.mjs scripts/validate-tm220-artifacts.mjs scripts/test-tm221-window-guard.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: apply tested Bridge 2.2.24 ACS fallback and newest-first ordering'
            git push origin HEAD:fix/tm224-acquisition-ordering-v2
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/tm224-tested-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm224-acquisition-tested
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
            ${{ runner.temp }}/tm224-acquisition.log
            ${{ runner.temp }}/tm224-tested-head.txt
          retention-days: 7
          if-no-files-found: warn
