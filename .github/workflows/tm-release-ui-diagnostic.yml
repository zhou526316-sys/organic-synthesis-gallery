name: Diagnose capture release UI media request
on:
  push:
    branches: [integration/tm220-final-unified]
    paths: ['.github/workflows/tm-release-ui-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install and build exact release source
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.55.1
          npx playwright install --with-deps webkit
          npm run build -- --sourcemap
      - name: Add error stack diagnostics to runner copy only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/mobile-interaction.spec.ts');s=p.read_text()
          a="page.on('pageerror', error => errors.push(error.message));"
          b="page.on('pageerror', error => { errors.push(error.message); console.log('EXACT_PAGE_ERROR', JSON.stringify({message:error.message,stack:error.stack})); });"
          assert a in s
          p.write_text(s.replace(a,b))
          PY
      - name: Run unchanged failing UI scenario
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          npx playwright test tests/mobile-interaction.spec.ts --grep 'feedback 26/27' --workers=1 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-release-ui-diagnostic
          path: |
            test-results/
            dist/assets/*.map
            src/
            tests/mobile-interaction.spec.ts
          retention-days: 3
