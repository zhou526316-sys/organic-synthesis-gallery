name: Publish reviewed scoped summary candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summary-publish-reviewed-candidate.yml'
      - 'audit/summary-publication-request.json'
permissions:
  contents: write
concurrency:
  group: scoped-summary-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate complete candidate and current hashes before one non-force write
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,collections,datetime,hashlib,json,lzma,os,pathlib,re,subprocess,time,urllib.request,urllib.error
          report={'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'published':False,'stage':'starting'}
          result_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary-publication-result.json'
          def save(): result_path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          def require(condition,message):
              if not condition: raise RuntimeError(message)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def read(path): return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          def get(url,auth=False):
              headers={'accept':'application/json','cache-control':'no-cache','user-agent':'Gallery-scoped-summary-publication'}
              if auth: headers['authorization']='Bearer '+os.environ['BRIDGE_WRITE_TOKEN']
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method='GET'),timeout=25) as r: return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (400,401,403,404) or attempt==2: raise RuntimeError('read_http_'+str(e.code)) from None
                  except Exception as e:
                      if attempt==2: raise RuntimeError('read_'+type(e).__name__) from None
                  time.sleep(1+attempt)
          try:
              parent=git('rev-parse','HEAD'); report['parentCommit']=parent
              require(not git('status','--porcelain'),'checkout_not_clean')
              request=read('audit/summary-publication-request.json')
              policy=read('audit/summary-publication-policy.json')
              require(request.get('reviewCompleted') is True,'review_not_completed')
              rid=request['requestId']; require(bool(re.fullmatch(r'[a-z0-9-]{1,100}',rid)),'invalid_request_id')
              directory=request['candidateDirectory']
              require(bool(re.fullmatch(r'audit/summary-release-candidates/[a-zA-Z0-9_-]+',directory)),'invalid_candidate_directory')
              manifest=read(directory+'/manifest.json')
              require(manifest.get('schemaVersion')=='gallery-summary-candidate-transport-v1','invalid_transport_schema')
              require(manifest.get('candidateId')==request.get('candidateId'),'wrong_candidate')
              require(manifest.get('decodedPayloadSha256')==request.get('expectedPayloadSha256'),'unexpected_payload')
              require(manifest.get('compression')=='xz' and manifest.get('encoding')=='base64','invalid_transport_encoding')
              parts=manifest['parts'];require(1<=len(parts)<=100,'invalid_part_count')
              chunks=[]; report['stage']='transport_validation';report['partChecks']=[]
              for i,part in enumerate(parts,1):
                  require(part['file']=='part-'+str(i).zfill(2)+'.b64','nonsequential_transport_part')
                  text=pathlib.Path(directory,part['file']).read_text(encoding='ascii').strip()
                  digest=hashlib.sha256(text.encode('ascii')).hexdigest()
                  ok=len(text)==part['characters'] and digest==part['sha256']
                  report['partChecks'].append({'part':part['file'],'characters':len(text),'sha256':digest,'ok':ok})
                  require(ok,'candidate_part_integrity_failed:'+part['file'])
                  chunks.append(text)
              compressed=base64.b64decode(''.join(chunks),validate=True)
              require(hashlib.sha256(compressed).hexdigest()==manifest['compressedSha256'],'compressed_digest_mismatch')
              decoded=lzma.decompress(compressed,memlimit=128*1024*1024)
              require(len(decoded)<=8*1024*1024,'candidate_too_large')
              require(hashlib.sha256(decoded).hexdigest()==request['expectedPayloadSha256'],'payload_digest_mismatch')
              delta=json.loads(decoded)
              require(delta.get('schemaVersion')=='gallery-reviewed-summary-delta-v1','invalid_delta_schema')
              cutoff=policy['minimumArticleDate']
              require(cutoff==request['cutoffDate']==manifest['cutoffDate']==delta['cutoffDate'],'scope_policy_changed')
              require(delta.get('dateField')=='date' and policy.get('articleDateField')=='date','invalid_cutoff_field')
              items=delta['items']; expected=delta['expectedDois']
              require(len(items)==manifest['expectedCount']==request['expectedReviewedCount'],'candidate_count_mismatch')
              require(len(set(expected))==len(expected) and set(items)==set(expected),'candidate_doi_set_mismatch')
              for doi,item in items.items():
                  require(bool(re.fullmatch(r'10\.\d{4,9}/\S+',doi)) and doi==doi.lower(),'invalid_doi')
                  require(item.get('doi')==doi and item.get('schemaVersion')=='scheduled-reviewed-summary-v1' and item.get('status')=='approved','invalid_summary_identity:'+doi)
                  require(item.get('evidenceLevel') in ('complete','partial','abstract_only'),'invalid_evidence_level:'+doi)
                  for field in ('sourceHash','evidencePacketHash'):require(bool(re.fullmatch(r'[a-f0-9]{64}',str(item.get(field,'')))),'invalid_hash:'+doi)
                  for field in ('zh','en'):
                      value=item.get(field,'');require(isinstance(value,str) and len(value.strip())>=40,'empty_summary:'+doi)
                      require(not re.search(r'gpt|openai|BEGIN PRIVATE KEY|ciphertextPart|encryptedKey',value,re.I),'public_copy_violation:'+doi)
                  if item['evidenceLevel']=='abstract_only':require('基于 Abstract' in item['zh'] and 'Abstract-based' in item['en'],'missing_abstract_disclosure:'+doi)
                  if item['evidenceLevel']=='partial':require('部分正文' in item['zh'] and 'partial text' in item['en'],'missing_partial_disclosure:'+doi)
                  require(isinstance(item.get('generatedAt'),int) and isinstance(item.get('reviewedAt'),int),'invalid_review_time:'+doi)
                  note=delta.get('reviewNotes',{}).get(doi,{})
                  require(bool(note.get('evidenceAudit')) and bool(note.get('sectionsConsulted')),'missing_article_review_note:'+doi)
              report['stage']='fresh_evidence_validation'
              api='https://api.gczhouwld.com'
              health=get(api+'/api/_healthcheck')
              require(health.get('summaryMode')=='scheduled_chatgpt_daily_no_api' and health.get('summaryReviewReady') is True and health.get('summaryReviewEnabled') is False,'summary_runtime_not_ready')
              inventory=get(api+'/api/article-summary/evidence-inventory',True)
              registry=get('https://gallery.gczhouwld.com/toc-demand-live.json?summary-check='+str(int(time.time())))
              require(isinstance(inventory.get('items'),list) and inventory.get('count')==len(inventory['items']),'incomplete_evidence_inventory')
              evidence={v['doi'].lower():v for v in inventory['items']}
              active={v['doi'].lower():v for v in registry['articles'] if v.get('doi')}
              require(len(active)==registry['webpageDoiCount'],'incomplete_active_registry')
              changed=[]
              for doi,item in items.items():
                  article=active.get(doi,{});ev=evidence.get(doi,{})
                  reasons=[]
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(article.get('date',''))) or article['date']<cutoff:reasons.append('not_active_in_scope')
                  if ev.get('textProcessingPolicy')=='no_external_ai':reasons.append('processing_policy')
                  if not ev.get('available'):reasons.append('evidence_unavailable')
                  if any(ev.get(k)!=item.get(k) for k in ('sourceHash','evidencePacketHash','evidenceLevel')):reasons.append('evidence_changed')
                  if reasons:changed.append({'doi':doi,'reasons':reasons})
              report['changedEvidence']=changed
              require(not changed,'fresh_evidence_validation_failed')
              target=pathlib.Path('public/scheduled-article-summaries.json'); baseline=read(target)
              require(baseline.get('schemaVersion')=='scheduled-reviewed-summary-v1' and isinstance(baseline.get('items'),dict),'invalid_current_summary_store')
              before=baseline['items'];before_count=len(before)
              new=[d for d in items if d not in before]
              updated=[d for d in items if d in before and before[d]!=items[d]]
              unchanged=[d for d in items if d in before and before[d]==items[d]]
              merged=dict(before);merged.update(items)
              require(all(merged[d]==v for d,v in before.items() if d not in items),'unrelated_summary_changed')
              older={d:v for d,v in before.items() if active.get(d,{}).get('date','')<cutoff}
              require(all(merged[d]==v for d,v in older.items()),'precutoff_summary_changed')
              require(not git('status','--porcelain'),'unexpected_worktree_change')
              remote=git('ls-remote','origin','refs/heads/main').split()[0]
              require(remote==parent,'concurrent_main_change_before_write')
              now=int(time.time()*1000)
              result=dict(baseline);result.update({'version':1,'schemaVersion':'scheduled-reviewed-summary-v1','publicationMode':'daily_1200_asia_shanghai','generatedAt':now,'items':merged})
              report.update({'candidateId':manifest['candidateId'],'candidateSha256':request['expectedPayloadSha256'],'cutoffDate':cutoff,'reviewedCount':len(items),'beforeCount':before_count,'newCount':len(new),'refreshedCount':len(updated),'unchangedCount':len(unchanged),'afterCount':len(merged),'preservedPrecutoffCount':len(older),'preservedUnrelatedCount':len(before)-len(set(before)&set(items)),'evidenceLevels':dict(collections.Counter(v['evidenceLevel'] for v in items.values())),'freshEvidenceValidatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceHandoff':delta['sourceHandoff'],'newDois':new,'refreshedDois':updated,'reviewNotes':delta['reviewNotes']})
              if not new and not updated:
                  report.update({'stage':'already_committed','idempotent':True,'summaryDataCommit':git('log','-1','--format=%H','--',str(target))})
              else:
                  audit=pathlib.Path('audit/summary-releases',rid+'.json');audit.parent.mkdir(parents=True,exist_ok=True)
                  audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  target.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  allowed={str(target),str(audit)}
                  changed_paths=set(git('diff','--name-only').splitlines())
                  untracked=set(git('ls-files','--others','--exclude-standard').splitlines())
                  require(changed_paths|untracked<=allowed,'unexpected_production_file_change')
                  git('diff','--check')
                  git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
                  git('add',str(target),str(audit))
                  git('commit','-m','Summary: publish reviewed September 20 onward catch-up (140 new, 16 refreshed)')
                  summary_commit=git('rev-parse','HEAD')
                  git('push','origin','HEAD:refs/heads/main')
                  report.update({'stage':'committed_waiting_deploy','summaryDataCommit':summary_commit,'committed':True})
              report['completedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat();save()
              print('SUMMARY_PUBLICATION_RESULT '+json.dumps({k:v for k,v in report.items() if k not in ('partChecks','reviewNotes','newDois','refreshedDois')},ensure_ascii=False))
          except Exception as e:
              report['error']=str(e)[:500];report['failedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat();save()
              print('SUMMARY_PUBLICATION_BLOCKED '+json.dumps({k:v for k,v in report.items() if k not in ('reviewNotes','newDois','refreshedDois')},ensure_ascii=False))
              raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-summary-publication-result
          path: ${{ runner.temp }}/summary-publication-result.json
          retention-days: 7
          if-no-files-found: error
