name: WeChat Draft Publisher

on:
  push:
    branches:
      - main
    paths:
      - 'audit/automation-triggers/wechat-publisher-request.json'
      - 'audit/automation-triggers/wechat-retrospective-request.json'

permissions:
  contents: write

concurrency:
  group: wechat-draft-publisher
  cancel-in-progress: false

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publisher Python syntax
        shell: bash
        run: python3 -m py_compile ops/wechat-publisher/create-draft.py

      - name: Run publisher on fixed-IP relay
        id: publish
        shell: bash
        env:
          RELAY_URL: ${{ secrets.WECHAT_TICKET_RELAY_URL }}
          RELAY_KEY: ${{ secrets.WECHAT_TICKET_RELAY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RELAY_URL:-}" || -z "${RELAY_KEY:-}" ]]; then
            echo "Missing WECHAT_TICKET_RELAY_URL or WECHAT_TICKET_RELAY_KEY" >&2
            exit 1
          fi
          BASE="${RELAY_URL%/wechat/jsapi-ticket}"
          RAW="$(curl -sS --max-time 360 -w '\n%{http_code}' \
            -X POST "${BASE}/wechat/publisher/run" \
            -H "Authorization: Bearer ${RELAY_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"action":"sync_daily_draft"}')"
          HTTP_CODE="$(printf '%s\n' "$RAW" | tail -n1)"
          RESPONSE="$(printf '%s\n' "$RAW" | sed '$d')"
          printf '%s\n' "$RESPONSE" > /tmp/wechat-publisher-response.json
          cat /tmp/wechat-publisher-response.json
          echo "HTTP_CODE=${HTTP_CODE}"
          if [[ ! "${HTTP_CODE}" =~ ^2 ]]; then
            exit 1
          fi
          jq -e '.ok == true and .result.draft_readback == "ok" and (.result.preview_url | length > 0)' /tmp/wechat-publisher-response.json >/dev/null
          if jq -e '.action == "verify_cloud_draft" and .readbackOnly == true' audit/automation-triggers/wechat-publisher-request.json >/dev/null; then
            jq -e '.result.stage == "cloud_readback_only" and .result.cloud_draft_modified == false and .result.readback_only == true' /tmp/wechat-publisher-response.json >/dev/null
          fi

      - name: Write latest publisher receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/wechat-publisher
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          raw=json.loads(Path("/tmp/wechat-publisher-response.json").read_text())
          result=raw.get("result") or {}
          receipt={
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "status": "ok",
              "stage": result.get("stage"),
              "mode": result.get("mode") or "daily",
              "slug": result.get("slug"),
              "title": result.get("title"),
              "publicationSlot": result.get("publicationSlot"),
              "media_id": result.get("media_id"),
              "paper_count": result.get("paper_count"),
              "draft_readback": result.get("draft_readback"),
              "preview_url": result.get("preview_url"),
              "publish_id": result.get("publish_id"),
              "publish_status": result.get("publish_status"),
              "article_id": result.get("article_id"),
              "article_url": result.get("article_url"),
              "content_source_url": result.get("content_source_url"),
              "cloud_matches_last_successful_preview": result.get("cloud_matches_last_successful_preview"),
              "cloud_image_tags_by_article": result.get("cloud_image_tags_by_article"),
              "cover_matches_server_upload_cache": result.get("cover_matches_server_upload_cache"),
              "cloud_draft_modified": result.get("cloud_draft_modified"),
              "mobile_local_copy_inspected": result.get("mobile_local_copy_inspected"),
              "readback_only": result.get("readback_only"),
          }
          target = (
              Path("audit/wechat-publisher/cloud-diagnostic-latest.json")
              if receipt["stage"] == "cloud_readback_only"
              else (
                  Path("audit/wechat-publisher/retrospective-latest.json")
                  if receipt["mode"] == "retrospective"
                  else Path("audit/wechat-publisher/latest.json")
              )
          )
          payload = json.dumps(receipt, ensure_ascii=False, indent=2) + "\n"
          target.write_text(payload, encoding="utf-8")
          Path("/tmp/wechat-publisher-receipt.json").write_text(payload, encoding="utf-8")
          Path("/tmp/wechat-publisher-receipt-target.txt").write_text(str(target), encoding="utf-8")
          PY

      - name: Commit publisher receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET="$(cat /tmp/wechat-publisher-receipt-target.txt)"

          apply_receipt() {
            mkdir -p "$(dirname "$TARGET")"
            cp /tmp/wechat-publisher-receipt.json "$TARGET"
            git add "$TARGET"
          }

          # The receipt is derived data. Re-apply it on top of the newest main
          # rather than rebasing two competing versions of the same JSON file.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            apply_receipt
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "audit: record WeChat draft preview"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "receipt push raced with another main update; retrying ($attempt/5)" >&2
            sleep 2
          done

          echo "failed to persist WeChat receipt after 5 ref-race retries" >&2
          exit 1
