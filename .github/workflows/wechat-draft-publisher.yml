name: WeChat Draft Publisher

on:
  push:
    branches:
      - main
    paths:
      - 'audit/literature-update-state.json'
      - 'public/wechat-featured/**'
      - 'assets/wechat-featured/**'
      - 'audit/automation-triggers/wechat-publisher-request.json'

permissions:
  contents: write

concurrency:
  group: wechat-draft-publisher
  cancel-in-progress: false

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run publisher on fixed-IP relay
        id: publish
        shell: bash
        env:
          RELAY_URL: ${{ secrets.WECHAT_TICKET_RELAY_URL }}
          RELAY_KEY: ${{ secrets.WECHAT_TICKET_RELAY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RELAY_URL:-}" || -z "${RELAY_KEY:-}" ]]; then
            echo "Missing WECHAT_TICKET_RELAY_URL or WECHAT_TICKET_RELAY_KEY" >&2
            exit 1
          fi
          BASE="${RELAY_URL%/wechat/jsapi-ticket}"
          RESPONSE="$(curl -fsS --max-time 360 \
            -X POST "${BASE}/wechat/publisher/run" \
            -H "Authorization: Bearer ${RELAY_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"action":"sync_daily_draft"}')"
          printf '%s\n' "$RESPONSE" > /tmp/wechat-publisher-response.json
          cat /tmp/wechat-publisher-response.json
          jq -e '.ok == true and .result.draft_readback == "ok" and (.result.preview_url | length > 0)'             /tmp/wechat-publisher-response.json >/dev/null

      - name: Write latest publisher receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/wechat-publisher
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          raw=json.loads(Path("/tmp/wechat-publisher-response.json").read_text())
          result=raw.get("result") or {}
          receipt={
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "status": "ok",
              "stage": result.get("stage"),
              "publicationSlot": result.get("publicationSlot"),
              "media_id": result.get("media_id"),
              "paper_count": result.get("paper_count"),
              "draft_readback": result.get("draft_readback"),
              "preview_url": result.get("preview_url"),
          }
          Path("audit/wechat-publisher/latest.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit publisher receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/wechat-publisher/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: record WeChat draft preview"
          git push origin HEAD:main
