name: Prioritize RSC v13 retry targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prioritize-rsc-v13-targets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prioritize-rsc-v13-targets
  cancel-in-progress: false

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Prioritize approved RSC v13 targets
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date +%s%3N)"
          npx wrangler d1 execute "$D1_NAME" --remote --command "
            INSERT INTO media_jobs
              (doi, publisher, mode, state, priority, attempts, last_attempt_at, next_retry_at, lease_owner, lease_expires_at, last_failure_reason, visual_kind, visual_source, confidence, created_at, updated_at)
            VALUES
              ('10.1039/d6sc06421c','rsc','coverage','pending',1,0,0,0,NULL,0,NULL,NULL,NULL,0,$NOW,$NOW),
              ('10.1039/d6gc03161g','rsc','coverage','pending',1,0,0,0,NULL,0,NULL,NULL,NULL,0,$NOW,$NOW)
            ON CONFLICT(doi) DO UPDATE SET
              state='pending',
              priority=1,
              next_retry_at=0,
              lease_owner=NULL,
              lease_expires_at=0,
              updated_at=excluded.updated_at;

            INSERT INTO media_repair_state
              (doi, repair_version, attempts, last_attempt_at, next_retry_at, last_root_cause, last_outcome, reported_priority, updated_at)
            VALUES
              ('10.1039/d6sc06421c',1,0,0,0,'rsc_v13_priority_retry','missing',1,$NOW),
              ('10.1039/d6gc03161g',1,0,0,0,'rsc_v13_priority_retry','missing',1,$NOW)
            ON CONFLICT(doi) DO UPDATE SET
              next_retry_at=0,
              last_root_cause='rsc_v13_priority_retry',
              last_outcome='missing',
              reported_priority=1,
              updated_at=excluded.updated_at;
          "
      - name: Verify only approved targets
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --command "
            SELECT doi, next_retry_at, last_root_cause, last_outcome, reported_priority
            FROM media_repair_state
            WHERE doi IN ('10.1039/d6sc06421c','10.1039/d6gc03161g')
            ORDER BY doi;
          " --json
