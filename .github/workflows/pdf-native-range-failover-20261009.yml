name: PDF native recovery and content-verified Range failover regression
on:
  push:
    branches: [fix/pdf-native-recovery-and-range-failover-20261009]
    paths:
      - 'src/private-pdf-reader.mjs'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'pdf/index.html'
      - 'tests/private-pdf-access-browser.mjs'
      - 'cloudflare/worker/scripts/test-private-pdf.mjs'
      - '.github/workflows/pdf-native-range-failover-20261009.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Validate Worker signed PDF ticket authorization and identity metadata
        run: |
          node --check cloudflare/worker/src/private-pdf.js
          node cloudflare/worker/scripts/test-private-pdf.mjs
      - name: Build current Gallery PDF.js and syntax-validate reader
        run: |
          node --check src/private-pdf-reader.mjs
          npm install --no-audit --no-fund
          npm run build
      - name: Chromium end-to-end secure Range failover and native handoff
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
          node tests/private-pdf-access-browser.mjs
      - name: Chromium local PDF reader unaffected
        run: node tests/pdf-vault-local-browser.mjs
      - name: Preserve bounded failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-native-failover-browser-diagnostics
          path: test-results/private-pdf-access-browser
          if-no-files-found: ignore
          retention-days: 5
