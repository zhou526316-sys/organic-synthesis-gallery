name: Oct10 Tampermonkey startup timeout read-only forensics
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/inspect-tm-oct10-startup-timeout.py
      - .github/workflows/tm-oct10-bootstrap-forensics.yml
permissions:
  contents: read
concurrency:
  group: tm-oct10-bootstrap-read-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing latest owner snapshot from R2 without modifying it
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.136.2 r2 object get organic-synthesis-gallery-media/local-captures/diagnostics/latest.json --remote --file "$RUNNER_TEMP/oct10-latest.json" >/dev/null
          python3 scripts/inspect-tm-oct10-startup-timeout.py "$RUNNER_TEMP/oct10-latest.json"
      - name: Remove raw owner diagnostic regardless of result
        shell: bash
        if: always()
        run: rm -f "$RUNNER_TEMP/oct10-latest.json"
