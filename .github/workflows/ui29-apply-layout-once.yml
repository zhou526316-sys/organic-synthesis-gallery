name: Apply reviewed summary layout integration once
on:
  push:
    branches: [fix/ui-summary-readable-20260923]
    paths: [.github/workflows/ui29-apply-layout-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'zhou526316-sys/organic-synthesis-gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Update only the superseded summary dimensions and empty-TOC layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('tests/mobile-interaction.spec.ts')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == '85e9fd2c4475a0813cfc0d25a7ba334a09fd365d'
          text = p.read_text()
          old = '    expect(box.width).toBeLessThan(780);\n    expect(box.width).toBeLessThan(1280 * 0.8);\n    expect(box.height).toBeLessThan(900 * 0.8);'
          new = '    // Feedback 29 explicitly enlarges the previous 740px summary panel.\n    expect(box.width).toBeGreaterThan(1000);\n    expect(box.width).toBeLessThanOrEqual(1080);\n    expect(box.width).toBeLessThan(1280 - 24);\n    expect(box.height).toBeLessThan(900 * 0.9);'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          p = Path('src/user-ui/summary-panel-layout.ts')
          text = p.read_text()
          old = '  .summary-drawer .summary-toc{'
          assert text.count(old) == 2
          text = text.replace(old, '  .summary-drawer .summary-main:only-child{grid-column:1/-1}\n'+old, 1)
          p.write_text(text)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mobile-interaction.spec.ts src/user-ui/summary-panel-layout.ts
          git commit -m 'test(ui): update requested summary size contract; span empty-TOC states'
          git push origin HEAD:fix/ui-summary-readable-20260923
