name: Validate prepublish literature review

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepublish-review-gate.yml'
      - 'scripts/validate-prepublish-review.mjs'
      - 'scripts/test-prepublish-readiness.mjs'
      - 'scripts/check-prepublish-readiness.mjs'
      - 'scripts/test-prepublish-slot-window.mjs'
      - 'scripts/test-per-doi-release.mjs'
      - 'shared/literature-journals.js'
      - 'audit/latest.json'
      - 'audit/unresolved-latest.json'
      - 'audit/prepublish-review-*.json'

permissions:
  contents: read

concurrency:
  group: prepublish-literature-review
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test staging versus full-review closure invariants
        run: node scripts/test-prepublish-readiness.mjs

      - name: Test target-slot freshness and zero-new proof
        run: node scripts/test-prepublish-slot-window.mjs

      - name: Test per-DOI publication and durable deferrals
        run: node scripts/test-per-doi-release.mjs

      - name: Locate canonical staging review
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^audit/prepublish-review-[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|1800)\.json$' || true)"
          if [ -n "$changed" ]; then
            review="$(printf '%s\n' "$changed" | tail -n 1)"
          else
            review="$(find audit -maxdepth 1 -type f -regextype posix-extended -regex '.*/prepublish-review-[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|1800)\.json' | sort | tail -n 1)"
          fi
          test -n "$review"
          echo "review=$review" >> "$GITHUB_OUTPUT"
          echo "Validating $review"

      - name: Validate complete handoff and documented decisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-prepublish-review.mjs "${{ steps.locate.outputs.review }}" --allow-deferred | tee "$RUNNER_TEMP/prepublish-validation.json"

      - name: Require reviewed DOI subset for publication readiness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-prepublish-review.mjs "${{ steps.locate.outputs.review }}" --allow-deferred --require-ready | tee "$RUNNER_TEMP/prepublish-readiness.json"

      - name: Require fresh snapshot for the target 08 or 18 slot
        if: always() && steps.locate.outputs.review != ''
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-prepublish-readiness.mjs "${{ steps.locate.outputs.review }}" --allow-deferred --require-ready | tee "$RUNNER_TEMP/prepublish-slot-readiness.json"

      - name: Preserve staging and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-readiness-evidence
          path: |
            ${{ runner.temp }}/prepublish-validation.json
            ${{ runner.temp }}/prepublish-readiness.json
            ${{ runner.temp }}/prepublish-slot-readiness.json
          if-no-files-found: warn
          retention-days: 14
