name: Isolate Gallery GIF paint and decode conditions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui147-gif-paint-isolation.yml']
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03f0d46178dd702077c97004e9f8d3dcb015ce00
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build unchanged source with pinned browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/gif-paint-install.log 2>&1 || { tail -60 /tmp/gif-paint-install.log; exit 1; }
          npm run build
      - name: Observe shadow bounds and preparation; preserve product and assertions
        run: |
          mkdir -p gif-paint
          cat > tests/pr147-paint-isolation.spec.ts <<'TS'
          import { test, expect } from '@playwright/test';
          import { createHash } from 'node:crypto';
          import { open, gifFile, GIF } from './status-image-fixtures';
          test.use({trace:'off',serviceWorkers:'block',viewport:{width:390,height:900}});
          for(const mode of ['baseline','caret-initial','host-box','bare-shadow','no-scroll-lock']) test(mode,async({page},info)=>{
            let image;
            if(mode==='bare-shadow'){
              await page.setContent('<div id="host"></div>');
              await page.locator('#host').evaluate((host,base64)=>{const root=host.attachShadow({mode:'open'});root.innerHTML='<img style="width:72px;height:36px;position:fixed;left:79px;top:485px" src="data:image/gif;base64,'+base64+'">';},GIF.toString('base64'));
              image=page.locator('#host img');
            }else{
              const actions=await open(page,390);
              await actions.locator('input[data-status-image="to-read"]').setInputFiles(gifFile);
              await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
              image=actions.locator('[data-action="set-status:to-read"] .status-image');
              await expect(image).toHaveAttribute('data-image-source','original');
              if(mode==='host-box')await actions.evaluate(host=>{
                const root=host.shadowRoot!;const drawer=root.querySelector('.drawer') as HTMLElement;const r=drawer.getBoundingClientRect();
                (host as HTMLElement).style.cssText='position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:999999;pointer-events:none';
                drawer.style.position='absolute';drawer.style.left=r.x+'px';drawer.style.top=r.y+'px';drawer.style.pointerEvents='auto';
              });
              if(mode==='no-scroll-lock')await page.evaluate(()=>document.documentElement.classList.remove('gallery-user-drawer-open'));
            }
            await image.scrollIntoViewIfNeeded();
            const geometry=await image.evaluate(node=>{const out=[];let x:Element|null=node;while(x){out.push({tag:x.tagName,cls:x.className,box:x.getBoundingClientRect().toJSON()});x=x.parentElement||((x.getRootNode() as ShadowRoot).host??null);}return out;});
            const frames=new Map<string,Buffer>();const samples:any[]=[];
            try{
              await expect.poll(async()=>{
                const box=(await image.boundingBox())!;
                const pixels=await page.screenshot({clip:box,animations:'allow',caret:mode==='caret-initial'?'initial':'hide'});
                const hash=createHash('sha256').update(pixels).digest('hex');frames.set(hash,pixels);samples.push({at:Date.now(),hash});return frames.size;
              },{timeout:6000,intervals:[150,230,310]}).toBeGreaterThan(1);
            }finally{
              await info.attach('conditions.json',{body:JSON.stringify({mode,geometry,samples}),contentType:'application/json'});
              let i=0;for(const bytes of frames.values())await info.attach(`frame-${i++}.png`,{body:bytes,contentType:'image/png'});
            }
          });
          TS
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gif-paint-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Retain coordinate and pixel evidence for all conditions
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gif-paint/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/pr147-paint-isolation.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=gif-paint/tests 2>&1 | tee gif-paint/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr147-gif-paint-isolation
          path: gif-paint/
          retention-days: 7
