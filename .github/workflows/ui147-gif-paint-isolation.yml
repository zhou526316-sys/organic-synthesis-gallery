name: Isolate Gallery GIF paint and decode conditions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui147-gif-paint-isolation.yml']
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03f0d46178dd702077c97004e9f8d3dcb015ce00
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build pinned candidate and install browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/gif-paint-install.log 2>&1 || { tail -60 /tmp/gif-paint-install.log; exit 1; }
          npm run build
      - name: Create isolated causal probes, leaving all release source unchanged
        run: |
          mkdir -p gif-paint
          cat > tests/pr147-paint-isolation.spec.ts <<'TS'
          import { test, expect } from '@playwright/test';
          import { open, gifFile, originalHash } from './status-image-fixtures';
          import { expectAnimatedImage } from './animated-image-evidence';
          test.use({trace:'off',serviceWorkers:'block'});
          for(const mode of ['baseline','image-layer','drawer-layer','visible-decode','fresh-element','visible-ancestry']) test(mode,async({page},info)=>{
            const actions=await open(page,390);
            await actions.locator('input[data-status-image="to-read"]').setInputFiles(gifFile);
            await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
            const image=actions.locator('[data-action="set-status:to-read"] .status-image');
            await expect(image).toHaveAttribute('data-image-source','original');
            const hash=await originalHash(image);
            const ancestry=await image.evaluate(node=>{
              const out=[];let x:Element|null=node;
              while(x){const css=getComputedStyle(x);out.push({tag:x.tagName,cls:x.className,cv:css.contentVisibility,contain:css.contain,transform:css.transform,visibility:css.visibility});x=x.parentElement||((x.getRootNode() as ShadowRoot).host??null);}
              return out;
            });
            if(mode==='image-layer')await image.evaluate(node=>(node as HTMLElement).style.transform='translateZ(0)');
            if(mode==='drawer-layer')await actions.locator('.drawer').evaluate(node=>(node as HTMLElement).style.transform='translateZ(0)');
            if(mode==='visible-decode')await image.evaluate(node=>(node as HTMLImageElement).decode());
            if(mode==='fresh-element')await image.evaluate(node=>{const fresh=node.cloneNode(true);node.replaceWith(fresh);});
            if(mode==='visible-ancestry')await actions.evaluate(node=>{let x:HTMLElement|null=node;while(x){x.style.setProperty('content-visibility','visible','important');x.style.setProperty('contain','none','important');x=x.parentElement;}});
            await info.attach('condition.json',{body:JSON.stringify({mode,hash,ancestry},null,2),contentType:'application/json'});
            await expectAnimatedImage(image,info);
            expect(await originalHash(image)).toBe(hash);
          });
          TS
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gif-paint-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Compare conditions without tracing or weakened frame checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gif-paint/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/pr147-paint-isolation.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=gif-paint/tests 2>&1 | tee gif-paint/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr147-gif-paint-isolation
          path: gif-paint/
          retention-days: 7
