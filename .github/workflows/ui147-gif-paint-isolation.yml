name: Isolate Gallery GIF paint and decode conditions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui147-gif-paint-isolation.yml']
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03f0d46178dd702077c97004e9f8d3dcb015ce00
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build pinned candidate and install browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/gif-paint-install.log 2>&1 || { tail -60 /tmp/gif-paint-install.log; exit 1; }
          npm run build
      - name: Create isolated source and parent-box probes without touching release code
        run: |
          mkdir -p gif-paint
          cat > tests/pr147-paint-isolation.spec.ts <<'TS'
          import { test, expect } from '@playwright/test';
          import { open, gifFile, originalHash } from './status-image-fixtures';
          import { expectAnimatedImage } from './animated-image-evidence';
          test.use({trace:'off',serviceWorkers:'block'});
          for(const mode of ['baseline','overlay-contents','overlay-height','fresh-url','document-load','body-copy']) test(mode,async({page},info)=>{
            const actions=await open(page,390);
            await actions.locator('input[data-status-image="to-read"]').setInputFiles(gifFile);
            await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
            let image=actions.locator('[data-action="set-status:to-read"] .status-image');
            await expect(image).toHaveAttribute('data-image-source','original');
            const hash=await originalHash(image);
            const before=await page.evaluate(()=>({at:performance.now(),state:document.readyState,load:performance.getEntriesByType('navigation').map(n=>(n as PerformanceNavigationTiming).loadEventEnd)}));
            if(mode==='overlay-contents')await actions.evaluate(node=>{const root=node.shadowRoot!;(root.querySelector('.overlay') as HTMLElement).style.display='contents';(root.querySelector('.drawer') as HTMLElement).style.zIndex='10020';});
            if(mode==='overlay-height')await actions.locator('.overlay').evaluate(node=>(node as HTMLElement).style.height='100vh');
            if(mode==='fresh-url')await image.evaluate(async node=>{const old=(node as HTMLImageElement).src;const blob=await(await fetch(old)).blob();(node as HTMLImageElement).src=URL.createObjectURL(blob);await(node as HTMLImageElement).decode();});
            if(mode==='document-load')await page.waitForLoadState('load');
            if(mode==='body-copy') {
              await image.evaluate(node=>{const img=node.cloneNode(true) as HTMLImageElement;img.id='body-gif-probe';img.style.cssText='position:fixed;left:8px;top:8px;width:72px;height:36px;z-index:999999';document.body.appendChild(img);});
              image=page.locator('#body-gif-probe');
            }
            await info.attach('condition.json',{body:JSON.stringify({mode,hash,before,after:await page.evaluate(()=>({at:performance.now(),state:document.readyState}))},null,2),contentType:'application/json'});
            await expectAnimatedImage(image,info);
            expect(await originalHash(image)).toBe(hash);
          });
          TS
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gif-paint-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Compare conditions with unchanged six-second frame checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gif-paint/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/pr147-paint-isolation.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=gif-paint/tests 2>&1 | tee gif-paint/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr147-gif-paint-isolation
          path: gif-paint/
          retention-days: 7
