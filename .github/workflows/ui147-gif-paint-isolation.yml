name: Isolate Gallery GIF paint and decode conditions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui147-gif-paint-isolation.yml']
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03f0d46178dd702077c97004e9f8d3dcb015ce00
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build unchanged source with pinned browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/gif-paint-install.log 2>&1 || { tail -60 /tmp/gif-paint-install.log; exit 1; }
          npm run build
      - name: Isolate native control rendering without release edits
        run: |
          mkdir -p gif-paint
          cat > tests/pr147-paint-isolation.spec.ts <<'TS'
          import { test, expect } from '@playwright/test';
          import { open, gifFile, originalHash } from './status-image-fixtures';
          import { expectAnimatedImage } from './animated-image-evidence';
          test.use({trace:'off',serviceWorkers:'block'});
          for(const mode of ['baseline','appearance-none','div-instead-of-button','image-outside-button','no-overflow-lock']) test(mode,async({page},info)=>{
            const actions=await open(page,390);
            await actions.locator('input[data-status-image="to-read"]').setInputFiles(gifFile);
            await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
            let image=actions.locator('[data-action="set-status:to-read"] .status-image');
            await expect(image).toHaveAttribute('data-image-source','original');
            const hash=await originalHash(image);
            if(mode==='appearance-none')await image.evaluate(node=>{const button=node.closest('button')!;button.style.setProperty('appearance','none');button.style.setProperty('-webkit-appearance','none');});
            if(mode==='div-instead-of-button')await image.evaluate(node=>{const button=node.closest('button')!;const div=document.createElement('div');for(const a of button.attributes)div.setAttribute(a.name,a.value);while(button.firstChild)div.appendChild(button.firstChild);button.replaceWith(div);});
            if(mode==='image-outside-button'){
              await image.evaluate(node=>{const box=node.getBoundingClientRect();const root=node.getRootNode() as ShadowRoot;const copy=node.cloneNode(true) as HTMLImageElement;copy.id='outside-button';copy.style.cssText=`position:fixed;left:${box.x}px;top:${box.y}px;width:${box.width}px;height:${box.height}px;z-index:999999;pointer-events:none`;root.appendChild(copy);});
              image=actions.locator('#outside-button');
            }
            if(mode==='no-overflow-lock')await page.evaluate(()=>{const s=document.createElement('style');s.textContent='html.gallery-user-drawer-open,html.gallery-user-drawer-open body{overflow:auto!important;overscroll-behavior:auto!important}';document.head.append(s);});
            await info.attach('mode.json',{body:JSON.stringify({mode,hash}),contentType:'application/json'});
            await expectAnimatedImage(image,info);
            expect(await originalHash(image)).toBe(hash);
          });
          TS
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gif-paint-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Keep all six-second animation and byte assertions
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gif-paint/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/pr147-paint-isolation.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=gif-paint/tests 2>&1 | tee gif-paint/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr147-gif-paint-isolation
          path: gif-paint/
          retention-days: 7
