name: WeChat Oct16 official cloud readback QA
on:
  push:
    branches: [main]
    paths: ['audit/automation-triggers/wechat-oct16-cloud-readback.json']
permissions:
  contents: write
concurrency:
  group: wechat-oct16-official-cloud-qa
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing read-only browser tooling
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps chromium >/tmp/oct16-cloud-browser.log 2>&1 || { tail -30 /tmp/oct16-cloud-browser.log; exit 1; }
      - name: Verify actual saved preview, all reviewed prose and ordered figures
        run: |
          set -euo pipefail
          node scripts/wechat-oct16-r2-official-cloud-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-oct16-r2-official-cloud-qa
          path: audit/wechat-working/2026-10-16-r2-cloud-readback
          retention-days: 14
      - name: Preserve successful read-only QA receipt
        if: success()
        run: |
          set -euo pipefail
          RESULT_DIR='audit/wechat-working/2026-10-16-r2-cloud-readback'
          mkdir -p /tmp/oct16-cloud-result
          cp -a "$RESULT_DIR"/. /tmp/oct16-cloud-result/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$RESULT_DIR"
            cp -a /tmp/oct16-cloud-result/. "$RESULT_DIR"/
            git add "$RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit: verify Oct16 official WeChat draft prose, original figures, links and mobile layout'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
