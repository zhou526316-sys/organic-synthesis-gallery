name: GPT reviewed summary pipeline regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/worker/src/article-summary.js'
      - 'cloudflare/worker/src/article-summary-jobs.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-article-summary*.mjs'
      - 'cloudflare/worker/package.json'
      - 'cloudflare/worker/wrangler.toml'
      - 'cloudflare/schema.sql'
      - 'cloudflare/migrations/2026-09-25-article-summary-jobs.sql'
      - 'src/user-ui/shared.ts'
      - 'src/user-ui/paper-actions.ts'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/reviewed-summary-ci.yml'

permissions:
  contents: read

jobs:
  reviewed-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate source and queue migration contract
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/worker/src/article-summary.js
          node --check cloudflare/worker/src/article-summary-jobs.js
          node --check cloudflare/worker/src/index.js
          grep -F 'CREATE TABLE IF NOT EXISTS article_summary_jobs' cloudflare/migrations/2026-09-25-article-summary-jobs.sql
          grep -F 'draft_cursor INTEGER NOT NULL DEFAULT 0' cloudflare/migrations/2026-09-25-article-summary-jobs.sql
          grep -F "const DRAFT_MODEL = 'gpt-5.6-terra';" cloudflare/worker/src/article-summary-jobs.js
          grep -F "const AUDIT_MODEL = 'gpt-5.6-sol';" cloudflare/worker/src/article-summary-jobs.js
          grep -F 'store: false' cloudflare/worker/src/article-summary-jobs.js
          grep -F "type: 'json_schema'" cloudflare/worker/src/article-summary-jobs.js
          grep -F 'strict: true' cloudflare/worker/src/article-summary-jobs.js
          grep -F 'summary_numeric_evidence_missing' cloudflare/worker/src/article-summary-jobs.js

      - name: Test reviewed summary pipeline with mocked OpenAI Responses
        working-directory: cloudflare/worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run test:article-summary
          npm run check

      - name: Verify safe production deployment order
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/deploy-worker-frontend.yml','utf8');
          const dry = workflow.indexOf('Dry-run frontend Worker bundle');
          const migration = workflow.indexOf('Apply reviewed-summary queue migration');
          const deploy = workflow.indexOf('Deploy frontend assets');
          if (!(dry >= 0 && migration > dry && deploy > migration)) throw new Error('expected dry-run -> migration -> deploy ordering');
          if (!workflow.includes('OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}')) throw new Error('OpenAI secret binding missing');
          if (!workflow.includes('crons = ["0 */6 * * *", "*/10 * * * *"]')) throw new Error('summary cron missing');
          console.log(JSON.stringify({dryRunBeforeMigration:true,migrationBeforeDeploy:true,openAiSecret:true,summaryCron:true}));
          NODE
