name: Deploy static Cloudflare Pages fallback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-pages-static.yml'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-static
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: organic-synthesis-gallery-public
      PAGES_URL: https://organic-synthesis-gallery-public.pages.dev
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot current literature files
        run: node cloudflare/scripts/snapshot-production-static.mjs

      - name: Build self-contained media mirror
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/build-pages-mirror.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 2 ]; then
            echo "Media mirror reported isolated misses; continuing with the preserved successful snapshot."
          fi
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          PAGES_MEDIA_CONCURRENCY: '8'

      - name: Generate fallback VPN Bridge
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery.zhou526316.workers.dev
          TARGET_SITE_ORIGIN: https://organic-synthesis-gallery-public.pages.dev
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Package self-updating fallback Bridge runtime
        env:
          TARGET_SITE_ORIGIN: https://organic-synthesis-gallery-public.pages.dev
          BRIDGE_UPDATE_ORIGIN: https://organic-synthesis-gallery-public.pages.dev
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
          BRIDGE_RUNTIME_OUTPUT: public/gallery-vpn-bridge-runtime.js
        run: node cloudflare/scripts/build-bridge-loader.mjs

      - name: Build static Gallery
        run: npm run build

      - name: Install Wrangler
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Create Pages project if needed
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set +e
          npx wrangler pages project create "$PROJECT_NAME" --production-branch main
          exit 0

      - name: Deploy static Gallery to Pages
        id: deploy
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy ../../dist --project-name "$PROJECT_NAME" --branch main 2>&1 | tee /tmp/pages-deploy.log
          URL=$(grep -Eo 'https://[-A-Za-z0-9.]+\.pages\.dev' /tmp/pages-deploy.log | tail -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify canonical Pages URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${PROJECT_NAME}.pages.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/" > /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/media-index.json" > /tmp/media-index.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/gallery-vpn-bridge.user.js" > /tmp/bridge.user.js
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/gallery-vpn-bridge-runtime.js" > /tmp/bridge.runtime.js
          CSS_PATH=$(grep -Eo 'href="[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2)
          test -n "$CSS_PATH"
          case "$CSS_PATH" in
            http://*|https://*) CSS_URL="$CSS_PATH" ;;
            /*) CSS_URL="$URL$CSS_PATH" ;;
            *) CSS_URL="$URL/$CSS_PATH" ;;
          esac
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$CSS_URL" > /tmp/app.css
          grep -F "46svh" /tmp/app.css
          grep -F "grid-template-columns:minmax(0,1fr)" /tmp/app.css
          grep -F "// @version      2.0.1" /tmp/bridge.user.js
          grep -F "// @match        https://organic-synthesis-gallery-public.pages.dev/*" /tmp/bridge.user.js
          grep -F "// @match        https://zhou526316-sys.github.io/organic-synthesis-gallery/*" /tmp/bridge.user.js
          grep -F "const VERSION = '1.1.1';" /tmp/bridge.runtime.js
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/media-index.json', 'utf8'));
          const count = Object.keys(manifest.items || {}).length;
          if (!count) throw new Error('Pages media index is empty');
          console.log(JSON.stringify({ pagesUrl: process.env.PROJECT_NAME, manifestItems: count, bridgeLoader: true, bridgeRuntime: true }));
          NODE

      - name: Publish URL
        run: |
          echo '## Static Gallery fallback' >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PROJECT_NAME}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
