name: Verify manual resume installer live

on:
  push:
    branches: [fix/tm-manual-resume-20261007]
    paths: [.github/workflows/tm-resume-live.yml]

permissions:
  contents: read

concurrency:
  group: tm-resume-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/tm-manual-resume-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Compare actual canonical and Worker installer bytes
        env:
          # Exact canonical artifact validated by manual resume regression run 37579215313.
          TM_EXPECTED_INSTALLER_SHA256: '954ead8f60a23735946fc89d7ab9059257c140721bfa83e7f701b23ecc104fa3'
        run: node scripts/verify-tm-resume-live.mjs
      - name: Preserve bounded read-only verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-resume-live
          path: ${{ runner.temp }}/tm-resume-live.json
          if-no-files-found: warn
          retention-days: 7
