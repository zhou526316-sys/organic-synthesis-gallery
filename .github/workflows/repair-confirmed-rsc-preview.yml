name: Repair confirmed RSC preview TOC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-confirmed-rsc-preview.yml'
  workflow_dispatch:
    inputs:
      doi:
        description: 'Confirmed RSC DOI whose stored TOC is a page/PDF preview'
        required: true
        default: '10.1039/d6sc06421c'

permissions:
  contents: read

concurrency:
  group: repair-confirmed-rsc-preview
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPAIR_DOI: ${{ github.event.inputs.doi || '10.1039/d6sc06421c' }}
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
    steps:
      - name: Wait for deployed purge endpoint and remove rejected RSC preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BRIDGE_WRITE_TOKEN"
          for i in {1..36}; do
            CODE="$(curl --silent --show-error --output /tmp/rsc-purge.json --write-out '%{http_code}' --max-time 20               --request POST               --header "authorization: Bearer $BRIDGE_WRITE_TOKEN"               --header 'content-type: application/json'               --data "{"doi":"$REPAIR_DOI","dryRun":false}"               https://api.gczhouwld.com/api/admin/media/purge-rsc-preview || true)"
            if [ "$CODE" = "200" ]; then
              cat /tmp/rsc-purge.json
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/rsc-purge.json','utf8'));if(x.ok!==true||!Array.isArray(x.affectedDois)||!x.affectedDois.includes(process.env.REPAIR_DOI.toLowerCase()))process.exit(1)"
              exit 0
            fi
            sleep 10
          done
          cat /tmp/rsc-purge.json 2>/dev/null || true
          exit 1

      - name: Verify production TOC no longer serves quarantined preview
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const doi=process.env.REPAIR_DOI.toLowerCase();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<20;i++){
            const u=new URL('https://api.gczhouwld.com/api/toc');
            u.searchParams.set('doi',doi);
            u.searchParams.set('verify',String(Date.now()));
            const r=await fetch(u,{headers:{'cache-control':'no-cache'}});
            const x=await r.json().catch(()=>({}));
            if(x.available===false&&x.reason==='rsc_pdf_preview_quarantined'){
              console.log(JSON.stringify(x));
              process.exit(0);
            }
            await sleep(3000);
          }
          throw new Error('quarantined RSC preview is still publicly available');
          NODE
