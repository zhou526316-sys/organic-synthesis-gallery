name: Integrate reviewed UI refresh optimization once
on:
  push:
    branches: [fix/ui-refresh-cost-20260923-1115]
    paths: [.github/workflows/ui-refresh-integrate-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Patch only inspected source on this branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def load(path, sha):
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha, 'Changed baseline requires review: '+path
              p=Path(path); return p,p.read_text()
          def once(text, old, new):
              assert text.count(old)==1, ('Expected unique patch site',old)
              return text.replace(old,new)
          p,text=load('src/user-ui/shared.ts','4006f28492beb57fa4877221a29bdd11d7d44348')
          text="import { ReaderCountLoader } from './reader-count-loader';\n"+text
          text=once(text,"  private readonly summaryCache = new Map<string, ArticleSummaryResult>();",'''  private readonly summaryCache = new Map<string, ArticleSummaryResult>();
            private metadataSaveQueued = false;
            private readonly countLoader = new ReaderCountLoader(
              async dois => (await workerPost<{ counts?: Record<string, number> }>('/api/user-ui/reader-counts', { dois })).counts,
              counts => {
                let changed = false;
                for (const [doi, count] of Object.entries(counts)) {
                  if (this.readerCounts[doi] !== count) changed = true;
                  this.readerCounts[doi] = count;
                }
                if (changed) {
                  writeReaderCountsCache(this.readerCounts);
                  this.dispatchEvent(new CustomEvent('counts', { detail: { dois: Object.keys(counts) } }));
                }
              },
            );''')
          text=once(text,"          if (typeof data.count === 'number') {\n            const changed", "          if (typeof data.count === 'number') {\n            this.countLoader.noteMark(doi);\n            const changed")
          text=once(text,"  save(broadcast = true, detail?: { paperId?: string; scope?: 'paper' | 'global' }): void {\n    try", "  save(broadcast = true, detail?: { paperId?: string; scope?: 'paper' | 'global' }): void {\n    this.metadataSaveQueued = false;\n    try")
          text=once(text,"  registerMeta(meta: PaperMeta): void { this.state.metadata[meta.id] = { id: meta.id, doi: meta.doi, title: meta.title, journal: meta.journal, href: meta.href }; this.save(false); }",'''  registerMeta(meta: PaperMeta): void {
              const next = { id: meta.id, doi: meta.doi, title: meta.title, journal: meta.journal, href: meta.href };
              const previous = this.state.metadata[meta.id];
              if (previous && previous.id === next.id && previous.doi === next.doi && previous.title === next.title && previous.journal === next.journal && previous.href === next.href) return;
              // Metadata is immediately available to newly mounted components, but
              // serialize the full state only once for this synchronous card batch.
              this.state.metadata[meta.id] = next;
              if (this.metadataSaveQueued) return;
              this.metadataSaveQueued = true;
              queueMicrotask(() => { if (this.metadataSaveQueued) this.save(false); });
            }''')
          start=text.index('  async loadCounts(dois: string[]): Promise<void> {')
          end=text.index('  async recordOpen(doi:',start)
          text=text[:start]+'''  async loadCounts(dois: string[]): Promise<void> {
              const unique = [...new Set(dois.map(normalizeDoi).filter((value): value is string => Boolean(value)))];
              await this.countLoader.load(unique);
            }
          '''+text[end:]
          p.write_text(text)
          p,text=load('src/user-ui/search-controller.ts','1e1f82a31c12b7a37a8ff2ef774333d7794183fe')
          text=once(text,"  private readonly storeChanged = (): void => this.refresh();",'''  private cards: HTMLElement[] = [];
            private metas: PaperMeta[] = [];
            private aliasKey = '';
            private readFilterKey = '';
            private stopped = false;
            private readonly storeChanged = (): void => this.refreshPreferences();
            private readonly refreshCounts = (): void => {
              if (!this.stopped && document.visibilityState !== 'hidden') void store.loadCounts(this.metas.flatMap(meta => meta.doi ? [meta.doi] : []));
            };''')
          text=once(text,'    this.refresh();\n    this.renderSuggestions();','    this.refreshPreferences(true);\n    this.renderSuggestions();') if text.count('    this.refresh();\n    this.renderSuggestions();')==1 else text
          old='    this.refresh();\n    this.renderSuggestions();'
          # Both direct typing and IME completion must avoid corpus decoration.
          if old in text:
              assert text.count(old)==2
              text=text.replace(old,'    this.refreshPreferences(true);\n    this.renderSuggestions();')
          text=once(text,"    window.addEventListener('resize', this.resize);", "    window.addEventListener('resize', this.resize);\n    window.addEventListener('focus', this.refreshCounts);\n    document.addEventListener('visibilitychange', this.refreshCounts);")
          text=once(text,'  destroy(): void {','  destroy(): void {\n    this.stopped = true;\n    this.cards = []; this.metas = [];')
          text=once(text,"    window.removeEventListener('resize', this.resize);", "    window.removeEventListener('resize', this.resize);\n    window.removeEventListener('focus', this.refreshCounts);\n    document.removeEventListener('visibilitychange', this.refreshCounts);")
          start=text.index('  private refresh(): void {')
          end=text.index('  private decorate(card:',start)
          text=text[:start]+'''  private currentReadFilterKey(): string {
              return store.state.hideRead ? JSON.stringify([
                store.state.statuses.map(status => [status.id, status.countsAsRead]),
                this.cards.map(card => store.paper(card.dataset.userPaperId || '').statusId || ''),
              ]) : 'show-all';
            }

            private refreshPreferences(searchChanged = false): void {
              if (!this.gallery || this.stopped) return;
              // Appearance/notes/favorites do not change the corpus or reader counts.
              // Preserve live aliases and hide-read filtering without rebuilding links,
              // serializing every paper, or querying the same numbers after each edit.
              this.cards.forEach(card => this.paintStatus(card));
              const aliasKey = JSON.stringify(store.state.aliases);
              const aliasesChanged = aliasKey !== this.aliasKey;
              if (aliasesChanged) { this.buildCandidates(this.metas); this.aliasKey = aliasKey; }
              const readKey = this.currentReadFilterKey();
              if (searchChanged || aliasesChanged || readKey !== this.readFilterKey) {
                this.observer?.disconnect();
                try { this.applyFilters(this.cards); this.readFilterKey = readKey; }
                finally { this.observer?.observe(this.gallery, { childList: true }); }
              }
            }

            private refresh(): void {
              if (!this.gallery || this.stopped) return;
              this.observer?.disconnect();
              try {
                this.cards = [...this.gallery.querySelectorAll<HTMLElement>('.card')];
                this.metas = this.cards.flatMap(card => { const meta = this.decorate(card); return meta ? [meta] : []; });
                this.buildCandidates(this.metas);
                this.aliasKey = JSON.stringify(store.state.aliases);
                this.applyFilters(this.cards);
                this.readFilterKey = this.currentReadFilterKey();
              } finally { this.observer?.observe(this.gallery, { childList: true }); }
              this.refreshCounts();
            }

            private paintStatus(card: HTMLElement): void {
              const status = store.status(store.paper(card.dataset.userPaperId || '').statusId || '');
              if (status) {
                card.classList.add('user-status-card');
                card.dataset.userStatusId = status.id;
                card.style.setProperty('--user-status-rgb', status.style.rgb.join(','));
              } else {
                card.classList.remove('user-status-card');
                delete card.dataset.userStatusId;
                card.style.removeProperty('--user-status-rgb');
              }
            }

          '''+text[end:]
          start=text.index("    const status = store.status(store.paper(id).statusId || '');",text.index('  private decorate('))
          end=text.index('    if (href && !titleElement',start)
          text=text[:start]+'    this.paintStatus(card);\n'+text[end:]
          p.write_text(text)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/shared.ts src/user-ui/search-controller.ts
          git rm .github/workflows/ui-refresh-integrate-once.yml
          git commit -m 'perf(ui): batch metadata persistence and separate preference refresh from corpus reload'
          git push origin HEAD:fix/ui-refresh-cost-20260923-1115
