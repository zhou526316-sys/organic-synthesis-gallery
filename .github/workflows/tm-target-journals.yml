name: Target journal Tampermonkey capability regression

on:
  push:
    branches: [fix/tm-chem-rsc-ccs-20261004, main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'scripts/tm-rsc-elsevier-ccs.inc.js'
      - 'scripts/tm-private-pdf-capture.inc.js'
      - 'scripts/apply-private-pdf-capture.py'
      - 'tests/tm-target-journals-browser.mjs'
      - 'tests/tm-newest-retry.test.mjs'
      - 'tests/private-pdf-capture-browser.mjs'
      - 'docs/private-pdf-editorial-pipeline.md'
      - '.github/workflows/private-pdf-capture-v2.yml'
      - '.github/workflows/tm-target-journals.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22}

      - name: Prove discovery and publication rules are outside this change
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          git diff --exit-code "$BASE" HEAD -- \
            scripts/audit-literature.mjs shared/literature-journals.js \
            docs/literature-scope-contract.md docs/literature-update-protocol.md \
            public/papers.gz.b64 public/rolling-supplement.json \
            .github/workflows/literature-audit.yml .github/workflows/prepublish-review-gate.yml \
            .github/workflows/new-body-continuous.yml audit/media-auto-policy.json \
            cloudflare/worker/src/media.js cloudflare/worker/src/local-captures.js

      - name: Verify source syntax and existing queue/controller protections
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node tests/tm-queue-coverage.test.mjs
          node tests/tm-missing-only.test.mjs
          node tests/tm-immediate-restart.test.mjs
          node tests/tm-controller-recovery.test.mjs
          node tests/tm-newest-retry.test.mjs
          node scripts/test-tm223-upload.mjs
          node scripts/test-tm220-release.mjs
          node scripts/test-tm222-auto-report.mjs

      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify Chem RSC CCS adapters and PDF cutoff
        run: |
          node tests/tm-target-journals-browser.mjs
          node tests/private-pdf-capture-browser.mjs

      - name: Build and validate canonical compatible installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node scripts/validate-tm220-artifacts.mjs public
          grep -F "PUBLISHER_MEDIA_REVISION = '20261004-rsc-elsevier-ccs-v9'" public/gallery-vpn-bridge.user.js
          grep -F "PUBLISHER_TASK_BINDING_REVISION = '20261004-elsevier-bound-task-v3'" public/gallery-vpn-bridge.user.js
          grep -F "PRIVATE_PDF_ADDED_DATE_CUTOFF = '2026-10-01'" public/gallery-vpn-bridge.user.js
          grep -F "ccs_toc_index_key_image" public/gallery-vpn-bridge.user.js
          grep -F "rsc_graphical_abstract" public/gallery-vpn-bridge.user.js
          mkdir -p "$RUNNER_TEMP/target-journals"
          cp public/gallery-vpn-bridge.user.js "$RUNNER_TEMP/target-journals/"
          sha256sum public/gallery-vpn-bridge.user.js > "$RUNNER_TEMP/target-journals/sha256.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-journal-tampermonkey-tested
          path: ${{ runner.temp }}/target-journals
          retention-days: 14
