name: Integrate reviewed crop controls once
on:
  push:
    branches: [feat/ui-image-crop-edit-20260923]
    paths: [.github/workflows/ui-crop-integrate-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-guarded UI-only integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def load(path, sha):
              p=Path(path)
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha, 'Source changed: '+path
              return p,p.read_text()
          def replace(text,a,b):
              assert text.count(a)==1, 'Nonunique integration: '+a[:120]
              return text.replace(a,b)
          p,t=load('src/user-ui/shared.ts','244c9ebf2e0ef346f1eea3dd6266eaf667bc2e37')
          t=replace(t,"import { cropUserImage } from './image-cropper';", "import { cropUserImage } from './image-cropper';\nimport { prepareCroppedStatusImage, imageFingerprint } from './status-image-edit';\nimport type { StatusImageCrop, StatusImageStyle } from './status-image-types';")
          t=replace(t,'imageOriginal?: OriginalStatusImage; glow?', 'imageOriginal?: OriginalStatusImage; imageCrop?: StatusImageCrop; glow?')
          methods='''  private commitStatusImage(target: StyleDef, next: StatusImageStyle): void {
              const keys = ['imageData', 'imageOriginal', 'imageCrop'] as const;
              const previous: StatusImageStyle = { imageData: target.imageData, imageOriginal: target.imageOriginal, imageCrop: target.imageCrop };
              const assign = (value: StatusImageStyle): void => {
                for (const key of keys) delete target[key];
                Object.assign(target, Object.fromEntries(Object.entries(value).filter(([, value]) => value !== undefined)));
              };
              assign(next);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); }
              catch (error) { assign(previous); throw error; }
              this.dispatchEvent(new CustomEvent('change', { detail: { scope: 'global' } }));
            }
            async cropStatusImage(target: StyleDef, file?: File): Promise<boolean> {
              const id = this.state.statuses.find(item => item.style === target)?.id;
              if (!id || (!file && !target.imageData)) return false;
              const job = Symbol('crop-status-image'); this.statusImageJobs.set(id, job);
              const fingerprint = imageFingerprint(target);
              const snapshot = structuredClone({ imageData: target.imageData, imageOriginal: target.imageOriginal, imageCrop: target.imageCrop });
              const prepared = await prepareCroppedStatusImage(snapshot, file);
              const live = this.status(id)?.style;
              if (!prepared || this.statusImageJobs.get(id) !== job || !live || imageFingerprint(live) !== fingerprint) return false;
              this.commitStatusImage(live, prepared);
              return true;
            }
            restoreStatusImage(target: StyleDef): boolean {
              const id = this.state.statuses.find(item => item.style === target)?.id;
              if (!id || !target.imageCrop) return false;
              this.statusImageJobs.set(id, Symbol('restore-status-image'));
              this.commitStatusImage(target, { imageData: target.imageCrop.sourcePreview, imageOriginal: target.imageOriginal });
              return true;
            }
          '''
          t=replace(t,'  private readonly statusImageJobs = new Map<string, symbol>();',methods+'  private readonly statusImageJobs = new Map<string, symbol>();')
          start=t.index('    const previous = { imageData: live.imageData, imageOriginal: live.imageOriginal };')
          end=t.index('    return true;',start)
          t=t[:start]+'    this.commitStatusImage(live, prepared);\n'+t[end:]
          t=replace(t,'    delete target.imageOriginal;\n    this.save();','    delete target.imageOriginal;\n    delete target.imageCrop;\n    this.save();')
          t=replace(t,"    const actionKey = (Object.entries(this.state.actionStyles)","    if (statusId) { await this.cropStatusImage(target, file); return; }\n    const actionKey = (Object.entries(this.state.actionStyles)")
          p.write_text(t)
          p,t=load('src/user-ui/paper-actions.ts','baf8560763dbe6938add72f241441ad133d7f1b9')
          old="<button type='button' data-action='view-status-image:${escapeHtml(status.id)}'>${this.tr('查看图片', 'View image')}</button>"
          new="""<button type='button' class='crop-image-entry' ${this.imageBusy ? 'disabled' : ''} data-action='crop-status-image:${escapeHtml(status.id)}'>${this.tr(status.style.imageCrop ? '重新裁切 / 抠图' : '裁切图片 / 抠图', status.style.imageCrop ? 'Edit crop / cutout' : 'Crop image / cutout')}</button><button type='button' data-action='view-status-image:${escapeHtml(status.id)}'>${this.tr('查看图片', 'View image')}</button>${status.style.imageCrop ? `<button type='button' ${this.imageBusy ? 'disabled' : ''} data-action='restore-status-image:${escapeHtml(status.id)}'>${this.tr('恢复原图', 'Restore original')}</button><button type='button' data-action='view-status-original:${escapeHtml(status.id)}'>${this.tr('查看原图', 'View original')}</button>` : ''}"""
          t=replace(t,old,new)
          t=replace(t,'静态裁切（可选）','上传后裁切（可选）')
          t=replace(t,'Static crop (optional)','Crop after upload (optional)')
          t=replace(t,'PNG / JPG / WebP / GIF，最大 30 MB。默认保留原图和动画，仅存在当前浏览器；账号同步预览图。静态裁切最大 20 MB。','PNG / JPG / WebP / GIF，最大 30 MB。已上传整图可直接点“裁切图片”。支持选区、圆形和手动抠图；GIF 裁切为静态图，原图保留，可恢复。账号同步裁切结果与预览，原文件仅存本浏览器。')
          t=replace(t,'PNG / JPG / WebP / GIF, up to 30 MB. Originals and animation stay in this browser; accounts sync a preview. Static crop: up to 20 MB.','Up to 30 MB. Crop uploaded images directly: rectangle, circle and manual cutout. GIF crops are static and reversible. Accounts sync the crop and preview; original files remain browser-local.')
          t=replace(t,"      .image-help{grid-column:1/-1;line-height:1.5;overflow-wrap:anywhere}","      .image-help{grid-column:1/-1;line-height:1.5;overflow-wrap:anywhere}\n      .image-options .crop-image-entry{background:#eef3ff;border:1px solid #8aa5ef;border-radius:8px;min-height:38px;padding:6px 10px;font-weight:700}\n      .status-original-action[data-image-source='crop']{object-fit:contain!important}")
          t=replace(t,"if (crop) { await store.setImage(status.style, file); this.imageMessage = ''; }","if (crop) { const saved = await store.cropStatusImage(status.style, file); this.imageMessage = saved ? this.tr('裁切已保存；显示选区结果，原图可恢复。', 'Crop saved; selected area displayed, original can be restored.') : this.tr('已取消，原设置未改变。', 'Cancelled; previous settings kept.'); }")
          handler='''    const imageEdit = /^(crop-status-image|restore-status-image|view-status-original):(.+)$/.exec(action);
              if (imageEdit) {
                const status = store.status(imageEdit[2]);
                if (!status?.style.imageData) return;
                if (imageEdit[1] === 'view-status-original') {
                  await viewStatusImage({ ...status.style, imageData: status.style.imageCrop?.sourcePreview || status.style.imageData, imageCrop: undefined }); return;
                }
                if (this.imageBusy) return;
                this.imageBusy = true; this.imageMessage = this.tr('正在准备图片…', 'Preparing image…'); this.render();
                try {
                  const saved = imageEdit[1] === 'crop-status-image' ? await store.cropStatusImage(status.style) : store.restoreStatusImage(status.style);
                  this.imageMessage = saved ? this.tr('图片设置已保存。', 'Image settings saved.') : this.tr('已取消或已有更新，保留当前设置。', 'Cancelled or superseded; current settings kept.');
                } catch (error) { this.imageMessage = statusImageError(error); }
                finally { this.imageBusy = false; this.render(); }
                return;
              }
          '''
          t=replace(t,"  private async action(action: string): Promise<void> {", "  private async action(action: string): Promise<void> {\n"+handler)
          p.write_text(t)
          p,t=load('src/user-ui/status-image-assets.ts','5eb9ae30b99666609050a8f509e25cd9675d3e1e')
          t=replace(t,"  const id = style.imageOriginal?.id;", "  const id = style.imageCrop ? undefined : style.imageOriginal?.id;") if t.count("  const id = style.imageOriginal?.id;")==1 else t.replace("  const id = style.imageOriginal?.id;", "  const id = style.imageCrop ? undefined : style.imageOriginal?.id;")
          t=replace(t,"data-image-source='preview' ${id", "data-image-source='${style.imageCrop ? 'crop' : 'preview'}' ${id")
          t=replace(t,"  image.dataset.imageSource = 'preview';", "  image.dataset.imageSource = style.imageCrop ? 'crop' : 'preview';")
          t=replace(t,"    : unavailable;", "    : style.imageCrop ? '裁切结果（静态）· 原图保留，可恢复 / Static crop · original retained and restorable' : unavailable;")
          p.write_text(t)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/shared.ts src/user-ui/paper-actions.ts src/user-ui/status-image-assets.ts
          git commit -m 'feat(ui): connect direct reversible crop editing and prevent full-original override'
          git push origin HEAD:feat/ui-image-crop-edit-20260923
