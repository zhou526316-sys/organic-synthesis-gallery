name: Apply TOC Collector safe-start patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-toc-collector-safe-start.yml'

permissions:
  contents: write

concurrency:
  group: toc-collector-safe-start
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe-start patch
        run: python .github/scripts/toc_collector_safe_start.py

      - name: Verify syntax and patch markers
        shell: bash
        run: |
          node --check toc-collector/src/main.mjs
          grep -q "Safe-start 0.1.3" toc-collector/src/main.mjs
          grep -q "Fatal-error visibility 0.1.3" toc-collector/src/main.mjs
          grep -q '"version": "0.1.3"' toc-collector/package.json

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- toc-collector/src/main.mjs toc-collector/package.json; then
            echo "Safe-start source is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toc-collector/src/main.mjs toc-collector/package.json
          git commit -m "fix: TOC Collector 0.1.3 visible safe startup"
          git push origin HEAD:main

  build-windows:
    needs: patch
    runs-on: windows-latest
    defaults:
      run:
        working-directory: toc-collector
    steps:
      - name: Checkout patched main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh patched main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify safe-start source
        shell: pwsh
        run: |
          npm run check
          $source = Get-Content src/main.mjs -Raw
          $pkg = Get-Content package.json -Raw
          if (-not $source.Contains('Safe-start 0.1.3')) { throw 'safe-start marker missing' }
          if (-not $pkg.Contains('0.1.3')) { throw '0.1.3 version missing' }

      - name: Build Windows installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows 0.1.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: toc-collector-windows-0.1.3
          path: |
            toc-collector/dist/*.exe
            toc-collector/dist/*.yml
          if-no-files-found: error
          retention-days: 14
