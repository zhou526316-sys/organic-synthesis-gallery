name: User system production smoke

on:
  workflow_run:
    workflows:
      - Deploy Worker additions
      - Deploy GitHub Pages frontend
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-system-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed GitHub Pages frontend and loaded chunks
        env:
          SITE_URL: https://zhou526316-sys.github.io/organic-synthesis-gallery/
        run: |
          node - <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const site = process.env.SITE_URL;

          async function get(url, attempts = 6) {
            let last = '';
            for (let i = 0; i < attempts; i += 1) {
              try {
                const response = await fetch(url, {
                  headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                  redirect: 'follow',
                });
                last = `${response.status} ${response.statusText}`;
                if (response.ok) return { response, text: await response.text() };
              } catch (error) {
                last = String(error);
              }
              await sleep(3000);
            }
            throw new Error(`GET ${url} failed after retries: ${last}`);
          }

          const pageUrl = `${site}?production-smoke=${Date.now()}`;
          const { text: html } = await get(pageUrl);
          assert(html.includes('Organic Synthesis Literature Gallery'), 'deployed HTML title marker missing');
          assert(html.includes('id="app"'), 'deployed app root missing');

          const queue = [];
          for (const match of html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/g)) {
            queue.push(new URL(match[1], site).href);
          }
          assert(queue.length > 0, 'deployed HTML has no JavaScript bundle');

          const visited = new Set();
          const sources = [];
          while (queue.length && visited.size < 80) {
            const url = queue.shift();
            if (!url || visited.has(url)) continue;
            visited.add(url);
            const { text } = await get(url);
            sources.push(text);

            const candidates = [
              ...text.matchAll(/["'](\.\/?[^"'\s]+\.js)["']/g),
              ...text.matchAll(/["'](\/[^"'\s]+\.js)["']/g),
            ];
            for (const match of candidates) {
              try {
                const next = new URL(match[1], url).href;
                if (next.startsWith(new URL(site).origin) && !visited.has(next)) queue.push(next);
              } catch {}
            }
          }

          const bundle = sources.join('\n');
          assert(bundle.includes('site-feedback-widget'), 'deployed bundle is missing site feedback widget');
          assert(bundle.includes('/api/user-ui/site-feedback'), 'deployed bundle is missing site feedback API route');
          assert(bundle.includes('api.gczhouwld.com'), 'deployed bundle is missing production API base');

          console.log(JSON.stringify({
            frontend: true,
            chunksChecked: visited.size,
            feedbackWidget: true,
            feedbackApiRoute: true,
          }));
          NODE

      - name: Check custom-domain auth, session, sync, email validation, reader, and feedback routes
        env:
          API_BASE: https://api.gczhouwld.com
          SITE_ORIGIN: https://zhou526316-sys.github.io
          RETURN_TO: https://zhou526316-sys.github.io/organic-synthesis-gallery/
        run: |
          node - <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const base = process.env.API_BASE;
          const origin = process.env.SITE_ORIGIN;
          const returnTo = process.env.RETURN_TO;

          async function json(path, init = {}, expected = 200, expectCors = true) {
            const headers = new Headers(init.headers || {});
            headers.set('origin', origin);
            const response = await fetch(`${base}${path}`, { ...init, headers, redirect: 'manual' });
            const text = await response.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch { throw new Error(`${path} returned non-JSON: ${text.slice(0, 300)}`); }
            assert(response.status === expected, `${path}: expected HTTP ${expected}, got ${response.status}: ${text}`);
            if (expectCors) {
              const allowOrigin = response.headers.get('access-control-allow-origin');
              assert(allowOrigin === origin, `${path}: CORS origin mismatch: ${allowOrigin}`);
            }
            return body;
          }

          const health = await json('/api/_healthcheck', {}, 200, false);
          assert(health.ok && health.d1 && health.r2 && health.writeAuth, `healthcheck incomplete: ${JSON.stringify(health)}`);

          const integrations = await json('/api/user-ui/integrations');
          assert(integrations?.auth?.google === true, `Google auth is not configured: ${JSON.stringify(integrations)}`);
          assert(integrations?.auth?.email === true, `Email auth is not configured: ${JSON.stringify(integrations)}`);
          assert(integrations?.auth?.local === true, `Native local auth is not enabled: ${JSON.stringify(integrations)}`);

          const anonymousSession = await json('/api/user-ui/auth/session');
          assert(anonymousSession.authenticated === false && anonymousSession.user === null, `anonymous session response invalid: ${JSON.stringify(anonymousSession)}`);

          const counts = await json('/api/user-ui/reader-counts', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ dois: [] }),
          });
          assert(counts && typeof counts.counts === 'object', `reader count response invalid: ${JSON.stringify(counts)}`);

          const invalidFeedback = await json('/api/user-ui/site-feedback', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ profileId: '', message: '' }),
          }, 400);
          assert(Boolean(invalidFeedback.error), `site feedback validation route invalid: ${JSON.stringify(invalidFeedback)}`);

          const pull = await json('/api/user-ui/reader-counts', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ mode: 'account-pull', sessionToken: 'invalid-smoke-session', profileId: 'smoke-profile-0001' }),
          }, 401);
          assert(pull.error === 'not_authenticated', `account pull auth guard invalid: ${JSON.stringify(pull)}`);

          const invalidExchange = await json('/api/user-ui/auth/exchange', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ code: 'invalid-smoke-exchange-code' }),
          }, 400);
          assert(invalidExchange.error === 'invalid_or_expired_code', `auth exchange guard invalid: ${JSON.stringify(invalidExchange)}`);

          const invalidEmail = await json('/api/user-ui/auth/email/start', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'not-an-email', returnTo }),
          }, 400);
          assert(invalidEmail.error === 'invalid_email', `email validation invalid: ${JSON.stringify(invalidEmail)}`);

          const invalidNativeRegistration = await json('/api/user-ui/auth/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'not-an-email', password: '12345678', displayName: 'Smoke' }),
          }, 400);
          assert(invalidNativeRegistration.error === 'invalid_email', `native registration email validation invalid: ${JSON.stringify(invalidNativeRegistration)}`);

          const invalidNativePassword = await json('/api/user-ui/auth/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'smoke-password@example.invalid', password: 'short', displayName: 'Smoke' }),
          }, 400);
          assert(invalidNativePassword.error === 'invalid_password', `native registration password validation invalid: ${JSON.stringify(invalidNativePassword)}`);

          const invalidNativeLogin = await json('/api/user-ui/auth/password/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'nonexistent-smoke@example.invalid', password: '12345678' }),
          }, 401);
          assert(invalidNativeLogin.error === 'invalid_credentials', `native password login guard invalid: ${JSON.stringify(invalidNativeLogin)}`);

          const invalidResetEmail = await json('/api/user-ui/auth/password/reset/start', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'not-an-email' }),
          }, 400);
          assert(invalidResetEmail.error === 'invalid_email', `password reset invalid-email validation failed: ${JSON.stringify(invalidResetEmail)}`);

          const invalidRegistrationCode = await json('/api/user-ui/auth/register/verify', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ challengeId: 'missing-smoke-challenge', code: '000000' }),
          }, 400);
          assert(invalidRegistrationCode.error === 'invalid_code', `registration verification guard invalid: ${JSON.stringify(invalidRegistrationCode)}`);

          const unauthenticatedPasswordChange = await json('/api/user-ui/auth/password/change', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ currentPassword: '12345678', newPassword: '87654321' }),
          }, 401);
          assert(unauthenticatedPasswordChange.error === 'not_authenticated', `password change auth guard invalid: ${JSON.stringify(unauthenticatedPasswordChange)}`);

          const unauthenticatedVerifyStart = await json('/api/user-ui/auth/email/verify/start', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: '{}',
          }, 401);
          assert(unauthenticatedVerifyStart.error === 'not_authenticated', `email verify auth guard invalid: ${JSON.stringify(unauthenticatedVerifyStart)}`);

          const google = await fetch(`${base}/api/user-ui/auth/start?provider=google&returnTo=${encodeURIComponent(returnTo)}`, {
            headers: { origin },
            redirect: 'manual',
          });
          assert(google.status === 302, `Google auth start expected 302, got ${google.status}`);
          const location = google.headers.get('location') || '';
          assert(location, 'Google auth start missing Location header');
          const target = new URL(location);
          assert(target.hostname === 'accounts.google.com', `Google auth redirected to unexpected host: ${target.hostname}`);
          const callback = target.searchParams.get('redirect_uri');
          assert(callback === `${base}/api/user-ui/auth/callback/google`, `Google redirect_uri mismatch: ${callback}`);
          assert(Boolean(target.searchParams.get('state')), 'Google OAuth state is missing');
          assert(target.searchParams.get('scope')?.includes('openid'), `Google OAuth scope missing openid: ${target.searchParams.get('scope')}`);

          console.log(JSON.stringify({
            health: true,
            cors: true,
            googleConfigured: true,
            emailConfigured: true,
            localAuthEnabled: true,
            nativeRegistrationValidation: true,
            nativePasswordLoginGuard: true,
            passwordResetValidation: true,
            registrationCodeGuard: true,
            passwordChangeAuthGuard: true,
            existingEmailVerificationAuthGuard: true,
            googleRedirectHost: target.hostname,
            googleRedirectUri: callback,
            anonymousSession: true,
            authExchangeGuard: true,
            emailValidation: true,
            readerCounts: true,
            siteFeedbackRoute: true,
            accountSyncAuthGuard: true,
          }));
          NODE
