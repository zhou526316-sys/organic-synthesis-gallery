name: One-time 13 Oct owner catchup safety regression
on:
  pull_request:
    paths:
      - 'scripts/lib/owner-one-time-catchup.mjs'
      - 'scripts/test-one-time-owner-catchup-20261013.mjs'
      - 'scripts/validate-pages-literature-authorization.mjs'
      - 'scripts/validate-production-literature-release-slot.mjs'
      - 'audit/owner-catchup/2026-10-13-title-decisions.json'
      - '.github/workflows/owner-catchup-20261013-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/owner-one-time-catchup.mjs'
      - 'scripts/test-one-time-owner-catchup-20261013.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check scripts/lib/owner-one-time-catchup.mjs
      - run: node scripts/test-one-time-owner-catchup-20261013.mjs
      - run: node scripts/test-pages-literature-authorization.mjs
      - run: node scripts/test-pages-release-delivery.mjs
      - run: node scripts/validate-pages-literature-authorization.mjs
