name: Mobile interaction regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-drawer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit for iPhone emulation
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Build Gallery
        run: npm run build

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gallery-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gallery-preview.log
          exit 1

      - name: Run 30-cycle mobile interaction smoke
        run: npx playwright test tests/mobile-interaction.spec.ts --reporter=line --workers=1
