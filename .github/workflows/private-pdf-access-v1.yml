name: Private PDF access v1 regression

on:
  push:
    branches: [feature/private-pdf-access-v1, main]
    paths:
      - 'cloudflare/schema.sql'
      - 'cloudflare/private-pdf-v1.sql'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/integrations.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-private-pdf.mjs'
      - 'src/private-pdf-access.ts'
      - 'src/bootstrap.ts'
      - 'public/private-pdf-owner-setup.html'
      - 'tests/private-pdf-access-browser.mjs'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/private-pdf-access-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/schema.sql'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/integrations.js'
      - 'cloudflare/worker/src/index.js'
      - 'src/private-pdf-access.ts'
      - 'src/bootstrap.ts'
      - 'public/private-pdf-owner-setup.html'
      - '.github/workflows/deploy-worker-frontend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Confirm unrelated production rules and media collector are untouched
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          echo "Scoped comparison base: $BASE"
          git diff --exit-code "$BASE" HEAD -- \
            PROJECT_RULES.md AGENTS.md shared/literature-journals.js audit/media-auto-policy.json \
            docs/literature-scope-contract.md docs/literature-update-protocol.md \
            .github/workflows/literature-audit.yml .github/workflows/github-pages.yml \
            .github/workflows/new-body-continuous.yml \
            public/papers.gz.b64 public/rolling-supplement.json cloudflare/worker/src/article-summary.js \
            cloudflare/worker/src/local-captures.js cloudflare/worker/src/media.js
          ! git diff "$BASE" HEAD -- . ':!audit/**' | grep -F 'wuliangdao@njfu.edu.cn'
          python - <<'PY'
          import pathlib, subprocess
          base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          before=subprocess.check_output(['git','show',f'{base}:public/toc-mainline.user.js'],text=True)
          after=pathlib.Path('public/toc-mainline.user.js').read_text()
          if before != after:
              start=after.find('  // Private PDF capture is an optional owner-only side channel.')
              end=after.find('  async function finishPairedJob(job,result,trace,token) {', start)
              if start < 0 or end < 0:
                  raise SystemExit('private PDF runtime markers missing')
              normalized=after[:start]+after[end:]
              hook_start=normalized.find("    try {\n      var privatePdfResult=await maybeCapturePrivatePdf(job,trace);")
              hook_end=normalized.find("    if(job.missingOnly&&result.figures&&result.figures.discovered>0)",hook_start)
              if hook_start < 0 or hook_end < 0:
                  raise SystemExit('private PDF finish hook markers missing')
              normalized=normalized[:hook_start]+normalized[hook_end:]
              normalized=normalized.replace('  installPrivatePdfLeaseReceiver();\n','',1)
              if normalized != before:
                  raise SystemExit('collector changed outside isolated private PDF side-channel')
          print('PRIVATE_PDF_COLLECTOR_SCOPE_OK')
          PY
          grep -F 'PRIVATE_PDF_CAPTURE_ENABLED = "0"' .github/workflows/deploy-worker-frontend.yml
          grep -F 'PRIVATE_PDF_PROCESSING_ENABLED = "0"' .github/workflows/deploy-worker-frontend.yml
      - name: Check Worker syntax and private PDF security contracts
        run: |
          node --check cloudflare/worker/src/private-pdf.js
          node --check cloudflare/worker/src/integrations.js
          node --check cloudflare/worker/src/index.js
          node cloudflare/worker/scripts/test-private-pdf.mjs
      - name: Validate full schema and isolated migration from scratch
        run: |
          sqlite3 /tmp/private-pdf-schema.db < cloudflare/schema.sql
          test "$(sqlite3 /tmp/private-pdf-schema.db "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_capabilities','private_pdf_documents','private_pdf_access_tokens');")" = "3"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/schema.sql
          sqlite3 /tmp/private-pdf-migration.db "DROP TABLE private_pdf_access_tokens; DROP TABLE private_pdf_documents; DROP TABLE user_capabilities;"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/private-pdf-v1.sql
          test "$(sqlite3 /tmp/private-pdf-migration.db "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_capabilities','private_pdf_documents','private_pdf_access_tokens');")" = "3"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/private-pdf-v1.sql
      - name: Build and typecheck frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/private-pdf-owner-setup.html
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify owner-only original-link routing and setup page
        run: node tests/private-pdf-access-browser.mjs
      - name: Dry-run Worker bundle without deployment
        working-directory: cloudflare/worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/private-pdf-worker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-pdf-access-v1-tested
          path: ${{ runner.temp }}/private-pdf-worker
          retention-days: 14
