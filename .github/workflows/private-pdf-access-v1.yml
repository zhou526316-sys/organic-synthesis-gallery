name: Private PDF access v1 regression

on:
  push:
    branches: [feature/private-pdf-access-v1, main]
    paths:
      - 'cloudflare/schema.sql'
      - 'cloudflare/private-pdf-v1.sql'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/integrations.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-private-pdf.mjs'
      - 'src/private-pdf-access.ts'
      - 'src/user-ui/library-shell.ts'
      - 'src/bootstrap.ts'
      - 'public/private-pdf-owner-setup.html'
      - 'pdf/**'
      - 'src/private-pdf-reader.mjs'
      - 'tests/private-pdf-access-browser.mjs'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/private-pdf-access-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/schema.sql'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/integrations.js'
      - 'cloudflare/worker/src/index.js'
      - 'src/private-pdf-access.ts'
      - 'src/user-ui/library-shell.ts'
      - 'src/bootstrap.ts'
      - 'public/private-pdf-owner-setup.html'
      - 'pdf/**'
      - 'src/private-pdf-reader.mjs'
      - 'tests/private-pdf-access-browser.mjs'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/private-pdf-access-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Confirm unrelated literature and release rules are untouched
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          echo "Scoped comparison base: $BASE"
          git diff --exit-code "$BASE" HEAD -- \
            PROJECT_RULES.md AGENTS.md shared/literature-journals.js audit/media-auto-policy.json \
            docs/literature-scope-contract.md docs/literature-update-protocol.md \
            .github/workflows/literature-audit.yml .github/workflows/github-pages.yml \
            .github/workflows/new-body-continuous.yml \
            public/papers.gz.b64 public/rolling-supplement.json
          ! git diff "$BASE" HEAD -- . ':!audit/**' | grep -F 'wuliangdao@njfu.edu.cn'
          # The owner explicitly approved changes to acquisition and to
          # evidence-inventory paging. Check private PDF authorization/capture
          # functions byte-for-byte rather than vetoing all source changes.
          python - <<'PY'
          import pathlib,re,subprocess
          base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          old=subprocess.check_output(['git','show',f'{base}:public/toc-mainline.user.js'],text=True)
          current=pathlib.Path('public/toc-mainline.user.js').read_text()
          def fun(code,name):
              m=re.search(r'^  (?:async )?function '+re.escape(name)+r'\(',code,re.M)
              assert m, 'private PDF function missing: '+name
              end=code.find('\n  }\n',m.start())
              assert end>=0, 'private PDF function incomplete: '+name
              return code[m.start():end+5]
          for name in ['privatePdfHostAllowed','discoverExplicitPdfCandidates','privatePdfBytesValid',
                       'waitForPrivatePdfCandidates','fetchExplicitPdf','uploadPrivatePdf']:
              assert fun(old,name)==fun(current,name),'Private PDF authorization or capture changed: '+name
          before=subprocess.check_output(['git','show',f'{base}:cloudflare/worker/src/article-summary.js'],text=True)
          after=pathlib.Path('cloudflare/worker/src/article-summary.js').read_text()
          start='export async function getArticleEvidenceInventory('
          suffix='\nexport const ARTICLE_EVIDENCE_SCHEMA_VERSION'
          assert start in before and start in after and suffix in before and suffix in after
          assert before[:before.index(start)]==after[:after.index(start)],'Other evidence/summary code changed'
          assert before[before.index(suffix):]==after[after.index(suffix):], 'Evidence schema exports changed'
          print('PRIVATE_PDF_PROTECTED_FUNCTIONS_AND_PAGED_EVIDENCE_SCOPE_OK')
          PY
          grep -F 'PRIVATE_PDF_CAPTURE_ENABLED = "1"' .github/workflows/deploy-worker-frontend.yml
          grep -F 'PRIVATE_PDF_PROCESSING_ENABLED = "1"' .github/workflows/deploy-worker-frontend.yml
      - name: Check Worker syntax and private PDF security contracts
        run: |
          node --check cloudflare/worker/src/private-pdf.js
          node --check cloudflare/worker/src/integrations.js
          node --check cloudflare/worker/src/index.js
          node cloudflare/worker/scripts/test-private-pdf.mjs
      - name: Validate full schema and isolated migration from scratch
        run: |
          sqlite3 /tmp/private-pdf-schema.db < cloudflare/schema.sql
          test "$(sqlite3 /tmp/private-pdf-schema.db "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_capabilities','private_pdf_documents','private_pdf_access_tokens');")" = "3"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/schema.sql
          sqlite3 /tmp/private-pdf-migration.db "DROP TABLE private_pdf_access_tokens; DROP TABLE private_pdf_documents; DROP TABLE user_capabilities;"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/private-pdf-v1.sql
          test "$(sqlite3 /tmp/private-pdf-migration.db "SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('user_capabilities','private_pdf_documents','private_pdf_access_tokens');")" = "3"
          sqlite3 /tmp/private-pdf-migration.db < cloudflare/private-pdf-v1.sql
      - name: Build and typecheck frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/private-pdf-owner-setup.html
          test -s dist/pdf/index.html
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify owner-only original-link routing and setup page
        env:
          PRIVATE_PDF_BROWSER_OUTPUT: ${{ runner.temp }}/gallery-private-pdf-test-results
          PRIVATE_PDF_BROWSER_SCOPE: owner
        run: node tests/private-pdf-access-browser.mjs
      - name: Upload private PDF browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-pdf-browser-verification
          path: ${{ runner.temp }}/gallery-private-pdf-test-results
          retention-days: 14
      - name: Dry-run Worker bundle without deployment
        working-directory: cloudflare/worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/private-pdf-worker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-pdf-access-v1-tested
          path: ${{ runner.temp }}/private-pdf-worker
          retention-days: 14
