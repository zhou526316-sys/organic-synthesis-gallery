name: Bridge Evidence v2 capture regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'cloudflare/worker/src/article-summary.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-article-summary.mjs'
      - 'src/user-ui/shared.ts'
      - 'src/user-ui/paper-actions.ts'
      - 'tests/summary-readable.spec.ts'
      - 'scripts/test-tm232-evidence-capture.mjs'
      - 'docs/summary-review-contract-v2.md'
      - '.github/workflows/tm232-evidence-capture.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax and Worker evidence contracts
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --check cloudflare/worker/src/article-summary.js
          node --check cloudflare/worker/src/index.js
          cd cloudflare/worker
          npm install --no-audit --no-fund
          npm run test:article-summary
          npm run check

      - name: Chromium Evidence Packet regression
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-tm232-evidence-capture.mjs | tee "$RUNNER_TEMP/tm232-evidence.log"
          grep -F 'TM234_EVIDENCE_TEST_SUMMARY ' "$RUNNER_TEMP/tm232-evidence.log"

      - name: Build exact Bridge 2.2.36 installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.36' public/gallery-vpn-bridge.user.js
          grep -F "var CONTROLLER_REVISION = '2.2.36';" public/gallery-vpn-bridge.user.js
          grep -F "var EVIDENCE_SCHEMA_VERSION = 'article-evidence-v2';" public/gallery-vpn-bridge.user.js
          grep -F 'EVIDENCE_INVENTORY_ENDPOINT' public/gallery-vpn-bridge.user.js
          grep -F 'evidenceBackfillJobs' public/gallery-vpn-bridge.user.js
          grep -F "abstract_only" public/gallery-vpn-bridge.user.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm236-evidence-tested
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
            ${{ runner.temp }}/tm232-evidence.log
          retention-days: 7
          if-no-files-found: warn
