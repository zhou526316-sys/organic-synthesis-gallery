name: User registration browser smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-registration-browser-smoke.yml'
  workflow_run:
    workflows:
      - Deploy GitHub Pages frontend
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-registration-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify native registration UI and request wiring
        env:
          SITE_URL: https://zhou526316-sys.github.io/organic-synthesis-gallery/
          SITE_ORIGIN: https://zhou526316-sys.github.io
          API_URL: https://api.gczhouwld.com/api/user-ui/auth/register
          API_FALLBACK_URL: https://organic-synthesis-gallery.zhou526316.workers.dev/api/user-ui/auth/register
          API_FALLBACK_ORIGIN: https://organic-synthesis-gallery.zhou526316.workers.dev
        run: |
          mkdir -p test-results
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            const requestFailures = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('requestfailed', request => requestFailures.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`));

            try {
              await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const shell = page.locator('gallery-user-shell').first();
              await shell.waitFor({ state: 'attached', timeout: 30000 });

              await shell.locator('.trigger').click();
              await shell.locator("[data-tab='login']").click();
              await shell.locator("[data-action='auth-mode:register']").click();

              const name = shell.locator('[data-local-name]');
              const email = shell.locator('[data-local-email]');
              const password = shell.locator('[data-local-password]');
              const submit = shell.locator('[data-native-auth-submit]');
              const notice = shell.locator('[data-auth-message]');

              await name.fill('Browser Smoke');
              await email.fill('bad@');
              await password.fill('12345678');
              await submit.click();

              await notice.waitFor({ state: 'visible', timeout: 5000 });
              assert(/^(邮箱格式不正确。|Invalid email address\.)$/.test((await notice.textContent())?.trim() || ''), `unexpected client validation: ${await notice.textContent()}`);
              assert(await submit.isEnabled(), 'register button stayed disabled after client validation');

              const corsProbe = await page.evaluate(async apiUrl => {
                try {
                  const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ email: 'not-an-email', password: '12345678', displayName: 'Probe' }),
                  });
                  return { status: response.status, body: await response.json() };
                } catch (error) {
                  return { status: 0, error: error instanceof Error ? error.message : String(error) };
                }
              }, process.env.API_URL);
              assert(corsProbe.status === 400 && corsProbe.body?.error === 'invalid_email', `real browser CORS/API probe failed: ${JSON.stringify(corsProbe)}`);

              let capturedRegistration = null;
              let capturedVerification = null;
              await page.route('https://api.gczhouwld.com/**', async route => {
                await route.abort('failed');
              });
              await page.route(`${process.env.API_FALLBACK_ORIGIN}/api/user-ui/auth/**`, async route => {
                const request = route.request();
                const url = new URL(request.url());
                const cors = {
                  'access-control-allow-origin': process.env.SITE_ORIGIN,
                  'access-control-allow-methods': 'GET, POST, OPTIONS',
                  'access-control-allow-headers': 'content-type, authorization',
                };
                if (request.method() === 'OPTIONS') {
                  await route.fulfill({ status: 204, headers: cors });
                  return;
                }
                if (url.pathname === '/api/user-ui/auth/register') {
                  capturedRegistration = JSON.parse(request.postData() || '{}');
                  await route.fulfill({
                    status: 202,
                    headers: { ...cors, 'content-type': 'application/json' },
                    body: JSON.stringify({
                      accepted: true,
                      verificationRequired: true,
                      challengeId: 'ch_browser_smoke',
                      expiresIn: 600,
                      resendAfter: 60,
                    }),
                  });
                  return;
                }
                if (url.pathname === '/api/user-ui/auth/register/verify') {
                  capturedVerification = JSON.parse(request.postData() || '{}');
                  await route.fulfill({
                    status: 201,
                    headers: { ...cors, 'content-type': 'application/json' },
                    body: JSON.stringify({
                      token: 'browser-smoke-token',
                      user: {
                        id: 'usr_browser_smoke',
                        displayName: 'Browser Smoke',
                        email: 'browser-smoke@example.invalid',
                        localAccount: true,
                        emailVerified: true,
                      },
                      expiresAt: Date.now() + 3600000,
                    }),
                  });
                  return;
                }
                if (url.pathname === '/api/user-ui/auth/password/reset/start') {
                  await route.fulfill({
                    status: 202,
                    headers: { ...cors, 'content-type': 'application/json' },
                    body: JSON.stringify({
                      accepted: true,
                      challengeId: 'ch_reset_smoke',
                      expiresIn: 600,
                      resendAfter: 60,
                    }),
                  });
                  return;
                }
                if (url.pathname === '/api/user-ui/auth/password/reset/confirm') {
                  await route.fulfill({
                    status: 200,
                    headers: { ...cors, 'content-type': 'application/json' },
                    body: JSON.stringify({ ok: true, reauthRequired: true }),
                  });
                  return;
                }
                if (url.pathname === '/api/user-ui/auth/session') {
                  await route.fulfill({
                    status: 200,
                    headers: { ...cors, 'content-type': 'application/json' },
                    body: JSON.stringify({ authenticated: false, user: null }),
                  });
                  return;
                }
                await route.continue();
              });

              await email.fill('browser-smoke@example.invalid');
              await submit.click();
              const codeInput = shell.locator('[data-register-code]');
              await codeInput.waitFor({ state: 'visible', timeout: 10000 });

              assert(capturedRegistration, 'registration POST was never emitted');
              assert(capturedRegistration.email === 'browser-smoke@example.invalid', `wrong registration email: ${JSON.stringify(capturedRegistration)}`);
              assert(capturedRegistration.password === '12345678', 'registration password payload missing');
              assert(capturedRegistration.displayName === 'Browser Smoke', `wrong display name: ${JSON.stringify(capturedRegistration)}`);

              await codeInput.fill('246810');
              await shell.locator('[data-register-code-form] button[type="submit"]').click();
              await shell.locator('.user-card').waitFor({ state: 'visible', timeout: 10000 });
              assert(capturedVerification?.challengeId === 'ch_browser_smoke', `wrong registration challenge: ${JSON.stringify(capturedVerification)}`);
              assert(capturedVerification?.code === '246810', `wrong verification code payload: ${JSON.stringify(capturedVerification)}`);
              assert((await shell.locator('.user-card').textContent())?.includes('Browser Smoke'), 'verified user card did not render');

              await page.evaluate(() => localStorage.removeItem('organic-gallery-session-v1'));
              await page.reload({ waitUntil: 'domcontentloaded' });
              const shell2 = page.locator('gallery-user-shell').first();
              await shell2.waitFor({ state: 'attached', timeout: 30000 });
              await shell2.locator('.trigger').click();
              await shell2.locator("[data-tab='login']").click();
              await shell2.locator("[data-action='forgot-password']").click();
              const resetEmail = shell2.locator('[data-reset-email]');
              await resetEmail.fill('browser-smoke@example.invalid');
              await shell2.locator('[data-reset-start-form] button[type="submit"]').click();
              const resetCode = shell2.locator('[data-reset-code]');
              await resetCode.waitFor({ state: 'visible', timeout: 10000 });
              await resetCode.fill('135790');
              await shell2.locator('[data-reset-new-password]').fill('New-Smoke-Password-123!');
              await shell2.locator('[data-reset-confirm-form] button[type="submit"]').click();
              await shell2.locator('[data-local-email]').waitFor({ state: 'visible', timeout: 10000 });
              const resetNotice = shell2.locator('[data-auth-message]');
              assert(/密码已重置|Password reset/i.test((await resetNotice.textContent()) || ''), `reset completion message missing: ${await resetNotice.textContent()}`);

              assert(pageErrors.length === 0, `uncaught browser errors: ${pageErrors.join(' | ')}`);

              console.log(JSON.stringify({
                nativeRegistrationForm: true,
                clientValidationVisible: true,
                productionCorsProbe: true,
                apiFallbackAfterNetworkFailure: true,
                registrationPostEmitted: true,
                registrationCodeStepVisible: true,
                registrationVerificationSubmitted: true,
                verifiedAccountRendered: true,
                passwordResetUiCompleted: true,
                pageErrors,
                consoleErrors: consoleErrors.slice(0, 20),
                requestFailures: requestFailures.slice(0, 20),
              }));
            } catch (error) {
              await page.screenshot({ path: 'test-results/registration-failure.png', fullPage: true }).catch(() => {});
              console.error('PAGE_ERRORS', JSON.stringify(pageErrors));
              console.error('CONSOLE_ERRORS', JSON.stringify(consoleErrors.slice(0, 50)));
              console.error('REQUEST_FAILURES', JSON.stringify(requestFailures.slice(0, 50)));
              throw error;
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-browser-smoke
          path: test-results/
          if-no-files-found: ignore
