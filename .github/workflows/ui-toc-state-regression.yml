name: Gallery TOC state regression (read-only fixtures)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.ts'
      - 'src/styles.css'
      - 'src/platform-api.ts'
      - 'scripts/test-gallery-media-routing.mjs'
      - 'tests/gallery-live-media.spec.ts'
      - '.github/workflows/ui-toc-state-regression.yml'
permissions:
  contents: read
jobs:
  toc-state:
    name: Visible missing/service TOC state (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install isolated frontend and WebKit fixtures
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock @playwright/test@1.55.1
          npx playwright install --with-deps webkit
      - name: Verify canonical media read-only adapter and TypeScript
        run: |
          node --test scripts/test-gallery-media-routing.mjs
          npx tsc --noEmit
      - name: Build frontend without modifying the literature publisher baseline
        run: npx vite build
      - name: Serve isolated built frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4174 --strictPort >/tmp/gallery-toc-state-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gallery-toc-state-preview.log
          exit 1
      - name: Verify three missing RSC TOCs, service recovery, and later images
        run: npx playwright test tests/gallery-live-media.spec.ts --browser=webkit --reporter=line --workers=1
      - name: Preserve failing browser trace only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-toc-state-browser-failure
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore
