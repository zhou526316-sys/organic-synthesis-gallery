name: Media target20 tail-flush workbench
on:
  push:
    branches: [feat/media-target20-tailflush]
    paths:
      - '.github/workflows/media-target20-tail-workbench.yml'
      - 'audit/media-auto-policy.json'
      - 'cloudflare/scripts/merge-new-body-auto.mjs'
      - 'scripts/test-new-body-auto.mjs'
      - '.github/workflows/new-body-continuous.yml'
      - 'docs/body-media-publication.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: media-target20-tail-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-target20-tailflush
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and batching policy
        run: |
          set -euo pipefail
          node --check cloudflare/scripts/merge-new-body-auto.mjs
          node --check scripts/test-new-body-auto.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('audit/media-auto-policy.json','utf8'));
          assert.equal(p.minNewArticles,20);
          assert.equal(p.maxNewArticles,25);
          assert.equal(p.tailFlushAfterMinutes,15);
          assert.equal(p.requireOfficialTocInBuild,true);
          const w=fs.readFileSync('.github/workflows/new-body-continuous.yml','utf8');
          assert.match(w,/cron:\s*'\*\/5 \* \* \* \*'/);
          console.log('TARGET20_TAIL_POLICY_OK');
          JS
          git diff --check
      - name: Extract frozen real marked-image fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,urllib.parse,urllib.request,zipfile
          class BoundRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if result is not None and urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(newurl).netloc:
                      result.remove_header('Authorization')
                  return result
          req=urllib.request.Request('https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery/actions/artifacts/10737978319/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(BoundRedirect()).open(req,timeout=40) as r: raw=r.read(32000001)
          assert len(raw)<=32000000
          assert hashlib.sha256(raw).hexdigest()=='d2ca8159ecdabb4ee21aa389f92f621de0c962eec657ba9514e31f584ded782c'
          z=zipfile.ZipFile(io.BytesIO(raw));ev=json.loads(z.read('evidence.json'));assert not ev['errors']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'auto-fixture';(out/'images').mkdir(parents=True)
          (out/'evidence.json').write_text(json.dumps(ev))
          for row in ev['images']:
              if row.get('reviewMarker',{}).get('revision')!='1': continue
              assert re.fullmatch(r'images/next-\d{3}\.(svg|png|webp)',row['file'])
              b=z.read(row['file']);assert hashlib.sha256(b).hexdigest()==row['sha256'];(out/row['file']).write_bytes(b)
          PY
      - name: Run real-byte and batching regressions
        env:
          BODY_AUTO_FIXTURE: ${{ runner.temp }}/auto-fixture
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-new-body-auto.mjs | tee "$RUNNER_TEMP/target20-tail-tests.log"
          grep -F 'NEW_BODY_AUTO_TESTS ' "$RUNNER_TEMP/target20-tail-tests.log"
          node scripts/test-reviewed-body.mjs
          node scripts/test-body-review-markers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-target20-tail-tested
          path: ${{ runner.temp }}/target20-tail-tests.log
          retention-days: 14
          if-no-files-found: warn
