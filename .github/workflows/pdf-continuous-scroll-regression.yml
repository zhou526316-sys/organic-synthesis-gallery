name: PDF continuous-scrolling isolated regression
on:
  push:
    branches:
      - feature/pdf-continuous-scroll-20261009
    paths:
      - 'src/pdf-continuous-viewer.mjs'
      - 'src/pdf-vault/reader.mjs'
      - 'src/pdf-vault/page.css'
      - 'src/private-pdf-reader.mjs'
      - 'pdf/index.html'
      - 'pdf-vault/index.html'
      - 'tests/private-pdf-access-browser.mjs'
      - 'tests/pdf-vault-local-browser.mjs'
      - '.github/workflows/pdf-continuous-scroll-regression.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-continuous-scroll-20261009
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build pdfjs-dist v6.4.299 continuous viewer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Browser test owner private PDF and local PDF library
        run: |
          node tests/private-pdf-access-browser.mjs
          node tests/pdf-vault-local-browser.mjs
