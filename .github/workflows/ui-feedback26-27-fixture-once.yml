name: Apply UI feedback fixture correction once
on:
  push:
    branches: [fix/ui-feedback-26-27-20260922]
    paths: ['.github/workflows/ui-feedback26-27-fixture-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-feedback-26-27-20260922
      - name: Add explicit media fixtures without changing production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('tests/mobile-interaction.spec.ts')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '98eed726998cbc91c2150f9e53474e26aafc38f8', 'Tests changed; re-review required'
          t = p.read_text()
          marker = "    // UI-only fixture for the unrelated live-capture endpoint; production capture code is unchanged."
          assert t.count(marker) == 1
          insert = """    // Static preview has no media backend. Keep these UI-only tests independent of
              // relative-endpoint redirects and reload cancellation in WebKit.
              await page.route('**/api/media/batch**', route => route.fulfill({
                status: 200,
                headers: { 'access-control-allow-origin': '*' },
                contentType: 'application/json',
                body: JSON.stringify({ items: [] }),
              }));
              await page.route('**/api/media/inventory**', route => route.fulfill({
                status: 200,
                headers: { 'access-control-allow-origin': '*' },
                contentType: 'application/json',
                body: JSON.stringify({ generatedAt: Date.now(), items: [] }),
              }));
          """
          t = t.replace(marker, insert + marker, 1)
          old = "      await page.screenshot({ path: testInfo.outputPath('status-color-persisted.png'), fullPage: false });"
          assert t.count(old) == 1
          t = t.replace(old, "      await statusButton.scrollIntoViewIfNeeded();\n" + old, 1)
          p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mobile-interaction.spec.ts
          git diff --cached --stat
          git commit -m 'test(ui): fixture local media APIs and capture visible persisted status'
          git push origin HEAD:fix/ui-feedback-26-27-20260922
