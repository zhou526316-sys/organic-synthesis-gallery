name: Verify immediate restart v3 live
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tm-controller-recovery-live.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact primary deployments and compare public installer bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const sourceSha='a3efa1d64d6dd71c3f774f49ae752ba236aad7ee';
          const expected='621f477f06dbca29629b0edf9098607c593024dcc54bb6d62084c64c3bc72e11';
          const report={readOnly:true,publisherRequests:0,mediaWrites:0,sourceSha,expectedInstallerSha256:expected,deployments:[],probes:[],errors:[],authenticatedDesktopVerified:false};
          const needed=['Deploy Worker frontend assets','Deploy GitHub Pages frontend'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<26;i++){
            const r=await fetch('https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery/actions/runs?head_sha='+sourceSha+'&event=push&per_page=30',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!r.ok){report.errors.push('runs_http_'+r.status);break;}
            const x=await r.json();report.deployments=(x.workflow_runs||[]).filter(v=>needed.includes(v.name)).map(v=>({name:v.name,id:v.id,status:v.status,conclusion:v.conclusion,headSha:v.head_sha}));
            if(report.deployments.length===2&&report.deployments.every(v=>v.status==='completed'))break;
            await sleep(15000);
          }
          async function probe(key,url){
            try{
              const r=await fetch(url+'?immediateRestart='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)}),text=await r.text();
              const v={key,url,status:r.status};
              if(key.includes('installer')){v.sha256=createHash('sha256').update(text).digest('hex');v.bytes=Buffer.byteLength(text);v.matchesTested=v.sha256===expected;v.marker=text.includes("var IMMEDIATE_RESTART_REVISION = '20261001-immediate-restart-v3';");v.panelMarker=text.includes('立即从头抓');v.version=(text.match(/@version\s+(\S+)/)||[])[1];}
              else if(r.ok){const x=JSON.parse(text);v.data={captureVersion:x.captureVersion,mediaControllerRevision:x.mediaControllerRevision,mediaGeneration:x.mediaGeneration,mode:x.mode};}
              return v;
            }catch(e){return {key,url,error:String(e.message).slice(0,180)};}
          }
          for(let attempt=0;attempt<3;attempt++){
            report.probes=await Promise.all([
              probe('canonical_installer','https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js'),
              probe('worker_installer','https://organic-synthesis-gallery.zhou526316.workers.dev/gallery-vpn-bridge.user.js'),
              probe('capabilities','https://api.gczhouwld.com/api/media/capture-capabilities')]);
            if(report.probes.slice(0,2).every(v=>v.matchesTested&&v.marker&&v.panelMarker))break;
            if(attempt<2)await sleep(15000);
          }
          const caps=report.probes.find(v=>v.key==='capabilities');
          report.passed=report.deployments.length===2&&report.deployments.every(v=>v.conclusion==='success')&&report.probes.slice(0,2).every(v=>v.status===200&&v.matchesTested&&v.marker&&v.panelMarker&&v.version==='2.2.52')&&caps?.status===200&&caps.data.captureVersion==='6.2.20'&&caps.data.mediaControllerRevision==='2.2.41'&&caps.data.mediaGeneration===1790082000000;
          report.verifiedAt=new Date().toISOString();
          console.log('IMMEDIATE_RESTART_LIVE',JSON.stringify(report));
          await writeFile(process.env.RUNNER_TEMP+'/immediate-restart-live.json',JSON.stringify(report,null,2));
          if(!report.passed)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immediate-restart-live
          path: ${{ runner.temp }}/immediate-restart-live.json
          retention-days: 14
