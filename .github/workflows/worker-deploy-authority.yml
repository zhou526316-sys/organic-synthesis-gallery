name: Worker deployment authority regression

on:
  push:
    branches: [fix/worker-deploy-authority-20261004, main]
    paths:
      - '.github/workflows/cloudflare-user-ui-release.yml'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/cloudflare-staging-deploy.yml'
      - '.github/workflows/worker-deploy-authority.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-user-ui-release.yml'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/cloudflare-staging-deploy.yml'
      - '.github/workflows/worker-deploy-authority.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22}

      - name: Verify maintenance workflow cannot deploy a partial Worker
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const maintenance=fs.readFileSync('.github/workflows/cloudflare-user-ui-release.yml','utf8');
          const canonical=fs.readFileSync('.github/workflows/deploy-worker-frontend.yml','utf8');
          const staging=fs.readFileSync('.github/workflows/cloudflare-staging-deploy.yml','utf8');
          const fail=(m)=>{throw new Error(m)};

          if (/npx\s+wrangler\s+deploy\b/.test(maintenance)) fail('user-schema maintenance must not deploy Worker code');
          if (/wrangler\s+secret\s+bulk[^\n]*--config/.test(maintenance)) fail('secret maintenance must not attach a partial wrangler config');
          if (!/wrangler\s+secret\s+bulk[^\n]*--name\s+organic-synthesis-gallery/.test(maintenance)) fail('named secret update missing');
          if (!maintenance.includes('Generate D1-only maintenance configuration')) fail('D1-only config marker missing');
          if (!maintenance.includes("! grep -Eq '^(main|\\[assets\\]|\\[vars\\]|\\[ai\\]|\\[triggers\\]|\\[\\[r2_buckets\\]\\])' wrangler.user-ui.toml")) fail('maintenance config deployability guard missing');

          const deploys=[...canonical.matchAll(/npx\s+wrangler\s+deploy\b[^\n]*--config\s+wrangler\.frontend\.toml/g)];
          if (deploys.length!==4) fail('canonical workflow must have dry-run, primary deploy, indexed-read rollback, and V3-write rollback');
          const indexedRollback=canonical.split('- name: Roll back literature indexed read on canary failure')[1]
            ?.split('- name: Preserve literature indexed read activation report')[0] || '';
          if (!indexedRollback.includes("if: steps.literature_index_read_canary.outcome == 'failure'")) fail('indexed-read rollback must be failure-only');
          if ((indexedRollback.match(/npx\s+wrangler\s+deploy\b[^\n]*--config\s+wrangler\.frontend\.toml/g)||[]).length!==1) fail('indexed-read rollback must contain exactly one deploy');

          const libraryRollback=canonical.split('- name: Roll back V3 write activation on authority/canary failure')[1]
            ?.split('- name: Clean up isolated V3 write canary account')[0] || '';
          if (!libraryRollback.includes("steps.user_library_v3_shadow.outcome == 'failure' || steps.user_library_v3_write_canary.outcome == 'failure'")) fail('V3-write rollback must require authority or canary failure');
          if ((libraryRollback.match(/npx\s+wrangler\s+deploy\b[^\n]*--config\s+wrangler\.frontend\.toml/g)||[]).length!==1) fail('V3-write rollback must contain exactly one deploy');
          for (const required of [
            'Canonical production Worker deployment authority',
            'PDF_R2_BUCKET: organic-synthesis-gallery-private-pdf',
            'binding = "PDF_PRIVATE"',
            'PRIVATE_PDF_READ_ENABLED = "1"',
            'PRIVATE_PDF_CAPTURE_ENABLED = "1"',
            'PRIVATE_PDF_PROCESSING_ENABLED = "0"',
            'EVIDENCE_INDEX_SHADOW_ENABLED = "1"',
            'Advance and reconcile Evidence Index shadow',
            "readPathActive!==false",
            'Verify user library V3 write activation preflight',
            'Verify V3 write activation with isolated account',
            'Roll back V3 write activation on authority/canary failure',
            'Verify canonical Worker bindings survived deployment and secret sync'
          ]) if (!canonical.includes(required)) fail('canonical workflow missing '+required);

          if (/^\s*push:\s*$/m.test(staging)) fail('staging workflow must never auto-run on main push');
          for (const required of [
            'D1_NAME: organic-synthesis-gallery-staging',
            'R2_BUCKET: organic-synthesis-gallery-media-staging',
            'STAGING_URL: https://organic-synthesis-gallery-staging.zhou526316.workers.dev',
            'secrets.STAGING_BRIDGE_WRITE_TOKEN',
            'name = "organic-synthesis-gallery-staging"',
            "Refusing non-staging D1",
            "Refusing non-staging R2",
            "Refusing non-staging Worker URL"
          ]) if (!staging.includes(required)) fail('staging isolation missing '+required);
          if (/^\s*D1_NAME:\s*organic-synthesis-gallery\s*$/m.test(staging)) fail('staging points at production D1');
          if (/^\s*R2_BUCKET:\s*organic-synthesis-gallery-media\s*$/m.test(staging)) fail('staging points at production R2');
          if (/^\s*STAGING_URL:\s*https:\/\/organic-synthesis-gallery\.zhou526316\.workers\.dev\s*$/m.test(staging)) fail('staging points at production Worker');

          console.log(JSON.stringify({
            maintenanceDeploysWorker:false,namedSecretUpdate:true,canonicalConfigChecks:true,
            stagingManualOnly:true,stagingResourcesIsolated:true
          }));
          NODE

      - name: Verify installed Wrangler supports name-only secret updates
        working-directory: cloudflare/worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler secret bulk --help > /tmp/secret-bulk-help.txt
          grep -q -- '--name' /tmp/secret-bulk-help.txt
          grep -q -- '--config' /tmp/secret-bulk-help.txt
          echo 'WRANGLER_NAME_ONLY_SECRET_UPDATE_SUPPORTED'

      - name: Confirm PDF/media/literature rules are outside this change
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          git diff --exit-code "$BASE" HEAD -- \
            public/toc-mainline.user.js \
            cloudflare/worker/src/article-summary.js cloudflare/worker/src/local-captures.js cloudflare/worker/src/media.js \
            public/papers.gz.b64 public/rolling-supplement.json shared/literature-journals.js \
            docs/literature-scope-contract.md docs/literature-update-protocol.md \
            .github/workflows/literature-audit.yml .github/workflows/new-body-continuous.yml \
            audit/media-auto-policy.json
          git diff --exit-code "$BASE" HEAD -- cloudflare/worker/src/private-pdf.js -- . ':!cloudflare/worker/src/private-pdf.js' || true
          node - <<'NODE'
          const fs=require('fs'), cp=require('child_process');
          const base=cp.execFileSync('git',['merge-base','HEAD','origin/main'],{encoding:'utf8'}).trim();
          const before=cp.execFileSync('git',['show',base+':cloudflare/worker/src/private-pdf.js'],{encoding:'utf8'});
          const after=fs.readFileSync('cloudflare/worker/src/private-pdf.js','utf8');
          const normalize=s=>s.replace(/const BOOTSTRAP_HASH = '[a-f0-9]{64}';/,"const BOOTSTRAP_HASH = '[rotated]';");
          if(normalize(before)!==normalize(after)) throw new Error('private-pdf.js changed beyond bootstrap hash rotation');
          console.log('PRIVATE_PDF_HASH_ONLY_CHANGE_OK');
          NODE
