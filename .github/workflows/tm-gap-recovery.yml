name: Tampermonkey gap recovery regression
on:
  push:
    branches: [fix/tm-gap-recovery-20261008]
    paths:
      - public/toc-mainline.user.js
      - cloudflare/scripts/build-bridge-loader.mjs
      - scripts/validate-tm220-artifacts.mjs
      - tests/tm-gap-recovery.test.mjs
      - tests/tm-missing-only.test.mjs
      - tests/tm-queue-coverage.test.mjs
      - tests/tm-manual-resume.test.mjs
      - tests/tm-throughput-truth.test.mjs
      - .github/workflows/tm-gap-recovery.yml
permissions:
  contents: read
concurrency:
  group: tm-gap-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify provenance, full routes and figure-gap continuity
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --test tests/tm-gap-recovery.test.mjs
          node tests/tm-missing-only.test.mjs
          node tests/tm-queue-coverage.test.mjs
          node --test tests/tm-throughput-truth.test.mjs
          node --test tests/tm-inventory-startup.test.mjs
          node tests/tm-controller-recovery.test.mjs
          node tests/tm-manual-resume.test.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
      - name: Build Bridge 2.2.67
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.67' public/gallery-vpn-bridge.user.js
          grep -F "var INSTALL_REVISION = '6.2.48';" public/gallery-vpn-bridge.user.js
          grep -F "GAP_RECOVERY_REVISION = '20261008-gap-recovery-v1'" public/gallery-vpn-bridge.user.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-gap-recovery-evidence
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
          retention-days: 7
