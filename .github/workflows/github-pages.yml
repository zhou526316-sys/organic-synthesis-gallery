name: Deploy GitHub Pages frontend
on:
  workflow_call:
    inputs:
      deployment_ref:
        description: Exact commit SHA/ref to deploy when called by another workflow
        required: false
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PAGES_REFRESH'
      - '.github/workflows/github-pages.yml'
      - 'cloudflare/scripts/build-cloudflare-bridge.mjs'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'cloudflare/scripts/build-pages-mirror.mjs'
      - 'cloudflare/scripts/merge-worker-media.mjs'
      - 'cloudflare/scripts/merge-local-captures.mjs'
      - 'cloudflare/scripts/merge-pmc-open-media.mjs'
      - 'cloudflare/scripts/merge-nature-figure-fallbacks.mjs'
      - 'cloudflare/scripts/prune-media-mirror.mjs'
      - 'cloudflare/scripts/verify-static-media-integrity.mjs'
      - 'cloudflare/scripts/sanitize-static-media.mjs'
      - 'cloudflare/scripts/merge-curated-pages.mjs'
      - 'cloudflare/scripts/new-body-auto-validation.mjs'
      - 'cloudflare/scripts/merge-new-body-auto.mjs'
      - 'audit/media-auto-policy.json'
      - 'audit/toc-gap-dois-2026-09-16.json'
      - 'audit/visual-gap-dois-2026-09-16.json'
      - 'public/curated-supplement.json'
      - 'public/automation-supplement.json'
      - 'shared/literature-policy.js'
      - 'scripts/validate-production-literature-release-slot.mjs'
      - 'scripts/validate-pages-literature-authorization.mjs'
      - 'scripts/test-pages-literature-authorization.mjs'
      - 'scripts/validate-tm220-artifacts.mjs'
      - 'scripts/build-share-pages.mjs'
      - 'public/share-default.png'
      - 'public/CNAME'
      - 'audit/publication-release-state.json'
      - 'public/rolling-supplement.json'
      - 'public/toc-demand-live.json'
      - 'public/toc-mainline.user.js'
      - 'audit/author-coverage.json'
      - 'audit/missing-authors.json'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'public/toc-rescue.js'
      - 'public/site-stats.html'
      - 'public/support/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  literature_authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment commit and release history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_ref != '' && inputs.deployment_ref || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test literature deployment authorization
        run: node scripts/test-pages-literature-authorization.mjs
      - name: Enforce fixed literature publication slot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-pages-literature-authorization.mjs | tee "$RUNNER_TEMP/pages-literature-authorization.json"
      - name: Preserve deployment authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-literature-authorization
          path: ${{ runner.temp }}/pages-literature-authorization.json
          if-no-files-found: warn
          retention-days: 14
  build:
    needs: literature_authorization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_ref != '' && inputs.deployment_ref || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify repository-owned literature baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s public/papers.gz.b64
          test -s public/total-synthesis.json
          test -s public/manual-supplement.json
          test -s public/final-audit-supplement.json
      - name: Generate GitHub Pages VPN Bridge
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs
      - name: Package self-contained VPN Bridge runtime
        env:
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
          BRIDGE_RUNTIME_OUTPUT: public/gallery-vpn-bridge-runtime.js
        run: node cloudflare/scripts/build-bridge-loader.mjs
      - name: Mirror media and metadata for static Pages
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/build-pages-mirror.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          if [ "$status" -eq 2 ]; then echo "Media mirror reported isolated misses; continuing to strict artifact verification."; fi
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          PAGES_MEDIA_FALLBACK: https://zhou526316-sys.github.io/organic-synthesis-gallery
          PAGES_MEDIA_CONCURRENCY: '8'
          MEDIA_REBUILD_LOCKDOWN: '1'
      - name: Merge current Worker media into static snapshot
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/merge-worker-media.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then echo "Worker media merge unavailable; preserving snapshot until strict artifact verification."; fi
          node cloudflare/scripts/prune-media-mirror.mjs
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          WORKER_MEDIA_CONCURRENCY: '6'
      - name: Merge D1-free local VPN captures
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/merge-local-captures.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          if [ "$status" -eq 2 ]; then echo "Local capture merge had isolated failures; preserving successful captures."; fi
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
      - name: Skip PMC open-media fallbacks during rebuild
        run: echo "PMC fallback disabled during media rebuild."
      - name: Skip Springer Nature Figure 1 fallbacks during rebuild
        run: echo "Springer Nature fallback disabled during media rebuild."
      - name: Merge assistant-audited literature and bilingual titles
        run: node cloudflare/scripts/merge-curated-pages.mjs
      - name: Independently validate newly marked body captures without blocking literature deployment
        id: auto_body_validation
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node cloudflare/scripts/merge-new-body-auto.mjs
      - name: Report deferred automatic body-media validation
        if: steps.auto_body_validation.outcome == 'failure'
        run: echo "::warning::Automatic body-media validation failed and was deferred to the Tampermonkey/VPN Bridge media line; literature cards and Pages deployment continue."
      - name: Preserve automatic media validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-body-auto-validation
          path: |
            public/auto-body-status.json
            public/auto-body-publication.json
          retention-days: 14
          if-no-files-found: warn
      - name: Sanitize invalid static media
        run: node cloudflare/scripts/sanitize-static-media.mjs
      - name: Verify media-index asset integrity
        run: node cloudflare/scripts/verify-static-media-integrity.mjs
      - name: Build static Gallery
        run: npm run build
      - name: Verify self-contained artifact
        shell: bash
        run: |
          set -euo pipefail
          for name in index.html CNAME papers.gz.b64 total-synthesis.json manual-supplement.json final-audit-supplement.json media-index.json literature-supplement.json title-translations-zh.json paper-title-resolutions.json gallery-vpn-bridge.user.js gallery-vpn-bridge-runtime.js toc-rescue.js toc-mainline.user.js; do test -f "dist/$name"; done
          test -d dist/media-mirror
          node scripts/validate-tm220-artifacts.mjs dist
          grep -F "gallery-literature-doi-registry" src/main.ts
          grep -F "readOnly: true" cloudflare/scripts/build-live-toc-demand-queue.mjs
          grep -F "payload?.readOnly !== true" cloudflare/worker/src/media.js
          grep -F "TAMPERMONKEY_CORS_WRITE_PATHS" cloudflare/worker/src/index.js
          grep -F "// @updateURL    https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://pubs.acs.org/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://onlinelibrary.wiley.com/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://pubs.rsc.org/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @grant        GM_openInTab" dist/gallery-vpn-bridge.user.js
          grep -F "const VERSION = '1.2.0';" dist/gallery-vpn-bridge-runtime.js
          grep -F "const API_BASE = 'https://organic-synthesis-gallery-public.pages.dev';" dist/gallery-vpn-bridge-runtime.js
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/media-index.json', 'utf8'));
          const items = Object.values(manifest.items || {});
          const remote = JSON.stringify(manifest).match(/https:\/\/organic-synthesis-gallery\.zhou526316\.workers\.dev\/media\//g) || [];
          const figures = items.reduce((sum, item) => sum + (item?.figures?.figures?.length || 0), 0);
          const pmcFallbacks = items.filter(item => item?.toc?.sourceRepository === 'PMC');
          const natureFallbacks = items.filter(item => item?.toc?.sourceRepository === 'Springer Nature' && item?.toc?.reason === 'figure1_fallback');
          if (pmcFallbacks.length) throw new Error('PMC fallback must remain disabled during rebuild');
          if (natureFallbacks.length) throw new Error('Nature fallback must remain disabled during rebuild');
          if (remote.length) throw new Error('media-index still contains workers.dev media URLs');
          const requiredDois = ['10.1038/s41467-026-77774-9','10.1021/jacs.6c15393','10.1021/acs.orglett.6c03266','10.1021/acscatal.6c05029','10.1002/anie.5041475','10.1038/s41467-026-77715-6'];
          const supplement = JSON.parse(fs.readFileSync('dist/literature-supplement.json', 'utf8'));
          const supplementDois = new Set((supplement.papers || []).map(p => String(p.doi || '').toLowerCase()));
          const mandatory = JSON.parse(fs.readFileSync('dist/final-audit-supplement.json', 'utf8'));
          const mandatoryDois = new Set((mandatory.papers || []).map(p => String(p.doi || '').toLowerCase()));
          for (const doi of requiredDois) {
            if (!supplementDois.has(doi)) throw new Error('curated DOI missing from supplement: '+doi);
            if (!mandatoryDois.has(doi)) throw new Error('curated DOI missing from mandatory cards: '+doi);
          }
          const translations = JSON.parse(fs.readFileSync('dist/title-translations-zh.json', 'utf8'));
          const zh = new Map((translations.translations || []).map(x => [x.title, x.zh]));
          if (!zh.get('Visible light-induced oxygen atom transfer into C−Cl bond of acyl chlorides for homolytic cleavage')) throw new Error('curated Chinese title missing');
          if (!zh.get('Scalable Total Syntheses of Nonthmicin and Ecteinamycin Reveal a Dual Antibacterial and Antitoxin Profile against Clostridioides difficile')) throw new Error('second-batch Chinese title missing');
          console.log(JSON.stringify({manifestItems:items.length,figures,curatedSupplement:true,mandatoryCurated:true,repositoryBaseline:true,bridgeLoader:true,bridgeRuntime:true}));
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [literature_authorization, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed search filtering CSS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node - <<'NODE'
          const site=process.env.SITE_URL;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const marker=/\.card\[hidden\]\{display:none!important\}/;
          for(let attempt=0;attempt<10;attempt++){
            try{
              const res=await fetch(site+'?search-css-smoke='+Date.now(),{headers:{'cache-control':'no-cache'}});
              const html=await res.text();
              const hrefs=[...html.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["']/g)].map(m=>new URL(m[1],site).href);
              const css=(await Promise.all(hrefs.map(async href=>{const r=await fetch(href+(href.includes('?')?'&':'?')+'smoke='+Date.now(),{headers:{'cache-control':'no-cache'}});return r.ok?r.text():'';}))).join('\n');
              if(marker.test(css)){console.log(JSON.stringify({searchFilteringCss:true,stylesheets:hrefs.length,site}));process.exit(0);}
            }catch(error){console.warn(String(error));}
            await sleep(3000);
          }
          throw new Error('deployed CSS is missing .card[hidden]{display:none!important}');
          NODE
