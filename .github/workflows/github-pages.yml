name: Deploy GitHub Pages frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PAGES_REFRESH'
      - '.github/workflows/github-pages.yml'
      - 'cloudflare/scripts/build-cloudflare-bridge.mjs'
      - 'cloudflare/scripts/build-pages-mirror-v2.mjs'
      - 'cloudflare/scripts/annotate-media-inventory.mjs'
      - 'cloudflare/scripts/merge-curated-pages.mjs'
      - 'cloudflare/scripts/snapshot-production-static.mjs'
      - 'cloudflare/scripts/sync-curated-cloudflare.mjs'
      - 'public/curated-supplement.json'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot current literature files
        run: node cloudflare/scripts/snapshot-production-static.mjs

      - name: Sync curated literature into Cloudflare repair queue
        env:
          GALLERY_BACKEND: https://organic-synthesis-gallery.zhou526316.workers.dev
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: node cloudflare/scripts/sync-curated-cloudflare.mjs

      - name: Generate GitHub Pages VPN Bridge
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery.zhou526316.workers.dev
          TARGET_SITE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Mirror live D1 media and metadata for static Pages
        run: node cloudflare/scripts/build-pages-mirror-v2.mjs
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          PAGES_MEDIA_CONCURRENCY: '8'

      - name: Annotate strict TOC versus figure fallback state
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
        run: node cloudflare/scripts/annotate-media-inventory.mjs

      - name: Merge assistant-audited literature and bilingual titles
        run: node cloudflare/scripts/merge-curated-pages.mjs

      - name: Build static Gallery
        run: npm run build

      - name: Verify self-contained artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/media-index.json
          test -f dist/literature-supplement.json
          test -f dist/title-translations-zh.json
          test -f dist/paper-title-resolutions.json
          test -f dist/gallery-vpn-bridge.user.js
          test -d dist/media-mirror
          grep -F "// @version      1.0.1" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://zhou526316-sys.github.io/organic-synthesis-gallery/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @connect      organic-synthesis-gallery.zhou526316.workers.dev" dist/gallery-vpn-bridge.user.js
          grep -R -F 'gallery-hires-viewer' dist/assets >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/media-index.json', 'utf8'));
          const items = Object.values(manifest.items || {});
          const remote = JSON.stringify(manifest).match(/https:\/\/organic-synthesis-gallery\.zhou526316\.workers\.dev\/media\//g) || [];
          const figures = items.reduce((sum, item) => sum + (item?.figures?.figures?.length || 0), 0);
          const realToc = items.filter(item => item?.inventory?.tocStored === true).length;
          const fallback = items.filter(item => item?.inventory?.tocMissing === true && Number(item?.inventory?.figureCount || 0) > 0).length;
          if (!items.length) throw new Error('media-index is empty');
          if (remote.length) throw new Error(`media-index still contains ${remote.length} workers.dev media URLs`);
          if (!items.every(item => item.inventory && typeof item.inventory.status === 'string')) throw new Error('strict media inventory annotation missing');
          const supplement = JSON.parse(fs.readFileSync('dist/literature-supplement.json', 'utf8'));
          const dois = new Set((supplement.papers || []).map(p => String(p.doi || '').toLowerCase()));
          if (!dois.has('10.1038/s41467-026-77774-9')) throw new Error('curated literature supplement was not merged');
          const translations = JSON.parse(fs.readFileSync('dist/title-translations-zh.json', 'utf8'));
          if (!(translations.translations || []).some(x => x.title === 'Visible light-induced oxygen atom transfer into C−Cl bond of acyl chlorides for homolytic cleavage' && x.zh)) throw new Error('curated Chinese title was not merged');
          console.log(JSON.stringify({ manifestItems: items.length, realToc, fallback, figures, curatedSupplement: true }));
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
