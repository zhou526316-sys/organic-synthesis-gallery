name: Deploy GitHub Pages frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PAGES_REFRESH'
      - '.github/workflows/github-pages.yml'
      - 'cloudflare/scripts/build-cloudflare-bridge.mjs'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'cloudflare/scripts/build-pages-mirror.mjs'
      - 'cloudflare/scripts/merge-worker-media.mjs'
      - 'cloudflare/scripts/merge-local-captures.mjs'
      - 'cloudflare/scripts/merge-pmc-open-media.mjs'
      - 'cloudflare/scripts/merge-nature-figure-fallbacks.mjs'
      - 'cloudflare/scripts/prune-media-mirror.mjs'
      - 'cloudflare/scripts/verify-static-media-integrity.mjs'
      - 'cloudflare/scripts/sanitize-static-media.mjs'
      - 'cloudflare/scripts/merge-curated-pages.mjs'
      - 'audit/toc-gap-dois-2026-09-16.json'
      - 'audit/visual-gap-dois-2026-09-16.json'
      - 'public/curated-supplement.json'
      - 'public/automation-supplement.json'
      - 'public/toc-demand-live.json'
      - 'public/toc-mainline.user.js'
      - 'audit/author-coverage.json'
      - 'audit/missing-authors.json'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'public/toc-rescue.js'
      - 'public/support/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify repository-owned literature baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s public/papers.gz.b64
          test -s public/total-synthesis.json
          test -s public/manual-supplement.json
          test -s public/final-audit-supplement.json

      - name: Generate GitHub Pages VPN Bridge
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Package self-contained VPN Bridge runtime
        env:
          TARGET_SITE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
          BRIDGE_UPDATE_ORIGIN: https://zhou526316-sys.github.io/organic-synthesis-gallery
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
          BRIDGE_RUNTIME_OUTPUT: public/gallery-vpn-bridge-runtime.js
        run: node cloudflare/scripts/build-bridge-loader.mjs

      - name: Mirror media and metadata for static Pages
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/build-pages-mirror.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 2 ]; then
            echo "Media mirror reported isolated misses; continuing to strict artifact verification."
          fi
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          PAGES_MEDIA_FALLBACK: https://zhou526316-sys.github.io/organic-synthesis-gallery
          PAGES_MEDIA_CONCURRENCY: '8'

      - name: Merge current Worker media into static snapshot
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/merge-worker-media.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Worker media merge unavailable; preserving the mirrored/published media snapshot and continuing to strict artifact verification."
          fi
          node cloudflare/scripts/prune-media-mirror.mjs
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
          WORKER_MEDIA_CONCURRENCY: '6'

      - name: Merge D1-free local VPN captures
        shell: bash
        run: |
          set +e
          node cloudflare/scripts/merge-local-captures.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 2 ]; then
            echo "Local capture merge had isolated failures; preserving successful captures."
          fi
        env:
          GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev

      - name: Merge redistributable PMC open-media fallbacks
        run: node cloudflare/scripts/merge-pmc-open-media.mjs
        env:
          PMC_MEDIA_CONCURRENCY: '2'
          PMC_REQUEST_DELAY_MS: '180'

      - name: Merge Springer Nature Figure 1 fallbacks
        run: node cloudflare/scripts/merge-nature-figure-fallbacks.mjs
        env:
          NATURE_FIGURE_CONCURRENCY: '3'
          NATURE_FIGURE_REQUEST_DELAY_MS: '180'

      - name: Merge assistant-audited literature and bilingual titles
        run: node cloudflare/scripts/merge-curated-pages.mjs

      - name: Sanitize invalid static media
        run: node cloudflare/scripts/sanitize-static-media.mjs

      - name: Verify media-index asset integrity
        run: node cloudflare/scripts/verify-static-media-integrity.mjs

      - name: Build static Gallery
        run: npm run build

      - name: Verify self-contained artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/papers.gz.b64
          test -f dist/total-synthesis.json
          test -f dist/manual-supplement.json
          test -f dist/final-audit-supplement.json
          test -f dist/media-index.json
          test -f dist/literature-supplement.json
          test -f dist/title-translations-zh.json
          test -f dist/paper-title-resolutions.json
          test -f dist/gallery-vpn-bridge.user.js
          test -f dist/gallery-vpn-bridge-runtime.js
          test -f dist/toc-rescue.js
          test -f dist/toc-mainline.user.js
          grep -F "// @version      6.2.6" dist/toc-mainline.user.js
          grep -F "toc-demand-live.json" dist/toc-mainline.user.js
          grep -F "/api/media/tampermonkey-report/import" dist/toc-mainline.user.js
          grep -F "async function iframeCandidates(job, trace)" dist/toc-mainline.user.js
          grep -F "function waitForDomMutation(timeoutMs)" dist/toc-mainline.user.js
          grep -F "object[type^=\"image\"],svg image" dist/toc-mainline.user.js
          grep -F "iframe_cross_origin_or_auth_redirect" dist/toc-mainline.user.js
          grep -F "_semantic_window" dist/toc-mainline.user.js
          grep -F "acs_main_scroll_top=" dist/toc-mainline.user.js
          grep -F "中止当前 TOC 批次" dist/toc-mainline.user.js
          grep -F "继续 TOC 主线" dist/toc-mainline.user.js
          grep -F "上传本地 TOC 日志" dist/toc-mainline.user.js
          grep -F "@connect      acs.silverchair-cdn.com" dist/toc-mainline.user.js
          grep -F "candidateRequestUrl" dist/toc-mainline.user.js
          grep -F "candidateBelongsToJob" dist/toc-mainline.user.js
          grep -F "captureBelongsToDoi" cloudflare/worker/src/local-captures.js
          grep -F "currentSrc" dist/toc-mainline.user.js
          grep -F "sanitizeTraceMessage" dist/toc-mainline.user.js
          grep -F "sanitizeTraceMessage" cloudflare/worker/src/local-captures.js
          grep -F "publisher_userscript_not_running" dist/toc-mainline.user.js
          grep -F "publisher_userscript_running_job_not_seen" dist/toc-mainline.user.js
          grep -F "查看出版社脚本心跳" dist/toc-mainline.user.js
          grep -F "publisher_script_started" dist/toc-mainline.user.js
          grep -F "CAPTURE_INDEX_URL" dist/toc-mainline.user.js
          grep -F "figure1_deferred" dist/toc-mainline.user.js
          grep -F "heartbeatDeadlineMs = 35000" dist/toc-mainline.user.js
          grep -F "action/doSearch?AllField=" dist/toc-mainline.user.js
          grep -F "LIVE_CAPTURE_INDEX_URL" dist/toc-rescue.js
          grep -F "fetchPostJson" dist/toc-mainline.user.js
          grep -F "gm_then_fetch_failed:" dist/toc-mainline.user.js
          grep -F "TAMPERMONKEY_CORS_WRITE_PATHS" cloudflare/worker/src/index.js
          test -d dist/media-mirror
          grep -F "// @version      2.2.6" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://zhou526316-sys.github.io/organic-synthesis-gallery/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://organic-synthesis-gallery-public.pages.dev/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @updateURL    https://zhou526316-sys.github.io/organic-synthesis-gallery/gallery-vpn-bridge.user.js" dist/gallery-vpn-bridge.user.js
          grep -F "// @connect      *" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://pubs.acs.org/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://onlinelibrary.wiley.com/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @match        https://pubs.rsc.org/*" dist/gallery-vpn-bridge.user.js
          grep -F "// @grant        GM_openInTab" dist/gallery-vpn-bridge.user.js
          grep -F "organicGalleryCloudflareBridgeWriteToken" dist/gallery-vpn-bridge.user.js
          grep -F "__OSG_TOC_BROWSER_MAINLINE__" dist/gallery-vpn-bridge.user.js
          grep -F "toc-demand-live.json" dist/gallery-vpn-bridge.user.js
          grep -F "VPN Bridge 2.2.6 · 正在启动 Runtime" dist/gallery-vpn-bridge.user.js
          grep -F "const VERSION = '1.2.0';" dist/gallery-vpn-bridge.user.js
          grep -F "const API_BASE = 'https://organic-synthesis-gallery-public.pages.dev';" dist/gallery-vpn-bridge.user.js
          if grep -Eq "\beval\s*\(" dist/gallery-vpn-bridge.user.js; then echo "Bridge userscript must not use eval"; exit 1; fi
          grep -F "const VERSION = '1.2.0';" dist/gallery-vpn-bridge-runtime.js
          grep -F "const API_BASE = 'https://organic-synthesis-gallery-public.pages.dev';" dist/gallery-vpn-bridge-runtime.js
          grep -F "abstract\\s*image" dist/gallery-vpn-bridge-runtime.js
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/media-index.json', 'utf8'));
          const items = Object.values(manifest.items || {});
          const remote = JSON.stringify(manifest).match(/https:\/\/organic-synthesis-gallery\.zhou526316\.workers\.dev\/media\//g) || [];
          const figures = items.reduce((sum, item) => sum + (item?.figures?.figures?.length || 0), 0);
          const pmcFallbacks = items.filter(item => item?.toc?.sourceRepository === 'PMC');
          const natureFallbacks = items.filter(item => item?.toc?.sourceRepository === 'Springer Nature' && item?.toc?.reason === 'figure1_fallback');
          if (items.length < 382) throw new Error(`media-index regressed below preserved baseline: ${items.length}`);
          if (figures < 652) throw new Error(`figure metadata regressed below preserved baseline: ${figures}`);
          if (remote.length) throw new Error(`media-index still contains ${remote.length} workers.dev media URLs`);
          if (natureFallbacks.length < 12) console.warn(`Springer Nature fallback count below historical reference (soft warning): ${natureFallbacks.length}`);
          for (const item of pmcFallbacks) {
            if (!String(item?.toc?.imageUrl || '').startsWith('open-media-mirror/')) throw new Error(`PMC fallback was not mirrored locally: ${item?.doi || 'unknown DOI'}`);
          }
          for (const item of natureFallbacks) {
            const imageUrl = String(item?.toc?.imageUrl || '');
            const localMirror = imageUrl.startsWith('media-mirror/');
            const springerCdn = /^https:\/\/media\.springernature\.com\//.test(imageUrl);
            if (!localMirror && !springerCdn) throw new Error(`Nature fallback has neither a local mirror nor a Springer Nature CDN URL: ${item?.doi || 'unknown DOI'}`);
          }

          const requiredDois = [
            '10.1038/s41467-026-77774-9',
            '10.1021/jacs.6c15393',
            '10.1021/acs.orglett.6c03266',
            '10.1021/acscatal.6c05029',
            '10.1002/anie.5041475',
            '10.1038/s41467-026-77715-6',
          ];
          const supplement = JSON.parse(fs.readFileSync('dist/literature-supplement.json', 'utf8'));
          const supplementDois = new Set((supplement.papers || []).map(p => String(p.doi || '').toLowerCase()));
          const mandatory = JSON.parse(fs.readFileSync('dist/final-audit-supplement.json', 'utf8'));
          const mandatoryDois = new Set((mandatory.papers || []).map(p => String(p.doi || '').toLowerCase()));
          for (const doi of requiredDois) {
            if (!supplementDois.has(doi)) throw new Error(`curated DOI missing from literature supplement: ${doi}`);
            if (!mandatoryDois.has(doi)) throw new Error(`curated DOI missing from mandatory card dataset: ${doi}`);
          }

          const translations = JSON.parse(fs.readFileSync('dist/title-translations-zh.json', 'utf8'));
          const zh = new Map((translations.translations || []).map(x => [x.title, x.zh]));
          if (!zh.get('Visible light-induced oxygen atom transfer into C−Cl bond of acyl chlorides for homolytic cleavage')) throw new Error('curated Chinese title was not merged');
          if (!zh.get('Scalable Total Syntheses of Nonthmicin and Ecteinamycin Reveal a Dual Antibacterial and Antitoxin Profile against Clostridioides difficile')) throw new Error('second-batch Chinese title was not merged');

          console.log(JSON.stringify({ manifestItems: items.length, figures, pmcFallbacks: pmcFallbacks.length, natureFallbacks: natureFallbacks.length, curatedSupplement: true, mandatoryCurated: true, repositoryBaseline: true, workerMediaMerged: true, bridgeLoader: true, bridgeRuntime: true }));
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed search filtering CSS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node - <<'NODE'
          const site = process.env.SITE_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const marker = /\.card\[hidden\]\{display:none!important\}/;

          for (let attempt = 0; attempt < 10; attempt += 1) {
            try {
              const htmlResponse = await fetch(`${site}?search-css-smoke=${Date.now()}`, {
                headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
              });
              const html = await htmlResponse.text();
              const hrefs = [...html.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["']/g)]
                .map(match => new URL(match[1], site).href);
              const css = (await Promise.all(hrefs.map(async href => {
                const response = await fetch(`${href}${href.includes('?') ? '&' : '?'}smoke=${Date.now()}`, {
                  headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
                });
                return response.ok ? response.text() : '';
              }))).join('\n');
              if (marker.test(css)) {
                console.log(JSON.stringify({ searchFilteringCss: true, stylesheets: hrefs.length, site }));
                process.exit(0);
              }
            } catch (error) {
              console.warn(String(error));
            }
            await sleep(3000);
          }
          throw new Error(`${site}: deployed CSS is missing .card[hidden]{display:none!important}`);
          NODE
