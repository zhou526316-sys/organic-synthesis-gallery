name: Tampermonkey historical TOC yield and verified Chem route 2026-10-17
on:
  pull_request:
    branches: [main]
    paths:
      - public/toc-mainline.user.js
      - cloudflare/scripts/build-bridge-loader.mjs
      - tests/tm-historical-toc-chem-route-20261017.test.mjs
      - .github/workflows/tm-historical-toc-chem-route-20261017.yml
  push:
    branches: [main]
    paths:
      - public/toc-mainline.user.js
      - cloudflare/scripts/build-bridge-loader.mjs
      - .github/workflows/tm-historical-toc-chem-route-20261017.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate source, DOI binding, October bundle and historical official-TOC preservation
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --check cloudflare/scripts/build-bridge-loader.mjs
          node --test tests/tm-historical-toc-chem-route-20261017.test.mjs tests/tm-long-run-inventory-budget-20261017.test.mjs tests/tm-heartbeat-circuit-20261015.test.mjs
          node --test tests/tm-gap-recovery.test.mjs tests/tm-inventory-startup.test.mjs
          node scripts/test-tm-oct1-scope-contract.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
      - name: Verify bundled install exactly matches production version contract
        env:
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.92' public/gallery-vpn-bridge.user.js
          grep -F "var INSTALL_REVISION = '6.2.73';" public/gallery-vpn-bridge.user.js
          grep -F 'publisher_article_route_unverified' public/gallery-vpn-bridge.user.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-historical-yield-20261017
          path: public/gallery-vpn-bridge.user.js
          retention-days: 7
