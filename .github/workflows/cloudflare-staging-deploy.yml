name: Deploy Cloudflare staging

on:
  push:
    branches:
      - migration/cloudflare
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organic-synthesis-gallery-cloudflare-staging
  cancel-in-progress: false

jobs:
  bootstrap-build-deploy-migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
      D1_NAME: organic-synthesis-gallery
      R2_BUCKET: organic-synthesis-gallery-media

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required repository secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$BRIDGE_WRITE_TOKEN" || { echo 'Missing BRIDGE_WRITE_TOKEN'; exit 1; }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot current production literature assets
        run: node cloudflare/scripts/snapshot-production-static.mjs

      - name: Build Gallery frontend
        run: npm run build

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Create or reuse D1 database
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create "$D1_NAME"
            npx wrangler d1 list --json > /tmp/d1-list.json
            D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
            )
          fi
          test -n "$D1_ID" || { echo 'Unable to resolve D1 database id'; exit 1; }
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Create or reuse R2 bucket
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Generate staging Wrangler configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.staging.toml <<EOF
          name = "organic-synthesis-gallery"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          workers_dev = true

          [vars]
          MIGRATION_STAGE = "staging"

          [triggers]
          crons = ["0 * * * *"]

          [assets]
          directory = "../../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/media/*"]

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "$R2_BUCKET"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF

      - name: Apply D1 schema
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --file ../schema.sql --config wrangler.staging.toml

      - name: Seed user-reported media priorities
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --file ../seeds/user-reported-media-priority.sql --config wrangler.staging.toml

      - name: Dry-run complete Worker and static assets bundle
        working-directory: cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml --outdir .wrangler-staging-dry-run

      - name: Bootstrap staging deployment
        id: bootstrap
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.staging.toml 2>&1 | tee /tmp/wrangler-deploy.log
          STAGING_URL=$(grep -Eo 'https://[-A-Za-z0-9.]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)
          test -n "$STAGING_URL" || { echo 'Unable to determine workers.dev deployment URL'; exit 1; }
          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "Staging URL: $STAGING_URL"

      - name: Install Bridge write secret
        working-directory: cloudflare/worker
        shell: bash
        run: printf '%s' "$BRIDGE_WRITE_TOKEN" | npx wrangler secret put BRIDGE_WRITE_TOKEN --config wrangler.staging.toml

      - name: Generate Cloudflare VPN Bridge
        env:
          TARGET_API_BASE: ${{ steps.bootstrap.outputs.url }}
          TARGET_SITE_ORIGIN: ${{ steps.bootstrap.outputs.url }}
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Rebuild frontend with Cloudflare VPN Bridge
        run: npm run build

      - name: Final staging deployment
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.staging.toml

      - name: Verify Cloudflare bindings and write authorization
        id: health
        shell: bash
        env:
          STAGING_URL: ${{ steps.bootstrap.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_URL/api/_healthcheck" > /tmp/health.json
          cat /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (!health.ok || !health.d1 || !health.r2 || !health.writeAuth) {
            throw new Error(`Incomplete Cloudflare bindings: ${JSON.stringify(health)}`);
          }
          NODE

      - name: Defer bulk media migration to protect free-tier quota
        run: |
          echo 'Bulk TOC/Figure cache migration intentionally skipped on initial staging deployment.'
          echo 'The 86 user-reported priority DOI records are already seeded and will be repaired gradually.'
          echo 'Existing AppDeploy production remains online as the source-of-truth during staging validation.'

      - name: Verify repair queue endpoint
        shell: bash
        env:
          STAGING_URL: ${{ steps.bootstrap.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_URL/api/media/repair-status" | tee /tmp/repair-status.json

      - name: Publish staging URL in workflow summary
        env:
          STAGING_URL: ${{ steps.bootstrap.outputs.url }}
        run: |
          {
            echo '## Organic Synthesis Gallery Cloudflare staging'
            echo
            echo "$STAGING_URL"
            echo
            echo '- Worker + Static Assets: deployed'
            echo '- D1 schema: applied'
            echo '- R2 media bucket: attached'
            echo '- Bridge write secret: installed'
            echo '- Repair cron: hourly (quota-conservative)'
            echo '- Bulk TOC/Figure migration: intentionally deferred'
            echo '- 86 user-reported priority DOI records: seeded'
          } >> "$GITHUB_STEP_SUMMARY"
