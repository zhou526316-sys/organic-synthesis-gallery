name: Deploy Cloudflare staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CLOUDFLARE_SCHEMA_REFRESH'
      - '.github/workflows/cloudflare-staging-deploy.yml'
      - 'cloudflare/schema.sql'
      - 'cloudflare/worker/**'

permissions:
  contents: read

concurrency:
  group: organic-synthesis-gallery-cloudflare-staging
  cancel-in-progress: false

jobs:
  migrate-build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
      D1_NAME: organic-synthesis-gallery
      R2_BUCKET: organic-synthesis-gallery-media
      STAGING_URL: https://organic-synthesis-gallery.zhou526316.workers.dev

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate repository secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$BRIDGE_WRITE_TOKEN" || { echo 'Missing BRIDGE_WRITE_TOKEN'; exit 1; }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot current AppDeploy literature assets
        run: node cloudflare/scripts/snapshot-production-static.mjs

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Resolve existing D1 database
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const row = rows.find(item => item.name === process.env.D1_NAME);
          if (row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID" || { echo 'D1 database is missing'; exit 1; }
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Verify R2 bucket exists
        working-directory: cloudflare/worker
        run: npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null

      - name: Generate Wrangler configuration
        working-directory: cloudflare/worker
        shell: bash
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.staging.toml <<EOF
          name = "organic-synthesis-gallery"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          workers_dev = true

          [vars]
          MIGRATION_STAGE = "staging"

          [triggers]
          crons = ["0 */6 * * *"]

          [assets]
          directory = "../../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/media/*"]

          [[r2_buckets]]
          binding = "MEDIA"
          bucket_name = "$R2_BUCKET"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF

      - name: Apply idempotent D1 schema
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --file ../schema.sql --config wrangler.staging.toml

      - name: Preserve 86 priority repair DOI records
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --file ../seeds/user-reported-media-priority.sql --config wrangler.staging.toml

      - name: Migrate verified metadata and real media only
        id: migrate
        shell: bash
        env:
          TARGET_API_BASE: ${{ env.STAGING_URL }}
          TARGET_WRITE_TOKEN: ${{ env.BRIDGE_WRITE_TOKEN }}
          MIGRATION_CONCURRENCY: '2'
          MEDIA_MANIFEST_OUTPUT: public/media-index.json
        run: |
          set -euo pipefail
          node cloudflare/scripts/migrate-efficient.mjs 2>&1 | tee /tmp/migration.log
          SUMMARY=$(grep '^MIGRATION_SUMMARY ' /tmp/migration.log | tail -1 | sed 's/^MIGRATION_SUMMARY //')
          test -n "$SUMMARY" || { echo 'Migration summary missing'; exit 1; }
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Generate Cloudflare VPN Bridge
        env:
          TARGET_API_BASE: ${{ env.STAGING_URL }}
          TARGET_SITE_ORIGIN: ${{ env.STAGING_URL }}
          BRIDGE_OUTPUT: public/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Build final static Gallery
        run: npm run build

      - name: Validate Worker and static bundle
        working-directory: cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml --outdir .wrangler-staging-dry-run

      - name: Deploy final Gallery once
        working-directory: cloudflare/worker
        run: npx wrangler deploy --config wrangler.staging.toml

      - name: Seed repair state for all current DOI records
        env:
          TARGET_API_BASE: ${{ env.STAGING_URL }}
        run: node cloudflare/scripts/seed-all-repair.mjs | tee /tmp/repair-seed.log

      - name: Verify Cloudflare health and static manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_URL/api/_healthcheck" > /tmp/health.json
          curl --fail --silent --show-error "$STAGING_URL/media-index.json" > /tmp/media-index.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/media-index.json', 'utf8'));
          if (!health.ok || !health.d1 || !health.r2 || !health.writeAuth) throw new Error(`Healthcheck failed: ${JSON.stringify(health)}`);
          const items = Object.values(manifest.items || {});
          const toc = items.filter(item => item?.toc?.available && item?.toc?.imageUrl).length;
          const figures = items.reduce((sum, item) => sum + (item?.figures?.figures?.length || 0), 0);
          if (!items.length) throw new Error('Static media manifest is empty');
          console.log(JSON.stringify({ manifestItems: items.length, toc, figures }));
          NODE

      - name: Verify priority repair queue remains available
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$STAGING_URL/api/media/repair-status" > /tmp/repair-status.json
          curl --fail --silent --show-error "$STAGING_URL/api/media/bridge-queue" > /tmp/bridge-queue.json
          node - <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('/tmp/bridge-queue.json','utf8'));
          console.log(JSON.stringify({bridgeQueueCount:queue.count, tocMissing:(queue.items||[]).filter(x=>x.tocMissing).length}));
          NODE

      - name: Publish deployment summary
        env:
          MIGRATION_SUMMARY: ${{ steps.migrate.outputs.summary }}
        run: |
          {
            echo '## Organic Synthesis Gallery Cloudflare migration'
            echo
            echo "$STAGING_URL"
            echo
            echo "Migration: $MIGRATION_SUMMARY"
            grep '^REPAIR_SEED_SUMMARY ' /tmp/repair-seed.log || true
            echo '- Frontend media reads: static media-index first'
            echo '- D1 fallback: only for visible media not present in static manifest'
            echo '- Real TOC is now required for media completeness'
            echo '- Repair state seeded for all current DOI records'
            echo '- Repair cron: every 6 hours, max 2 DOI per run'
          } >> "$GITHUB_STEP_SUMMARY"
