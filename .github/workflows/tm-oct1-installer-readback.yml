name: Tampermonkey Oct-1 postdeploy installer readback
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-tm-oct1-installer-live.mjs'
      - '.github/workflows/tm-oct1-installer-readback.yml'
  workflow_run:
    workflows: ['Deploy GitHub Pages frontend']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify PR source only, before production artifact exists
        if: github.event_name == 'pull_request'
        run: |
          node --check scripts/verify-tm-oct1-installer-live.mjs
          node --check cloudflare/scripts/build-bridge-loader.mjs
          node --check public/toc-mainline.user.js
          node scripts/validate-tm220-artifacts.mjs source
      - name: Read official Pages and Worker installers after deployment
        if: github.event_name != 'pull_request'
        run: |
          node --check scripts/verify-tm-oct1-installer-live.mjs
          node scripts/verify-tm-oct1-installer-live.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: tm-oct1-installer-production-readback
          path: ${{ runner.temp }}/tm-oct1-live-acceptance.json
          retention-days: 7
