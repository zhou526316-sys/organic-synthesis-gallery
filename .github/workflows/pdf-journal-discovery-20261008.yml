name: PDF cross-journal inventory discovery
on:
  push:
    branches:
      - diag/pdf-cross-journal-sampling-20261008
    paths:
      - .github/workflows/pdf-journal-discovery-20261008.yml
      - scripts/diagnose-pdf-journal-discovery.mjs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pdf-journal-discovery-20261008
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/pdf-cross-journal-sampling-20261008
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Wrangler dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Discover current indexed article inventory and sample 3 per journal
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check scripts/diagnose-pdf-journal-discovery.mjs
          node scripts/diagnose-pdf-journal-discovery.mjs
