name: Sync frontend to Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-worker-sync.yml'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'scripts/build-share-pages.mjs'
      - 'public/share-default.png'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/automation-supplement.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'public/curated-supplement.json'
      - 'public/rolling-supplement.json'
      - 'public/wechat-editions/**'
      - 'public/MP_verify_*.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: frontend-worker-sync
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Dispatch current frontend assets to Worker
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_OUTPUT="$(gh workflow run deploy-worker-frontend.yml --repo "$REPO" --ref main 2>&1)"
          printf '%s\n' "$DISPATCH_OUTPUT"
          RUN_ID="$(printf '%s\n' "$DISPATCH_OUTPUT" | sed -nE 's#.*?/actions/runs/([0-9]+).*#\1#p' | tail -n1)"
          if [ -z "$RUN_ID" ]; then
            echo "Could not resolve the Worker deploy run id from gh workflow dispatch output." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched Worker frontend deploy run $RUN_ID."

      - name: Wait for Worker frontend deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$REPO" --exit-status

      - name: Verify GitHub Pages and Worker serve reviewed UI
        env:
          GITHUB_PAGES_URL: https://zhou526316-sys.github.io/organic-synthesis-gallery/
          WORKER_SITE_URL: https://organic-synthesis-gallery.zhou526316.workers.dev/
          CUSTOM_SITE_URL: https://api.gczhouwld.com/
          GALLERY_SITE_URL: https://gallery.gczhouwld.com/
        run: |
          node - <<'NODE'
          const sites = [process.env.GITHUB_PAGES_URL, process.env.WORKER_SITE_URL, process.env.CUSTOM_SITE_URL, process.env.GALLERY_SITE_URL];
          const required = [
            ['site-feedback-widget', 'feedback widget'],
            ['user-search-summary', 'search results summary'],
            ['site-feedback-widget-position-v1', 'draggable feedback position'],
            ['account-v3-head', 'bounded V3 account sync'],
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function get(url, attempts = 8) {
            let last = '';
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  headers: {
                    'cache-control': 'no-cache',
                    pragma: 'no-cache',
                    'user-agent': 'organic-gallery-frontend-sync-smoke',
                  },
                });
                last = `${response.status} ${response.statusText}`;
                if (response.ok) return await response.text();
              } catch (error) {
                last = String(error);
              }
              await sleep(2500);
            }
            throw new Error(`${url}: request failed: ${last}`);
          }

          async function inspect(site) {
            const html = await get(`${site}?frontend-sync=${Date.now()}`);
            if (!html.includes('id="app"')) throw new Error(`${site}: app root missing`);
            const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/g)]
              .map(match => new URL(match[1], site).href);
            if (!scripts.length) throw new Error(`${site}: no JS entry found`);

            const seen = new Set();
            const queue = [...scripts];
            const bodies = [];
            while (queue.length && seen.size < 80) {
              const url = queue.shift();
              if (!url || seen.has(url)) continue;
              seen.add(url);
              const body = await get(url);
              bodies.push(body);
              for (const match of body.matchAll(/["']([^"'\s]+\.js)["']/g)) {
                try {
                  const next = new URL(match[1], url).href;
                  if (next.startsWith(new URL(site).origin) && !seen.has(next)) queue.push(next);
                } catch {}
              }
            }

            const bundle = bodies.join('\n');
            const missing = required.filter(([needle]) => !bundle.includes(needle));
            if (missing.length) {
              throw new Error(`${site}: stale frontend, missing ${missing.map(item => item[1]).join(', ')}`);
            }
            return { site, chunks: seen.size };
          }

          const results = [];
          for (const site of sites) results.push(await inspect(site));

          const sampleSlug = Buffer.from('10.1021/jacs.6c15393', 'utf8').toString('base64url');
          const shareHtml = await get(`${process.env.CUSTOM_SITE_URL}share/${sampleSlug}.html?frontend-sync=${Date.now()}`);
          if (!shareHtml.includes('property="og:type" content="article"')) throw new Error('custom-domain share card is missing Open Graph article metadata');
          if (!shareHtml.includes('property="og:image"')) throw new Error('custom-domain share card is missing a cover image');
          if (!shareHtml.includes('10.1021/jacs.6c15393')) throw new Error('custom-domain share card points at the wrong paper');

          console.log(JSON.stringify({ ok: true, results, customShareCard: true }));
          NODE
