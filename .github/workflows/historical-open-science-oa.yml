name: Historical scientific OA source validation (read-only)
on:
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based offset in the formal historical DOI worklist
        type: number
        default: 0
      limit:
        description: Maximum audited OA sources in this window (1 to 20)
        type: number
        default: 20
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/historical-open-xml-pilot.mjs'
      - 'scripts/audit-historical-open-science-oa.mjs'
      - 'scripts/test-historical-open-science-oa.mjs'
      - '.github/workflows/historical-open-science-oa.yml'
      - 'scripts/lib/historical-oa-trigger.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-open-science-oa.yml'
      - 'audit/automation-triggers/historical-science-oa-window.json'
permissions:
  contents: read
concurrency:
  group: historical-open-science-source-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify source parser and offline non-writing contract
        run: |
          node --check scripts/lib/historical-open-xml-pilot.mjs
          node --check scripts/lib/historical-oa-trigger.mjs
          node --check scripts/audit-historical-open-science-oa.mjs
          node --test scripts/test-historical-open-science-oa.mjs
          node scripts/audit-historical-open-science-oa.mjs --dry-run --limit=20 --output=/tmp/historical-oa-offline.json
          node -e "const x=require('/tmp/historical-oa-offline.json');if(x.xmlOriginalsPersisted||x.publicBodyImports||x.publisherVisits||x.pdfDownloads||x.candidateDois>20)process.exit(1)"
  source-pilot:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve reviewed, catalog-pinned and bounded source window
        id: source-window
        shell: bash
        env:
          OA_EVENT: ${{ github.event_name }}
          OA_DISPATCH_OFFSET: ${{ inputs.offset || 0 }}
          OA_DISPATCH_LIMIT: ${{ inputs.limit || 20 }}
        run: |
          set -euo pipefail
          if [ "$OA_EVENT" = workflow_dispatch ]; then
            [[ "$OA_DISPATCH_OFFSET" =~ ^[0-9]+$ ]] && [[ "$OA_DISPATCH_LIMIT" =~ ^[0-9]+$ ]]
            test "$OA_DISPATCH_LIMIT" -ge 1 && test "$OA_DISPATCH_LIMIT" -le 20
            {
              echo 'enabled=true'
              echo "offset=$OA_DISPATCH_OFFSET"
              echo "limit=$OA_DISPATCH_LIMIT"
              echo 'catalog='
            } >> "$GITHUB_OUTPUT"
          else
            # A workflow-only code release must not restart the old source window.
            if ! git diff --name-only HEAD^ HEAD -- audit/automation-triggers/historical-science-oa-window.json \
              | grep -qx 'audit/automation-triggers/historical-science-oa-window.json'; then
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {normalizeOaTrigger} from './scripts/lib/historical-oa-trigger.mjs';
          const raw=JSON.parse(readFileSync('audit/automation-triggers/historical-science-oa-window.json','utf8'));
          const win=normalizeOaTrigger(raw);
          appendFileSync(process.env.GITHUB_OUTPUT,
            ['enabled=true','offset='+win.offset,'limit='+win.limit,
              'catalog='+win.catalogId,''].join(String.fromCharCode(10)));
          console.log('HISTORICAL_OA_WINDOW '+JSON.stringify({requestId:win.requestId,offset:win.offset,
            limit:win.limit,catalogId:win.catalogId,readOnly:true}));
          NODE
          fi
      - name: Scan one exact published-DOI OA window (no protected article requests)
        if: steps.source-window.outputs.enabled == 'true'
        env:
          OA_OFFSET: ${{ steps.source-window.outputs.offset }}
          OA_LIMIT: ${{ steps.source-window.outputs.limit }}
          OA_CATALOG: ${{ steps.source-window.outputs.catalog }}
        run: |
          node scripts/audit-historical-open-science-oa.mjs --limit="$OA_LIMIT" \
            --offset="$OA_OFFSET" --expected-catalog-id="$OA_CATALOG" \
            --output=/tmp/real-historical-oa-evidence.json
      - name: Preserve only DOI/source/rights/science-count records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-oa-source-evidence-${{ github.run_id }}
          path: /tmp/real-historical-oa-evidence.json
          retention-days: 7
          if-no-files-found: warn
