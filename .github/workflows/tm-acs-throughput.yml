name: Tampermonkey ACS recovery regression
on:
  push:
    branches: [fix/tm-acs-throughput-20261008, main]
  pull_request:
    branches: [main]
    paths:
      - public/toc-mainline.user.js
      - cloudflare/worker/src/local-captures.js
      - cloudflare/scripts/build-bridge-loader.mjs
      - scripts/validate-tm220-artifacts.mjs
      - tests/tm-acs-throughput.test.mjs
      - tests/tm-image-outbox-recovery-20261008.test.mjs
      - tests/tm-owner-pdf-replay-20261008.test.mjs
      - scripts/test-tm223-upload.mjs
      - .github/workflows/tm-acs-throughput.yml
permissions:
  contents: read
concurrency:
  group: tm-acs-throughput
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify bounded ACS acquisition and existing queue guarantees
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --check cloudflare/worker/src/local-captures.js
          node --test tests/tm-acs-throughput.test.mjs
          node --test tests/tm-image-outbox-recovery-20261008.test.mjs
          node --test tests/tm-owner-pdf-replay-20261008.test.mjs
          node scripts/test-tm223-upload.mjs
          node --test tests/tm-gap-recovery.test.mjs
          node tests/tm-missing-only.test.mjs
          node tests/tm-queue-coverage.test.mjs
          node tests/tm-immediate-restart.test.mjs
          node tests/tm-manual-resume.test.mjs
          node scripts/test-stage-storage.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
      - name: Build Bridge 2.2.74
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.74' public/gallery-vpn-bridge.user.js
          grep -F "var INSTALL_REVISION = '6.2.55';" public/gallery-vpn-bridge.user.js
          grep -F "ACS_MEDIA_RECOVERY_REVISION = '20261008-acs-viewer-upload-v1'" public/gallery-vpn-bridge.user.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-acs-recovery-evidence
          path: |
            public/gallery-vpn-bridge.user.js
            public/toc-mainline.user.js
          retention-days: 7
