name: WeChat Oct12 R6 Real Preview Visual QA (Read Only)
on:
  push:
    branches: [main]
    paths:
      - audit/automation-triggers/wechat-oct12-r6-live-preview-request.json
permissions:
  contents: write
concurrency:
  group: wechat-oct12-r6-live-preview-qa-only
  cancel-in-progress: false
jobs:
  capture-two-article-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate read-only request and source review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit/automation-triggers/wechat-oct12-r6-live-preview-request.json').read_text())
          g=json.loads(Path('audit/wechat-working/2026-10-12-review-gate.json').read_text())
          a=json.loads(Path('audit/wechat-publisher/latest.json').read_text())
          assert r['action']=='read_only_real_relay_preview_visual_qa'
          assert r['revision']=='2026-10-12-r6'
          assert r['previewUrl']==a['preview_url']=='https://relay.gczhouwld.com/wechat-preview/ab7daf116c9af68cefa965be.html'
          assert a['stage']=='draft_update' and a['draft_readback']=='ok'
          assert a['media_id']==r['originalDraftMediaId']
          assert a['article_count']==2 and a['publish_id'] is None
          assert g['revision']=='2026-10-12-r6'
          assert g['textReview']=='pass' and g['imageReview']=='pass'
          assert r['draftWriteAuthorized'] is False and r['publicSendAuthorized'] is False
          print('read-only cloud draft identity and review gate match')
          PY
      - name: Install pinned Chromium and playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps chromium >/tmp/wechat-r6-preview-playwright-install.log 2>&1 || { tail -70 /tmp/wechat-r6-preview-playwright-install.log; exit 1; }
      - name: Capture real read-only WeChat draft/get relay at desktop and mobile widths
        run: node scripts/wechat-oct12-r6-live-preview-qa.mjs
      - name: Store captured screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-20261012-r6-preview
          path: audit/wechat-working/2026-10-12-r6-live-preview/
          retention-days: 30
      - name: Commit independent read-only screenshot + QA audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wx-r6-readonly
          cp -a audit/wechat-working/2026-10-12-r6-live-preview/. /tmp/wx-r6-readonly/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit/wechat-working/2026-10-12-r6-live-preview
            cp -a /tmp/wx-r6-readonly/. audit/wechat-working/2026-10-12-r6-live-preview/
            git add -- audit/wechat-working/2026-10-12-r6-live-preview/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit: verify and screenshot Oct12 R6 real read-only dual WeChat draft preview'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
