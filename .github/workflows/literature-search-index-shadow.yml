name: Literature search index shadow

on:
  workflow_run:
    workflows:
      - Deploy Worker frontend assets
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literature-search-index-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
      SHADOW_DIR: ${{ runner.temp }}/gallery-literature-index-shadow
      REPORT_PATH: ${{ runner.temp }}/literature-index-shadow-report.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Freeze verified live literature generation
        run: |
          set -euo pipefail
          test -n "$BRIDGE_WRITE_TOKEN"
          node architecture/shadow.mjs --verify-live --out "$SHADOW_DIR"

      - name: Import and compare dedicated literature search shadow
        env:
          LITERATURE_INDEX_SHADOW_REPORT: ${{ env.REPORT_PATH }}
        run: |
          set -euo pipefail
          node scripts/sync-literature-catalog-index-shadow.mjs "$SHADOW_DIR"

      - name: Preserve literature search shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-search-index-shadow-${{ github.run_id }}
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.SHADOW_DIR }}/report.json
          if-no-files-found: warn
          retention-days: 14
