name: WeChat Preview Referrer Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wechat-preview-referrer-repair.yml']
permissions:
  contents: write
jobs:
  repair-preview-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add preview-only referrer policy with exact source guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,datetime,hashlib,json,pathlib
          p=pathlib.Path('ops/wechat-publisher/create-draft.py'); b=p.read_bytes()
          before=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          if before!='8c94f4596448cb1e8ddb220d0242f01f9e5b41e2': raise SystemExit('Publisher changed; reconcile first')
          s=b.decode(); a=s.index('def render_wechat_draft_preview('); z=s.index('\ndef write_draft_preview(',a)
          part=s[a:z]; marker='<meta name="robots" content="noindex,nofollow">'
          assert part.count(marker)==1
          part=part.replace(marker,marker+'\n<meta name="referrer" content="no-referrer">',1)
          s=s[:a]+part+s[z:]; ast.parse(s); p.write_text(s)
          assert 'normalize_preview_lazy_images(str(item.get("content") or ""))' in s
          data=s.encode(); result={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'pass','change':'HTML preview referrer policy only; same exact WeChat-uploaded image URLs','publisherOldBlobSha':before,'publisherNewBlobSha':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest(),'draftContentChanged':False,'wechatApiCalled':False}
          pathlib.Path('audit/wechat-working/2026-10-07-r7-preview-referrer-repair.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/wechat-publisher/create-draft.py audit/wechat-working/2026-10-07-r7-preview-referrer-repair.json
          git commit -m 'fix: preview no-referrer policy for original WeChat media URLs'
          git push origin HEAD:main
