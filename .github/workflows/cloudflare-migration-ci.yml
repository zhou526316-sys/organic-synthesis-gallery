name: Cloudflare migration CI

on:
  push:
    branches:
      - migration/cloudflare
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'src/**'
      - '.github/workflows/cloudflare-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check isolated user UI modules
        run: >-
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler
          --lib ES2022,DOM,DOM.Iterable --strict --noUnusedLocals --noUnusedParameters
          src/user-shell.ts src/user-ui/shared.ts src/user-ui/paper-actions.ts
          src/user-ui/library-shell.ts src/user-ui/search-controller.ts src/user-ui/account-sync.ts

  worker-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/worker/package.json

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Test reader-count materialization
        run: npm run test:reader-counts

      - name: Wrangler dry-run build
        run: npm run check

  bridge-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Cloudflare Bridge from production 0.4.5
        env:
          TARGET_API_BASE: https://api.example.workers.dev
          TARGET_SITE_ORIGIN: https://gallery.example.pages.dev
          BRIDGE_OUTPUT: /tmp/gallery-vpn-bridge.user.js
        run: node cloudflare/scripts/build-cloudflare-bridge.mjs

      - name: Validate generated Bridge contract
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/gallery-vpn-bridge.user.js
          grep -F "// @version      1.0.4" /tmp/gallery-vpn-bridge.user.js
          grep -F "// @match        https://gallery.example.pages.dev/*" /tmp/gallery-vpn-bridge.user.js
          grep -F "// @connect      api.example.workers.dev" /tmp/gallery-vpn-bridge.user.js
          grep -F "const API_BASE = 'https://api.example.workers.dev';" /tmp/gallery-vpn-bridge.user.js
          grep -F "GM_getValue" /tmp/gallery-vpn-bridge.user.js
          grep -F "GM_setValue" /tmp/gallery-vpn-bridge.user.js
          grep -F "GM_registerMenuCommand" /tmp/gallery-vpn-bridge.user.js
          grep -F "Authorization: \`Bearer \${token}\`" /tmp/gallery-vpn-bridge.user.js
          grep -F "return validDoi(doi);" /tmp/gallery-vpn-bridge.user.js
          grep -F "publisher_access_blocked" /tmp/gallery-vpn-bridge.user.js
          grep -F "semantic_toc_not_found" /tmp/gallery-vpn-bridge.user.js
          if grep -F "api-v2.appdeploy.ai/app/organic-synthesis-literature-gallery-ase43k" /tmp/gallery-vpn-bridge.user.js; then
            echo 'Generated Bridge still contains the old AppDeploy API base.'
            exit 1
          fi
