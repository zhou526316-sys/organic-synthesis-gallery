name: Site quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Test Gallery custom-domain live media routing
        run: node --test scripts/test-gallery-media-routing.mjs

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Verify optional body-media 503 resilience
        run: node --test scripts/test-new-body-transport.mjs

      - name: Test responsive result pagination and verified reader
        timeout-minutes: 2
        run: |
          test -s scripts/test-result-window.mjs
          test -s architecture/tests/published-reader.test.mjs
          node --test scripts/test-result-window.mjs scripts/test-daily-gallery-order.mjs scripts/test-publisher-date-display-fix.mjs architecture/tests/published-reader.test.mjs

      - name: Test Tampermonkey architecture membership observer
        run: node --test scripts/test-tm-architecture-membership.mjs

      - name: Test daily 08:00 literature release contracts
        run: |
          node --test scripts/test-fixed-slot-release-handoff.mjs scripts/test-pages-release-delivery.mjs
          node scripts/test-prepublish-readiness.mjs
          node scripts/test-prepublish-slot-window.mjs
          node scripts/test-per-doi-release.mjs
          node --test scripts/test-approved-publication-date-corrections.mjs
          node scripts/test-deferred-publication-quality.mjs
          node scripts/test-formal-review-conversion.mjs
          node scripts/test-pages-literature-authorization.mjs

      - name: Validate current production literature marker compatibility
        run: |
          node scripts/validate-production-literature-release-slot.mjs
          node scripts/validate-pages-literature-authorization.mjs

      - name: Test and build inactive architecture public bundle
        run: |
          node --test scripts/test-gallery-architecture-public.mjs scripts/test-result-window.mjs scripts/test-daily-gallery-order.mjs
          node scripts/build-gallery-architecture-public.mjs

      - name: Build frontend
        run: npm run build

      - name: Enforce model-neutral public copy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'gpt' src index.html public/site-stats.html --include='*.ts' --include='*.tsx' --include='*.js' --include='*.html'; then
            echo 'Public-facing source must not contain model names.'
            exit 1
          fi
          if grep -RniE 'gpt' dist/index.html dist/assets --include='*.js' --include='*.html'; then
            echo 'Built public frontend must not contain model names.'
            exit 1
          fi

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/architecture-v1/release.json
          test -s dist/architecture-v1/current.json
          test -d dist/assets
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          grep -R -F "site-feedback-widget" dist/assets >/dev/null
          grep -R -F "api.gczhouwld.com" dist/assets >/dev/null

  worker:
    name: Worker dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Test site feedback D1-to-R2 fallback
        run: npm run test:feedback-fallback

      - name: Test reader-count, user-library and analytics shadow state
        run: |
          npm run test:reader-counts
          npm run test:user-library-shadow
          npm run test:user-library-v3
          npm run test:user-library-v3-shadow
          npm run test:site-analytics-materialized

      - name: Test fulltext-backed article summaries
        run: npm run test:article-summary

      - name: Test Evidence Index and scheduled handoff shadow
        run: |
          npm run test:evidence-index
          npm run test:scheduled-handoff-index

      - name: Test summary candidate index shadow parity
        run: npm run test:summary-candidate-index

      - name: Test architecture shadow deployment contracts
        working-directory: .
        run: |
          node scripts/test-summary-candidate-shadow-deployment-contract.mjs
          node scripts/test-scheduled-handoff-shadow-deployment-contract.mjs
          node scripts/test-user-library-shadow-deployment-contract.mjs
          node scripts/test-user-library-v3-deployment-contract.mjs
          node scripts/test-user-library-v3-write-canary-contract.mjs
          node scripts/test-user-library-v3-rollout-forecast-contract.mjs
          node scripts/test-media-boundedness-contract.mjs
          node scripts/test-site-analytics-materialized-deployment-contract.mjs

      - name: Test scheduled encrypted handoff
        run: npm run test:scheduled-summary-handoff

      - name: Test GPT-reviewed summary queue
        run: npm run test:summary-review

      - name: Compile Worker with Wrangler
        run: npm run check

  playwright:
    name: Playwright interaction regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.1
          npx playwright install --with-deps webkit

      - name: Build legacy interaction fixture
        run: npm run build

      - name: Start legacy preview server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gallery-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gallery-preview.log
          exit 1

      - name: Run existing interaction regression
        run: npx playwright test tests/mobile-interaction.spec.ts --reporter=line --workers=1

      - name: Run bounded V3 account-sync regression
        run: npx playwright test tests/account-sync-v3.spec.ts --reporter=line --workers=1

      - name: Build verified architecture read fixture
        run: |
          node cloudflare/scripts/merge-curated-pages.mjs
          node scripts/build-gallery-architecture-public.mjs
          npm run build
          node scripts/pages-release-delivery.mjs build dist

      - name: Start architecture preview server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4174 >/tmp/gallery-architecture-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gallery-architecture-preview.log
          exit 1

      - name: Run Hot Archive frontend regression
        env:
          ARCHITECTURE_PREVIEW_BASE: http://127.0.0.1:4174
        run: npx playwright test tests/architecture-frontend.spec.ts --reporter=line --workers=1

  api-smoke:
    name: Production API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current production API before merge
        env:
          API_BASE: https://api.gczhouwld.com
          SITE_ORIGIN: https://zhou526316-sys.github.io
        run: |
          node - <<'NODE'
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const base = process.env.API_BASE;
          const origin = process.env.SITE_ORIGIN;

          async function call(path, init = {}, expected = 200, cors = true) {
            const headers = new Headers(init.headers || {});
            headers.set('origin', origin);
            const response = await fetch(`${base}${path}`, { ...init, headers, redirect: 'manual' });
            const text = await response.text();
            let body = {};
            try { body = text ? JSON.parse(text) : {}; } catch {
              throw new Error(`${path} returned non-JSON: ${text.slice(0, 300)}`);
            }
            assert(response.status === expected, `${path}: expected ${expected}, got ${response.status}: ${text.slice(0, 500)}`);
            if (cors) {
              assert(response.headers.get('access-control-allow-origin') === origin, `${path}: CORS mismatch`);
            }
            return body;
          }

          const health = await call('/api/_healthcheck', {}, 200, false);
          assert(health.ok && health.d1 && health.r2 && health.writeAuth, `healthcheck incomplete: ${JSON.stringify(health)}`);

          const integrations = await call('/api/user-ui/integrations');
          assert(integrations?.auth && integrations?.payments, `integrations invalid: ${JSON.stringify(integrations)}`);

          const counts = await call('/api/user-ui/reader-counts', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ dois: [] }),
          });
          assert(counts && typeof counts.counts === 'object', `reader-counts invalid: ${JSON.stringify(counts)}`);

          const invalidFeedback = await call('/api/user-ui/site-feedback', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ profileId: '', message: '' }),
          }, 400);
          assert(Boolean(invalidFeedback.error), `site-feedback validation route missing: ${JSON.stringify(invalidFeedback)}`);

          console.log(JSON.stringify({ health: true, integrations: true, readerCounts: true, siteFeedbackRoute: true }));
          NODE

  required:
    name: Required quality gate
    if: always()
    needs: [frontend, worker, playwright, api-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all quality checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          WORKER: ${{ needs.worker.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          API_SMOKE: ${{ needs.api-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'frontend=%s\nworker=%s\nplaywright=%s\napi-smoke=%s\n' "$FRONTEND" "$WORKER" "$PLAYWRIGHT" "$API_SMOKE"
          test "$FRONTEND" = success
          test "$WORKER" = success
          test "$PLAYWRIGHT" = success
          test "$API_SMOKE" = success
