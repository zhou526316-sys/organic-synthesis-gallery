name: Capture queue coverage regression
on:
  push:
    branches: [fix/tm-queue-coverage-20261003, main]
    paths: [public/toc-mainline.user.js, scripts/apply-tm-queue-coverage.py, scripts/tm-queue-coverage.inc.js, scripts/finalize-tm-queue-priority.mjs, tests/tm-queue-coverage.test.mjs, tests/tm-queue-coverage-browser.mjs, .github/workflows/tm-queue-coverage.yml]
  pull_request:
    branches: [main]
    paths: [public/toc-mainline.user.js, scripts/finalize-tm-queue-priority.mjs, tests/tm-queue-coverage.test.mjs, tests/tm-queue-coverage-browser.mjs, .github/workflows/tm-queue-coverage.yml]
permissions:
  contents: read
concurrency:
  group: queue-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply scoped patch on repair branch only
        if: github.ref == 'refs/heads/fix/tm-queue-coverage-20261003'
        run: |
          python scripts/apply-tm-queue-coverage.py
          node scripts/finalize-tm-queue-priority.mjs --apply
          git diff --check
      - name: Test full queue, metadata recovery and retained source safeguards
        run: |
          set -euo pipefail
          {
            node --check public/toc-mainline.user.js
            node scripts/finalize-tm-queue-priority.mjs
            node tests/tm-queue-coverage.test.mjs
            node tests/tm-missing-only.test.mjs
            node tests/tm-immediate-restart.test.mjs
            node tests/tm-controller-recovery.test.mjs
            node tests/tm-newest-retry.test.mjs
            node scripts/test-tm223-upload.mjs
            node scripts/test-tm220-release.mjs
            node scripts/test-tm222-auto-report.mjs
          } | tee "$RUNNER_TEMP/queue-coverage-tests.txt"
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify61-paper run and remaining counters in actual browser fixture
        run: |
          node tests/tm-queue-coverage-browser.mjs
          node tests/tm-missing-only-browser.mjs
      - name: Build self-contained compatible installer
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node scripts/validate-tm220-artifacts.mjs public
          node --check public/gallery-vpn-bridge.user.js
          grep -F '全队列补缺6' public/gallery-vpn-bridge.user.js
          mkdir -p "$RUNNER_TEMP/queue-coverage-output"
          cp public/gallery-vpn-bridge.user.js public/toc-mainline.user.js "$RUNNER_TEMP/queue-coverage-output/"
          sha256sum "$RUNNER_TEMP/queue-coverage-output/"*.js | tee "$RUNNER_TEMP/queue-coverage-output/sha256.txt"
      - name: Commit tested runtime and fixtures only, excluding workflow files
        if: github.ref == 'refs/heads/fix/tm-queue-coverage-20261003'
        run: |
          test "$GITHUB_REF" = refs/heads/fix/tm-queue-coverage-20261003
          git restore -- .github/workflows/tm-missing-only.yml .github/workflows/tm-immediate-restart.yml
          git add public/toc-mainline.user.js scripts/tm-immediate-restart-runtime.inc.js scripts/tm-queue-coverage.inc.js tests/tm-immediate-restart.test.mjs tests/tm-missing-only.test.mjs tests/tm-missing-only-browser.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve pending coverage and continue incomplete capture tasks'
            git push origin HEAD:fix/tm-queue-coverage-20261003
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-coverage-tested
          path: |
            ${{ runner.temp }}/queue-coverage-output
            ${{ runner.temp }}/queue-coverage-tests.txt
            ${{ runner.temp }}/tm-queue-coverage-browser.json
            ${{ runner.temp }}/tm-queue-coverage-browser.png
            ${{ runner.temp }}/tm-queue-coverage-trace.zip
            ${{ runner.temp }}/tm-missing-browser-report.json
            ${{ runner.temp }}/tm-missing-browser-trace.zip
          retention-days: 14
