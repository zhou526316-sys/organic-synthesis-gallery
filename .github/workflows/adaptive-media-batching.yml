name: Completed paired media publication regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-media-batching.yml'
      - '.github/workflows/new-body-continuous.yml'
      - '.github/workflows/github-pages.yml'
      - 'audit/media-auto-policy.json'
      - 'cloudflare/scripts/merge-new-body-auto.mjs'
      - 'cloudflare/scripts/merge-local-captures.mjs'
      - 'scripts/test-adaptive-media-batching.mjs'
      - 'scripts/test-new-body-auto.mjs'
      - 'scripts/select-new-body-live-dois.mjs'
      - 'scripts/test-new-body-live-selection.mjs'
      - 'scripts/verify-new-body-auto-live.mjs'
      - 'docs/body-media-publication.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: adaptive-media-batching
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check code and completed-packet contracts
        run: |
          set -euo pipefail
          node --check cloudflare/scripts/merge-new-body-auto.mjs
          node --check cloudflare/scripts/merge-local-captures.mjs
          node --check scripts/test-adaptive-media-batching.mjs
          node scripts/test-adaptive-media-batching.mjs | tee "$RUNNER_TEMP/adaptive-media.log"
          grep -F 'ADAPTIVE_BATCH_TEST_SUMMARY ' "$RUNNER_TEMP/adaptive-media.log"
          node scripts/test-new-body-live-selection.mjs
          node --check scripts/verify-new-body-auto-live.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const continuous=fs.readFileSync('.github/workflows/new-body-continuous.yml','utf8');
          assert.match(continuous,/cron:\s*'\*\/5 \* \* \* \*'/);
          assert.match(continuous,/workflow_run:[\s\S]*Deploy GitHub Pages frontend/);
          assert.ok(continuous.includes('ref: main')&&continuous.includes('deployment_ref: ${{ needs.inspect.outputs.deployment_ref }}')&&continuous.includes('git ls-remote origin refs/heads/main'));
          const pages=fs.readFileSync('.github/workflows/github-pages.yml','utf8');
          assert.ok(pages.includes("deployment_ref:")&&pages.includes("inputs.deployment_ref != '' && inputs.deployment_ref || 'main'"));
          const toc=pages.indexOf('Merge D1-free local VPN captures');
          const body=pages.indexOf('Validate and atomically merge completed TOC plus body packets');
          assert.ok(toc>0&&body>toc,'same-build local TOC merge must precede body publication');
          assert.ok(!pages.slice(body,body+220).includes('continue-on-error: true'),'paired media publication must fail closed');
          const policy=JSON.parse(fs.readFileSync('audit/media-auto-policy.json','utf8'));
          assert.equal(policy.minNewArticles,1);assert.equal(policy.maxNewArticles,25);assert.equal(policy.requireCompletedCapturePacket,true);assert.equal(policy.backfillStabilityMinutes,15);
          const tm=fs.readFileSync('public/toc-mainline.user.js','utf8');
          assert.ok(tm.includes('BEGIN OSG_AUTO_REPORT_V1')&&tm.includes('enqueueCaptureReport')&&tm.includes("var VERSION = '6.2.20';")&&tm.includes("var CONTROLLER_REVISION = '2.2."));
          console.log('ADAPTIVE_WORKFLOW_ORDER_OK');
          JS
          git diff --check
      - name: Extract frozen real new-image fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,urllib.error,urllib.parse,urllib.request,zipfile
          class BoundRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if result is not None and urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(newurl).netloc:
                      result.remove_header('Authorization')
                  return result
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'auto-fixture';(out/'images').mkdir(parents=True)
          artifact='https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery/actions/artifacts/10737978319/zip'
          try:
              req=urllib.request.Request(artifact,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(BoundRedirect()).open(req,timeout=40) as r: raw=r.read(32000001)
              assert len(raw)<=32000000 and hashlib.sha256(raw).hexdigest()=='d2ca8159ecdabb4ee21aa389f92f621de0c962eec657ba9514e31f584ded782c'
              z=zipfile.ZipFile(io.BytesIO(raw));ev=json.loads(z.read('evidence.json'));assert not ev['errors']
              (out/'evidence.json').write_text(json.dumps(ev))
              for row in ev['images']:
                  if row.get('reviewMarker',{}).get('revision')!='1': continue
                  assert re.fullmatch(r'images/next-\d{3}\.(svg|png|webp)',row['file'])
                  b=z.read(row['file']);assert hashlib.sha256(b).hexdigest()==row['sha256'];(out/row['file']).write_bytes(b)
              print('BODY_FIXTURE_SOURCE frozen_actions_artifact')
          except urllib.error.HTTPError as error:
              if error.code != 410: raise
              # GitHub artifacts expire. Fall back only to already-published,
              # content-addressed Gallery assets; no publisher network is used.
              site='https://gallery.gczhouwld.com/'
              with urllib.request.urlopen(site+'auto-body-publication.json?fixture=1',timeout=40) as r:
                  snapshot=json.loads(r.read(20000001))
              candidates=[entry for entry in snapshot.get('items',[]) if entry.get('record',{}).get('reviewMarker',{}).get('revision')=='1'
                  and entry.get('record',{}).get('contentType') in ('image/svg+xml','image/png','image/webp')]
              chosen=[]
              for required in ('image/svg+xml','image/png'):
                  row=next((entry for entry in candidates if entry['record'].get('contentType')==required),None)
                  assert row, 'published fixture missing '+required
                  chosen.append(row)
              seen={(entry['record']['doi'],entry['record']['id'],entry['record']['sha256']) for entry in chosen}
              for entry in candidates:
                  key=(entry['record']['doi'],entry['record']['id'],entry['record']['sha256'])
                  if key in seen: continue
                  chosen.append(entry);seen.add(key)
                  if len(chosen)==9: break
              assert len(chosen)==9
              images=[]
              ext={'image/svg+xml':'svg','image/png':'png','image/webp':'webp'}
              for index,entry in enumerate(chosen):
                  row=dict(entry['record']);suffix=ext[row['contentType']]
                  rel=f'images/next-{index:03d}.{suffix}';url=urllib.parse.urljoin(site,entry['imageUrl'])
                  with urllib.request.urlopen(url,timeout=40) as response: body=response.read(4000001)
                  assert len(body)<=4000000 and hashlib.sha256(body).hexdigest()==row['sha256']
                  row['file']=rel;images.append(row);(out/rel).write_bytes(body)
              ev={'errors':[],'images':images,'fixtureSource':'published_content_addressed_snapshot'}
              (out/'evidence.json').write_text(json.dumps(ev))
              print('BODY_FIXTURE_SOURCE published_content_addressed_snapshot')
          PY
      - name: Run actual-byte and prior publication regressions
        env:
          BODY_AUTO_FIXTURE: ${{ runner.temp }}/auto-fixture
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/test-new-body-auto.mjs | tee "$RUNNER_TEMP/new-body-auto.log"
          grep -F 'NEW_BODY_AUTO_TESTS ' "$RUNNER_TEMP/new-body-auto.log"
          node scripts/test-reviewed-body.mjs
          node scripts/test-body-review-markers.mjs
          git diff --check
          git diff --exit-code -- public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/rolling-supplement.json public/toc-mainline.user.js src cloudflare/worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-media-batching-tested
          path: |
            ${{ runner.temp }}/adaptive-media.log
            ${{ runner.temp }}/new-body-auto.log
          retention-days: 14
          if-no-files-found: warn
