name: Tampermonkey publisher and outbox throughput 2026-10-16
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'tests/tm-throughput-20261016.test.mjs'
      - 'tests/tm-image-outbox-recovery-20261008.test.mjs'
      - 'tests/tm-owner-pdf-replay-20261008.test.mjs'
      - '.github/workflows/tm-throughput-recovery-20261016.yml'
  push:
    branches: [main]
    paths:
      - 'public/toc-mainline.user.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - '.github/workflows/tm-throughput-recovery-20261016.yml'
permissions:
  contents: read
jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Test owner PDF security, real image spool, per-DOI isolation without media writes
        run: |
          set -euo pipefail
          node --check public/toc-mainline.user.js
          node --check cloudflare/scripts/build-bridge-loader.mjs
          node --test tests/tm-throughput-20261016.test.mjs tests/tm-image-outbox-recovery-20261008.test.mjs tests/tm-owner-pdf-replay-20261008.test.mjs tests/tm-heartbeat-circuit-20261015.test.mjs
          node --test tests/tm-gap-recovery.test.mjs tests/tm-inventory-startup.test.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
      - name: Assemble current bundled release from the verified source
        env:
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          set -euo pipefail
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          grep -F '// @version      2.2.90' public/gallery-vpn-bridge.user.js
          grep -F "var INSTALL_REVISION = '6.2.71';" public/gallery-vpn-bridge.user.js
          grep -F '// @run-at       document-end' public/gallery-vpn-bridge.user.js
      - name: Keep immutable tested installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-throughput-2-2-90
          path: public/gallery-vpn-bridge.user.js
          retention-days: 7
