name: Backfill article figure dimensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FIGURE_DIMENSIONS_BACKFILL'
      - 'cloudflare/scripts/backfill-figure-dimensions.mjs'
      - '.github/workflows/backfill-figure-dimensions.yml'

permissions:
  contents: read

concurrency:
  group: figure-dimensions-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
      GALLERY_BACKEND_SOURCE: https://organic-synthesis-gallery.zhou526316.workers.dev
      FIGURE_DIMENSION_LIMIT: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Resolve D1
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const row=rows.find(x=>x.name===process.env.D1_NAME);
          if(row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"
      - name: Build D1 config
        working-directory: cloudflare/worker
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          cat > wrangler.backfill.toml <<EOF
          name = "organic-synthesis-gallery-figure-dimension-backfill"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF
      - name: Backfill stored figure dimensions
        working-directory: cloudflare/worker
        run: node ../scripts/backfill-figure-dimensions.mjs
        env:
          D1_CONFIG: wrangler.backfill.toml
