name: WeChat Oct16 reviewed source staging
on:
  push:
    branches: [wechat-oct16-autoreview-r2]
    paths: ['audit/automation-triggers/wechat-oct16-reviewed-stage.json']
permissions:
  contents: write
concurrency:
  group: wechat-oct16-reviewed-stage
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill only the independently verified missing author list
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path.cwd()
          evidence=json.loads((root/'audit/wechat-working/2026-10-16-integration-author-evidence.json').read_text())
          doi=evidence['doi'];expected=evidence['authors'];title=evidence['title']
          names=['rolling-supplement.json','literature-supplement.json','automation-supplement.json','curated-supplement.json','final-audit-supplement.json','manual-supplement.json','total-synthesis.json']
          changes=[];seen=0
          for name in names:
            p=root/'public'/name
            if not p.exists():continue
            original=p.read_bytes();obj=json.loads(original)
            groups=[obj] if isinstance(obj,list) else [obj[k] for k in ('papers','items','records') if isinstance(obj.get(k),list)]
            changed=False
            for group in groups:
              for row in group:
                if not isinstance(row,dict) or str(row.get('doi','')).lower()!=doi:continue
                seen+=1
                assert row.get('title')==title,'DOI/title mismatch'
                assert not row.get('authors') or row['authors']==expected,'Nonempty different author list requires review'
                if not row.get('authors'):
                  row['authors']=expected;changed=True
            if changed:
              p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
              changes.append({'path':str(p.relative_to(root)),'beforeSha256':hashlib.sha256(original).hexdigest(),'afterSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'fieldsChanged':['authors']})
          assert seen>0,'DOI not found; no entry may be invented'
          pathlib.Path('/tmp/wechat-oct16-author-changes.json').write_text(json.dumps(changes))
          print(json.dumps({'doi':doi,'matchingRows':seen,'changes':changes,'authorCount':len(expected)}))
          PY
      - name: Install original image decoder
        run: python3 -m pip install --quiet Pillow
      - name: Enforce real catalogue and every locked source and image check
        run: |
          set -euo pipefail
          python3 -m py_compile ops/wechat-publisher/create-draft.py ops/wechat-publisher/reviewed_gallery_entry.py scripts/verify-wechat-oct16-review.py
          python3 scripts/verify-wechat-oct16-review.py | tee /tmp/wechat-oct16-actual-source-check.json
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('/tmp/wechat-oct16-actual-source-check.json')
          r=json.loads(p.read_text())
          assert r['status']=='actual_main_catalogue_and_reviewed_renderer_pass'
          assert r['papers']==35 and r['assets']==41 and r['bodyFigures']==[20,18]
          r.update({'previousGreenRunWasNotApproval':True,'pipelineFailurePropagationFixed':True,'metadataRepair':json.loads(pathlib.Path('/tmp/wechat-oct16-author-changes.json').read_text()),'draftWritePerformed':False,'publicSendAuthorized':False})
          out=pathlib.Path('audit/wechat-working/2026-10-16-r2-integration-check.json');out.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print('PASS: all locked sources/rasters, native renderer, exact 35-paper catalogue and source-authenticated authors')
          PY
      - name: Commit metadata repair and actual passing integration receipt only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          changes=json.load(open('/tmp/wechat-oct16-author-changes.json'))
          paths=[x['path'] for x in changes]+['audit/wechat-working/2026-10-16-r2-integration-check.json']
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+paths,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','commit','-m','fix(wechat): verify missing Nature author list and pass strict Oct16 source integration'],check=True)
            subprocess.run(['git','push','origin','HEAD:wechat-oct16-autoreview-r2'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-oct16-real-source-check
          path: |
            /tmp/wechat-oct16-actual-source-check.json
            /tmp/wechat-oct16-author-changes.json
          retention-days: 7
