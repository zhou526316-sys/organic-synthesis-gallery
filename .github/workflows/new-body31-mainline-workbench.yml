name: Prepare approved new body31 on current mainline
on:
  push:
    branches: [recovery/new-body31-mainline]
    paths: ['.github/workflows/new-body31-mainline-workbench.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: new-body31-mainline
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/new-body31-mainline
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Recover exact already-approved new capture bytes, not sealed old media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,urllib.parse,urllib.request,zipfile
          artifact=10735114169;expected='d8074cacdbdea81f483b947fc2ea4568859e239781c033150538c8734d3979eb'
          class BoundRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  out=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if out is not None and urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(newurl).netloc:out.remove_header('Authorization')
                  return out
          req=urllib.request.Request(f'https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(BoundRedirect()).open(req,timeout=40) as r:raw=r.read(32000001)
          assert len(raw)<=32000000 and hashlib.sha256(raw).hexdigest()==expected
          z=zipfile.ZipFile(io.BytesIO(raw));ev=json.loads(z.read('evidence.json'));assert ev['errors']==[]
          rows=[r for r in ev['images'] if r['reviewId'] in {f'next-{n:03d}' for n in range(1,32)}];assert len(rows)==31
          dest=pathlib.Path('audit/media-recovery/body-batches/assets');dest.mkdir(parents=True,exist_ok=True)
          items=[]
          for r in rows:
              assert r['hashVerified'] and not r.get('error') and r['captureVersion']=='6.2.20' and r['pageDoi']==r['doi'] and r['mediaGeneration']==1790082000000
              b=z.read(r['file']);h=hashlib.sha256(b).hexdigest();assert h==r['sha256'] and h.startswith(r['contentHash']) and len(b)==r['actualBytes']==r['byteLength']
              ext=pathlib.PurePosixPath(r['file']).suffix;assert ext in ('.svg','.png','.webp')
              asset=dest/(h+ext);asset.write_bytes(b)
              fields=['doi','id','label','caption','articleUrl','sourceUrl','captureVersion','pageDoi','jobId','mediaGeneration','contentHash','contentType','byteLength','width','height']
              item={k:r[k] for k in fields};item.update(approved=True,role='article_figure',reviewId=r['reviewId'],sha256=h,originalUpdatedAt=r['updatedAt'],originalR2Key=r['r2Key'],order=int(r['sortOrder']),assetPath=asset.as_posix(),quality='vector_or_mixed_svg' if ext=='.svg' else 'captured_raster_'+str(r['width'])+'px')
              items.append(item)
          pathlib.Path(os.environ['RUNNER_TEMP'],'body31-input.json').write_text(json.dumps(items,ensure_ascii=False))
          print('PRESERVED_NEW_BODY_FILES '+json.dumps({'files':len(items),'bytes':sum(i['byteLength'] for i in items),'sourceArtifact':artifact,'quarantineUnchanged':True,'r2Writes':0}))
          PY
      - name: Bind approvals using current shared evidence format
        run: |
          node --input-type=module - <<'JS'
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {canonicalBodyEvidence,BODY_MEDIA_GENERATION} from './shared/body-media-evidence.js';
          import {verifyApprovedBodyItem} from './cloudflare/scripts/merge-approved-body-batches.mjs';
          const items=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/body31-input.json'));
          const at=new Date().toISOString();
          for(const item of items){
            item.review={decision:'approved',reviewedAt:at,evidenceSha256:createHash('sha256').update(canonicalBodyEvidence(item,item.sha256)).digest('hex'),note:'Carried forward previously individually reviewed NEW current-generation Figure/Scheme decisions next-001 through next-031 from frozen artifact10735114169; exact bytes and present-mainline identity contract revalidated. Not historical sealed media.'};
            const b=await readFile(item.assetPath);verifyApprovedBodyItem(item,b);
            assert.throws(()=>verifyApprovedBodyItem({...item,caption:item.caption+' altered'},b),/evidence_changed/);
          }
          const batches=[items.slice(0,29),items.slice(29)];
          for(const [i,part] of batches.entries()){
            assert.ok(part.length<=30&&new Set(part.map(x=>x.doi)).size<=5);
            const batchId='body-new31-'+(i===0?'a':'b')+'-20260923';
            const batch={schemaVersion:1,batchId,mediaGeneration:BODY_MEDIA_GENERATION,approvedCount:part.length,sourceArtifact:10735114169,sourceArchiveSha256:'d8074cacdbdea81f483b947fc2ea4568859e239781c033150538c8734d3979eb',sourceReadAt:'2026-09-23T06:33:08.326536+00:00',scope:'Explicit NEW captures only. Prior same-DOI/source/role/byte reviews reused, current evidence fingerprints revalidated. No full-article completeness claim.',items:part};
            await writeFile('audit/media-recovery/body-batches/'+batchId+'.json',JSON.stringify(batch,null,2)+'\n');
          }
          await writeFile('PAGES_REFRESH','Approved new body31 publication; immutable artifact10735114169; preserve current mainline capture markers and literature authorization.\n');
          console.log('CURRENT_MARKER_APPROVALS verified=31 captionTamperRejected=31 batches=2');
          JS
      - name: Verify incremental publication and preservation
        run: |
          printf '{"version":2,"items":{}}' > public/media-index.json
          node cloudflare/scripts/merge-reviewed-toc.mjs
          node cloudflare/scripts/merge-sealed-media-batch2.mjs
          node cloudflare/scripts/merge-reviewed-body.mjs
          node cloudflare/scripts/merge-approved-body-batches.mjs
          node cloudflare/scripts/verify-static-media-integrity.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {mergeApprovedBodyBatches} from './cloudflare/scripts/merge-approved-body-batches.mjs';
          const s=JSON.parse(await readFile('public/body-batches-status.json'));
          assert.equal(s.added.filter(x=>x.batchId.startsWith('body-new31-')).length,31);
          const media=JSON.parse(await readFile('public/media-index.json'));const before=JSON.stringify(media.items);
          assert.equal(Object.values(media.items).filter(r=>r.toc?.recoveryId==='toc-batch1-20260922').length,83);
          assert.equal(Object.values(media.items).filter(r=>r.toc?.recoveryId==='sealed-media-batch2-20260923'&&!/fallback/i.test(r.toc.reason||'')).length,18);
          const again=await mergeApprovedBodyBatches();assert.equal(again.added.length,0);assert.equal(JSON.stringify(JSON.parse(await readFile('public/media-index.json')).items),before);
          await writeFile(process.env.RUNNER_TEMP+'/body31-dry-run.json',JSON.stringify({added:s.added.length,dois:[...new Set(s.added.map(x=>x.doi))],previousTocBatchesPreserved:true,idempotent:true,allNewBytesVerified:true,stagingWrites:0,stagingDeletes:0}));
          JS
          git diff --check
          git diff --exit-code -- cloudflare shared src public/toc-mainline.user.js public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/rolling-supplement.json
      - name: Commit approved data and media refresh marker on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/recovery/new-body31-mainline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/media-recovery/body-batches PAGES_REFRESH
          if ! git diff --cached --quiet; then
            git commit -m 'media: add 31 reviewed new body files through the current shared approval contract'
            git push origin HEAD:recovery/new-body31-mainline
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/body31-tested-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-body31-mainline-tested
          path: |
            ${{ runner.temp }}/body31-dry-run.json
            ${{ runner.temp }}/body31-tested-head.txt
          retention-days: 7
          if-no-files-found: warn
