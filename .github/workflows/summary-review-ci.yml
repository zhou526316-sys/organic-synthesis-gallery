name: Daily scheduled summary backend regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/worker/src/article-summary.js'
      - 'cloudflare/worker/src/scheduled-summary-handoff.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-article-summary.mjs'
      - 'cloudflare/worker/scripts/test-scheduled-summary-handoff.mjs'
      - 'cloudflare/worker/package.json'
      - 'public/scheduled-article-summaries.json'
      - 'src/user-ui/paper-actions.ts'
      - 'docs/summary-review-contract-v2.md'
      - 'docs/scheduled-summary-contract.md'
      - '.github/workflows/deploy-worker-frontend.yml'
      - '.github/workflows/summary-review-ci.yml'

permissions:
  contents: read

jobs:
  scheduled-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax and no-API production contract
        run: |
          set -euo pipefail
          node --check cloudflare/worker/src/article-summary.js
          node --check cloudflare/worker/src/scheduled-summary-handoff.js
          node --check cloudflare/worker/src/index.js
          node --check cloudflare/worker/scripts/test-article-summary.mjs
          node --check cloudflare/worker/scripts/test-scheduled-summary-handoff.mjs
          ! grep -F 'OPENAI_API_KEY:' .github/workflows/deploy-worker-frontend.yml
          ! grep -F 'runSummaryReviewCycle' cloudflare/worker/src/index.js
          grep -F 'SUMMARY_REVIEW_ENABLED = "0"' .github/workflows/deploy-worker-frontend.yml
          grep -F 'SUMMARY_MODE = "scheduled_chatgpt_daily_no_api"' .github/workflows/deploy-worker-frontend.yml
          grep -F 'crons = ["0 */6 * * *"]' .github/workflows/deploy-worker-frontend.yml
          grep -F "'/api/article-summary/scheduled-handoff'" cloudflare/worker/src/index.js
          grep -F "'/api/admin/article-summary/handoff-backfill'" cloudflare/worker/src/index.js
          grep -F "Backfill encrypted daily-summary handoff" .github/workflows/deploy-worker-frontend.yml
          grep -F "scheduled_daily_1200_asia_shanghai" cloudflare/worker/src/index.js
          grep -F "RSA-OAEP-256+A256GCM" cloudflare/worker/src/scheduled-summary-handoff.js
          grep -F "SCHEDULED_SUMMARY_ASSET" cloudflare/worker/src/scheduled-summary-handoff.js
          grep -F "'public/scheduled-article-summaries.json'" .github/workflows/deploy-worker-frontend.yml
      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Run Evidence and encrypted handoff regressions
        working-directory: cloudflare/worker
        run: |
          npm run test:article-summary
          npm run test:scheduled-summary-handoff
      - name: Wrangler dry-run
        working-directory: cloudflare/worker
        run: npm run check
