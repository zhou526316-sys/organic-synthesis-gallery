name: Owner PDF Tencent gateway isolated security regression
on:
  push:
    branches:
      - feature/owner-private-pdf-dual-ingress-20261008
    paths:
      - 'deploy/pdf-gateway/**'
      - '.github/workflows/pdf-tencent-gateway-regression.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gateway-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-private-pdf-dual-ingress-20261008
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Parse user-facing Windows PowerShell deployment launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'deploy/pdf-gateway/run-from-windows.ps1',
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell launcher syntax invalid" }
      - name: Install isolated Nginx binary for HTTP-01 address-precedence regression
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          fi
      - name: Syntax and owner PDF gateway security regression
        run: |
          set -euo pipefail
          bash -n deploy/pdf-gateway/install.sh deploy/pdf-gateway/test_acme_permissions.sh deploy/pdf-gateway/test_acme_vhost_precedence.sh
          bash deploy/pdf-gateway/test_acme_permissions.sh
          bash -x deploy/pdf-gateway/test_acme_vhost_precedence.sh
          python -m py_compile deploy/pdf-gateway/gateway.py deploy/pdf-gateway/test_gateway.py
          python -m unittest discover -s deploy/pdf-gateway -p 'test_gateway.py' -v

  windows-powershell51:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-private-pdf-dual-ingress-20261008
          persist-credentials: false
      - name: Validate literal UTF-8 BOM for Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'This test requires Windows PowerShell 5.1, not pwsh 7'
          }
          $file = 'deploy/pdf-gateway/run-from-windows.ps1'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'Windows PowerShell 5.1 requires a UTF-8 BOM for this installer'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Windows PowerShell 5.1 failed to parse the checked-out installer'
          }
          Write-Host 'WIN_PS51_LOCAL_PARSE_PASS'
      - name: Repeat user raw download and Windows PowerShell 5.1 parse
        shell: powershell
        run: |
          $uri = 'https://raw.githubusercontent.com/zhou526316-sys/organic-synthesis-gallery/' + $env:GITHUB_SHA + '/deploy/pdf-gateway/run-from-windows.ps1'
          $dest = Join-Path $env:TEMP 'gallery-pdf-gateway-download-ps51.ps1'
          Invoke-WebRequest -Uri $uri -OutFile $dest -UseBasicParsing
          $bytes = [System.IO.File]::ReadAllBytes($dest)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'Raw GitHub download lost the UTF-8 BOM'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $dest, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Windows PowerShell 5.1 failed to parse downloaded installer'
          }
          Write-Host 'WIN_PS51_RAW_DOWNLOAD_PARSE_PASS'

      - name: Check one-session Windows PowerShell 5.1 installer and pinned raw URL
        shell: powershell
        run: |
          $path = 'deploy/pdf-gateway/run-once-from-windows.ps1'
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
          if ($b.Length -lt 3 -or $b[0] -ne 239 -or $b[1] -ne 187 -or $b[2] -ne 191) {
            throw 'The one-SSH launcher must include a Windows PS 5.1 UTF-8 BOM'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'New launcher syntax invalid' }
          $text = [System.IO.File]::ReadAllText((Resolve-Path $path).Path)
          if ([regex]::Matches($text,'& ssh\.exe').Count -ne 1) { throw 'Expected exactly one SSH process' }
          if ($text.Contains('scp.exe')) { throw 'No additional SCP authentication allowed' }
          if (-not $text.Contains('bc50cc94f6a83fdd85a579442b8c4a5ee6b10784')) {
            throw 'Expected immutable reviewed gateway version'
          }
          if (-not $text.Contains('sudo bash "$WORK/install.sh" "$MODE"')) {
            throw 'Expected guarded installer, not a direct nginx overwrite'
          }
          Write-Host 'WIN_PS51_ONE_SSH_INSTALLER_PASS'
      - name: Verify GitHub raw download of one-session launcher under PowerShell 5.1
        shell: powershell
        run: |
          $url = 'https://raw.githubusercontent.com/zhou526316-sys/organic-synthesis-gallery/' +
            $env:GITHUB_SHA + '/deploy/pdf-gateway/run-once-from-windows.ps1'
          $file = Join-Path $env:TEMP 'gallery-one-ssh-windows-ps51.ps1'
          Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing
          $b = [System.IO.File]::ReadAllBytes($file)
          if ($b[0] -ne 239 -or $b[1] -ne 187 -or $b[2] -ne 191) {
            throw 'Raw download missing UTF-8 BOM'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw 'PS 5.1 downloaded installer syntax invalid' }
          Write-Host 'WIN_PS51_ONE_SSH_RAW_DOWNLOAD_PASS'
