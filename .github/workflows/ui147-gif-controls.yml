name: Isolate GIF rendering versus test instrumentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui147-gif-controls.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03f0d46178dd702077c97004e9f8d3dcb015ce00
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build unchanged candidate and install pinned browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/gif-control-install.log 2>&1 || { tail -60 /tmp/gif-control-install.log; exit 1; }
          npm run build
      - name: Create standalone positive and negative controls as well as unchanged Gallery
        run: |
          mkdir -p gif-controls
          python - <<'PY'
          from pathlib import Path
          body='''import { test, expect } from '@playwright/test';
          import { open, gifFile, GIF, originalHash } from './status-image-fixtures';
          import { expectAnimatedImage } from './animated-image-evidence';
          test.use({trace: TRACE,serviceWorkers:'block'});
          for(const kind of ['plain-data','plain-blob','gallery','static-negative']) test(`MODE ${kind}`,async({page},info)=>{
            let image;
            if(kind==='gallery') {
              const actions=await open(page,390);
              await actions.locator('input[data-status-image="to-read"]').setInputFiles(gifFile);
              await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
              image=actions.locator('[data-action="set-status:to-read"] .status-image');
              await expect(image).toHaveAttribute('data-image-source','original');
              await originalHash(image);
            } else {
              // No Gallery scripts/styles/IndexedDB or URL hydration run here.
              await page.setContent('<img id="control" alt="Standalone animation control" style="width:72px;height:36px">');
              await page.locator('#control').evaluate((node,args)=>{
                if(args.kind==='static-negative') {
                  const c=document.createElement('canvas'); c.width=120;c.height=60;
                  const ctx=c.getContext('2d')!;ctx.fillStyle='#f00';ctx.fillRect(0,0,120,60);
                  (node as HTMLImageElement).src=c.toDataURL();return;
                }
                const data='data:image/gif;base64,'+args.base64;
                const bytes=Uint8Array.from(atob(args.base64),c=>c.charCodeAt(0));
                (node as HTMLImageElement).src=args.kind==='plain-data'?data:URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));
              },{kind,base64:GIF.toString('base64')});
              image=page.locator('#control');
              await expect.poll(()=>image.evaluate(node=>(node as HTMLImageElement).naturalWidth)).toBe(120);
            }
            console.log('CONTROL',JSON.stringify({mode:'MODE',kind,visibility:await page.evaluate(()=>document.visibilityState)}));
            if(kind==='static-negative') {
              let failed=false;
              try {await expectAnimatedImage(image,info);} catch(error) {failed=true;expect(String(error)).toContain('toBeGreaterThan');}
              expect(failed).toBe(true);
            } else await expectAnimatedImage(image,info);
          });
          '''
          for mode in ['off','on']:
              Path('tests/pr147-gif-control-'+mode+'.spec.ts').write_text(body.replace('TRACE',repr(mode)).replace('MODE',mode))
          PY
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gif-control-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Run controls and retain every result
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: gif-controls/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/pr147-gif-control- --browser=webkit --workers=1 --reporter=line,json --output=gif-controls/tests 2>&1 | tee gif-controls/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr147-gif-controls
          path: gif-controls/
          retention-days: 7
