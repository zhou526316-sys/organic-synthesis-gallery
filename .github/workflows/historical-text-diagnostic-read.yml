name: Read historical text diagnostic aggregates (owner only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-text-diagnostic-read.yml'
      - 'audit/automation-triggers/historical-text-diagnostic-read.json'
      - 'scripts/audit-historical-text-diagnostics.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-text-diagnostic-readonly
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify reader syntax
        run: node --check scripts/audit-historical-text-diagnostics.mjs
      - name: Aggregate at most 200 private D1 metadata events without exporting DOI or credentials
        env:
          BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}
        run: node scripts/audit-historical-text-diagnostics.mjs
      - name: Validate private aggregate invariants without article content
        run: |
          node -e "const r=require(process.env.RUNNER_TEMP+'/historical-text-aggregate.json');const sum=v=>Object.values(v||{}).reduce((a,b)=>a+b,0);if(!r.ok||r.rawEventsReleased!==0||r.bodyReleased!==false||sum(r.byPublisherAndReason)!==r.attempts||sum(r.byPublisherAndHttpStatus)!==r.attempts||sum(r.byPublisherAndVersion)!==r.attempts)process.exit(1);console.log('HISTORICAL_DIAGNOSTIC_PUBLISHER_BREAKDOWN_VERIFIED '+r.attempts)"
      - name: Retain only aggregate statistics (no raw logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-historical-text-diag-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-text-aggregate.json
          retention-days: 3
          if-no-files-found: warn
