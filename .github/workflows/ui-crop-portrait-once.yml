name: Align portrait crop geometry once
on:
  push:
    branches: [feat/ui-image-crop-edit-20260923]
    paths: [.github/workflows/ui-crop-portrait-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Bound canvas display to its real aspect ratio
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/user-ui/image-cropper.ts')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='e32c4cd961e8b8eed4ccb7a8d84f7e07df9b161f', 'Re-review changed crop editor'
          t=p.read_text()
          old='  const ctx = canvas.getContext(\'2d\')!;'
          assert t.count(old)==1
          t=t.replace(old,"  // A portrait canvas must not stretch to the grid column while its height\n  // is capped; letterboxing would misalign pointer and source coordinates.\n  canvas.style.maxWidth = `${canvas.width}px`;\n  canvas.style.justifySelf = 'center';\n"+old)
          p.write_text(t)
          p=Path('tests/status-crop-edit.spec.ts');t=p.read_text()
          assert 'portrait source coordinates stay aligned' not in t
          t+='''
          test('portrait source coordinates stay aligned with the visible crop canvas',async({page},info)=>{
            const actions=await open(page,390);
            const bytes=await page.evaluate(()=>{
              const c=document.createElement('canvas');c.width=200;c.height=600;
              const x=c.getContext('2d')!;
              ['#ff0000','#00ff00','#0000ff'].forEach((color,i)=>{x.fillStyle=color;x.fillRect(0,i*200,200,200);});
              return c.toDataURL().split(',')[1];
            });
            await actions.locator('[data-status-image="to-read"]').setInputFiles({name:'portrait.png',mimeType:'image/png',buffer:Buffer.from(bytes,'base64')});
            await expect(actions.locator('[data-status-image-message]')).toContainText(/原图已保存|Original saved/);
            const dialog=await crop(page,actions);const canvas=dialog.locator('[data-crop-canvas]');
            const box=(await canvas.boundingBox())!;
            expect(Math.abs((box.width-2)/(box.height-2)-1/3)).toBeLessThan(.01);
            await page.mouse.move(box.x+box.width/2,box.y+box.height/2);await page.mouse.down();
            await page.mouse.move(box.x+box.width/2,box.y+box.height/2-box.height/3,{steps:4});await page.mouse.up();
            expect(Number(await dialog.locator('[data-crop-field="y"]').inputValue())).toBeLessThanOrEqual(2);
            await page.screenshot({path:info.outputPath('portrait-crop-aligned.png')});
            await dialog.locator('[data-crop-apply]').click();
            await expect.poll(async()=>(await state(page)).imageCrop?.recipe.mode).toBe('square');
            expect((await pixels(page,(await state(page)).imageData)).center).toEqual([255,0,0,255]);
          });
          '''
          p.write_text(t)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/image-cropper.ts tests/status-crop-edit.spec.ts
          git commit -m 'fix(ui): preserve portrait canvas aspect and accurate drag coordinates'
          git push origin HEAD:feat/ui-image-crop-edit-20260923
