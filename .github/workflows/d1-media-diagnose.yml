name: Diagnose D1 media schema

on:
  push:
    branches: [main]
    paths:
      - 'D1_MEDIA_DIAGNOSE_NOW'
      - '.github/workflows/d1-media-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: d1-media-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund
      - name: Resolve D1
        id: d1
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          D1_ID=$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const row=rows.find(x=>x.name===process.env.D1_NAME);
          if(row?.uuid) process.stdout.write(row.uuid);
          NODE
          )
          test -n "$D1_ID"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"
      - name: Build diagnostic config
        working-directory: cloudflare/worker
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          cat > wrangler.diagnose.toml <<EOF
          name = "organic-synthesis-gallery-diagnose"
          main = "src/index.js"
          compatibility_date = "2026-09-16"
          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$D1_ID"
          EOF
      - name: Print media table list
        working-directory: cloudflare/worker
        run: npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('toc_assets','figure_assets','primary_visual_assets','primary_visual_variants','media_repair_state','media_attempts','media_jobs') ORDER BY name;"
      - name: Print media table columns
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          for table in toc_assets figure_assets primary_visual_assets primary_visual_variants media_repair_state media_attempts media_jobs; do
            echo "===== $table ====="
            npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "PRAGMA table_info($table);" || true
          done
      - name: Count media rows
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          for table in toc_assets figure_assets primary_visual_assets primary_visual_variants media_repair_state media_attempts media_jobs; do
            echo "===== COUNT $table ====="
            npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "SELECT COUNT(*) AS row_count FROM $table;" || true
          done

      - name: Diagnose reader-count storage
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          echo "===== PAPER_READERS SUMMARY ====="
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "
            SELECT
              COUNT(*) AS total_rows,
              SUM(CASE WHEN profile_id LIKE 'ip:%' THEN 1 ELSE 0 END) AS ip_rows,
              SUM(CASE WHEN profile_id NOT LIKE 'ip:%' THEN 1 ELSE 0 END) AS legacy_rows,
              COUNT(DISTINCT doi) AS total_dois,
              COUNT(DISTINCT CASE WHEN profile_id LIKE 'ip:%' THEN doi END) AS ip_dois,
              COUNT(DISTINCT CASE WHEN profile_id NOT LIKE 'ip:%' THEN doi END) AS legacy_dois
            FROM paper_readers;
          "
          echo "===== PAPER_READERS BY SOURCE ====="
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "
            SELECT
              CASE WHEN profile_id LIKE 'ip:%' THEN 'ip' ELSE 'legacy' END AS source,
              COUNT(*) AS rows,
              COUNT(DISTINCT doi) AS dois
            FROM paper_readers
            GROUP BY source
            ORDER BY source;
          "
          echo "===== TOP DOI COUNTS (AGGREGATED ONLY) ====="
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.diagnose.toml --command "
            SELECT
              doi,
              COUNT(*) AS all_count,
              SUM(CASE WHEN profile_id LIKE 'ip:%' THEN 1 ELSE 0 END) AS ip_count,
              SUM(CASE WHEN profile_id NOT LIKE 'ip:%' THEN 1 ELSE 0 END) AS legacy_count
            FROM paper_readers
            GROUP BY doi
            ORDER BY all_count DESC, doi
            LIMIT 20;
          "
