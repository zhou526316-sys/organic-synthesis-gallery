name: Verify Tampermonkey 2.2.29 live
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages frontend', 'Deploy Worker frontend assets']
    types: [completed]
  push:
    branches: [main]
    paths: ['audit/automation-triggers/tm220-live-check.json']
permissions:
  contents: read
concurrency:
  group: tm220-live-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read deployed script and complete queue with matching Worker
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,time,urllib.request
          site='https://gallery.gczhouwld.com/'
          worker='https://organic-synthesis-gallery.zhou526316.workers.dev'
          def get(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=10) as r:
                  assert r.status==200
                  data=r.read(2500001)
              assert len(data)<=2500000
              return data
          for attempt in range(12):
              try:
                  suffix='?releaseCheck='+str(int(time.time()))
                  raw=get(site+'gallery-vpn-bridge.user.js'+suffix);script=raw.decode()
                  assert re.search(r'@version\s+2\.2\.29(?:\s|$)',script), 'userscript not 2.2.29'
                  for marker in ["var VERSION = '6.2.20';",'overnightRetryEligible','checkpointKey','pairedJobs','capture_server_upgrade_pending','GM_listValues','assertBoundCaptureJob','pending_verified_promotion']:
                      assert marker in script, 'script contract '+marker
                  q=json.loads(get(site+'toc-demand-live.json'+suffix))
                  assert q['mediaGeneration']==1790082000000 and q['pairedCaptureRegistry'] is True
                  assert len(q['articles'])==q['webpageDoiCount'] and len(q['articles'])>400
                  assert len({r['doi'] for r in q['articles']})==len(q['articles'])
                  caps=json.loads(get(worker+'/api/media/capture-capabilities'+suffix))
                  assert caps['captureVersion']=='6.2.20' and caps['mode']=='verified-staging' and caps['bodyFigures'] is True
                  assert caps['publishedAutomatically'] is False
                  media=json.loads(get(site+'media-index.json'+suffix))
                  recovered=sum(r.get('toc',{}).get('recoveryId')=='toc-batch1-20260922' for r in media['items'].values())
                  assert recovered>=83, 'reviewed TOCs unexpectedly lost'
                  report={'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'installationUrl':site+'gallery-vpn-bridge.user.js','bridgeVersion':'2.2.29','captureVersion':'6.2.20','scriptBytes':len(raw),'scriptSha256':hashlib.sha256(raw).hexdigest(),'queueArticles':len(q['articles']),'queueGeneratedAt':q['generatedAt'],'retainedReviewedTocs':recovered,'workerCapabilities':caps,'publicReadOnly':True,'realPublisherSessionVerified':False}
                  pathlib.Path(os.environ['RUNNER_TEMP'],'tm220-live.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
                  print('TM220_LIVE_VERIFIED '+json.dumps(report,ensure_ascii=False));break
              except Exception as e:
                  print('TM220_DEPLOYMENT_PENDING',attempt,type(e).__name__,str(e)[:120],flush=True)
                  if attempt==11:raise
                  time.sleep(10)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm220-live-verification
          path: ${{ runner.temp }}/tm220-live.json
          retention-days: 14
          if-no-files-found: warn
