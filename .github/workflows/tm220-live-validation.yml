name: Verify current Tampermonkey live
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages frontend', 'Deploy Worker frontend assets']
    types: [completed]
  push:
    branches: [main]
    paths: ['audit/automation-triggers/tm220-live-check.json', '.github/workflows/tm220-live-validation.yml']
permissions:
  contents: read
concurrency:
  group: tm220-live-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # PR #465 superseded historical Bridge 2.2.55 / Mainline 6.2.36.
      # Reuse the maintained Oct-1+ readback instead of pinning obsolete versions
      # and reporting false negatives after each valid Pages/Worker deployment.
      - name: Verify both canonical installers and protected PDF inventory
        run: |
          node --check scripts/verify-tm-oct1-installer-live.mjs
          node scripts/verify-tm-oct1-installer-live.mjs
      - name: Verify current public literature queue without writes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://gallery.gczhouwld.com/toc-demand-live.json?tmVerify='+Date.now();
          const res=await fetch(url,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
          assert.equal(res.status,200,'queue_http_'+res.status);
          const queue=await res.json(),articles=queue.articles||[];
          assert.equal(articles.length,queue.webpageDoiCount,'queue_count_mismatch');
          assert.ok(articles.length>400,'queue_unexpectedly_small');
          assert.equal(new Set(articles.map(x=>x.doi)).size,articles.length,'queue_duplicate_doi');
          assert.equal(queue.pairedCaptureRegistry,true,'paired_capture_registry_missing');
          assert.equal(queue.mediaGeneration,1790082000000,'media_generation_mismatch');
          assert.ok(/^\d{4}-\d{2}-\d{2}$/.test(String(queue.latestAddedDate||'')),'latest_added_date_missing');
          assert.equal(articles.filter(x=>x.addedDate===queue.latestAddedDate).length,queue.latestAddedCount,'latest_added_count_mismatch');
          console.log('TM_CURRENT_QUEUE_VERIFIED',JSON.stringify({count:articles.length,latestAddedDate:queue.latestAddedDate,latestAddedCount:queue.latestAddedCount,generatedAt:queue.generatedAt}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-current-live-verification
          path: ${{ runner.temp }}/tm-oct1-live-acceptance.json
          retention-days: 14
          if-no-files-found: warn
