name: Tampermonkey manual resume regression

on:
  push:
    branches: [fix/tm-manual-resume-20261007, main]
    paths:
      - public/toc-mainline.user.js
      - cloudflare/scripts/build-bridge-loader.mjs
      - scripts/validate-tm220-artifacts.mjs
      - tests/tm-manual-resume.test.mjs
      - tests/tm-manual-resume-browser.mjs
      - tests/tm-newest-retry.test.mjs
      - .github/workflows/tm-manual-resume-regression.yml

permissions:
  contents: read

concurrency:
  group: tm-manual-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduler_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify shared scheduler and retry contracts
        run: |
          node scripts/finalize-tm-queue-priority.mjs
          node tests/tm-newest-retry.test.mjs
          node tests/tm-manual-resume.test.mjs
  verify:
    if: github.ref == 'refs/heads/fix/tm-manual-resume-20261007'
    needs: scheduler_contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify recovery, existing pause, queue and publisher ownership safeguards
        run: |
          node --check public/toc-mainline.user.js
          node tests/tm-manual-resume.test.mjs
          node tests/tm-immediate-restart.test.mjs
          node tests/tm-controller-recovery.test.mjs
          node tests/tm-queue-coverage.test.mjs
          node tests/tm-missing-only.test.mjs
          node scripts/test-tm221-window-guard.mjs
          node scripts/test-tm220-release.mjs
          node scripts/test-tm223-upload.mjs
          node scripts/validate-tm220-artifacts.mjs source
          git diff --check
      - name: Build and fingerprint the canonical installable Bridge
        env:
          TARGET_API_BASE: https://organic-synthesis-gallery-public.pages.dev
          TARGET_SITE_ORIGIN: https://gallery.gczhouwld.com
          BRIDGE_UPDATE_ORIGIN: https://gallery.gczhouwld.com
        run: |
          node cloudflare/scripts/build-cloudflare-bridge.mjs
          node cloudflare/scripts/build-bridge-loader.mjs
          node --check public/gallery-vpn-bridge.user.js
          node scripts/validate-tm220-artifacts.mjs public
          sha256sum public/gallery-vpn-bridge.user.js | tee "$RUNNER_TEMP/tm-resume-installer.sha256"
      - name: Install bounded Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install chromium
      - name: Verify competing browser control pages and current panel
        run: |
          node tests/tm-manual-resume-browser.mjs
          node scripts/test-tm222-live-progress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-manual-resume-evidence
          path: |
            ${{ runner.temp }}/tm-resume-*
            ${{ runner.temp }}/tm-manual-resume-*
            ${{ runner.temp }}/tm222-*.png
          retention-days: 7
