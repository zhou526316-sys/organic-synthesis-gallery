name: Seed all TOC gaps for VPN Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TOC_AUDIT_NOW'
      - '.github/workflows/toc-audit.yml'
      - 'cloudflare/scripts/seed-all-repair.mjs'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'public/curated-supplement.json'

permissions:
  contents: read

jobs:
  seed-and-audit:
    runs-on: ubuntu-latest
    env:
      BACKEND: https://organic-synthesis-gallery.zhou526316.workers.dev
      TARGET_API_BASE: https://organic-synthesis-gallery.zhou526316.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Seed every tracked DOI into the VPN Bridge repair queue
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/scripts/seed-all-repair.mjs | tee /tmp/seed-all.log

      - name: Verify full bridge queue
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND/api/media/bridge-queue" > /tmp/bridge.json
          curl --fail --silent --show-error "$BACKEND/api/media-audit" > /tmp/audit.json
          node - <<'NODE'
          const fs = require('fs');
          const bridge = JSON.parse(fs.readFileSync('/tmp/bridge.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const seed = fs.readFileSync('/tmp/seed-all.log', 'utf8');
          const seedLine = seed.split(/\r?\n/).find(line => line.startsWith('REPAIR_SEED_SUMMARY '));
          let seedSummary = null;
          if (seedLine) {
            try { seedSummary = JSON.parse(seedLine.slice('REPAIR_SEED_SUMMARY '.length)); } catch {}
          }
          const items = Array.isArray(bridge.items) ? bridge.items : [];
          const summary = {
            trackedDois: seedSummary?.trackedDois ?? null,
            tocMissing: seedSummary?.tocMissing ?? null,
            withToc: seedSummary?.withToc ?? null,
            bridgeQueueCount: items.length,
            queueTocMissing: items.filter(item => item?.tocMissing).length,
            queueSuspiciousToc: items.filter(item => item?.suspiciousToc).length,
            queueFiguresUnder2: items.filter(item => Number(item?.figureCount || 0) < 2).length,
          };
          console.log('FULL_TOC_QUEUE_SUMMARY', JSON.stringify(summary));
          console.log('MEDIA_AUDIT_SUMMARY', JSON.stringify(audit.summary || audit));
          if (summary.trackedDois !== null && summary.trackedDois > 1200) {
            throw new Error(`Tracked DOI count ${summary.trackedDois} exceeds current Bridge queue limit 1200.`);
          }
          NODE
