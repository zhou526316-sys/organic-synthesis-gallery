name: Mobile entry and TOC regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.ts'
      - 'src/user-ui/search-controller.ts'
      - 'tests/mobile-interaction.spec.ts'
      - '.github/workflows/mobile-entry-toc-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    concurrency:
      group: mobile-entry-toc-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Type-check and build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mobile-entry-preview.log 2>&1 &
          for i in {1..40}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mobile-entry-preview.log
          exit 1
      - name: Verify Gallery-first mobile entry and priority TOC hydration
        run: npx playwright test tests/mobile-interaction.spec.ts --grep "mobile title entry stays in Gallery|mobile TOC hydrates a small near-screen batch" --reporter=line --workers=1
