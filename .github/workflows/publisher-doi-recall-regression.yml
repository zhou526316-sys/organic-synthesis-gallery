name: Publisher DOI recall regression

on:
  pull_request:
    paths:
      - '.github/workflows/publisher-doi-recall-regression.yml'
      - 'cloudflare/scripts/audit-literature.mjs'
      - 'scripts/lib/publisher-feed-discovery.mjs'
      - 'scripts/test-publisher-feed-discovery.mjs'
      - 'scripts/lib/literature-review-queue-guard.mjs'
      - 'scripts/test-literature-review-queue-guard.mjs'
      - 'scripts/lib/literature-exclusion-recheck.mjs'
      - 'scripts/test-literature-exclusion-recheck.mjs'
      - 'scripts/test-literature-completeness-capability.mjs'
      - 'scripts/validate-prepublish-review.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-recall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check independent publisher discovery
        run: |
          node --check scripts/lib/publisher-feed-discovery.mjs
          node --check cloudflare/scripts/audit-literature.mjs
      - name: Validate official feed DOI identity and known omission
        run: node --test scripts/test-publisher-feed-discovery.mjs
      - name: Validate improved-evidence exclusion re-review
        run: node --test scripts/test-literature-exclusion-recheck.mjs
      - name: Verify publisher DOI-bound public abstract fallback parser
        run: node --test scripts/test-publisher-abstract-metadata.mjs
      - name: Validate primary window versus unverified DOI backlog
        run: node --test scripts/test-literature-review-queue-guard.mjs
      - name: Verify core literature source coverage policy
        run: node scripts/test-literature-completeness-capability.mjs
      - name: Verify strict prepublication contract regressions
        run: |
          node scripts/test-prepublish-readiness.mjs
          node scripts/test-deferred-publication-quality.mjs

  read-only-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test real 16-journal DOI discovery without writing production
        env:
          AUDIT_START: ''
          AUDIT_END: '2026-10-13'
          AUDIT_OUTPUT: ${{ runner.temp }}/publisher-source-readonly-latest.json
          AUDIT_UNRESOLVED_OUTPUT: ${{ runner.temp }}/publisher-source-readonly-unresolved.json
          GALLERY_SITE: https://gallery.gczhouwld.com
        run: |
          node cloudflare/scripts/audit-literature.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(readFileSync(process.env.AUDIT_OUTPUT,'utf8'));
          const compact=JSON.parse(readFileSync(process.env.AUDIT_UNRESOLVED_OUTPUT,'utf8'));
          assert.equal(report.endDate,'2026-10-13');
          assert.equal(report.generatedAt,compact.generatedAt);
          assert.equal(report.targetJournals.length,16);
          assert.equal(report.publisherFeeds?.status?.length,16);
          assert.equal(report.publisherFeeds.completeListing,false);
          assert.equal(compact.unresolved.length,report.summary.unresolved);
          assert.equal(compact.publisherFeeds.status.length,16);
          assert.equal(compact.publisherDateVerificationBacklog.count,
            report.publisherDateVerificationBacklog.count);
          assert.equal(compact.historicalEvidenceChallenges.count,
            report.historicalEvidenceChallenges.count);
          assert.equal(report.publisherDateVerificationBacklog.items.length,
            report.publisherDateVerificationBacklog.count);
          assert.equal(report.historicalEvidenceChallenges.items.length,
            report.historicalEvidenceChallenges.count);
          const primary=report.baseStartDate;
          assert.ok(compact.unresolved.every(row=>
            !row.publisherFeedUrl||row.date||!row.publisherDateUnverified||
            !row.feedDate||row.feedDate>=primary),
            'An undated RSS item with old packaging date cannot enter primary handoff');
          assert.equal(report.summary.publisherFirstOnlineBacklog,
            report.publisherDateVerificationBacklog.count);
          assert.equal(report.summary.historicalEvidenceChallenges,
            report.historicalEvidenceChallenges.count);
          assert.ok(compact.unresolved.every(row=>
            !row.recheckPreviousExclusion||row.date>=report.baseStartDate),
            'Historic exclusion with changed abstract must not become a fresh 08:00 candidate');
          assert.ok(report.historicalEvidenceChallenges.items.every(row=>
            row.date<report.baseStartDate||!row.date),
            'Changed evidence within the current primary date window must be reviewed, not hidden in backlog');
          assert.equal(report.summary.publisherFirstOnlineBacklog,
            report.publisherDateVerificationBacklog.items.length);
          assert.ok(report.sourceStats?.length>=16);
          const doi='10.1038/s44160-026-01189-z';
          assert.ok(report.missingCandidates.some(row=>row.doi===doi),
            'Known Nature Synthesis pending DOI must remain in actual candidate handoff');
          console.log('PUBLISHER_READONLY_SMOKE '+JSON.stringify({
            sourceRecords:report.summary.sourceRecords,
            unresolved:report.summary.unresolved,
            publisherOnly:report.summary.publisherFeedOnlyDois,
            publisherFeedStatuses:report.publisherFeeds.status.map(row=>({
              journal:row.journal,status:row.status,doiCount:row.doiCount
            }))
          }));
          NODE
      - name: Upload read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-source-readonly-smoke
          path: ${{ runner.temp }}/publisher-source-readonly-*.json
          retention-days: 7
