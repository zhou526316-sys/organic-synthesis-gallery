name: Status original image regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/user-ui/**'
      - 'src/user-shell.ts'
      - 'tests/status-*.ts'
      - '.github/workflows/status-original-images-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-original-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit
      - name: Type-check and build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/status-images-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/status-images-preview.log
          exit 1
      - name: Verify originals, previews, viewer, routing and cancellation
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: status-image-test-results/results.json
        run: npx --no-install playwright test tests/status-original-images.spec.ts tests/status-image-errors.spec.ts tests/status-api-routing.spec.ts tests/status-fetch-lifecycle.spec.ts tests/status-preview-readiness.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=status-image-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-original-image-results
          path: status-image-test-results/
          retention-days: 7
          if-no-files-found: warn
