name: Site analytics readiness diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-analytics-readiness-diagnostic.yml'
      - 'D4E_ANALYTICS_DIAGNOSTIC_REQUEST'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: organic-synthesis-gallery
      WORKER_URL: https://organic-synthesis-gallery.zhou526316.workers.dev
      BRIDGE_WRITE_TOKEN: ${{ secrets.BRIDGE_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund

      - name: Read analytics watermarks without mutation
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM site_pageviews_v1) AS raw_events,
              (SELECT COALESCE(MAX(id),0) FROM site_pageviews_v1) AS raw_max_event_id,
              (SELECT COALESCE(MAX(viewed_at),0) FROM site_pageviews_v1) AS raw_last_viewed_at,
              (SELECT COUNT(*) FROM site_analytics_materialized_events_v2) AS materialized_events_count,
              (SELECT COALESCE(MAX(event_id),0) FROM site_analytics_materialized_events_v2) AS materialized_max_event_id,
              (SELECT COALESCE(pv,0) FROM site_global_stats_v2 WHERE id=1) AS global_pv,
              (SELECT COALESCE(last_viewed_at,0) FROM site_global_stats_v2 WHERE id=1) AS global_last_viewed_at,
              (SELECT COALESCE(last_event_id,0) FROM site_analytics_v2_backfill WHERE id=1) AS backfill_last_event_id,
              (SELECT COALESCE(complete,0) FROM site_analytics_v2_backfill WHERE id=1) AS backfill_complete,
              (SELECT COALESCE(scanned_events,0) FROM site_analytics_v2_backfill WHERE id=1) AS scanned_events,
              (SELECT COALESCE(materialized_events,0) FROM site_analytics_v2_backfill WHERE id=1) AS backfill_materialized_events,
              (SELECT COALESCE(duplicate_events,0) FROM site_analytics_v2_backfill WHERE id=1) AS duplicate_events,
              (SELECT COALESCE(failed_events,0) FROM site_analytics_v2_backfill WHERE id=1) AS failed_events,
              (SELECT COALESCE(last_error,'') FROM site_analytics_v2_backfill WHERE id=1) AS last_error;
          " > "$RUNNER_TEMP/analytics-watermarks.json"

      - name: Fetch Worker status surfaces
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          import fs from 'node:fs';
          const base=String(process.env.WORKER_URL||'').replace(/\/$/,'');
          const token=process.env.BRIDGE_WRITE_TOKEN||'';
          async function call(path,auth=false){
            const headers={'cache-control':'no-cache',pragma:'no-cache'};
            if(auth) headers.authorization='Bearer '+token;
            const response=await fetch(base+path,{headers,signal:AbortSignal.timeout(30000)});
            const text=await response.text();let body={};try{body=text?JSON.parse(text):{};}catch{}
            return {status:response.status,ok:response.ok,body};
          }
          const [materializedStatus,snapshotStatus,health,live]=await Promise.all([
            call('/api/admin/site-analytics-materialized/status',true),
            call('/api/admin/site-analytics-snapshot/status',true),
            call('/api/_healthcheck'),
            call('/api/user-ui/site-stats'),
          ]);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/analytics-surfaces.json',JSON.stringify({
            materializedStatus,snapshotStatus,health,live
          },null,2)+'\n');
          NODE

      - name: Build readiness report
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          import fs from 'node:fs';
          const unpack=file=>{
            const raw=JSON.parse(fs.readFileSync(file,'utf8'));
            const rows=Array.isArray(raw)?raw.flatMap(x=>x.results||[]):(raw.results||[]);
            return rows[0]||{};
          };
          const row=unpack(process.env.RUNNER_TEMP+'/analytics-watermarks.json');
          const surfaces=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/analytics-surfaces.json','utf8'));
          const n=k=>Math.max(0,Number(row[k]||0));
          const lastError=String(row.last_error||'');
          const checks={
            noLastError:lastError==='',
            materializedMaxEqualsBackfillLast:n('materialized_max_event_id')===n('backfill_last_event_id'),
            ledgerCountEqualsScanned:n('backfill_materialized_events')+n('duplicate_events')===n('scanned_events'),
            globalPvEqualsScanned:n('global_pv')===n('scanned_events'),
            materializedMaxNotAheadOfRaw:n('materialized_max_event_id')<=n('raw_max_event_id'),
            materializedTimeNotAheadOfRaw:n('global_last_viewed_at')<=n('raw_last_viewed_at'),
            backfillComplete:n('backfill_complete')===1,
            rawMaxEqualsMaterializedMax:n('raw_max_event_id')===n('materialized_max_event_id'),
            backfillLastEqualsRawMax:n('backfill_last_event_id')===n('raw_max_event_id'),
            timestampsEqual:n('global_last_viewed_at')===n('raw_last_viewed_at'),
          };
          const snapshotSourceReady=checks.noLastError&&checks.materializedMaxEqualsBackfillLast
            &&checks.ledgerCountEqualsScanned&&checks.globalPvEqualsScanned
            &&checks.materializedMaxNotAheadOfRaw&&checks.materializedTimeNotAheadOfRaw;
          const strictReady=snapshotSourceReady&&checks.backfillComplete&&checks.rawMaxEqualsMaterializedMax
            &&checks.backfillLastEqualsRawMax&&checks.timestampsEqual;
          const report={
            schemaVersion:1,phase:'D4e-readiness-diagnostic',generatedAt:new Date().toISOString(),
            row,checks,snapshotSourceReady,strictReady,
            derived:{
              rawIdGap:n('raw_max_event_id')-n('raw_events'),
              materializedIdGap:n('materialized_max_event_id')-n('materialized_events_count'),
              pendingRawIds:n('raw_max_event_id')-n('backfill_last_event_id'),
              rawVsMaterializedCount:n('raw_events')-n('materialized_events_count'),
            },
            surfaces,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/analytics-readiness-diagnostic.json',JSON.stringify(report,null,2)+'\n');
          console.log('ANALYTICS_READINESS_DIAGNOSTIC '+JSON.stringify({
            checks,snapshotSourceReady,strictReady,derived:report.derived,
            publicReadPath:surfaces.live?.body?.readPath,
            snapshotReadEnabled:surfaces.health?.body?.siteAnalyticsPublicSnapshotReadEnabled,
          }));
          NODE

      - name: Preserve readiness diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: site-analytics-readiness-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-readiness-diagnostic.json
          if-no-files-found: error
          retention-days: 7
