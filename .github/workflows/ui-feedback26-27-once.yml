name: Verify isolated UI feedback 26 and 27

on:
  push:
    branches: [fix/ui-feedback-26-27-20260922]
    paths: ['.github/workflows/ui-feedback26-27-once.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-feedback-26-27-20260922
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact source and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path('src/user-ui/paper-actions.ts')
          tests = Path('tests/mobile-interaction.spec.ts')
          assert subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip() == 'c7348580f8a92fa0a0865d37896671507a7caede', 'Source changed; re-review before applying'
          assert subprocess.check_output(['git', 'hash-object', str(tests)], text=True).strip() == '25aa5f7cca8fb5e0a5e6804ec7da572faedda080', 'Tests changed; re-review before applying'
          s = source.read_text()
          def once(old, new):
              global s
              assert s.count(old) == 1, repr(old)
              s = s.replace(old, new, 1)
          once("private panel: 'none' | 'status'", "private panel: 'none' | 'favorite' | 'status'")
          once("private openPanel(panel: 'status'", "private openPanel(panel: 'favorite' | 'status'")
          once("${button(s.status, status ?", "${button(status ? { ...s.status, rgb: status.style.rgb } : s.status, status ?")
          once("const title = this.panel === 'summary'", "const title = this.panel === 'favorite' ? this.tr('收藏与收藏夹', 'Saved papers and folders') : this.panel === 'summary'")
          once("    if (action === 'favorite') { store.toggleFavorite(this.paperId); return; }", """    if (action === 'favorite') {
                if (this.panel === 'favorite') this.closePanel();
                else this.openPanel('favorite');
                return;
              }
              if (action === 'toggle-favorite') {
                store.updatePaper(this.paperId, paper => {
                  paper.favorite = !paper.favorite;
                  if (!paper.favorite) paper.collections = [];
                });
                return;
              }""")
          prefix = "    } else {\n      body = `<section class='section'><h4>${this.tr('快速选择（收藏夹）', 'Quick choices (folders)')}"
          assert s.count(prefix) == 1
          start = s.index(prefix)
          end = s.index('\n      ${this.citationMarkup()}', start)
          folders = s[start:end].split('      body = `', 1)[1]
          replacement = "    } else if (this.panel === 'favorite') {\n      body = `" + folders + """
                <section class='section'><button class='secondary${paper.favorite ? ' danger' : ''}' type='button' data-action='toggle-favorite'>${paper.favorite ? this.tr('取消收藏并移出所有收藏夹', 'Remove from saved and all folders') : this.tr('仅收藏（不分类）', 'Save without a folder')}</button><div class='help'>${this.tr('可选择多个收藏夹。取消某个分类不会取消收藏；取消收藏请使用上方按钮。', 'Choose multiple folders. Unchecking a folder keeps the paper saved; use the button above to remove it from saved papers.')}</div></section>`;
              } else {
                body = `"""
          s = s[:start] + replacement + s[end:]
          source.write_text(s)
          t = tests.read_text()
          old_title = "test('More quick choices map directly to customizable folders'"
          assert t.count(old_title) == 1
          t = t.replace(old_title, "test('Favorite quick choices map directly to customizable folders'", 1)
          old = "await actions.locator('button[data-action=\"more\"]').click();\n  await expect(actions.locator('.drawer')).toContainText(/快速选择（收藏夹）|Quick choices"
          new = "await actions.locator('button[data-action=\"favorite\"]').click();\n  await expect(actions.locator('.drawer')).toContainText(/快速选择（收藏夹）|Quick choices"
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          t += r'''

          for (const width of [390, 1280]) {
            test(`feedback 26/27: favorite folders and status colors persist at ${width}px`, async ({ page }, testInfo) => {
              test.setTimeout(90_000);
              await page.setViewportSize({ width, height: 900 });
              const errors: string[] = [];
              const diagnostics: string[] = [];
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => { if (message.type() === 'error') diagnostics.push(`console: ${message.text()}`); });
              page.on('requestfailed', request => diagnostics.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));
              page.on('response', response => { if (response.url().includes('/api/user-ui/')) diagnostics.push(`api: ${response.status()} ${response.url()}`); });
              await page.route('https://api.gczhouwld.com/**', async route => {
                const url = route.request().url();
                const body = url.includes('/api/user-ui/reader-counts') ? { counts: {} }
                  : url.includes('/api/user-ui/integrations') ? { auth: { google: false, wechat: false, qq: false, email: false }, payments: { wechat: false, alipay: false } }
                  : {};
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
              });
              try {
                await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
                const actions = page.locator('gallery-paper-actions').first();
                await expect(actions).toBeVisible({ timeout: 30000 });
                await expect(actions.locator('.bar > button.action')).toHaveCount(4);
                const favorite = actions.locator('button[data-action="favorite"]');
                await favorite.click();
                const drawer = actions.locator('.drawer');
                await expect(drawer).toHaveAttribute('data-anchor', 'favorite');
                const anchorBox = await favorite.boundingBox();
                const drawerBox = await drawer.boundingBox();
                expect(anchorBox).not.toBeNull();
                expect(drawerBox).not.toBeNull();
                if (anchorBox && drawerBox) {
                  expect(drawerBox.x).toBeGreaterThanOrEqual(0);
                  expect(drawerBox.x + drawerBox.width).toBeLessThanOrEqual(width);
                  expect(Math.min(Math.abs(drawerBox.y - anchorBox.y - anchorBox.height), Math.abs(anchorBox.y - drawerBox.y - drawerBox.height))).toBeLessThanOrEqual(18);
                }
                const project = actions.locator('input[data-collection="project"]');
                await project.check();
                await expect(project).toBeChecked();
                await expect(favorite).toHaveAttribute('title', /已收藏|Saved/);
                await favorite.click();
                await expect(actions.locator('.drawer')).toHaveCount(0);
                await expect(favorite).toHaveAttribute('title', /已收藏|Saved/);
                await page.reload({ waitUntil: 'domcontentloaded' });
                await expect(favorite).toHaveAttribute('title', /已收藏|Saved/);
                await favorite.click();
                await expect(project).toBeChecked();
                await actions.locator('button[data-action="close"]').click();
                await actions.locator('button[data-action="more"]').click();
                await expect(actions.locator('input[data-collection]')).toHaveCount(0);
                await expect(actions.locator('[data-citation-style]')).toBeVisible();
                await actions.locator('button[data-action="close"]').click();

                const statusButton = actions.locator('button[data-action="status"]');
                const originalShape = await statusButton.getAttribute('class');
                await statusButton.click();
                const statusChoice = actions.locator('button[data-action^="set-status:"]').first();
                const statusId = (await statusChoice.getAttribute('data-action'))!.slice('set-status:'.length);
                const color = await statusChoice.locator('.status-choice-label').evaluate(element => getComputedStyle(element).backgroundColor);
                await statusChoice.click();
                await expect.poll(() => statusButton.evaluate(element => getComputedStyle(element).backgroundColor)).toBe(color);
                await statusButton.click();
                const colorInput = actions.locator('input[data-status-color]').filter({ visible: true });
                const matchingColor = actions.locator(`input[data-status-color="${statusId}"]`);
                await matchingColor.evaluate((element: HTMLInputElement) => {
                  element.value = '#13579b';
                  element.dispatchEvent(new Event('change', { bubbles: true }));
                });
                await expect.poll(() => statusButton.evaluate(element => getComputedStyle(element).backgroundColor)).toBe('rgb(19, 87, 155)');
                await expect.poll(() => actions.locator('.chips > .chip.status').first().evaluate(element => getComputedStyle(element).backgroundColor)).toBe('rgb(19, 87, 155)');
                expect((await statusButton.getAttribute('class'))?.replace(' active', '')).toBe(originalShape?.replace(' active', ''));
                await page.reload({ waitUntil: 'domcontentloaded' });
                await expect.poll(() => statusButton.evaluate(element => getComputedStyle(element).backgroundColor)).toBe('rgb(19, 87, 155)');
                await favorite.click();
                await actions.locator('button[data-action="toggle-favorite"]').click();
                await expect(project).not.toBeChecked();
                await expect(favorite).toHaveAttribute('title', /^(收藏|Save)$/);
                await expect(actions.locator('.bar > button.action')).toHaveCount(4);
                expect(errors).toEqual([]);
              } catch (error) {
                await testInfo.attach('feedback-actions-failure', { body: await page.screenshot({ fullPage: true }), contentType: 'image/png' });
                throw error;
              } finally {
                await testInfo.attach('feedback-actions-diagnostics', { body: JSON.stringify({ errors, diagnostics }, null, 2), contentType: 'application/json' });
              }
            });
          }
          '''
          t = t.replace("                const colorInput = actions.locator('input[data-status-color]').filter({ visible: true });\n", '')
          tests.write_text(t)
          print(subprocess.check_output(['git', 'diff', '--stat'], text=True))
          PY
      - name: Install and typecheck
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: Run complete interaction regression
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/gallery-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/mobile-interaction.spec.ts --reporter=line --workers=1 --trace=retain-on-failure
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-feedback-26-27-verification
          path: |
            test-results/
            src/user-ui/paper-actions.ts
            tests/mobile-interaction.spec.ts
          retention-days: 7
      - name: Commit verified changes to the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-feedback26-27-once.yml
          git add src/user-ui/paper-actions.ts tests/mobile-interaction.spec.ts
          git diff --cached --name-only
          git commit -m 'fix(ui): move folder picker to Save and inherit reading-status color'
          git push origin HEAD:fix/ui-feedback-26-27-20260922
