name: Pagination bounded diagnostics

on:
  push:
    branches: [fix/pagination-navigation-ui-v2]
    paths: [.github/workflows/pagination-diagnostics.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and merge conflicts without publishing
        run: |
          mkdir -p pagination-diagnostics
          git config user.name pagination-diagnostics
          git config user.email pagination-diagnostics@users.noreply.github.com
          git rev-parse HEAD origin/main > pagination-diagnostics/revisions.txt
          git merge --no-commit --no-ff origin/main > pagination-diagnostics/merge.log 2>&1 || true
          git diff --name-only --diff-filter=U > pagination-diagnostics/conflicts.txt
          python3 - <<'PY'
          import subprocess, pathlib, json
          root = pathlib.Path('pagination-diagnostics')
          base = subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          paths = ['src/main.ts','src/bootstrap.ts','src/performance-runtime.ts','src/styles.css','tests/architecture-frontend.spec.ts']
          sources = {'baseRevision':base,'files':{}}
          for name in paths:
              entry = {}
              for label, ref in [('base',base),('head','HEAD'),('main','origin/main')]:
                  p = subprocess.run(['git','show',f'{ref}:{name}'],capture_output=True,text=True)
                  if p.returncode == 0: entry[label] = p.stdout
              entry['merged'] = pathlib.Path(name).read_text()
              sources['files'][name] = entry
          (root/'sources.json').write_text(json.dumps(sources,ensure_ascii=False))
          PY
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then git merge --abort; fi
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install deterministic test runtime
        run: |
          npm install --no-audit --no-fund > pagination-diagnostics/install.log 2>&1
          npm install --no-save --no-package-lock @playwright/test@1.55.1 >> pagination-diagnostics/install.log 2>&1
          npx playwright install --with-deps webkit >> pagination-diagnostics/install.log 2>&1
      - name: Build the same archive fixture as the failing regression
        run: |
          node cloudflare/scripts/merge-curated-pages.mjs > pagination-diagnostics/build.log 2>&1
          node scripts/build-gallery-architecture-public.mjs >> pagination-diagnostics/build.log 2>&1
          npm run build >> pagination-diagnostics/build.log 2>&1
          node scripts/pages-release-delivery.mjs build dist >> pagination-diagnostics/build.log 2>&1
      - name: Add observation-only hooks in the disposable test workspace
        run: |
          cat >> tests/architecture-frontend.spec.ts <<'TS'

          test.beforeEach(async ({ page }) => {
            await page.addInitScript(() => {
              const events: unknown[] = [];
              (window as any).__paginationEvents = events;
              const record = (type: string, target?: EventTarget | null) => {
                const element = target instanceof Element ? target : null;
                events.push({ t: Math.round(performance.now()), type,
                  target: element ? { tag: element.tagName, id: element.id, page: (element as HTMLElement).dataset.resultPage, connected: element.isConnected } : null,
                  status: document.querySelector('#resultWindowStatus')?.textContent,
                  first: document.querySelector('#gallery > .card')?.getAttribute('data-doi'),
                  catalogRead: document.documentElement.dataset.catalogRead,
                  catalogQueryRead: document.documentElement.dataset.catalogQueryRead,
                  scrollY });
                if (events.length > 180) events.shift();
              };
              for (const type of ['pointerdown','mousedown','pointerup','mouseup','click','submit']) {
                document.addEventListener(type, event => record(`${type}:capture`, event.target), true);
                document.addEventListener(type, event => record(`${type}:bubble`, event.target));
              }
              new MutationObserver(records => {
                if (records.some(r => r.target instanceof Element && (r.target.id === 'resultPageNumbers' || r.target.id === 'resultWindowStatus'))) record('pagination-mutation');
              }).observe(document.documentElement, { childList:true, subtree:true });
            });
          });
          test.afterEach(async ({ page }, info) => {
            const events = await page.evaluate(() => (window as any).__paginationEvents || []).catch(() => []);
            await info.attach('pagination-events', { body:JSON.stringify(events,null,2),contentType:'application/json' });
            if (info.status !== info.expectedStatus) await page.screenshot({ path:info.outputPath('failure.png'),fullPage:false }).catch(() => {});
          });
          TS
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > pagination-diagnostics/preview.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Reproduce numbered-page regressions without altering assertions
        env:
          ARCHITECTURE_PREVIEW_BASE: http://127.0.0.1:4173
          PLAYWRIGHT_JSON_OUTPUT_FILE: pagination-diagnostics/report.json
        run: npx playwright test tests/architecture-frontend.spec.ts --grep 'result pagination keeps|active D1 catalog view' --browser=webkit --workers=1 --reporter=line,json --output=pagination-diagnostics/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagination-bounded-diagnostics
          path: |
            pagination-diagnostics/revisions.txt
            pagination-diagnostics/conflicts.txt
            pagination-diagnostics/merge.log
            pagination-diagnostics/sources.json
            pagination-diagnostics/report.json
            pagination-diagnostics/results/
          retention-days: 3
