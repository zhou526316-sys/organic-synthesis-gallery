name: Audit ChemRxiv preprint coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chemrxiv-preprint-audit.yml'
      - 'cloudflare/scripts/audit-chemrxiv-preprints.mjs'
      - 'audit/visual-gap-dois-2026-09-16.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search ChemRxiv by verified article title
        env:
          TOC_GAP_FILE: audit/visual-gap-dois-2026-09-16.json
          CHEMRXIV_CONCURRENCY: '2'
          CHEMRXIV_DELAY_MS: '250'
        run: node cloudflare/scripts/audit-chemrxiv-preprints.mjs
      - name: Upload preprint audit
        uses: actions/upload-artifact@v4
        with:
          name: chemrxiv-visual-gap-report
          path: audit/chemrxiv-toc-gap-report.json
          retention-days: 7
