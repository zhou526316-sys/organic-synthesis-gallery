name: Stage bounded summary29 source integration
on:
  push:
    branches: ['feat/ui-summary-readable-20260923']
    paths: ['.github/workflows/ui-summary29-stage.yml']
permissions:
  contents: write
concurrency:
  group: summary29-source-staging
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-summary-readable-20260923
      - name: Update only the inspected summary sizing contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/mobile-interaction.spec.ts')
          data = p.read_bytes()
          actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert actual == '85e9fd2c4475a0813cfc0d25a7ba334a09fd365d', f'Concurrent test changed: {actual}'
          text = data.decode('utf-8')
          old = '    expect(box.width).toBeLessThan(780);\n    expect(box.width).toBeLessThan(1280 * 0.8);\n    expect(box.height).toBeLessThan(900 * 0.8);'
          new = '''    // Feedback29 deliberately enlarges the old 740px panel; retain bounded,
              // nonfullscreen behavior rather than enforcing the obsolete small size.
              expect(box.width).toBeGreaterThanOrEqual(1000);
              expect(box.width).toBeLessThanOrEqual(1200);
              expect(box.x).toBeGreaterThanOrEqual(16);
              expect(box.x + box.width).toBeLessThanOrEqual(1280 - 16);
              expect(box.y).toBeGreaterThanOrEqual(16);
              expect(box.y + box.height).toBeLessThanOrEqual(900 - 16);
              expect(box.height).toBeLessThanOrEqual(900 * 0.84 + 1);'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          needle = "  await drawer.locator('button[data-action=\"summary-lang:en\"]').click();"
          assert text.count(needle) == 1
          text = text.replace(needle, "  expect(await drawer.locator('.summary-text').evaluate(node => parseFloat(getComputedStyle(node).fontSize))).toBeGreaterThanOrEqual(16);\n" + needle)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'tests/mobile-interaction.spec.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mobile-interaction.spec.ts
          git commit -m 'test(ui): validate enlarged summary margins instead of the obsolete small width'
          git push origin HEAD:refs/heads/feat/ui-summary-readable-20260923
