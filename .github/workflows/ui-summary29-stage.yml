name: Stage bounded summary29 source integration
on:
  push:
    branches: ['feat/ui-summary-readable-20260923']
    paths: ['.github/workflows/ui-summary29-stage.yml']
permissions:
  contents: write
concurrency:
  group: summary29-source-staging
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-summary-readable-20260923
      - name: Remove unreachable legacy summary size branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/user-ui/paper-actions.ts')
          data = p.read_bytes()
          actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert actual == '0b938508c707ad88ca1a3c31071052f27359b917', f'Concurrent source changed: {actual}'
          text = data.decode('utf-8')
          old = "    const cap = this.panel === 'summary' ? (window.innerWidth <= 680 ? 620 : 680) : (window.innerWidth <= 680 ? 520 : 560);"
          new = '    const cap = window.innerWidth <= 680 ? 520 : 560;'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'src/user-ui/paper-actions.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/paper-actions.ts
          git commit -m 'fix(ui): remove unreachable legacy summary cap after layout extraction'
          git push origin HEAD:refs/heads/feat/ui-summary-readable-20260923
