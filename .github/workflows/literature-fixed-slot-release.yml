name: Fixed-slot literature release writer

on:
  push:
    branches:
      - main
      - 'automation/release-*'
    paths:
      - 'audit/automation-triggers/literature-release-request.json'
  workflow_run:
    workflows: ['Validate prepublish literature review']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: fixed-slot-literature-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    outputs:
      release_commit: ${{ steps.commit_release.outputs.release_commit }}
      did_release: ${{ steps.prepare.outputs.prepared }}
    steps:
      - name: Checkout trusted main code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test fixed-slot handoff and fail-closed timing
        run: node --test scripts/test-fixed-slot-release-handoff.mjs

      - name: Download exact successful prepublish evidence
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: prepublish-readiness-evidence
          path: ${{ runner.temp }}/approved-prepublish
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Arm reviewed subset and prepare only at the fixed slot
        id: prepare
        run: node scripts/fixed-slot-release-handoff.mjs prepare

      - name: Commit atomic literature release
        if: steps.prepare.outputs.prepared == 'true'
        id: commit_release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fixed-slot-release-handoff.mjs commit-guard
          slot="$(node -p "require('./audit/automation-triggers/literature-release-request.json').publicationSlot")"
          review="$(node -p "require('./audit/release-execution-result.json').formalReviewFile")"
          queue="$(node -p "require('./audit/release-execution-result.json').pendingQueueFile")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$review" "$queue" public/rolling-supplement.json audit/publication-release-state.json audit/release-execution-result.json audit/automation-triggers/literature-release-request.json
          for file in public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/literature-supplement.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add -u -- "$file"
            fi
          done
          test -n "$(git status --porcelain -- "$review" "$queue" public/rolling-supplement.json audit/publication-release-state.json)"
          git commit -m "release(literature): publish reviewed subset for ${slot}"
          git push origin HEAD:main
          release_commit="$(git rev-parse HEAD)"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Preserve release writer result and handoff status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-slot-literature-release-result
          path: |
            audit/release-execution-result.json
            ${{ runner.temp }}/release-handoff-status.json
            ${{ runner.temp }}/fixed-slot-plan.json
          if-no-files-found: warn
          retention-days: 14

  refresh_toc:
    needs: release
    if: needs.release.outputs.did_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      toc_commit: ${{ steps.commit_toc.outputs.toc_commit }}
    steps:
      - name: Checkout released main snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify release is present on current main
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git reset --hard origin/main
          request_slot="$(node -p "require('./audit/automation-triggers/literature-release-request.json').publicationSlot")"
          marker_slot="$(node -p "require('./audit/publication-release-state.json').publicationSlot")"
          test "$request_slot" = "$marker_slot"
          node scripts/validate-production-literature-release-slot.mjs

      - name: Guard dynamic literature inputs
        shell: bash
        run: |
          grep -F "automation-supplement.json" cloudflare/scripts/build-live-toc-demand-queue.mjs
          grep -F "rolling-supplement.json" cloudflare/scripts/build-live-toc-demand-queue.mjs

      - name: Build current TOC demand queues
        run: node cloudflare/scripts/build-live-toc-demand-queue.mjs

      - name: Verify TOC demand matches production marker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./audit/publication-release-state.json').productionCards")"
          actual="$(node -p "require('./public/toc-demand-live.json').webpageDoiCount")"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Commit refreshed TOC demand
        id: commit_toc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- toc-collector/queues public/toc-demand-live.json)" ]; then
            git add toc-collector/queues public/toc-demand-live.json
            git commit -m "Refresh live TOC demand queues after fixed-slot release"
            git push origin HEAD:main
          fi
          toc_commit="$(git rev-parse HEAD)"
          echo "toc_commit=$toc_commit" >> "$GITHUB_OUTPUT"

  # Existing Pages workflow receives writer completion in trusted main context.
  # No new schedule or reusable Pages call with a release-branch identity.
