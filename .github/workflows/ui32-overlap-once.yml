name: Repair observed editor and feedback-launcher overlap once
on:
  push:
    branches: [feat/ui-glow-width-20260923-b32]
    paths: ['.github/workflows/ui32-overlap-once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve positions; suspend only the launcher behind an active editor
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/user-ui/feedback-widget.ts')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='14692c1056983ccf61e03e74e072545945bf7f2c'
          text=p.read_text()
          needle='    .site-feedback-tab{border:1px solid #294da8;'
          assert text.count(needle)==1
          rule='    /* Do not let the floating launcher intercept an active card editor. Keep its saved position and any already-open feedback panel. */\n    body:has(gallery-paper-actions[data-drawer-open="true"]) ${ELEMENT}:not(:has(.site-feedback-panel)){visibility:hidden;pointer-events:none}\n'
          p.write_text(text.replace(needle,rule+needle))
          p=Path('tests/status-glow-width.spec.ts');text=p.read_text()
          assert 'real drag previews continuously' in text and 'launcher yields' not in text
          added="\n\ntest('feedback launcher yields to an open editor then restores without losing position', async ({ page }) => {\n  const evidence = watch(page);\n  const actions = await open(page, 390);\n  const launcher = page.locator('site-feedback-widget .site-feedback-tab');\n  await actions.locator('[data-action=\"close\"]').click();\n  await expect(launcher).toBeVisible();\n  const before = (await launcher.boundingBox())!;\n  const positionKeys = await page.evaluate(() => [localStorage.getItem('site-feedback-tab-position-v1'), localStorage.getItem('site-feedback-widget-position-v1')]);\n  await button(actions).click();\n  await expect(range(actions)).toBeVisible();\n  await expect(launcher).not.toBeVisible();\n  await actions.locator('[data-action=\"close\"]').click();\n  await expect(launcher).toBeVisible();\n  const after = (await launcher.boundingBox())!;\n  expect(after.x).toBe(before.x); expect(after.y).toBe(before.y);\n  expect(await page.evaluate(() => [localStorage.getItem('site-feedback-tab-position-v1'), localStorage.getItem('site-feedback-widget-position-v1')])).toEqual(positionKeys);\n  await launcher.click();\n  await expect(page.locator('.site-feedback-panel')).toBeVisible();\n  expect(evidence.errors).toEqual([]); expect(evidence.marks).toEqual([]);\n});\n"
          p.write_text(text+added)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/feedback-widget.ts tests/status-glow-width.spec.ts
          git rm .github/workflows/ui32-overlap-once.yml
          git commit -m 'fix(ui): prevent floating feedback launcher intercepting active card controls'
          git push origin HEAD:feat/ui-glow-width-20260923-b32
