name: Audit literature completeness

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional audit start date (YYYY-MM-DD); blank = Beijing rolling 72h window
        required: false
      end_date:
        description: Optional audit end date (YYYY-MM-DD); blank = current Beijing date
        required: false
  schedule:
    # Independent pre-release discovery safety net. Beijing 06:55 / 16:55,
    # leaving about one hour for semantic review before the fixed 08:00 / 18:00 release slots.
    - cron: '55 22,8 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/literature-audit.yml'
      - 'cloudflare/scripts/audit-literature.mjs'
      - 'shared/literature-journals.js'
      - 'scripts/test-literature-completeness-capability.mjs'
      - 'public/curated-supplement.json'
      - 'public/automation-supplement.json'
      - 'public/rolling-supplement.json'
      - 'audit/review-*.json'
      - 'audit/automation-triggers/literature-audit-request.json'

permissions:
  contents: write

concurrency:
  group: literature-completeness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify completeness capability guard
        run: node scripts/test-literature-completeness-capability.mjs

      - name: Build DOI-union audit report
        env:
          AUDIT_START: ${{ inputs.start_date || '' }}
          AUDIT_END: ${{ inputs.end_date || '' }}
          GALLERY_SITE: https://zhou526316-sys.github.io/organic-synthesis-gallery
        run: node cloudflare/scripts/audit-literature.mjs

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: literature-audit
          path: |
            audit/latest.json
            audit/unresolved-latest.json
          retention-days: 14

      - name: Persist latest audit snapshot without blocking the audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          candidate_latest="$RUNNER_TEMP/literature-audit-latest.json"
          candidate_review="$RUNNER_TEMP/literature-audit-unresolved-latest.json"
          cp audit/latest.json "$candidate_latest"
          cp audit/unresolved-latest.json "$candidate_review"

          for attempt in 1 2 3; do
            echo "Persist attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit

            set +e
            node - "$candidate_latest" "$candidate_review" audit/latest.json audit/unresolved-latest.json <<'NODE'
          const fs = require('fs');
          const [candidateLatestPath, candidateReviewPath, existingLatestPath, existingReviewPath] = process.argv.slice(2);
          const readJson = path => {
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) return null;
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          };
          const candidateLatest = readJson(candidateLatestPath);
          const candidateReview = readJson(candidateReviewPath);
          const existingLatest = readJson(existingLatestPath);
          const existingReview = readJson(existingReviewPath);
          const candidateTime = Date.parse(candidateLatest?.generatedAt || 0) || 0;
          const reviewTime = Date.parse(candidateReview?.generatedAt || 0) || 0;
          if (!candidateTime || reviewTime !== candidateTime) {
            console.error('Candidate latest/review-input generation mismatch.');
            process.exit(3);
          }
          const existingLatestTime = Date.parse(existingLatest?.generatedAt || 0) || 0;
          const existingReviewTime = Date.parse(existingReview?.generatedAt || 0) || 0;
          if (existingLatestTime > candidateTime) {
            console.log('A newer audit snapshot is already on main; skipping older candidate.');
            process.exit(42);
          }
          if (existingLatestTime === candidateTime && existingReviewTime >= candidateTime) {
            console.log('The same-age audit and compact review input are already on main.');
            process.exit(42);
          }
          process.exit(0);
          NODE
            status=$?
            set -e
            if [ "$status" -eq 42 ]; then
              exit 0
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi

            cp "$candidate_latest" audit/latest.json
            cp "$candidate_review" audit/unresolved-latest.json
            git add audit/latest.json audit/unresolved-latest.json
            if git diff --cached --quiet; then
              echo 'Audit snapshot unchanged.'
              exit 0
            fi

            git commit -m 'audit: refresh literature completeness snapshot'
            if git push origin HEAD:main; then
              echo 'Audit snapshot persisted.'
              exit 0
            fi

            echo "::warning::main changed during audit persistence attempt $attempt; retrying against the new tip."
            sleep $((attempt * 2))
          done

          echo "::warning::Fresh audit artifacts were uploaded successfully, but the snapshot could not be persisted after 3 non-force attempts. The artifact remains the recovery source."
