name: Audit literature completeness

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional audit start date (YYYY-MM-DD); blank = Beijing rolling 72h window
        required: false
      end_date:
        description: Optional audit end date (YYYY-MM-DD); blank = current Beijing date
        required: false
  schedule:
    - cron: '0 0,10 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/literature-audit.yml'
      - 'cloudflare/scripts/audit-literature.mjs'
      - 'public/curated-supplement.json'

permissions:
  contents: write

concurrency:
  group: literature-completeness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build DOI-union audit report
        env:
          AUDIT_START: ${{ inputs.start_date || '' }}
          AUDIT_END: ${{ inputs.end_date || '' }}
          GALLERY_SITE: https://zhou526316-sys.github.io/organic-synthesis-gallery
        run: node cloudflare/scripts/audit-literature.mjs

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: literature-audit
          path: audit/latest.json
          retention-days: 14

      - name: Commit latest audit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/latest.json
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
          else
            git commit -m 'audit: refresh literature completeness report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
