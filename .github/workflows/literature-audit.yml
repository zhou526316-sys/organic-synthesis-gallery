name: Audit literature completeness

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional audit start date (YYYY-MM-DD); blank = Beijing rolling 72h window
        required: false
      end_date:
        description: Optional audit end date (YYYY-MM-DD); blank = current Beijing date
        required: false
  schedule:
    - cron: '0 0,10 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/literature-audit.yml'
      - 'cloudflare/scripts/audit-literature.mjs'
      - 'public/curated-supplement.json'

permissions:
  contents: write

concurrency:
  group: literature-completeness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build DOI-union audit report
        env:
          AUDIT_START: ${{ inputs.start_date || '' }}
          AUDIT_END: ${{ inputs.end_date || '' }}
          GALLERY_SITE: https://zhou526316-sys.github.io/organic-synthesis-gallery
        run: node cloudflare/scripts/audit-literature.mjs

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: literature-audit
          path: audit/latest.json
          retention-days: 14

      - name: Persist latest audit report without blocking the audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          candidate="$RUNNER_TEMP/literature-audit-latest.json"
          cp audit/latest.json "$candidate"

          for attempt in 1 2 3; do
            echo "Persist attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit

            if [ -s audit/latest.json ]; then
              node - "$candidate" audit/latest.json <<'NODE'
          const fs = require('fs');
          const [candidatePath, existingPath] = process.argv.slice(2);
          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const existing = JSON.parse(fs.readFileSync(existingPath, 'utf8'));
          const candidateTime = Date.parse(candidate.generatedAt || 0) || 0;
          const existingTime = Date.parse(existing.generatedAt || 0) || 0;
          if (existingTime >= candidateTime) {
            console.log('A same-age or newer audit report is already on main; nothing to persist.');
            process.exit(42);
          }
          NODE
              status=$?
              if [ "$status" -eq 42 ]; then
                exit 0
              elif [ "$status" -ne 0 ]; then
                exit "$status"
              fi
            fi

            cp "$candidate" audit/latest.json
            git add audit/latest.json
            if git diff --cached --quiet; then
              echo 'Audit report unchanged.'
              exit 0
            fi

            git commit -m 'audit: refresh literature completeness report'
            if git push origin HEAD:main; then
              echo 'Audit report persisted.'
              exit 0
            fi

            echo "::warning::main changed during audit persistence attempt $attempt; retrying against the new tip."
            sleep $((attempt * 2))
          done

          echo "::warning::Fresh audit artifact was uploaded successfully, but audit/latest.json could not be persisted after 3 non-force attempts. The audit run remains successful and the artifact is the recovery source."
