name: Deploy Tampermonkey through canonical GitHub Pages pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# GitHub deletes the transient "github-pages" artifact after deployment, so an
# asset-only overlay cannot safely reuse a previous deployed artifact. Manual
# recovery therefore delegates to the repository's authoritative Pages workflow,
# which rebuilds from an authorized snapshot and enforces the fixed-slot
# literature delivery guard before deployment.
jobs:
  canonical_pages:
    uses: ./.github/workflows/github-pages.yml
    with:
      deployment_ref: main
