name: Apply display observer scope hooks once
on:
  push:
    branches: [fix/ui-refresh-cost-20260923-1115]
    paths: [.github/workflows/ui147-display-scope-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-guarded observer callback changes only
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          edits=[
            ('src/runtime-recovery.ts','0eed9ee07968cc87374bef2f01bc6c71cb54a92d',
             'const observer = new MutationObserver(() => scheduleScan(20));',
             'const observer = new MutationObserver(records => {\n  if (shouldScanDisplay(records)) scheduleScan(20);\n});'),
            ('src/performance-runtime.ts','505006cc9842c811dfb24477e2fe34fb91debe77',
             '  const observer = new MutationObserver(scheduleScan);',
             '  const observer = new MutationObserver(records => {\n    if (shouldScanDisplay(records)) scheduleScan();\n  });'),
          ]
          for filename,sha,old,new in edits:
              p=Path(filename)
              assert subprocess.check_output(['git','hash-object',filename],text=True).strip()==sha, 'Re-review changed baseline: '+filename
              text=p.read_text();assert text.count(old)==1
              p.write_text("import { shouldScanDisplay } from './user-ui/display-mutation-scope';\n"+text.replace(old,new))
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime-recovery.ts src/performance-runtime.ts
          git commit -m 'fix(ui): ignore head-only mutations in display recovery scans'
          # Source only: no workflow edits or permission changes are pushed here.
          git push origin HEAD:fix/ui-refresh-cost-20260923-1115
