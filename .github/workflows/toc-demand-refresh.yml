name: Refresh live TOC demand queue

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,10 * * *'
  push:
    branches: [main]
    paths:
      - 'TOC_DEMAND_REFRESH'
      - 'cloudflare/scripts/build-live-toc-demand-queue.mjs'
      - 'shared/literature-journals.js'
      - '.github/workflows/toc-demand-refresh.yml'
      - 'public/papers.gz.b64'
      - 'public/total-synthesis.json'
      - 'public/manual-supplement.json'
      - 'public/final-audit-supplement.json'
      - 'public/curated-supplement.json'
      - 'public/automation-supplement.json'
      - 'public/rolling-supplement.json'
      - 'public/literature-supplement.json'
      - 'public/media-index.json'

permissions:
  contents: write

concurrency:
  group: toc-demand-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build current TOC demand queues
        run: node cloudflare/scripts/build-live-toc-demand-queue.mjs
      - name: Show demand counts
        shell: bash
        run: |
          cat toc-collector/queues/toc-demand-summary.json
          node -e "const q=require('./public/toc-demand-live.json'); console.log(JSON.stringify({visible:q.visibleGapTotal,missingOfficial:q.missingOfficialTotal,upgrades:q.officialUpgradeTotal}))"
          echo "all=$(wc -l < toc-collector/queues/toc-demand-all.txt)"
          echo "acs=$(wc -l < toc-collector/queues/toc-demand-acs.txt)"
          echo "wiley=$(wc -l < toc-collector/queues/toc-demand-wiley.txt)"
          echo "nature=$(wc -l < toc-collector/queues/toc-demand-nature.txt)"
          echo "science=$(wc -l < toc-collector/queues/toc-demand-science.txt)"
          echo "rsc=$(wc -l < toc-collector/queues/toc-demand-rsc.txt)"
          echo "elsevier=$(wc -l < toc-collector/queues/toc-demand-elsevier.txt)"
          echo "ccs=$(wc -l < toc-collector/queues/toc-demand-ccs.txt)"
          echo "no_visual=$(wc -l < toc-collector/queues/toc-demand-no-visual.txt)"
          echo "upgrade=$(wc -l < toc-collector/queues/toc-demand-official-upgrade.txt)"
      - name: Commit refreshed queues
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- toc-collector/queues public/toc-demand-live.json)" ]; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toc-collector/queues public/toc-demand-live.json
          git commit -m "Refresh live TOC demand queues"
          git push
