name: PDF Vault standard-font public resource isolated regression
on:
  push:
    branches:
      - fix/pdf-vault-live-font-probe-20261009
    paths:
      - 'scripts/verify-pdf-vault-live.mjs'
      - 'tests/pdf-vault-live-font-probe.mjs'
      - '.github/workflows/pdf-vault-font-probe-isolated.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  font-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Validate font-request fallback and parser syntax
        run: |
          node --check scripts/verify-pdf-vault-live.mjs
          node --test tests/pdf-vault-live-font-probe.mjs
      - name: Fetch public self-hosted font without account credentials
        run: |
          node --input-type=module - <<'NODE'
          import {isValidBundledStandardFont} from './scripts/verify-pdf-vault-live.mjs';
          const url='https://gallery.gczhouwld.com/pdf-vault-assets/6.4.299/standard_fonts/LiberationSans-Regular.ttf';
          const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});
          if(res.status!==200)throw new Error('font_http_'+res.status);
          const bytes=new Uint8Array(await res.arrayBuffer());
          if(!isValidBundledStandardFont(bytes))throw new Error('invalid_live_standard_font');
          console.log('PDF_PUBLIC_STANDARD_FONT_OK '+JSON.stringify({bytes:bytes.length,status:res.status,origin:'gallery.gczhouwld.com'}));
          NODE
