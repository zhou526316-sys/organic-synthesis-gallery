name: Apply confirmed scope removals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirmed-scope-removal.yml'
      - 'audit/automation-triggers/scope-removal-request.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: confirmed-scope-removal
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      deployment_ref: ${{ steps.commit.outputs.deployment_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify installed authorization without replaying obsolete bootstrap patches
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/immediate-scope-correction.mjs
          node --check scripts/apply-immediate-scope-correction.mjs
          node --check scripts/validate-literature-quality-gate.mjs
          grep -F 'authorizeScopeCorrection' scripts/validate-pages-literature-authorization.mjs
          grep -F 'authorizeScopeCorrection' scripts/validate-production-literature-release-slot.mjs
          test -z "$(git status --porcelain)"
      - name: Test deletion-only and existing release invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-immediate-scope-correction.mjs | tee "$RUNNER_TEMP/scope-removal-tests.json"
          node scripts/test-pages-literature-authorization.mjs
          node scripts/test-literature-completeness-capability.mjs
          node scripts/test-scope-title-corrections.mjs
          node scripts/test-per-doi-release.mjs
          node scripts/test-deferred-publication-quality.mjs
          node scripts/test-formal-review-conversion.mjs
          node scripts/validate-pages-literature-authorization.mjs > "$RUNNER_TEMP/prior-pages-authorization.json"
      - name: Prepare and commit atomic confirmed removals
        id: commit
        shell: bash
        env:
          LITERATURE_SUPPLEMENT_URL: 'data:application/json,{"papers":[]}'
        run: |
          set -euo pipefail
          git fetch origin main
          local=$(git rev-parse HEAD)
          if [ "$(git rev-parse origin/main)" != "$local" ]; then
            git diff --exit-code "$local" origin/main -- scripts cloudflare/scripts/audit-literature.mjs public/papers.gz.b64 public/total-synthesis.json public/manual-supplement.json public/final-audit-supplement.json public/curated-supplement.json public/automation-supplement.json public/rolling-supplement.json shared/literature-policy.js audit/literature-scope-corrections.json audit/publication-release-state.json audit/literature-update-state.json audit/scope-removal-authority.json audit/automation-triggers/scope-removal-request.json
            git reset --hard origin/main
          fi
          node scripts/apply-immediate-scope-correction.mjs | tee "$RUNNER_TEMP/scope-removal-result.json"
          node -e 'const {execFileSync}=require("child_process");const r=require("./audit/scope-removal-execution-result.json");execFileSync("git",["add","--",...r.files],{stdio:"inherit"})'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          count="$(node -p 'require("./audit/scope-removal-execution-result.json").removedDois.length')"
          git commit -m "fix(scope): immediately remove ${count} confirmed out-of-scope article(s)"
          node scripts/validate-pages-literature-authorization.mjs | tee "$RUNNER_TEMP/correction-pages-authorization.json"
          node scripts/validate-production-literature-release-slot.mjs > "$RUNNER_TEMP/correction-baseline-authorization.json"
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/scope-removal-commit.txt"
          # Queue uses the complete authorized local collection; do not re-import
          # the still-old deployed compatibility supplement during a deletion.
          node cloudflare/scripts/build-live-toc-demand-queue.mjs
          node -e 'const q=require("./public/toc-demand-live.json"),m=require("./audit/publication-release-state.json");if(q.webpageDoiCount!==m.productionCards)throw Error("correction queue count mismatch")'
          git add toc-collector/queues public/toc-demand-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(scope): refresh demand queue after confirmed removal'
            git push origin HEAD:main
          fi
          echo "deployment_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-scope-removal-evidence
          path: |
            ${{ runner.temp }}/scope-removal-tests.json
            ${{ runner.temp }}/prior-pages-authorization.json
            ${{ runner.temp }}/scope-removal-result.json
            ${{ runner.temp }}/correction-pages-authorization.json
            ${{ runner.temp }}/correction-baseline-authorization.json
            ${{ runner.temp }}/scope-removal-commit.txt
          if-no-files-found: warn
          retention-days: 14
  deploy_pages:
    needs: correction
    uses: ./.github/workflows/github-pages.yml
    with:
      deployment_ref: ${{ needs.correction.outputs.deployment_ref }}
  record_delivery:
    needs: [correction, deploy_pages]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pages-delivery-verification
          path: ${{ runner.temp }}/correction-receipt
      - name: Verify current live removal and merge only delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const marker=read('audit/publication-release-state.json');
          const receipt=read(process.env.RUNNER_TEMP+'/correction-receipt/pages-delivery-verification.json');
          const request=read('audit/automation-triggers/scope-removal-request.json');
          assert.equal(marker.mode,'scope-correction');assert.equal(receipt.ok,true);
          assert.equal(receipt.runId,Number(process.env.GITHUB_RUN_ID));
          assert.equal(receipt.markerBlobSha,git('rev-parse','HEAD:audit/publication-release-state.json'));
          const response=await fetch('https://gallery.gczhouwld.com/release-delivery.json?scope-removal='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(25000)});
          assert(response.ok);const live=await response.json();
          assert.equal(live.markerBlobSha,receipt.markerBlobSha);assert.equal(live.datasetSha256,receipt.datasetSha256);
          assert.equal(live.productionCards,marker.productionCards);
          for(const doi of marker.removedDois)assert(!live.dois.includes(doi),'removed DOI remains online');
          if(request.separateMediaCorrectionDoi)assert(live.dois.includes(request.separateMediaCorrectionDoi),'media-error article must remain');
          const state=read('audit/literature-update-state.json');assert.equal(state.lastScopeCorrection?.id,marker.correctionId);
          const verifiedAt=new Date().toISOString();
          state.lastScopeCorrection={...state.lastScopeCorrection,status:'deployed_verified',deployedAt:verifiedAt,deploymentRun:receipt.runId,deploymentSourceCommit:receipt.sourceCommit,markerBlobSha:receipt.markerBlobSha,datasetSha256:receipt.datasetSha256,retainedCards:live.productionCards,removedDoisVerifiedAbsent:marker.removedDois};
          state.lastWebsiteSync={...state.lastWebsiteSync,finishedAt:verifiedAt,dataCommitSha:receipt.markerCommit,deployment:'success-live-verified',verification:{mode:'scope-correction',lastFixedPublicationSlot:marker.lastFixedPublicationSlot,pagesRun:receipt.runId,deploymentSourceCommit:receipt.sourceCommit,markerBlobSha:receipt.markerBlobSha,totalGalleryCards:live.productionCards,galleryDois:live.productionCards,removedDoisAbsent:marker.removedDois,retainedDoiSetVerified:true,datasetSha256:receipt.datasetSha256,sites:receipt.sites,note:'Deletion-only delivery verified. Historical admission review, pending backlog, active run and closure dates are unchanged.'},tocVerification:{webpageDoiCount:read('public/toc-demand-live.json').webpageDoiCount,verifiedAt}};
          writeFileSync('audit/literature-update-state.json',JSON.stringify(state,null,2)+'\n');
          writeFileSync('audit/scope-removal-delivery-latest.json',JSON.stringify({...receipt,mode:'scope-correction',removedDois:marker.removedDois,verifiedAt},null,2)+'\n');
          console.log(JSON.stringify(state.lastScopeCorrection));
          JS
            git add audit/literature-update-state.json audit/scope-removal-delivery-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit(scope): record live-verified deletion without changing pending or admission history'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
