name: Inspect legacy Pages API entry (read only)

# Compatibility entry point only. Production frontend/API deployment is owned by
# GitHub Pages and deploy-worker-frontend.yml respectively.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    uses: ./.github/workflows/legacy-pages-mirror-readonly.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
