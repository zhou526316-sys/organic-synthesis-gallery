name: Fix TOC Collector syntax once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-toc-collector-syntax.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch semantic score calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('toc-collector/src/main.mjs')
          s = p.read_text()
          s2 = s.replace('${semanticScore.toString()}(a.text)', 'semanticScore(a.text)').replace('${semanticScore.toString()}(b.text)', 'semanticScore(b.text)')
          if s2 == s:
              raise SystemExit('expected syntax anchors not found')
          p.write_text(s2)
          PY
          node --check toc-collector/src/main.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toc-collector/src/main.mjs
          git commit -m "fix: correct TOC Collector media scoring syntax"
          git push
