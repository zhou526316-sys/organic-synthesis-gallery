name: Verify night capture release live
on:
  workflow_run:
    workflows: ['Deploy GitHub Pages frontend','Deploy Worker frontend assets']
    types: [completed]
  push:
    branches: [main]
    paths: ['audit/automation-triggers/tm-night-live-acceptance.json', '.github/workflows/tm-night-live-acceptance.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/tm-night-live-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: tm-night-live-acceptance
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both official installers and anonymous PDF denial
        run: node scripts/verify-tm-oct1-installer-live.mjs
      - name: Verify public queue and current backend capabilities
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import path from 'node:path';
          const temp=process.env.RUNNER_TEMP||'/tmp';
          const installer=JSON.parse(await readFile(path.join(temp,'tm-oct1-live-acceptance.json'),'utf8'));
          assert.equal(installer.passed,true,'dual-domain-installer-not-verified');
          const getJson=async url=>{
            const response=await fetch(url+(url.includes('?')?'&':'?')+'night-check='+Date.now(),{
              headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)
            });
            assert.equal(response.status,200,'unexpected_http_'+response.status);
            return response.json();
          };
          let outcome;
          for(let attempt=1;attempt<=5;attempt++){
            try{
              const [queue,cap]=await Promise.all([
                getJson('https://gallery.gczhouwld.com/toc-demand-live.json'),
                getJson('https://api.gczhouwld.com/api/media/capture-capabilities')
              ]);
              assert.ok(Array.isArray(queue.articles)&&queue.articles.length>0,'empty_capture_registry');
              assert.equal(queue.articles.length,queue.webpageDoiCount,'capture_registry_count_mismatch');
              const dois=queue.articles.map(item=>String(item.doi||'').trim().toLowerCase());
              assert.ok(dois.every(Boolean),'blank_registry_doi');
              assert.equal(new Set(dois).size,dois.length,'duplicate_registry_doi');
              assert.ok(dois.every(x=>x.length>4),'invalid_registry_doi');
              assert.equal(new Set(dois).size,dois.length,'duplicate_registry_doi');
              assert.equal(cap.captureVersion,'6.2.20','capture_protocol_mismatch');
              assert.equal(cap.mediaControllerRevision,'2.2.41','controller_revision_mismatch');
              assert.equal(cap.mediaGeneration,queue.mediaGeneration,'media_generation_mismatch');
              outcome={passed:true,articleCount:dois.length,queueGeneratedAt:queue.generatedAt,
                mediaGeneration:cap.mediaGeneration,captureProtocol:cap.captureVersion,
                controllerRevision:cap.mediaControllerRevision,attempts:attempt};
              break;
            }catch(error){
              outcome={passed:false,attempts:attempt,error:String(error?.message||error).slice(0,180)};
              if(attempt<5)await new Promise(resolve=>setTimeout(resolve,5000));
            }
          }
          const report={checkedAt:new Date().toISOString(),
            bridgeVersion:installer.version,installedEngine:installer.install,
            installerUrls:installer.checks.map(row=>row.key),
            installerChecksPassed:true,privateInventoryDeniesAnonymous:installer.privateInventoryDeniesAnonymous,
            readOnly:true,publisherRequests:0,productionWrites:0,realUserBrowserOvernightVerified:false,
            ...outcome};
          await writeFile(path.join(temp,'night-live-acceptance.json'),JSON.stringify(report,null,2)+'\n');
          console.log('NIGHT_LIVE_ACCEPTANCE '+JSON.stringify(report));
          if(!report.passed)process.exitCode=1;
          JS
      - name: Preserve live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-live-acceptance
          path: |
            ${{ runner.temp }}/night-live-acceptance.json
            ${{ runner.temp }}/tm-oct1-live-acceptance.json
          retention-days: 14
          if-no-files-found: warn
