name: Historical Q3 reviewed-scope provenance

on:
  pull_request:
    paths:
      - 'scripts/historical-q3-reconciliation.mjs'
      - 'scripts/historical-q3-reviewed-scope-proof.mjs'
      - 'scripts/test-historical-q3-reconciliation.mjs'
      - 'scripts/test-historical-q3-publisher-scope-proof.mjs'
      - 'scripts/test-historical-q3-natcatal-residual-24.mjs'
      - 'scripts/test-historical-q3-natsynth-reviewed-44.mjs'
      - 'scripts/test-historical-q3-nchem-51-reviewed.mjs'
      - 'scripts/historical-q3-chem-date-proof.mjs'
      - 'scripts/test-historical-q3-chem-date-provenance.mjs'
      - 'audit/historical-publisher-issues/2026/chem-q3-source-date-conflicts-and-firstday-provisional.json'
      - 'audit/historical-scope-assessments/2026-10-15-chem-three-q3-original-methods.json'
      - 'scripts/historical-q3-reviewer-status-refresh.mjs'
      - 'scripts/test-historical-q3-reviewer-status-refresh.mjs'
      - 'audit/historical-publisher-issues/2026/nature-chemistry-q3-2026-all-types-66.json'
      - 'audit/historical-reviewed/q3-nchem-51-frozen-source-proof.json'
      - 'audit/historical-reviewed/q3-nchem-27-nonoriginal-two-pass.json'
      - 'audit/historical-reviewed/q3-nchem-21-scope-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-nchem-21-excluded-pending.json'
      - 'audit/historical-scope-assessments/2026-10-14-nchem-24-original-two-pass.json'
      - 'audit/historical-reviewed/approved-admissions.json'
      - 'audit/historical-reviewed/q3-natsynth-44-frozen-source-proof.json'
      - 'audit/historical-reviewed/q3-natsynth-publisher-types-44.json'
      - 'audit/historical-reviewed/q3-natsynth-nonoriginal-31-two-pass.json'
      - 'audit/historical-reviewed/q3-natsynth-13-article-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-natsynth-13-original-two-pass.json'
      - 'audit/historical-reviewed/q3-natcatal-unfinished-24-source-proof.json'
      - 'audit/historical-reviewed/q3-natcatal-nonoriginal-19-two-pass.json'
      - 'audit/historical-reviewed/q3-natcatal-late-online-five-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-natcatal-late-online-five.json'
      - 'audit/historical-reviewed/q3-natcatal-scope-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-nature-catalysis-issues-07-09.json'
      - '.github/workflows/historical-q3-reviewed-scope-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original Q3 scope/candidate-count contracts
        run: node --test scripts/test-historical-q3-reconciliation.mjs
      - name: Validate 15 exact DOI science decisions, source hashes, and new isolated counters
        run: node --test scripts/test-historical-q3-publisher-scope-proof.mjs
      - name: Verify 24 additional Nat Catal DOI source hashes and academic/nonoriginal partitions
        run: node --test scripts/test-historical-q3-natcatal-residual-24.mjs
      - name: Validate 44 Nature Synthesis Q3 source DOI categories and substantive synthesis reviews
        run: node --test scripts/test-historical-q3-natsynth-reviewed-44.mjs
      - name: Validate Nature Chemistry official 66 DOI date/type census and 51 DOI two-pass scopes
        run: node --test scripts/test-historical-q3-nchem-51-reviewed.mjs
      - name: Validate real Chem first-online versus issue-date conflicts and three 08:00 admitted methods
        run: node --test scripts/test-historical-q3-chem-date-provenance.mjs
      - name: Cryptographically verify reviewed-queue status refresh against unchanged raw source
        run: node --test scripts/test-historical-q3-reviewer-status-refresh.mjs
