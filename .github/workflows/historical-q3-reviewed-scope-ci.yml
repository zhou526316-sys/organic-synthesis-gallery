name: Historical Q3 reviewed-scope provenance

on:
  pull_request:
    paths:
      - 'scripts/historical-q3-reconciliation.mjs'
      - 'scripts/historical-q3-reviewed-scope-proof.mjs'
      - 'scripts/test-historical-q3-reconciliation.mjs'
      - 'scripts/test-historical-q3-publisher-scope-proof.mjs'
      - 'scripts/test-historical-q3-natcatal-residual-24.mjs'
      - 'audit/historical-reviewed/q3-natcatal-unfinished-24-source-proof.json'
      - 'audit/historical-reviewed/q3-natcatal-nonoriginal-19-two-pass.json'
      - 'audit/historical-reviewed/q3-natcatal-late-online-five-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-natcatal-late-online-five.json'
      - 'audit/historical-reviewed/q3-natcatal-scope-source-proof.json'
      - 'audit/historical-scope-assessments/2026-10-14-nature-catalysis-issues-07-09.json'
      - '.github/workflows/historical-q3-reviewed-scope-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original Q3 scope/candidate-count contracts
        run: node --test scripts/test-historical-q3-reconciliation.mjs
      - name: Validate 15 exact DOI science decisions, source hashes, and new isolated counters
        run: node --test scripts/test-historical-q3-publisher-scope-proof.mjs
      - name: Verify 24 additional Nat Catal DOI source hashes and academic/nonoriginal partitions
        run: node --test scripts/test-historical-q3-natcatal-residual-24.mjs
