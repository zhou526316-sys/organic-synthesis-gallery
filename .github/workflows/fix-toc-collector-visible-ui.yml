name: Apply TOC Collector visible UI patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'toc-collector/tools/patch_visible_ui.py'
      - '.github/workflows/fix-toc-collector-visible-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python toc-collector/tools/patch_visible_ui.py
      - name: Syntax check
        run: node --check toc-collector/src/main.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toc-collector/src/main.mjs toc-collector/package.json
          git commit -m "fix: show TOC Collector status window"
          git push
