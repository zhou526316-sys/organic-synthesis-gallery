name: Owner private PDF reader grant isolated security regression
on:
  push:
    branches: [feature/owner-private-pdf-read-only-grants-20261009]
    paths:
      - 'cloudflare/worker/src/private-pdf-reader-grants.js'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/scripts/test-private-pdf-reader-grants.mjs'
      - 'cloudflare/worker/scripts/test-private-pdf.mjs'
      - 'cloudflare/private-pdf-reader-grants.sql'
      - 'public/private-pdf-owner-setup.html'
      - '.github/workflows/pdf-reader-grants-regression.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  authorized-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Test restricted owner reader grants and signed-ticket revocation
        run: |
          node --check cloudflare/worker/src/private-pdf-reader-grants.js
          node --check cloudflare/worker/src/private-pdf.js
          node --test cloudflare/worker/scripts/test-private-pdf-reader-grants.mjs cloudflare/worker/scripts/test-private-pdf.mjs
      - name: Validate grant audit D1 migration, without production connection
        run: |
          python3 - <<'PY'
          import sqlite3,pathlib
          db=sqlite3.connect(':memory:')
          db.execute('create table users (id text primary key)')
          db.executescript(pathlib.Path('cloudflare/private-pdf-reader-grants.sql').read_text())
          names=[row[0] for row in db.execute("select name from sqlite_master where type='table'")]
          assert 'private_pdf_reader_grant_audit' in names,names
          print('READER_GRANT_AUDIT_SCHEMA_VALID')
          PY
      - name: Build Gallery frontend without production deploy
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/private-pdf-owner-setup.html
          grep -q 'reader-grant-panel' dist/private-pdf-owner-setup.html
          ! grep -Eq '1592487527|@qq.com' public/private-pdf-owner-setup.html
