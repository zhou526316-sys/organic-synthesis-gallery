name: Historical 2026 Jul-Sep title evidence audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-julsep-title-provenance.mjs'
      - 'audit/historical-backfill/2026-07-to-09-title-gaps-static-20261010.json'
      - '.github/workflows/historical-title-evidence-audit.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only verify Crossref DOI title and author metadata
        run: node scripts/audit-julsep-title-provenance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historic-julsep-title-evidence
          path: artifacts/historical-title-evidence/
          retention-days: 30
