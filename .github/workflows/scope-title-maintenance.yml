name: Apply scope and Chinese-title maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scope-title-maintenance.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: scope-title-maintenance
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Recover exact already-tested code from the maintenance artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35807691266
          name: scope-title-maintenance-evidence
          path: ${{ runner.temp }}/scope-title-recovery
      - name: Verify source and recovered bytes before applying
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, hashlib, subprocess
          base='d285773afd65da0693f47917831ed60c5d7ca771'
          shas={
            'src/main.ts':'311be803317296763780b85fafe855c3ee78b4be',
            'src/bootstrap.ts':'953a9ae18cedd44752888c2eabb4f28f52a705ea',
            'cloudflare/scripts/audit-literature.mjs':'2cb4fa17e1748c1402320bf80be1516da5374a6d',
            'scripts/validate-prepublish-review.mjs':'7663608bc40fa8249200b3a641f7a9393117cfb1',
            'scripts/apply-fixed-slot-literature-release.mjs':'caa50f3cc9f4e0975848a5381282705d9923f2a4',
            'docs/literature-update-protocol.md':'d63ad84830ac5192db84d77cf5c5d91b66b1304d',
          }
          for file,sha in shas.items():
              data=(Path(os.environ['RUNNER_TEMP'])/'scope-title-recovery'/'scope-title-patched'/file).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==sha, file
              previous=subprocess.check_output(['git','show',f'{base}:{file}'])
              current=Path(file).read_bytes()
              assert current in (previous,data), 'Concurrent source change: '+file
              Path(file).write_bytes(data)
          PY
          git diff --exit-code -- public shared/literature-policy.js audit/publication-release-state.json .github/workflows
      - name: Regression and translation coverage
        run: |
          set -euo pipefail
          node --check scripts/apply-fixed-slot-literature-release.mjs
          node --check cloudflare/scripts/audit-literature.mjs
          node scripts/test-scope-title-corrections.mjs | tee "$RUNNER_TEMP/scope-title-tests.json"
          node scripts/test-literature-completeness-capability.mjs
          node scripts/test-prepublish-readiness.mjs
          node scripts/test-prepublish-slot-window.mjs
          node scripts/test-per-doi-release.mjs
          node scripts/test-deferred-publication-quality.mjs
          node scripts/test-formal-review-conversion.mjs
      - name: Build browser frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Persist code without asking the runner to write workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          files=(src/main.ts src/bootstrap.ts cloudflare/scripts/audit-literature.mjs scripts/validate-prepublish-review.mjs scripts/apply-fixed-slot-literature-release.mjs docs/literature-update-protocol.md)
          git diff --exit-code -- public shared/literature-policy.js audit/publication-release-state.json .github/workflows
          git add "${files[@]}"
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git diff --cached --binary > "$RUNNER_TEMP/scope-title-code.patch"
          base=$(git rev-parse HEAD)
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$base" ]; then
            git diff --exit-code "$base" origin/main -- "${files[@]}" shared/chinese-title-overrides.js scripts/lib/scope-corrections.mjs audit/literature-scope-corrections.json public/rolling-supplement.json
            git reset --hard origin/main
            git apply --index "$RUNNER_TEMP/scope-title-code.patch"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(literature): apply verified scope corrections and Chinese-title rendering'
          git push origin HEAD:main
          git rev-parse HEAD | tee "$RUNNER_TEMP/scope-title-code-commit.txt"
      - name: Preserve result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-title-installed-evidence
          path: |
            ${{ runner.temp }}/scope-title-tests.json
            ${{ runner.temp }}/scope-title-code-commit.txt
          retention-days: 14
          if-no-files-found: warn
