name: Scope and Chinese-title regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scope-title-maintenance.yml'
      - 'scripts/smoke-live-chinese-titles.mjs'
permissions:
  contents: read
concurrency:
  group: scope-title-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test explicit exclusions and complete Chinese-title coverage
        run: |
          node scripts/test-scope-title-corrections.mjs
          node scripts/test-literature-completeness-capability.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify live Chinese and English rendering without translation API
        run: node scripts/smoke-live-chinese-titles.mjs
      - name: Preserve read-only production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-chinese-title-verification
          path: /tmp/live-chinese-title-smoke.json
          if-no-files-found: warn
          retention-days: 14
