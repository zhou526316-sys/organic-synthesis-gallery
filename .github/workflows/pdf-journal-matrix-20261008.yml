name: PDF cross-journal real reading regression (16 journals)
on:
  push:
    branches:
      - diag/pdf-cross-journal-sampling-20261008
    paths:
      - .github/workflows/pdf-journal-matrix-20261008.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pdf-journal-matrix-20261008
  cancel-in-progress: false

jobs:
  journal-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
      JOURNAL_BATCH: ${{ matrix.batch }}
    steps:
      - name: Checkout isolated journal test branch
        uses: actions/checkout@v4
        with:
          ref: diag/pdf-cross-journal-sampling-20261008
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF parser and Chromium
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Install Cloudflare CLI for D1 inventory and synthetic session
        working-directory: cloudflare/worker
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Test actual authorization, R2 download, PDF.js and browser for up to 12 DOI
        timeout-minutes: 13
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check scripts/diagnose-pdf-journal-discovery.mjs
          node --check scripts/diagnose-owner-private-pdf-authorized-smoke.mjs
          node --check scripts/diagnose-pdf-journal-matrix.mjs
          node scripts/diagnose-pdf-journal-matrix.mjs
      - name: Independently remove synthetic user/session/entitlement for this batch
        if: always()
        timeout-minutes: 2
        run: |
          if test -x cloudflare/worker/node_modules/.bin/wrangler; then
            node scripts/diagnose-owner-private-pdf-authorized-smoke.mjs --cleanup
          else
            echo "Cloudflare CLI not installed; no setup step could create the synthetic account."
          fi
