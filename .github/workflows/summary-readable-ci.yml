name: Readable summary layout regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/user-ui/paper-actions.ts'
      - 'src/user-ui/summary-panel-layout.ts'
      - 'tests/summary-readable.spec.ts'
      - '.github/workflows/summary-readable-ci.yml'
permissions:
  contents: read
concurrency:
  group: summary-readable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  summary-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing build and pinned browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/summary-browser-install.log 2>&1 || { tail -80 /tmp/summary-browser-install.log; exit 1; }
      - name: Type-check and build
        run: |
          npx tsc --noEmit
          npm run build
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/summary-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/summary-preview.log
          exit 1
      - name: Verify readable bounded summaries, resizing and missing-fulltext state
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: summary-readable-results/results.json
        run: |
          mkdir -p summary-readable-results
          git rev-parse HEAD > summary-readable-results/tested-commit.txt
          sha256sum src/user-ui/paper-actions.ts src/user-ui/summary-panel-layout.ts tests/summary-readable.spec.ts > summary-readable-results/source-sha256.txt
          set -o pipefail
          npx --no-install playwright test tests/summary-readable.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=summary-readable-results/tests 2>&1 | tee summary-readable-results/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-readable-results
          path: summary-readable-results/
          retention-days: 7
          if-no-files-found: warn
