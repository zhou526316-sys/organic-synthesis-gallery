name: Diagnose mobile corpus identity during refresh optimization
on:
  push:
    branches: [fix/ui-refresh-cost-20260923-1115]
    paths: [.github/workflows/ui-refresh-card-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b81f5a09db8e879507e31d1cf5d00227ae64ce3b
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned dependencies and build reviewed source
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/card-diagnostic-install.log 2>&1 || { tail -60 /tmp/card-diagnostic-install.log; exit 1; }
          npm run build
      - name: Add observations to the first test only without changing assertions
        run: |
          mkdir -p card-diagnostic-results
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/mobile-interaction.spec.ts');whole=p.read_text()
          end=whole.index("test.describe('desktop feedback regressions'")
          text,tail=whole[:end],whole[end:]
          needle="  await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });"
          assert text.count(needle)==1
          evidence='''  const responseLog: unknown[] = [];
            page.on('response', response => {
              const path = new URL(response.url()).pathname;
              if (/\\.json$|literature|supplement/.test(path)) responseLog.push({ at: Date.now(), status: response.status(), url: response.url() });
            });
          '''
          text=text.replace(needle,evidence+needle)
          needle="  const initialCards = await page.locator('.card').count();"
          assert text.count(needle)==1
          text=text.replace(needle,'''  const beforeCards = await page.locator('.card').evaluateAll(nodes => nodes.map(node => ({
              html: node.outerHTML.slice(0, 500), id: (node as HTMLElement).dataset.userPaperId,
              parent: node.parentElement?.id || node.parentElement?.className, root: (node.getRootNode() as ShadowRoot).host?.tagName || 'document',
            })));
          '''+needle)
          needle="  expect(await page.locator('.card').count()).toBe(initialCards);"
          assert text.count(needle)==1
          text=text.replace(needle,'''  const afterCards = await page.locator('.card').evaluateAll(nodes => nodes.map(node => ({
              html: node.outerHTML.slice(0, 500), id: (node as HTMLElement).dataset.userPaperId,
              parent: node.parentElement?.id || node.parentElement?.className, root: (node.getRootNode() as ShadowRoot).host?.tagName || 'document',
            })));
            const evidence = { beforeCards, afterCards, responseLog, galleryCards: await page.locator('#gallery > .card').count(),
              removed: await page.evaluate(() => (window as any).__removedGalleryCards || 0) };
            console.log('CORPUS_DIAGNOSTIC', JSON.stringify(evidence));
            await test.info().attach('corpus-diagnostic.json', {body:JSON.stringify(evidence,null,2),contentType:'application/json'});
            await page.screenshot({path:test.info().outputPath('before-card-count-assertion.png')});
          '''+needle)
          p.write_text(text+tail)
          PY
          git diff -- tests/mobile-interaction.spec.ts > card-diagnostic-results/observation-only.diff
          git diff --exit-code -- src/ public/ shared/
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/card-diagnostic-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Execute unchanged interaction contract with identity evidence
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: card-diagnostic-results/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/mobile-interaction.spec.ts --grep 'survive 30' --workers=1 --reporter=line,json --trace=on --output=card-diagnostic-results/tests 2>&1 | tee card-diagnostic-results/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-card-identity-diagnostic
          path: card-diagnostic-results/
          retention-days: 7
          if-no-files-found: warn
