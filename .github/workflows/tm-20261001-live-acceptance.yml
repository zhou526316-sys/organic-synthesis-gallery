name: Tampermonkey October 1 live acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tm-20261001-live-acceptance.yml'
      - 'public/toc-mainline.user.js'
      - 'scripts/tm-private-pdf-capture.inc.js'
      - 'cloudflare/scripts/build-bridge-loader.mjs'
      - 'cloudflare/worker/src/index.js'
      - 'cloudflare/worker/src/private-pdf.js'
      - 'cloudflare/worker/src/local-captures.js'
  workflow_run:
    workflows: ['Deploy GitHub Pages frontend', 'Deploy Worker frontend assets']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current live bundle semantics without media writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const expectedVersion='2.2.54';
          const expectedController='2.2.41';
          const expectedInstall='6.2.35';
          const report={readOnly:true,publisherRequests:0,mediaWrites:0,expectedVersion,expectedController,expectedInstall,http:[],errors:[]};
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(key,url,init={}){
            try{
              const r=await fetch(url,{...init,headers:{'cache-control':'no-cache',...(init.headers||{})},signal:AbortSignal.timeout(20000)});
              const text=await r.text();
              const row={key,url,status:r.status,acao:r.headers.get('access-control-allow-origin'),contentType:r.headers.get('content-type')};
              if(key.includes('installer')){
                row.version=(text.match(/@version\s+(\S+)/)||[])[1]||'';
                row.controller=text.includes("var CONTROLLER_REVISION = '2.2.41';");
                row.install=text.includes("var INSTALL_REVISION = '6.2.35';");
                row.bundle=text.includes("RECENT_FULL_CAPTURE_REVISION = '20261006-oct1-all-media-v1'")&&text.includes("RECENT_FULL_CAPTURE_CUTOFF = '2026-10-01'");
                row.pdf=text.includes("PRIVATE_PDF_CAPTURE_REVISION = '20261006-private-pdf-bundle-v6'");
                row.ccsMatch=text.includes('// @match        https://www.chinesechemsoc.org/*');
              }else if(key==='capabilities'&&r.ok){
                const p=JSON.parse(text);row.data={captureVersion:p.captureVersion,mediaControllerRevision:p.mediaControllerRevision,mediaGeneration:p.mediaGeneration,mode:p.mode,evidenceSchemaVersion:p.evidenceSchemaVersion};
              }else if(key==='queue'&&r.ok){
                const p=JSON.parse(text);row.data={generatedAt:p.generatedAt,latestAddedDate:p.latestAddedDate,latestAddedCount:p.latestAddedCount,webpageDoiCount:p.webpageDoiCount,registryLength:(p.articles||[]).length};
              }
              report.http.push(row);return row;
            }catch(e){report.errors.push(key+':'+String(e.message).slice(0,120));return {};}
          }
          let site={},worker={},caps={},cors={};
          for(let i=0;i<24;i++){
            const suffix='?oct1Bundle='+Date.now();
            site=await probe('canonical_installer','https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js'+suffix);
            worker=await probe('worker_installer','https://organic-synthesis-gallery.zhou526316.workers.dev/gallery-vpn-bridge.user.js'+suffix);
            caps=await probe('capabilities','https://api.gczhouwld.com/api/media/capture-capabilities'+suffix,{headers:{origin:'https://www.chinesechemsoc.org'}});
            const installerOk=x=>x.status===200&&x.version===expectedVersion&&x.controller&&x.install&&x.bundle&&x.pdf&&x.ccsMatch;
            if(installerOk(site)&&installerOk(worker)&&caps.data?.mediaControllerRevision===expectedController)break;
            await wait(15000);
          }
          cors=await probe('ccs_preflight','https://api.gczhouwld.com/api/article-figures/stage',{method:'OPTIONS',headers:{origin:'https://www.chinesechemsoc.org','access-control-request-method':'POST','access-control-request-headers':'authorization,content-type'}});
          const queue=await probe('queue','https://gallery.gczhouwld.com/toc-demand-live.json?oct1Bundle='+Date.now());
          const installerOk=x=>x.status===200&&x.version===expectedVersion&&x.controller&&x.install&&x.bundle&&x.pdf&&x.ccsMatch;
          report.verifiedAt=new Date().toISOString();
          report.passed=installerOk(site)&&installerOk(worker)
            &&caps.status===200&&caps.data?.captureVersion==='6.2.20'&&caps.data?.mediaControllerRevision===expectedController&&caps.data?.mediaGeneration===1790082000000
            &&cors.status===204&&cors.acao==='https://www.chinesechemsoc.org'
            &&queue.status===200&&queue.data?.latestAddedDate>='2026-10-01'&&queue.data?.registryLength===queue.data?.webpageDoiCount;
          report.authenticatedUserBrowserVerified=false;
          await writeFile(process.env.RUNNER_TEMP+'/tm-20261001-live-acceptance.json',JSON.stringify(report,null,2));
          console.log('LIVE_ACCEPTANCE',JSON.stringify(report));
          if(!report.passed)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-20261001-live-acceptance
          path: ${{ runner.temp }}/tm-20261001-live-acceptance.json
          retention-days: 14
