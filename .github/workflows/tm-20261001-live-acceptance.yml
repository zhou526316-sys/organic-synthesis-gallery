name: Tampermonkey October 1 live acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tm-20261001-live-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check exact deployment and public bytes without media writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const sha='b544519456d6747138bdc3b4a3783f136083388d';
          const expected='1dfdbf3d6e3540b0dca1f01beb34b6fdda8b06a8301bd6c2e7bc8e9ba47f5721';
          const report={readOnly:true,publisherRequests:0,mediaWrites:0,sourceSha:sha,expectedInstallerSha256:expected,deployments:[],http:[],errors:[]};
          const api='https://api.github.com/repos/zhou526316-sys/organic-synthesis-gallery';
          const needed=['Deploy Worker frontend assets','Deploy GitHub Pages frontend'];
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<24;i++){
            try{
              const res=await fetch(api+'/actions/runs?head_sha='+sha+'&per_page=30',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
              if(!res.ok)throw Error('runs_http_'+res.status);
              const data=await res.json();
              report.deployments=(data.workflow_runs||[]).filter(x=>needed.includes(x.name)).map(x=>({name:x.name,id:x.id,status:x.status,conclusion:x.conclusion,headSha:x.head_sha}));
              console.log('DEPLOYMENTS',JSON.stringify(report.deployments));
              if(report.deployments.length===2&&report.deployments.every(x=>x.status==='completed'))break;
            }catch(e){report.errors.push(String(e.message).slice(0,120));break;}
            await wait(15000);
          }
          async function probe(key,url,init={}){
            try{
              const r=await fetch(url,{...init,headers:{'cache-control':'no-cache',...(init.headers||{})},signal:AbortSignal.timeout(20000)});
              const text=await r.text();const row={key,url,status:r.status,acao:r.headers.get('access-control-allow-origin'),contentType:r.headers.get('content-type')};
              if(key.includes('installer')){
                row.sha256=createHash('sha256').update(text).digest('hex');row.matchesTested=row.sha256===expected;
                row.hotfix=text.includes("var CAPTURE_HOTFIX_REVISION = '20261001-newest-retry-v1';");row.ccsMatch=text.includes('// @match        https://www.chinesechemsoc.org/*');row.version=(text.match(/@version\s+(\S+)/)||[])[1];
              }else if(key==='capabilities'&&r.ok){const p=JSON.parse(text);row.data={captureVersion:p.captureVersion,mediaControllerRevision:p.mediaControllerRevision,mediaGeneration:p.mediaGeneration,mode:p.mode,evidenceSchemaVersion:p.evidenceSchemaVersion};}
              else if(key==='queue'&&r.ok){const p=JSON.parse(text);row.data={generatedAt:p.generatedAt,latestAddedDate:p.latestAddedDate,latestAddedCount:p.latestAddedCount,webpageDoiCount:p.webpageDoiCount,registryLength:(p.articles||[]).length};}
              report.http.push(row);return row;
            }catch(e){report.errors.push(key+':'+String(e.message).slice(0,120));return {};}
          }
          const suffix='?hotfixAcceptance='+Date.now();
          const site=await probe('canonical_installer','https://gallery.gczhouwld.com/gallery-vpn-bridge.user.js'+suffix);
          const worker=await probe('worker_installer','https://organic-synthesis-gallery.zhou526316.workers.dev/gallery-vpn-bridge.user.js'+suffix);
          const caps=await probe('capabilities','https://api.gczhouwld.com/api/media/capture-capabilities'+suffix,{headers:{origin:'https://www.chinesechemsoc.org'}});
          const cors=await probe('ccs_preflight','https://api.gczhouwld.com/api/article-figures/stage',{method:'OPTIONS',headers:{origin:'https://www.chinesechemsoc.org','access-control-request-method':'POST','access-control-request-headers':'authorization,content-type'}});
          await probe('queue','https://gallery.gczhouwld.com/toc-demand-live.json'+suffix);
          report.verifiedAt=new Date().toISOString();
          report.passed=report.deployments.length===2&&report.deployments.every(x=>x.conclusion==='success')&&site.status===200&&site.matchesTested&&site.hotfix&&site.ccsMatch&&worker.status===200&&worker.matchesTested&&caps.data?.mediaControllerRevision==='2.2.41'&&caps.data?.captureVersion==='6.2.20'&&caps.data?.mediaGeneration===1790082000000&&cors.status===204&&cors.acao==='https://www.chinesechemsoc.org';
          report.authenticatedUserBrowserVerified=false;
          await writeFile(process.env.RUNNER_TEMP+'/tm-20261001-live-acceptance.json',JSON.stringify(report,null,2));
          console.log('LIVE_ACCEPTANCE',JSON.stringify(report));
          if(!report.passed)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-20261001-live-acceptance
          path: ${{ runner.temp }}/tm-20261001-live-acceptance.json
          retention-days: 14
