name: WeChat SI Text Audit

on:
  push:
    branches: [main]
    paths:
      - 'audit/automation-triggers/wechat-si-audit-request.json'

permissions:
  contents: write

concurrency:
  group: wechat-si-text-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and inspect Supplementary Information
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'PY'
          import re, subprocess, urllib.request
          from pathlib import Path

          items = {
            "natchem": "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41557-026-02237-z/MediaObjects/41557_2026_2237_MOESM1_ESM.pdf",
            "hyster": "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41586-026-10930-9/MediaObjects/41586_2026_10930_MOESM1_ESM.pdf",
          }
          needles = {
            "natchem": ["water","methyl methacrylate","ICP","B2O3","pinacol","radical trap","acetone"],
            "hyster": ["alanine","505 nm","Supplementary Figure 11","Supplementary Figure 32","Supplementary Figure 46","direct excitation"],
          }
          out=[]
          for key,url in items.items():
            pdf=Path(f"/tmp/{key}.pdf")
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=120) as r:
                pdf.write_bytes(r.read())
            txt=Path(f"/tmp/{key}.txt")
            subprocess.run(["pdftotext","-layout",str(pdf),str(txt)],check=True)
            pages=txt.read_text(encoding="utf-8",errors="replace").split("\f")
            out.append(f"# {key}\n")
            for needle in needles[key]:
                out.append(f"## query: {needle}\n")
                found=0
                for page_no,page in enumerate(pages,1):
                    low=page.lower()
                    if needle.lower() not in low:
                        continue
                    found+=1
                    lines=page.splitlines()
                    hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
                    for i in hits[:4]:
                        a=max(0,i-5); b=min(len(lines),i+8)
                        out.append(f"### page {page_no}\n")
                        out.extend(line.rstrip()+"\n" for line in lines[a:b])
                        out.append("\n")
                if not found:
                    out.append("(no hit)\n\n")
          Path("/tmp/wechat-si-audit.txt").write_text("".join(out),encoding="utf-8")
          PY
      - name: Persist SI audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET="audit/wechat-working/2026-10-06-si-text-audit.md"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wechat-si-audit.txt "$TARGET"
            git add "$TARGET"
            git commit -m "audit: extract SI evidence map" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
