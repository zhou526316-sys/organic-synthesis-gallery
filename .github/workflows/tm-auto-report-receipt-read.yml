name: Read automatic capture report receipts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tm-auto-report-receipt-read.yml'
      - 'audit/automation-triggers/tm-auto-report-receipt-read.json'
permissions:
  contents: read
concurrency:
  group: tm-auto-report-receipt-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read newest stored reports with existing R2 authorization only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,json,os,pathlib,re,urllib.parse,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/r2/buckets/organic-synthesis-gallery-media/objects/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def safe_url(value):
              try:
                  u=urllib.parse.urlsplit(str(value or ''))
                  return urllib.parse.urlunsplit((u.scheme,u.hostname or '',u.path,'','')) if u.scheme in ('https','http') else ''
              except ValueError: return ''
          def text(value):
              s=re.sub(r'https?://[^\s\"\'<>]+',lambda m:safe_url(m.group()),str(value or ''))
              return re.sub(r'(?i)Bearer\s+\S+|(?:token|secret|password|cookie|authorization|signature)\s*[\"\s]*[:=]\s*[^\s;,]+','[redacted]',s)[:1200]
          def get(key):
              if key not in ('local-captures/tampermonkey/report-index.json','local-captures/diagnostics/latest.json') and not re.fullmatch(r'local-captures/tampermonkey/reports/[A-Za-z0-9_/-]+\.json',key):
                  raise ValueError('unexpected_report_key')
              req=urllib.request.Request(base+urllib.parse.quote(key,safe='/'),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Cache-Control':'no-cache'})
              with opener.open(req,timeout=25) as r: body=r.read(32*1024*1024+1)
              if len(body)>32*1024*1024: raise ValueError('size_limit_32mib')
              return json.loads(body)
          def pick(r,fields):
              if not isinstance(r,dict): return {}
              return {k:(safe_url(r[k]) if k.lower().endswith('url') else text(r[k]) if isinstance(r[k],str) else r[k]) for k in fields if k in r and not isinstance(r[k],(dict,list))}
          fields=['doi','status','reason','candidateSource','assetType','startedAt','finishedAt','updatedAt','attemptId','attemptCount','articleUrl','sourceUrl','traceEvents','retainedAttempts']
          report={'readAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'transport':'authenticated_R2_GET','readOnly':True,'mediaWrites':0,'errors':[],'index':[],'details':[],'reportReadLimitMiB':32}
          try:
              index=get('local-captures/tampermonkey/report-index.json')
              report['indexUpdatedAt']=index.get('updatedAt')
              items=index.get('items')
              if isinstance(items,dict): items=list(items.values())
              if not isinstance(items,list): raise ValueError('index_items_missing')
              items=sorted(items,key=lambda x:float(x.get('updatedAt') or 0),reverse=True)
              report['indexDoiCount']=len(items)
              report['index']=[pick(r,fields) for r in items[:12]]
              report['automaticDoiCountInIndex']=sum(str(r.get('candidateSource','')).startswith('auto_') for r in items)

              # Server report index is an observation source, not an owner
              # browser-local final summary. Distinguish unique DOI reports
              # from verified publisher visits; never label PDF deferred as saved.
              after=datetime.datetime.fromisoformat('2026-10-16T02:56:47+00:00').timestamp()*1000
              def stamp(value):
                  try: return datetime.datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()*1000
                  except (TypeError,ValueError,OverflowError): return 0
              recent=[]
              for row in items:
                  attempts=row.get('attempts') if isinstance(row.get('attempts'),list) else [row]
                  for a in attempts:
                      if not isinstance(a,dict) or a.get('final') is not True: continue
                      updated=float(a.get('updatedAt') or 0)
                      started=stamp(a.get('startedAt') or row.get('startedAt'))
                      if updated<after or (started and started<after): continue
                      doi=str(a.get('doi') or row.get('doi') or '').strip().lower()
                      if not re.fullmatch(r'10\.\d{4,9}/[^\s]{4,200}',doi): continue
                      recent.append({**a,'doi':doi,'publisher':str(row.get('publisher') or a.get('publisher') or '')[:40]})
              # Multiple delivery events for one job are not multiple visits.
              unique={}
              for a in recent:
                  identity=(a['doi'],str(a.get('jobId') or a.get('attemptId') or a.get('updatedAt')))
                  if identity not in unique or float(a.get('updatedAt') or 0)>float(unique[identity].get('updatedAt') or 0):
                      unique[identity]=a
              recent=sorted(unique.values(),key=lambda a:float(a.get('updatedAt') or 0))
              def classify(a):
                  status=str(a.get('status') or 'unknown')
                  return status if status in ('success','partial','failed','aborted') else 'other'
              tally={}
              for a in recent: tally[classify(a)]=tally.get(classify(a),0)+1
              reasons={}
              by_publisher={}
              for a in recent:
                  p=a.get('publisher') or 'unknown'
                  by_publisher[p]=by_publisher.get(p,0)+1
                  if classify(a) in ('failed','partial'):
                      reason=str(a.get('reason') or '')[:160]
                      reason=re.sub(r'https?://\S+','[url]',reason)
                      k='heartbeat_missing' if 'heartbeat_missing' in reason else 'pdf_deferred' if 'owner_pdf_local_replay_pending' in reason else 'pdf_error' if 'pdf=' in reason or 'private_pdf_' in reason else 'figure_partial' if 'figures=' in reason else reason[:70] or 'unknown'
                      reasons[k]=reasons.get(k,0)+1
              def num(a,key):
                  try:return max(0,int(a.get(key) or 0))
                  except (TypeError,ValueError):return 0
              report['recentRun']={
                'cutoffUtc':'2026-10-16T02:56:47Z','indexWindow':'rolling_server_report_retention',
                'cannotProveOwnerControllerFullyFinished':True,
                'finalJobIds':len(recent),'distinctDois':len({a['doi'] for a in recent}),
                'statusCounts':tally,'byPublisher':by_publisher,
                'reasons':dict(sorted(reasons.items(),key=lambda kv:-kv[1])[:18]),
                'tocStoredJobs':sum(str(a.get('tocStatus'))=='stored' for a in recent),
                'figureStagedCount':sum(num(a,'figuresStored') for a in recent),
                'figureCompleteJobs':sum(num(a,'figuresDiscovered')>0 and num(a,'figuresStored')>=num(a,'figuresDiscovered') for a in recent),
                'fulltextStoredJobs':sum(str(a.get('fulltextStatus'))=='stored' for a in recent),
                'pdfCloudStoredJobs':sum(str(a.get('privatePdfStatus')) in ('stored','already_stored') for a in recent),
                'pdfDeferredJobs':sum(str(a.get('privatePdfStatus'))=='deferred_upload' for a in recent),
                'pdfFailureJobs':sum(str(a.get('privatePdfStatus')) in ('failed','not_found') for a in recent),
                'latestUpdatedAt':max([num(a,'updatedAt') for a in recent],default=0)
              }
              report['recentFinalSample']=[pick(a,['doi','jobId','publisher','status','reason','startedAt','finishedAt',
                'updatedAt','tocStatus','figuresDiscovered','figuresStored','fulltextStatus','privatePdfStatus','evidenceLevel'])
                for a in recent[-35:]]
              def detail(row):
                  out=[]
                  attempts=(row.get('attempts') or [row])[:4]
                  for a in attempts:
                      try:
                          r=get(a['reportKey']); item=pick(r,fields+['available','error'])
                          events=r.get('trace',[])
                          context=[e for e in events if e.get('stage') in ('diagnostic_context','job','paired_result')]
                          failures=[e for e in events if e.get('event')=='failed' or float(e.get('httpStatus') or 0)>=400 or e.get('stage')=='page_doi_guard']
                          event_fields=['seq','at','stage','event','status','httpStatus','url','message','contentType','imageWidth','imageHeight','byteLength']
                          item['context']=[pick(e,event_fields) for e in context[:3]+context[3:][-2:]]
                          item['failureEvents']=[pick(e,event_fields) for e in failures[-8:]]
                          out.append(item)
                      except Exception as e: out.append({'attemptId':a.get('attemptId'),'readError':type(e).__name__,'httpStatus':getattr(e,'code',None)})
                  return {'doi':row.get('doi'),'attempts':out}
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: report['details']=list(pool.map(detail,items[:5]))
          except Exception as e: report['errors'].append({'source':'reportIndex','type':type(e).__name__,'httpStatus':getattr(e,'code',None)})
          try:
              local=get('local-captures/diagnostics/latest.json')
              report['manualSnapshot']=pick(local,['uploadedAt','version','source','kind','uploadedReason'])
              report['manualSummary']=pick(local.get('summary',{}),['controllerRevision','startedAt','finishedAt','success','partial','failed','tocStored','figuresStaged'])
          except Exception as e: report['errors'].append({'source':'manualSnapshot','type':type(e).__name__,'httpStatus':getattr(e,'code',None)})
          report['readCompletedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path(os.environ['RUNNER_TEMP'],'tm-auto-report-receipts.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('AUTO_REPORT_RECEIPT_SUMMARY '+json.dumps({k:v for k,v in report.items() if k not in ('details','index')},ensure_ascii=False),flush=True)
          if report.get('recentRun'): print('AUTO_REPORT_RECENT_AGG '+json.dumps(report['recentRun'],ensure_ascii=False),flush=True)
          for row in report.get('recentFinalSample',[]): print('AUTO_REPORT_RECENT_FINAL '+json.dumps(row,ensure_ascii=False),flush=True)
          for row in report['index']: print('AUTO_REPORT_INDEX '+json.dumps(row,ensure_ascii=False),flush=True)
          for row in report['details']: print('AUTO_REPORT_DETAIL '+json.dumps(row,ensure_ascii=False),flush=True)
          if report['errors']: raise SystemExit('Read coverage incomplete; inspect explicit errors.')
          PY
      - name: Preserve sanitized current receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-auto-report-receipts
          path: ${{ runner.temp }}/tm-auto-report-receipts.json
          retention-days: 7
          if-no-files-found: warn
