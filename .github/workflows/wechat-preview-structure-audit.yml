name: WeChat Preview Structure Audit

on:
  push:
    branches: [main]
    paths:
      - 'audit/automation-triggers/wechat-preview-structure-audit-request.json'

permissions:
  contents: write

concurrency:
  group: wechat-preview-structure-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit draft/get preview structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, html as htmlmod, urllib.request
          from pathlib import Path

          receipt=json.loads(Path('audit/wechat-publisher/latest.json').read_text(encoding='utf-8'))
          url=str(receipt.get('preview_url') or '').strip()
          if not url:
              raise SystemExit('missing preview_url')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')

          articles=re.findall(r"<article\b.*?</article>",raw,flags=re.I|re.S)
          def strip(s):
              return re.sub(r'\s+',' ',htmlmod.unescape(re.sub(r'<[^>]+>',' ',s))).strip()

          report={
              'preview_url':url,
              'media_id':receipt.get('media_id'),
              'draft_readback':receipt.get('draft_readback'),
              'article_count':len(articles),
              'articles':[]
          }
          article_texts=[]
          for idx,a in enumerate(articles,1):
              title_m=re.search(r'<h1[^>]*>(.*?)</h1>',a,flags=re.I|re.S)
              imgs=[]
              for m in re.finditer(r"<img\b([^>]*)>",a,flags=re.I|re.S):
                  attrs=m.group(1)
                  src_m=re.search(r"""src=['"]([^'"]+)['"]""",attrs,flags=re.I)
                  style_m=re.search(r"""style=['"]([^'"]+)['"]""",attrs,flags=re.I)
                  tail=a[m.end():m.end()+1400]
                  cap_m=re.search(r"<p[^>]*>(.*?)</p>",tail,flags=re.I|re.S)
                  width=None
                  style=style_m.group(1) if style_m else ''
                  wm=re.search(r'width\s*:\s*([0-9]+)%',style,flags=re.I)
                  if wm: width=int(wm.group(1))
                  imgs.append({
                      'src':src_m.group(1) if src_m else '',
                      'width_pct':width,
                      'caption':strip(cap_m.group(1)) if cap_m else ''
                  })
              txt=strip(a)
              article_texts.append(txt)
              report['articles'].append({
                  'index':idx,
                  'title':strip(title_m.group(1)) if title_m else '',
                  'image_count':len(imgs),
                  'images':imgs
              })

          if len(article_texts) < 2:
              raise SystemExit('expected two articles')
          daily, retro = article_texts[0], article_texts[1]

          daily_checks={
              'fig1e':'原文 Fig. 1e' in daily,
              'fig1a':'原文 Fig. 1a' in daily,
              'fig1bc':'原文 Fig. 1b–c' in daily,
              'fig1d':'原文 Fig. 1d' in daily,
              'fig2a':'原文 Fig. 2a' in daily,
              'fig2b':'原文 Fig. 2b' in daily,
              'fig2c':'原文 Fig. 2c' in daily,
              'fig2df':'原文 Fig. 2d–f' in daily,
              'fig3a':'原文 Fig. 3a' in daily,
              'fig3bc':'原文 Fig. 3b–c' in daily,
              'fig3d':'原文 Fig. 3d' in daily,
              'table1_upper':'原文 Table 1（底物拓展上半部分）' in daily,
              'table1_lower':'原文 Table 1（底物拓展下半部分）' in daily,
              'fig4a':'原文 Fig. 4a' in daily,
              'table1_route':'原文 Table 1 顶部路线示意' in daily,
              'fig4b':'原文 Fig. 4b' in daily,
              'si_water':'Supporting Information Table 5' in daily,
              'si_radical':'Supporting Information Fig. 6' in daily,
              'si_icp':'Supporting Information Table 6' in daily,
              'si_bpin':'Supporting Information Fig. 7' in daily,
              'old_isolated_fig1c_absent':'原文 Fig. 1c（仅保留本文反应）' not in daily,
          }
          retro_checks={
              'fig1a':'原文 Fig. 1a' in retro,
              'fig1b':'原文 Fig. 1b' in retro,
              'fig1c':'原文 Fig. 1c' in retro,
              'fig2a':'原文 Fig. 2a' in retro,
              'fig2b':'原文 Fig. 2b' in retro,
              'fig2c':'原文 Fig. 2c' in retro,
              'fig2d':'原文 Fig. 2d' in retro,
              'fig3':'原文 Fig. 3' in retro,
              'fig4a':'原文 Fig. 4a' in retro,
              'fig4bc':'原文 Fig. 4b–c' in retro,
              'fig4de':'原文 Fig. 4d–e' in retro,
              'fig5abc':'原文 Fig. 5a–c' in retro,
              'fig5de':'原文 Fig. 5d–e' in retro,
              'fig5f':'原文 Fig. 5f' in retro,
              'fig5g':'原文 Fig. 5g' in retro,
              'si_natural_aa':'Supporting Information Fig. 11' in retro,
          }
          counts={
              'daily_image_count': report['articles'][0]['image_count'],
              'retro_image_count': report['articles'][1]['image_count'],
              'daily_expected_min':21,
              'retro_expected_min':17,
          }
          report['checks']={'daily':daily_checks,'retrospective':retro_checks,'counts':counts}

          ok=(
              len(articles)==2
              and receipt.get('draft_readback')=='ok'
              and all(daily_checks.values())
              and all(retro_checks.values())
              and counts['daily_image_count']>=counts['daily_expected_min']
              and counts['retro_image_count']>=counts['retro_expected_min']
          )
          Path('/tmp/wechat-preview-structure.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          if not ok:
              raise SystemExit('preview structure audit failed')
          PY
      - name: Persist structure audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET="audit/wechat-working/2026-10-06-preview-structure.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wechat-preview-structure.json "$TARGET"
            git add "$TARGET"
            git commit -m "audit: verify complete WeChat figure-text structure" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
