name: Apply reviewed card-only glow source correction
on:
  push:
    branches: [fix/ui-refresh-cost-20260923-1115]
    paths: [.github/workflows/ui-card-glow-target-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply inspected source and tests only, without modifying any workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def load(path, sha):
              p=Path(path)
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==sha, 'Re-review changed source: '+path
              return p,p.read_text()
          def once(text,old,new):
              assert text.count(old)==1, ('Expected unique edit',old,text.count(old))
              return text.replace(old,new)
          p,text=load('src/user-ui/status-presentation.ts','9e25964a0049057f615e075c9b8aea1cf3b5741c')
          text=once(text,', type StyleDef','')
          text=once(text,"import { applyGlowWidth, bindGlowWidth, STATUS_GLOW_WIDTH_CSS } from './status-glow-width';","import { bindGlowWidth, STATUS_GLOW_WIDTH_CSS } from './status-glow-width';\nimport { applyCardGlow } from './card-glow';")
          start=text.index('function applyGlow(');end=text.index('function captionTone(',start)
          text=text[:start]+text[end:]
          needle="  const selected = store.status(store.paper(paperId).statusId || '');"
          text=once(text,needle,needle+"\n  const card = (root.host as HTMLElement).closest<HTMLElement>('#gallery > .card');\n  if (card) applyCardGlow(card, selected?.style, selected?.id || '');")
          text=once(text,"    applyGlow(action, selected?.style, selected?.id || '');\n",'')
          text=once(text,"  root.querySelectorAll<HTMLElement>('.chips > .chip.status').forEach(node => applyGlow(node, selected?.style, selected?.id || ''));\n",'')
          start=text.index('    const choice = Array.from(root.querySelectorAll<HTMLElement>');end=text.index('    const label = document.createElement',start)
          text=text[:start]+text[end:]
          text=once(text,"'环绕光效' : 'Surrounding glow'","'卡片光效' : 'Card glow'")
          text=once(text,"'仅改变外观，不改变阅读状态；减少动态效果时停止装饰动画。' : 'Appearance only; reduced motion stops decorative animation.'","'应用于该阅读状态的整张文献卡片；按钮不发光。减少动态效果时停止动画。' : 'Applies to the full literature card for this status, not its buttons. Reduced motion stops animation.'")
          start=text.index('\n[data-status-glow]{');end=text.index('\n.status-style-editor',start)
          text=text[:start]+"\n@media(forced-colors:active){.action.status-artwork .status-action-label{color:ButtonText!important;background:ButtonFace!important}}"+text[end:]
          p.write_text(text)
          p,text=load('src/user-ui/status-glow-width.ts','1d5d44e7ebbadaf96d7e440f014ea2b23489d26f')
          text=text.replace("tr('光效粗细', 'Glow thickness')","tr('卡片光效粗细', 'Card glow thickness')")
          text=once(text,"'1–6px；拖动预览，松开保存。光效关闭时只保存粗细。', '1–6px; drag to preview, release to save. Off stays off.'","'1–6px 卡片外沿；拖动预览，松开保存。按钮不发光，关闭时不显示光效。', '1–6px card edge; drag to preview, release to save. Buttons do not glow. Off stays off.'")
          old="    root.querySelectorAll<HTMLElement>('[data-status-glow-id]').forEach(node => {\n      if (node.dataset.statusGlowId === id) applyGlowWidth(node, width);\n    });"
          text=once(text,old,"    const card = (root.host as HTMLElement).closest<HTMLElement>('#gallery > .card');\n    if (card?.dataset.statusGlowId === id) applyGlowWidth(card, width);")
          start=text.index('\n[data-status-glow]');text=text[:start]+'\n`;\n'
          text=text.replace('Preview touches only this disposable card render.', 'Preview touches only the current matching literature card.')
          p.write_text(text)
          p=Path('src/user-ui/card-glow.ts');text=p.read_text()
          text=once(text,"statusId && STATUS_GLOWS.includes(style?.glow as never) ? style!.glow! : 'none'","statusId && style?.glow && STATUS_GLOWS.includes(style.glow) ? style.glow : 'none'")
          p.write_text(text)
          p,text=load('tests/status-presentation.spec.ts','e36172f431beb59c9fbd25995178e60c99aebcf1')
          needle="const action = (actions: Locator): Locator => actions.locator('button[data-action=\"status\"]');"
          text=once(text,needle,needle+"\nconst glowCard = (actions: Locator): Locator => actions.locator('..');")
          text=text.replace("expect(action(actions)).toHaveAttribute('data-status-glow'", "expect(glowCard(actions)).toHaveAttribute('data-status-glow'")
          text=text.replace('animation(action(actions))','animation(glowCard(actions))')
          text=text.replace("action(actions).evaluate(node => getComputedStyle(node, '::after').opacity)","glowCard(actions).evaluate(node => getComputedStyle(node, '::after').opacity)")
          text=text.replace("action(actions).evaluate(node => getComputedStyle(node).getPropertyValue('--status-glow-rgb')","glowCard(actions).evaluate(node => getComputedStyle(node).getPropertyValue('--status-glow-rgb')")
          text=once(text,"      await expect(actions.locator('.chips > .chip.status')).toHaveAttribute('data-status-glow', mode);","      await expect(actions.locator('[data-status-glow],[data-card-glow]')).toHaveCount(0);\n      expect(await action(actions).evaluate(node => getComputedStyle(node, '::after').content)).toBe('none');")
          p.write_text(text)
          p,text=load('tests/status-glow-width.spec.ts','2fcf96dff687d3112faba88aedfc7c953335e793')
          needle="const button = (actions: Locator): Locator => actions.locator('button[data-action=\"status\"]');"
          text=once(text,needle,needle+"\nconst glowCard = (actions: Locator): Locator => actions.locator('..');")
          text=text.replace('border(button(actions))','border(glowCard(actions))')
          text=text.replace("expect(button(actions)).toHaveAttribute('data-status-glow'", "expect(glowCard(actions)).toHaveAttribute('data-status-glow'")
          for prop in ['content','animationName','boxShadow']:
              text=text.replace("button(actions).evaluate(node => getComputedStyle(node, '::after')."+prop+")","glowCard(actions).evaluate(node => getComputedStyle(node, '::after')."+prop+")")
          text=once(text,"    expect(await border(actions.locator('.chips > .chip.status'))).toBe('6px');","    expect(await actions.locator('.chips > .chip.status').evaluate(node => getComputedStyle(node, '::after').content)).toBe('none');")
          text=once(text,"    expect(await border(actions.locator('[data-action=\"set-status:to-read\"] .status-choice-label'))).toBe('6px');","    expect(await actions.locator('[data-action=\"set-status:to-read\"] .status-choice-label').evaluate(node => getComputedStyle(node, '::after').content)).toBe('none');\n    expect(await button(actions).evaluate(node => getComputedStyle(node, '::after').content)).toBe('none');\n    await expect(actions.locator('[data-status-glow]')).toHaveCount(0);")
          text=once(text,"    effect: Number(getComputedStyle(node, '::after').zIndex),","    image: Number(getComputedStyle(node.querySelector('img')!).zIndex),\n    effect: getComputedStyle(node, '::after').content,")
          text=once(text,'  expect(layers.caption).toBeGreaterThan(layers.effect);',"  expect(layers.caption).toBeGreaterThan(layers.image);\n  expect(layers.effect).toBe('none');")
          p.write_text(text)
          p=Path('tests/card-glow-target.spec.ts');text=p.read_text()
          needle="    const statusButton = actions.locator('[data-action=\"status\"]');"
          text=once(text,needle,needle+"\n    await actions.locator('[data-action=\"set-status:to-read\"]').click();\n    await statusButton.click();")
          text=once(text,"actions.locator('.status-glow-control > span')","actions.locator('[data-status-editor=\"to-read\"] .status-glow-control > span')")
          text=once(text,"actions.locator('.status-glow-width-control > label')","actions.locator('[data-status-editor=\"to-read\"] .status-glow-width-control > label')")
          p.write_text(text)
          PY
          git diff --check
          git diff --exit-code -- .github/workflows/
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/user-ui/card-glow.ts src/user-ui/status-presentation.ts src/user-ui/status-glow-width.ts tests/status-presentation.spec.ts tests/status-glow-width.spec.ts tests/card-glow-target.spec.ts
          git commit -m 'fix(ui): card-only glow and thickness per explicit user correction'
          git push origin HEAD:fix/ui-refresh-cost-20260923-1115
