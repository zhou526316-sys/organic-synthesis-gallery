name: Page navigation regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bootstrap.ts'
      - 'src/user-ui/page-navigation.ts'
      - 'tests/page-navigation.spec.ts'
      - 'tests/page-navigation-loading.spec.ts'
      - '.github/workflows/page-navigation-ci.yml'
permissions:
  contents: read
concurrency:
  group: page-navigation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  navigation:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned browser and compile unchanged production build
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps ${{ matrix.browser }} >/tmp/navigation-browser.log 2>&1 || { tail -60 /tmp/navigation-browser.log; exit 1; }
          npx tsc --noEmit
          npm run build
      - name: Start isolated local entry
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/navigation-preview.log 2>&1 &
          for i in {1..40}; do if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/navigation-preview.log
          exit 1
      - name: Verify endpoints, layouts, focus and early loading with blocked production writes
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: navigation-results/results.json
        run: |
          mkdir -p navigation-results
          git rev-parse HEAD > navigation-results/tested-commit.txt
          sha256sum src/bootstrap.ts src/user-ui/page-navigation.ts tests/page-navigation.spec.ts tests/page-navigation-loading.spec.ts > navigation-results/source-sha256.txt
          set -o pipefail
          npx --no-install playwright test tests/page-navigation.spec.ts tests/page-navigation-loading.spec.ts --browser=${{ matrix.browser }} --workers=1 --reporter=line,json --output=navigation-results/tests 2>&1 | tee navigation-results/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-navigation-${{ matrix.browser }}
          path: navigation-results/
          retention-days: 7
          if-no-files-found: warn
