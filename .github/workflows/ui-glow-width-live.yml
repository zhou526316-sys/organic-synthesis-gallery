name: Verify deployed glow thickness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-glow-width-live.yml']
permissions:
  contents: read
concurrency:
  group: ui-glow-width-live
  cancel-in-progress: false
jobs:
  live-width:
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: github
            site: https://zhou526316-sys.github.io/organic-synthesis-gallery/
          - entry: worker
            site: https://organic-synthesis-gallery.zhou526316.workers.dev/
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_SITE_URL: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe972c58975052c5270206f933c93ca7980f29a0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned test browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx --no-install playwright install --with-deps webkit >/tmp/width-live-browser.log 2>&1 || { tail -60 /tmp/width-live-browser.log; exit 1; }
      - name: Adapt only navigation and safe network transport
        run: |
          mkdir -p live-width-results
          sha256sum tests/status-glow-width.spec.ts src/user-ui/status-glow-width.ts src/user-ui/status-presentation.ts src/user-ui/feedback-widget.ts src/user-ui/shared.ts > live-width-results/source-sha256.txt
          git rev-parse HEAD > live-width-results/reviewed-commit.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/status-image-fixtures.ts');text=p.read_text()
          start=text.index('export async function isolate(');end=text.index('export async function open(',start)
          transport='''export async function isolate(context: BrowserContext): Promise<void> {
            await recordStatusNetwork(context);
            await context.route('**/*', async route => {
              const request=route.request(); const url=request.url();
              if (url.startsWith('blob:') || url.startsWith('data:')) { await route.continue(); return; }
              const path=new URL(url).pathname;
              const headers={ 'access-control-allow-origin':request.headers().origin || new URL(process.env.LIVE_SITE_URL!).origin, 'access-control-allow-credentials':'true', 'access-control-allow-methods':'GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE', 'access-control-allow-headers':request.headers()['access-control-request-headers'] || 'content-type, authorization', 'vary':'Origin' };
              if (request.method()==='OPTIONS') { await route.fulfill({status:204,headers}); return; }
              const api=path==='/api' || path.startsWith('/api/');
              if (['GET','HEAD'].includes(request.method()) && !api) { await route.continue(); return; }
              console.log('MOCKED_LIVE_API',request.method(),path);
              const body=path.endsWith('/reader-counts') ? {counts:{},count:0} : path.endsWith('/integrations') ? {auth:{},payments:{}} : {items:[]};
              await route.fulfill({status:200,headers,contentType:'application/json',body:JSON.stringify(body)});
            });
          }
          '''
          text=text[:start]+transport+text[end:]
          needle="await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });"
          assert text.count(needle)==1
          text=text.replace(needle,"page.on('response', response => { if (new URL(response.url()).pathname.endsWith('.js')) console.log('LIVE_SCRIPT', response.status(), response.url()); });\n  await page.goto(process.env.LIVE_SITE_URL!, { waitUntil: 'domcontentloaded' });")
          needle='  return actions;'
          assert text.count(needle)==1
          text=text.replace(needle,"  console.log('LIVE_READY', JSON.stringify({ url:page.url(), paperId:await actions.getAttribute('data-paper-id'), widthControls:await actions.locator('[data-status-glow-width]').count() }));\n"+needle)
          p.write_text(text)
          PY
          git diff --check
          git diff -- tests/status-image-fixtures.ts > live-width-results/transport-only.diff
          git diff --exit-code -- tests/status-glow-width.spec.ts src/user-ui/
          printf '{"productionWritesAllowed":false,"allApiMocked":true,"fallbackPagesChecked":false,"reviewedCommit":"fe972c58975052c5270206f933c93ca7980f29a0"}\n' > live-width-results/scope.json
      - name: Execute unchanged real-drag, keyboard, width, restoration and failure checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: live-width-results/results.json
        run: |
          set -o pipefail
          npx --no-install playwright test tests/status-glow-width.spec.ts --browser=webkit --workers=1 --reporter=line,json --output=live-width-results/tests 2>&1 | tee live-width-results/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-glow-width-${{ matrix.entry }}
          path: live-width-results/
          retention-days: 7
          if-no-files-found: warn
