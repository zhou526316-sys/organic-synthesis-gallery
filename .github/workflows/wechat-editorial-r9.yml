name: WeChat Editorial R9 Review
on:
  push:
    branches: [main]
    paths: ['audit/automation-triggers/wechat-revision-r9.json']
permissions:
  contents: write
concurrency:
  group: wechat-editorial-r9
  cancel-in-progress: false
jobs:
  revise-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install review-only dependencies
        run: |
          python3 -m pip install --quiet 'Pillow>=10,<13' 'playwright>=1.50,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          test -x /usr/bin/google-chrome
      - name: Apply fingerprint-locked source revision and assemble review
        run: python3 ops/wechat-publisher/apply-editorial-r9.py
      - name: Upload internal review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-r9-internal-review
          path: r9-review/
          retention-days: 7
          if-no-files-found: ignore
