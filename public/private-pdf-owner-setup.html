<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private PDF owner setup</title>
<style>
body{font-family:Inter,system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#1f2937}main{border:1px solid #d0d5dd;border-radius:14px;padding:24px}button{padding:10px 16px;border:0;border-radius:9px;background:#111827;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#667085}.ok{color:#067647}.bad{color:#b42318}code{word-break:break-all}
</style>
</head>
<body>
<main>
<h1>私有 PDF owner 绑定</h1>
<p class="muted">这个页面只做一次账号权限绑定，不会抓取 PDF，也不会修改文献、TOC 或正文图规则。</p>
<p>当前登录账号：<strong id="account">正在读取…</strong></p>
<p id="status" class="muted"></p>
<button id="claim" disabled>确认将当前账号设为私有 PDF owner</button>
<button id="authorize" disabled hidden>授权本浏览器抓取 PDF（7 天）</button>
<p id="capture-status" class="muted"></p>
<section id="reader-grant-panel" hidden style="border-top:1px solid #d0d5dd;margin-top:24px;padding-top:16px">
  <h2>PDF 阅读权限管理</h2>
  <p class="muted">只有站长可以授权已验证邮箱的 Gallery 账号。仅添加 private_pdf_read；不添加站长、抓取或处理权限。现有阅读权限也允许下载，因此只对有权分享的文献授权。</p>
  <label for="reader-grant-email">已验证的目标账号邮箱</label>
  <input id="reader-grant-email" type="email" autocomplete="off" spellcheck="false" placeholder="reader@example.com" style="display:block;width:100%;box-sizing:border-box;padding:10px;margin:10px 0 12px">
  <label style="display:block;margin-bottom:12px"><input id="reader-grant-rights" type="checkbox"> 我确认有权向该账号提供相关 PDF 文献的访问权限。</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" id="reader-grant-check">检查状态</button>
    <button type="button" id="reader-grant-add">授予阅读权限</button>
    <button type="button" id="reader-grant-revoke">撤销阅读权限</button>
  </div>
  <p id="reader-grant-result" class="muted" role="status" aria-live="polite"></p>
</section>
</main>
<script type="module">
const SESSION_KEY='organic-gallery-session-v1';
const API='https://api.gczhouwld.com';
const account=document.querySelector('#account');
const status=document.querySelector('#status');
const button=document.querySelector('#claim');
const authorize=document.querySelector('#authorize');
const captureStatus=document.querySelector('#capture-status');
const token=localStorage.getItem(SESSION_KEY)||'';
const code=new URLSearchParams(location.hash.replace(/^#/,'')).get('code')||'';
async function json(path,init={}){
  const headers=new Headers(init.headers||{});
  if(token)headers.set('authorization','Bearer '+token);
  if(init.body&&!headers.has('content-type'))headers.set('content-type','application/json');
  const response=await fetch(API+path,{...init,headers,cache:'no-store'});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||('HTTP '+response.status));
  return data;
}
(async()=>{
  if(!token){account.textContent='未登录';status.textContent='请先回到文献库登录目标账号，再重新打开本页。';status.className='bad';return;}
  try{
    const session=await json('/api/user-ui/auth/session');
    if(!session.authenticated||!session.user){account.textContent='未登录';status.textContent='当前登录状态已失效。';status.className='bad';return;}
    account.textContent=session.user.email||session.user.displayName||session.user.id;
    const capabilities=session.user.capabilities||[];
    async function offerCaptureAuthorization(){
      if(!capabilities.includes('private_pdf_capture'))return;
      authorize.hidden=false;
      authorize.disabled=false;
      captureStatus.textContent='可单独授权本浏览器的 PDF 捕获模块。';
      authorize.addEventListener('click',async()=>{
        authorize.disabled=true;captureStatus.textContent='正在签发 PDF 捕获授权…';captureStatus.className='muted';
        try{
          // Do not preflight through the public healthcheck. The lease endpoint is
          // already browser-CORS enabled and is the authoritative capability + kill-switch check.
          const lease=await json('/api/user-ui/private-pdf/capture-lease',{method:'POST'});
          if(!lease.token||!lease.expiresAt)throw new Error('capture_lease_invalid');
          const message={type:'osg-private-pdf-capture-lease-v1',token:lease.token,expiresAt:lease.expiresAt,scope:lease.scope};
          let acked=false,attempts=0,timer=null;
          const cleanup=()=>{if(timer!==null){clearInterval(timer);timer=null;}window.removeEventListener('message',ack);};
          const ack=event=>{
            if(event.origin!==location.origin||event.data?.type!=='osg-private-pdf-capture-lease-ack-v1')return;
            if(Number(event.data.expiresAt||0)!==Number(lease.expiresAt||0))return;
            acked=true;cleanup();
            captureStatus.textContent='PDF 捕获授权成功，本浏览器有效至 '+new Date(lease.expiresAt).toLocaleString()+'。';
            captureStatus.className='ok';
          };
          window.addEventListener('message',ack);
          const send=()=>{
            if(acked)return;
            attempts+=1;
            window.postMessage(message,location.origin);
            captureStatus.textContent='正在向 Tampermonkey 交接 PDF 授权（'+attempts+'/12）…';
            if(attempts>=12){
              cleanup();
              captureStatus.textContent='尚未收到 Tampermonkey 确认。请确认脚本已更新并启用，然后重新点击授权。';
              captureStatus.className='bad';authorize.disabled=false;
            }
          };
          send();
          timer=setInterval(send,750);
        }catch(error){
          const reason=String(error?.message||error);
          captureStatus.textContent=reason==='private_pdf_capture_disabled'
            ? 'PDF 捕获模块当前已关闭；现有网页与图片抓取不受影响。'
            : '授权失败：'+reason;
          captureStatus.className='bad';authorize.disabled=false;
        }
      });
    }
    async function enableReaderGrantPanel(){
      const panel=document.querySelector('#reader-grant-panel');
      panel.hidden=false;
      const input=document.querySelector('#reader-grant-email');
      const consent=document.querySelector('#reader-grant-rights');
      const result=document.querySelector('#reader-grant-result');
      const actions=[
        ['reader-grant-check','status'],
        ['reader-grant-add','grant'],
        ['reader-grant-revoke','revoke']
      ];
      const buttons=actions.map(([name])=>document.getElementById(name));
      for(const [id,action] of actions){
        document.getElementById(id).addEventListener('click',async()=>{
          const email=String(input.value||'').trim().toLowerCase();
          if(!email || !input.checkValidity()){result.className='bad';result.textContent='请输入有效邮箱地址。';return;}
          if(action==='grant' && !consent.checked){
            result.className='bad';result.textContent='请确认拥有相关文献的分享权限。';return;
          }
          buttons.forEach(button=>button.disabled=true);
          result.className='muted';result.textContent='正在核对已验证的目标账号和阅读权限…';
          try{
            const data=await json('/api/user-ui/private-pdf/reader-grant',{
              method:'POST',
              body:JSON.stringify({email,action,rightsConfirmed:action==='grant'&&consent.checked})
            });
            const verdict=data.readGranted?'已拥有 PDF 阅读权限。':'目前没有 PDF 阅读权限。';
            result.className='ok';
            result.textContent=verdict+(data.changed?' 授权记录已更新。':' 无需修改。');
          }catch(error){
            result.className='bad';
            const reason=String(error?.message||error);
            result.textContent=reason==='reader_account_not_verified_or_ambiguous'
              ? '找不到当前邮箱与已验证邮箱一致的唯一账号。'
              : reason==='reader_target_has_privileged_pdf_capabilities'
              ? '该账号已有其他私有 PDF 管理权限，不通过只读授权页修改。'
              : '未能更新权限：'+reason;
          }finally{buttons.forEach(button=>button.disabled=false);}
        });
      }
    }
    if(capabilities.includes('private_pdf_owner')){
      status.textContent='这个账号已经是私有 PDF owner。';status.className='ok';
      await enableReaderGrantPanel();
      await offerCaptureAuthorization();
      return;
    }
    if(!code){status.textContent='缺少一次性绑定码。';status.className='bad';return;}
    status.textContent='请确认这里显示的是你要绑定的账号，再点击按钮。';
    button.disabled=false;
    button.addEventListener('click',async()=>{
      button.disabled=true;status.textContent='正在绑定…';status.className='muted';
      try{
        const result=await json('/api/user-ui/private-pdf/bootstrap-owner',{method:'POST',body:JSON.stringify({claimCode:code})});
        status.textContent='绑定成功。已获得私有 PDF 读取、捕获和处理权限；后续功能仍按阶段开启。';status.className='ok';
        history.replaceState(null,'',location.pathname+location.search);
        window.dispatchEvent(new Event('gallery-auth-session-changed'));
        capabilities.splice(0,capabilities.length,...(result.capabilities||[]));
        await enableReaderGrantPanel();
        await offerCaptureAuthorization();
      }catch(error){status.textContent='绑定失败：'+String(error?.message||error);status.className='bad';button.disabled=false;}
    },{once:true});
  }catch(error){account.textContent='读取失败';status.textContent=String(error?.message||error);status.className='bad';}
})();
</script>
</body>
</html>
