<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PDF · Organic Synthesis Gallery</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#f5f7fb}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;background:#fff;border-bottom:1px solid #d9e2ef}
    a{color:#2456c6;text-decoration:none;font-weight:650}#doi{font-size:13px;color:#56657a;overflow-wrap:anywhere}
    main{position:relative;flex:1;min-height:0}#pdf-frame{width:100%;height:100%;border:0;background:#fff}
    #status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#56657a;background:#f5f7fb}
    #status[hidden]{display:none}.bad{color:#9f2d20}
  </style>
</head>
<body>
  <header><a href="/">← 返回 Gallery</a><span id="doi"></span></header>
  <main><div id="status">正在读取私有 PDF…</div><iframe id="pdf-frame" title="Article PDF" hidden></iframe></main>
  <script>
    (() => {
      'use strict';
      const SESSION_KEY='organic-gallery-session-v1';
      const API_BASE='https://api.gczhouwld.com';
      const params=new URLSearchParams(location.search);
      const doi=String(params.get('doi')||'').trim().toLowerCase();
      const fallback=params.get('fallback')||'';
      const status=document.getElementById('status');
      const frame=document.getElementById('pdf-frame');
      document.getElementById('doi').textContent=doi;
      const safeFallback=()=>{try{const u=new URL(fallback,location.origin);return /^https?:$/.test(u.protocol)?u.href:'';}catch{return ''}};
      const showFallback=()=>{
        const url=safeFallback();
        status.replaceChildren();
        const message=document.createElement('div');
        message.textContent='该论文尚无已验证的私有 PDF。';
        status.appendChild(message);
        if(url){
          const link=document.createElement('a');
          link.id='publisher-fallback';
          link.href=url;
          link.rel='noopener noreferrer';
          link.textContent='打开出版社原文 ↗';
          status.appendChild(link);
        }
        status.className='bad';
      };
      if(!/^10\.\d{4,9}\/.+/.test(doi)){status.textContent='DOI 无效。';status.className='bad';return;}
      let token='';try{token=localStorage.getItem(SESSION_KEY)||'';}catch{}
      if(!token){showFallback();return;}
      const url=new URL('/api/user-ui/private-pdf/open',API_BASE);url.searchParams.set('doi',doi);
      fetch(url,{method:'POST',headers:{authorization:'Bearer '+token},cache:'no-store'})
        .then(async response=>response.ok?response.json():null)
        .then(data=>{
          if(!data||data.available!==true||typeof data.url!=='string'){showFallback();return;}
          frame.src=data.url;frame.hidden=false;status.hidden=true;
        })
        .catch(showFallback);
    })();
  </script>
</body>
</html>
