<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Organic Synthesis Gallery · 访问统计</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:1120px;margin:0 auto;padding:28px 18px 48px}
    h1{margin:0;font-size:26px}.sub{margin:8px 0 22px;color:#64748b;font-size:14px}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
    button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
    .status{font-size:13px;color:#64748b}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .card{padding:16px}.label{font-size:12px;color:#64748b}.value{font-size:30px;font-weight:700;margin-top:5px}.hint{font-size:12px;color:#94a3b8;margin-top:4px}
    .panel{padding:16px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 12px}
    .two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
    .chart{width:100%;height:220px;border:1px solid #eef2f7;border-radius:10px;background:linear-gradient(#fff,#fbfdff)}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eef2f7}th{color:#64748b;font-weight:600}
    .bars{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:120px 1fr 56px;gap:9px;align-items:center;font-size:13px}.bar-track{height:9px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:#334155;border-radius:999px}
    .muted{color:#64748b}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.bar-row{grid-template-columns:90px 1fr 48px}}
  </style>
</head>
<body>
<main>
  <div class="toolbar">
    <div>
      <h1>Gallery 访问统计</h1>
      <div class="sub">北京时间 · 聚合数据 · 原始 IP 不存储</div>
    </div>
    <button id="refresh">刷新</button>
  </div>
  <div id="status" class="status">加载中…</div>
  <section class="grid" id="cards"></section>

  <section class="panel">
    <h2>最近 30 天 PV / UV</h2>
    <svg id="chart" class="chart" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-label="PV UV trend"></svg>
  </section>

  <section class="two">
    <div class="panel">
      <h2>最近 7 天</h2>
      <table><thead><tr><th>日期</th><th>PV</th><th>UV</th></tr></thead><tbody id="trend7"></tbody></table>
    </div>
    <div class="panel">
      <h2>文献阅读</h2>
      <table><tbody id="readerStats"></tbody></table>
    </div>
  </section>

  <section class="two">
    <div class="panel">
      <h2>来源域名 · 30 天</h2>
      <div id="referrers" class="bars"></div>
    </div>
    <div class="panel">
      <h2>设备 · 30 天</h2>
      <div id="devices" class="bars"></div>
    </div>
  </section>
</main>
<script>
const API='https://organic-synthesis-gallery.zhou526316.workers.dev';
const fmt=n=>new Intl.NumberFormat('zh-CN').format(Number(n||0));
const dt=ms=>ms?new Date(ms).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'尚无记录';
function card(label,value,hint=''){return '<div class="card"><div class="label">'+label+'</div><div class="value">'+fmt(value)+'</div><div class="hint">'+hint+'</div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bars(rows,labelKey){
  if(!rows?.length)return '<div class="muted">暂无数据</div>';
  const max=Math.max(1,...rows.map(x=>Number(x.pv||0)));
  return rows.map(x=>'<div class="bar-row"><div title="'+esc(x[labelKey])+'">'+esc(x[labelKey])+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(Number(x.pv||0)/max*100)+'%"></div></div><div>'+fmt(x.pv)+' PV</div></div>').join('');
}
function drawChart(rows){
  const svg=document.getElementById('chart'); svg.innerHTML='';
  if(!rows?.length)return;
  const W=1000,H=220,p=24,max=Math.max(1,...rows.flatMap(r=>[Number(r.pv||0),Number(r.uv||0)]));
  const points=(key)=>rows.map((r,i)=>[(p+(W-2*p)*(i/Math.max(1,rows.length-1))),H-p-(H-2*p)*(Number(r[key]||0)/max)]);
  const poly=(pts,stroke)=>{const el=document.createElementNS('http://www.w3.org/2000/svg','polyline');el.setAttribute('fill','none');el.setAttribute('stroke',stroke);el.setAttribute('stroke-width','4');el.setAttribute('points',pts.map(p=>p.join(',')).join(' '));svg.appendChild(el)};
  for(let i=0;i<5;i++){const y=p+(H-2*p)*i/4;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',p);l.setAttribute('x2',W-p);l.setAttribute('y1',y);l.setAttribute('y2',y);l.setAttribute('stroke','#e2e8f0');svg.appendChild(l)}
  poly(points('pv'),'#0f172a'); poly(points('uv'),'#64748b');
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',W-180);t.setAttribute('y',18);t.setAttribute('font-size','14');t.textContent='深色 PV · 浅色 UV';svg.appendChild(t);
}
async function load(){
  const status=document.getElementById('status'); status.textContent='刷新中…';
  try{
    const [s,r]=await Promise.all([
      fetch(API+'/api/user-ui/site-stats',{cache:'no-store'}).then(x=>x.json()),
      fetch(API+'/api/user-ui/reader-stats',{cache:'no-store'}).then(x=>x.json())
    ]);
    document.getElementById('cards').innerHTML=[
      card('累计 PV',s.allTime?.pv,'从 2026-09-22 新统计启用后开始'),
      card('累计 UV',s.allTime?.uv,'按加盐 IP hash 去重'),
      card('今日 PV',s.today?.pv,s.today?.date||''),
      card('今日 UV',s.today?.uv,''),
      card('访问但未点文献',s.allTime?.visitorsWithoutPaperOpen,'全站 UV 中尚无文献打开事件'),
      card('访问且点过文献',s.allTime?.visitorsWithPaperOpen,''),
      card('文献去重阅读人次',r.uniquePaperReads,'DOI × IP 去重'),
      card('文献阅读独立 IP',r.uniqueIps,'')
    ].join('');
    document.getElementById('trend7').innerHTML=(s.last7Days||[]).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+fmt(x.pv)+'</td><td>'+fmt(x.uv)+'</td></tr>').join('');
    document.getElementById('readerStats').innerHTML=[
      ['DOI×IP 去重阅读',r.uniquePaperReads],['独立阅读 IP',r.uniqueIps],['被读过的文献',r.papersWithReaders],
      ['最早阅读记录',dt(r.firstOpenedAt)],['最近阅读记录',dt(r.lastOpenedAt)]
    ].map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>').join('');
    document.getElementById('referrers').innerHTML=bars(s.topReferrers30Days,'source');
    document.getElementById('devices').innerHTML=bars(s.devices30Days,'device');
    drawChart(s.last30Days||[]);
    status.textContent='最后刷新：'+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' · 首次 PV 记录：'+dt(s.trackingStartedAt);
  }catch(e){
    status.innerHTML='<div class="error">加载失败：'+esc(e?.message||e)+'</div>';
  }
}
document.getElementById('refresh').addEventListener('click',load);
load();
setInterval(load,60000);
</script>
</body>
</html>
